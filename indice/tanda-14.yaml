      - {norma: "LEC", articulo: "435", apartado: "2", tipo: "regula", nota: "Excepcionalmente, incluso de oficio: repetir prueba sobre hechos relevantes que falló por circunstancias ya desaparecidas."}
      - {norma: "LEC", articulo: "435", apartado: "2, párrafo 2.º", tipo: "conexa", nota: "El auto que acuerda esa repetición expresa con detalle las circunstancias y los motivos."}
      - {norma: "LEC", articulo: "436", apartado: "1", tipo: "regula", nota: "Se practican en veinte días; después, cinco días para un escrito que resuma y valore su resultado."}
