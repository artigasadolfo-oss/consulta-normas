# Índice de conceptos de «Consulta de normas» — tanda 14 (prioridad B: prueba, verbales especiales y zonas tensionadas)
# Revisor: armero. Espejo: legalize-es@aca28304d, leído con `git show aca28304d:es/…` (no el árbol de trabajo, que hoy trae erratas),
# salvo «Zonas de mercado residencial tensionado y límites de renta», revisada el 9-10-2026 contra legalize-es@597314599f
# (composición con el RDL 29/2026). Todo precepto citado se ha leído en el espejo de su revisión.
# Vigencia: scripts/contraste_boe.py --solo "LEC,LOPJ,CE,CC,LAU,
# LPH" --espejo-commit aca28304d (08-10-2026, 12:50). Distintos citados: solo LAU 10, 17 y 18 (voz 102, provisional; notas según la
# API vigente y el RDL 29/2026). LEC 22 y 685, CC 396 y LPH 10 distintos pero no citados.
# Voces 67, 68, 69, 70, 71, 72, 73, 88, 89, 90 y 102 de la lista maestra (11 voces, prioridad B). Ver tanda-14-notas.md.

voces:
  - voz: "Fuerza probatoria de documentos públicos y privados"
    sinonimos: ["fuerza probatoria", "prueba plena", "documento público", "documento privado", "escritura pública", "copia simple", "cotejo", "cotejo de letras", "impugnación de documento", "fecha frente a terceros", "documento electrónico", "apostilla"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "317", tipo: "regula", nota: "Son públicos a efectos de prueba: judiciales, notariales, de corredor, registrales y los de funcionario con fe pública."}
      - {norma: "LEC", articulo: "318", tipo: "regula", nota: "Hacen la prueba del 319 en original, copia o certificación fehaciente, o por copia simple cuya autenticidad no se impugne."}
      - {norma: "LEC", articulo: "319", apartado: "1", tipo: "regula", nota: "Prueba plena del hecho, acto o estado de cosas documentado, de su fecha y de la identidad del fedatario y de los intervinientes."}
      - {norma: "LEC", articulo: "319", apartado: "2", tipo: "conexa", nota: "Otros documentos administrativos públicos: lo que diga su ley; si nada dice, ciertos salvo que otras pruebas los desvirtúen."}
      - {norma: "LEC", articulo: "319", apartado: "3", tipo: "conexa", nota: "En materia de usura el tribunal forma libremente su convicción, sin la vinculación de la prueba plena."}
      - {norma: "LEC", articulo: "320", apartado: "1", tipo: "regula", nota: "Impugnada la autenticidad del público: cotejo con el original, con el Libro Registro o verificación de la firma electrónica."}
      - {norma: "LEC", articulo: "320", apartado: "3", tipo: "regula", nota: "Si el cotejo confirma la copia, costas y gastos al impugnante; impugnación temeraria: multa de 120 a 600 euros."}
      - {norma: "LEC", articulo: "322", apartado: "1", tipo: "conexa", nota: "Escrituras antiguas sin protocolo o públicos sin original con que cotejar: prueba plena salvo prueba en contrario."}
      - {norma: "LEC", articulo: "323", apartado: "2", tipo: "conexa", nota: "Extranjero sin tratado: público si cumple los requisitos de su país y lleva legalización o apostilla."}
      - {norma: "LEC", articulo: "267", tipo: "conexa", nota: "El público se aporta por copia simple; si se impugna, se lleva a los autos original, copia o certificación con efectos."}
      - {norma: "LEC", articulo: "324", tipo: "regula", nota: "Son privados, a efectos de prueba, los documentos que no encajan en ninguno de los casos del art. 317."}
      - {norma: "LEC", articulo: "326", apartado: "1", tipo: "regula", nota: "El privado hace prueba plena, como el público, si no impugna su autenticidad la parte a quien perjudica."}
      - {norma: "LEC", articulo: "326", apartado: "2", tipo: "regula", nota: "Impugnado: cotejo pericial de letras u otra prueba; si no se acredita la autenticidad o no se propone prueba, sana crítica."}
      - {norma: "LEC", articulo: "326", apartado: "3", tipo: "conexa", nota: "Documento electrónico impugnado (autenticidad, integridad, fecha y hora): vía del 326.2 y Reglamento (UE) 910/2014."}
      - {norma: "LEC", articulo: "326", apartado: "4", tipo: "regula", nota: "Con servicio de confianza cualificado se presume correcto; comprueba el impugnante, que paga si falla y puede ser multado."}
      - {norma: "LEC", articulo: "268", apartado: "2", tipo: "conexa", nota: "La copia simple del privado surte los efectos del original mientras ninguna parte cuestione su conformidad."}
      - {norma: "LEC", articulo: "334", apartado: "1", tipo: "regula", nota: "Copia reprográfica impugnada: cotejo con el original; si no es posible, sana crítica con el resultado de las demás pruebas."}
      - {norma: "LEC", articulo: "327", tipo: "conexa", nota: "Libros de comerciantes: leyes mercantiles; el tribunal puede reclamarlos, motivadamente, con los asientos concretos."}
      - {norma: "CC", articulo: "1218", tipo: "regula", nota: "El público prueba, aun contra tercero, el hecho que motiva su otorgamiento y su fecha; entre partes, sus declaraciones."}
      - {norma: "CC", articulo: "1217", tipo: "conexa", nota: "Los documentos en que interviene notario se rigen por la legislación notarial."}
      - {norma: "CC", articulo: "1220", tipo: "conexa", nota: "Copias impugnadas de públicos con matriz: solo prueban si se cotejan; si discrepan, prevalece la matriz."}
      - {norma: "CC", articulo: "1223", tipo: "conexa", nota: "Escritura defectuosa por incompetencia del notario o falta de forma: vale como privado si la firman los otorgantes."}
      - {norma: "CC", articulo: "1225", tipo: "regula", nota: "El privado reconocido legalmente vale como escritura pública entre los firmantes y sus causahabientes."}
      - {norma: "CC", articulo: "1227", tipo: "regula", nota: "Fecha del privado frente a terceros: desde su inscripción, la muerte de un firmante o su entrega a funcionario."}
      - {norma: "CC", articulo: "1228", tipo: "conexa", nota: "Asientos y papeles privados prueban solo contra quien los escribió; quien se aprovecha acepta lo que le perjudica."}
      - {norma: "CC", articulo: "1230", tipo: "conexa", nota: "Los privados hechos para alterar lo pactado en escritura pública no producen efecto contra tercero."}
    no_consta_en_norma:
      - "La prueba plena del público cubre que se hizo la declaración, no su veracidad intrínseca: doctrina jurisprudencial."
      - "Si basta la impugnación genérica («se impugnan todos los documentos») para privar al privado de prueba plena: jurisprudencial."
      - "Valor del documento privado emanado de la propia parte que lo aporta (facturas, albaranes): sana crítica; casuística."
    fuera_de_la_herramienta:
      - "Ley del Notariado y Reglamento Notarial: copias, matriz y fe pública notarial (a ella remite el art. 1217 CC)."
      - "Reglamento (UE) 910/2014 (eIDAS): servicios de confianza cualificados, al que remiten los apartados 3 y 4 del art. 326 LEC."
    afines: ["Documentos: aportación e impugnación", "Documentos y pruebas posteriores (preclusión)", "Medios de reproducción, correos y mensajería (WhatsApp) como prueba", "Exhibición de documentos entre partes y por terceros", "Admisión de hechos y silencio en la contestación", "Dictamen pericial de parte y judicial"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Exhibición de documentos entre partes y por terceros"
    sinonimos: ["exhibición documental", "exhibición de documentos", "requerimiento de exhibición", "documento en poder de la contraria", "negativa a exhibir", "exhibición por tercero", "exhibición por la Administración", "certificación de organismo público", "copia simple del documento", "valor de la copia por negativa", "testimonio del documento exhibido", "exhibición de libros"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "328", apartado: "1", tipo: "regula", nota: "Cada parte puede pedir a las demás que exhiban documentos que no tiene y que se refieren al objeto o a la eficacia de la prueba."}
      - {norma: "LEC", articulo: "328", apartado: "2", tipo: "regula", nota: "Con la solicitud, copia simple del documento o, si no la hay, indicación lo más exacta posible de su contenido."}
      - {norma: "LEC", articulo: "328", apartado: "3", tipo: "conexa", nota: "Infracción de propiedad industrial o intelectual a escala comercial: exhibición de documentos bancarios, con principio de prueba."}
      - {norma: "LEC", articulo: "329", apartado: "1", tipo: "regula", nota: "Negativa injustificada: el tribunal puede dar valor a la copia o a la versión del solicitante, junto a las demás pruebas."}
      - {norma: "LEC", articulo: "329", apartado: "2", tipo: "regula", nota: "O, en su lugar, requerir por providencia que se aporten, según su naturaleza, las demás pruebas y lo pretendido."}
      - {norma: "LEC", articulo: "330", apartado: "1", tipo: "regula", nota: "Al tercero no litigante solo se le exige exhibir si el tribunal ve el documento trascendente para sentenciar."}
      - {norma: "LEC", articulo: "330", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Comparecencia personal del tercero y resolución sin recurso; la parte puede reproducir la petición en segunda instancia."}
      - {norma: "LEC", articulo: "330", apartado: "2", tipo: "regula", nota: "No son terceros los titulares de la relación controvertida o de las que son su causa, aunque no sean parte."}
      - {norma: "LEC", articulo: "331", tipo: "conexa", nota: "Si el exhibiente no quiere desprenderse del documento, el LAJ extiende testimonio o se digitaliza bajo su fe."}
      - {norma: "LEC", articulo: "332", apartado: "1", tipo: "regula", nota: "Las Administraciones no pueden negarse a certificar ni a exhibir, salvo documentación reservada o secreta, que razonan."}
      - {norma: "LEC", articulo: "332", apartado: "2", tipo: "conexa", nota: "También las empresas de servicios públicos o encargadas de actividades públicas, salvo deber legal de secreto."}
      - {norma: "LEC", articulo: "333", tipo: "conexa", nota: "Dibujos, fotos o planos de los que solo hay original: en la exhibición se obtiene copia con fe del LAJ."}
      - {norma: "LEC", articulo: "327", tipo: "conexa", nota: "Libros de comerciantes: el tribunal puede reclamarlos, motivada y excepcionalmente, con los asientos concretos."}
      - {norma: "LEC", articulo: "265", apartado: "2", tipo: "conexa", nota: "Si el documento está en archivo o registro del que pueden obtenerse copias, hay que aportarlo, no solo designarlo."}
      - {norma: "LEC", articulo: "256", apartado: "1", tipo: "conexa", nota: "Antes del pleito, la exhibición se pide como diligencia preliminar (documentos, cosa, testamento, cuentas, póliza)."}
      - {norma: "LEC", articulo: "261", apartado: "2.ª", tipo: "conexa", nota: "Diligencia preliminar desatendida: entrada y registro si hay indicios de dónde están los documentos."}
    no_consta_en_norma:
      - "Qué negativa es «injustificada» (329) y el peso de la copia del solicitante frente a otras pruebas: casuística jurisprudencial."
      - "Momento para pedir la exhibición entre partes: el art. 328 no lo fija; se propone con la prueba (audiencia previa o verbal)."
      - "Datos personales de terceros y secreto profesional o bancario frente a la exhibición: ponderación jurisprudencial."
    afines: ["Diligencias preliminares", "Documentos: aportación e impugnación", "Fuerza probatoria de documentos públicos y privados", "Proposición de prueba", "Prueba anticipada y aseguramiento de la prueba", "Carga de la prueba"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Prueba anticipada y aseguramiento de la prueba"
    sinonimos: ["prueba anticipada", "anticipación de la prueba", "aseguramiento de la prueba", "medidas de aseguramiento", "conservar la prueba", "testigo de edad avanzada", "peritaje antes de la demanda", "estado de la obra antes de reparar", "riesgo de destrucción de pruebas", "acta del estado de cosas", "caución sustitutoria", "prueba antes del pleito"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "293", apartado: "1", tipo: "regula", nota: "Antes del proceso o durante él cabe anticipar un acto de prueba si hay temor fundado de que no pueda hacerse en su momento."}
      - {norma: "LEC", articulo: "293", apartado: "2", tipo: "regula", nota: "Antes del pleito, ante el tribunal competente para el asunto principal, que controla de oficio su competencia; sin declinatoria."}
      - {norma: "LEC", articulo: "294", apartado: "1", tipo: "conexa", nota: "Se propone según las normas de cada medio de prueba, exponiendo las razones de la petición."}
      - {norma: "LEC", articulo: "294", apartado: "2", tipo: "regula", nota: "Si es fundada, se acuerda por providencia y se practica cuando convenga, siempre antes del juicio o vista."}
      - {norma: "LEC", articulo: "295", apartado: "1", tipo: "regula", nota: "Antes del proceso, el solicitante designa a los futuros demandados, citados con cinco días al menos para intervenir."}
      - {norma: "LEC", articulo: "295", apartado: "3", tipo: "regula", nota: "Practicada antes del proceso, pierde su valor si no se demanda en dos meses, salvo fuerza mayor o causa análoga."}
      - {norma: "LEC", articulo: "295", apartado: "4", tipo: "regula", nota: "Si después es posible y una parte lo pide, se repite; ambas se valoran según la sana crítica."}
      - {norma: "LEC", articulo: "296", apartado: "1", tipo: "conexa", nota: "Documentos y materiales quedan bajo custodia del tribunal que la acordó hasta que se unen a la demanda."}
      - {norma: "LEC", articulo: "297", apartado: "1", tipo: "regula", nota: "Aseguramiento: medidas para que conductas o hechos naturales no destruyan o alteren cosas o estados de cosas."}
      - {norma: "LEC", articulo: "297", apartado: "2", tipo: "regula", nota: "Medidas para conservar cosas o situaciones o dejar constancia fehaciente de ellas; también mandatos de hacer o no hacer."}
      - {norma: "LEC", articulo: "297", apartado: "3", tipo: "conexa", nota: "Jurisdicción y competencia para el aseguramiento: las de la prueba anticipada."}
      - {norma: "LEC", articulo: "297", apartado: "4", tipo: "regula", nota: "Acordadas antes del proceso, decaen sin demanda en veinte días: se alzan, con costas y daños a cargo del solicitante."}
      - {norma: "LEC", articulo: "298", apartado: "1", tipo: "regula", nota: "Requisitos: prueba posible, pertinente y útil; riesgo de que luego sea imposible; medida conducente, breve y proporcionada."}
      - {norma: "LEC", articulo: "298", apartado: "2", tipo: "conexa", nota: "El tribunal pondera el ofrecimiento del solicitante de garantizar los daños y perjuicios de la medida."}
      - {norma: "LEC", articulo: "298", apartado: "3", tipo: "conexa", nota: "Cabe sustituir la medida por caución bastante del afectado que responda de la práctica de la prueba."}
      - {norma: "LEC", articulo: "298", apartado: "4", tipo: "regula", nota: "Se adopta oyendo a quien la soporta y, si hay proceso, al demandado; solo este discute la utilidad de la prueba."}
      - {norma: "LEC", articulo: "298", apartado: "5", tipo: "regula", nota: "Sin audiencia si el retraso causa daño irreparable o hay riesgo de destrucción: providencia motivada e irrecurrible."}
      - {norma: "LEC", articulo: "298", apartado: "6", tipo: "regula", nota: "Adoptada sin audiencia, oposición en veinte días desde la notificación de la providencia."}
      - {norma: "LEC", articulo: "298", apartado: "8", tipo: "conexa", nota: "Oposición: vista en cinco días y auto irrecurrible en tres."}
      - {norma: "LEC", articulo: "64", apartado: "2", tipo: "conexa", nota: "La declinatoria no impide practicar el aseguramiento de prueba, salvo caución del demandado."}
    no_consta_en_norma:
      - "Recurso contra la providencia del 294.2: aunque el epígrafe dice «recursos», el texto no regula ninguno; rige el régimen general."
      - "Si la prueba anticipada solicitada antes del pleito interrumpe la prescripción de la acción: criterio jurisprudencial."
      - "Acta notarial de presencia o pericial extrajudicial como alternativa: no es prueba anticipada; vale lo que su clase de prueba."
    afines: ["Diligencias preliminares", "Medidas cautelares antes de la demanda", "Caución", "Dictamen pericial de parte y judicial", "Reconocimiento judicial", "Exhibición de documentos entre partes y por terceros"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Prueba ilícita"
    sinonimos: ["prueba ilícita", "prueba ilegal", "prueba prohibida", "vulneración de derechos fundamentales", "grabación oculta", "detective privado", "videovigilancia", "correo intervenido", "secreto de las comunicaciones", "intimidad", "nulidad de la prueba", "fruto del árbol envenenado"]
    normas_base: ["LEC", "LOPJ", "CE"]
    remisiones:
      - {norma: "LOPJ", articulo: "11", apartado: "1", tipo: "regula", nota: "No surten efecto las pruebas obtenidas, directa o indirectamente, violentando derechos o libertades fundamentales."}
      - {norma: "LEC", articulo: "287", apartado: "1", tipo: "regula", nota: "Quien vea vulnerados derechos fundamentales al obtener una prueba admitida debe alegarlo de inmediato."}
      - {norma: "LEC", articulo: "287", apartado: "1, párrafo 2.º", tipo: "regula", nota: "También de oficio; se resuelve en el acto del juicio, oídas las partes y con prueba sobre la ilicitud."}
      - {norma: "LEC", articulo: "287", apartado: "2", tipo: "regula", nota: "Contra lo resuelto, solo reposición en el acto; la impugnación se reproduce en la apelación contra la sentencia."}
      - {norma: "LEC", articulo: "287", apartado: "3", tipo: "regula", nota: "En el verbal, la cuestión se resuelve en el auto del art. 438.10, antes de la vista."}
      - {norma: "LEC", articulo: "438", apartado: "9", tipo: "conexa", nota: "Verbal: impugnación por ilicitud (art. 287) en los tres días siguientes al traslado de la proposición de prueba."}
      - {norma: "LEC", articulo: "438", apartado: "10", tipo: "conexa", nota: "Verbal: el auto resuelve impugnaciones, excepciones, prueba y si hay vista; cabe reposición con efecto suspensivo."}
      - {norma: "LEC", articulo: "433", apartado: "1", tipo: "regula", nota: "Ordinario: si se suscita la ilicitud de una prueba, se resuelve antes de practicar las demás."}
      - {norma: "LEC", articulo: "283", apartado: "3", tipo: "regula", nota: "Nunca se admite como prueba una actividad prohibida por la ley."}
      - {norma: "CE", articulo: "24", apartado: "2", tipo: "regula", nota: "Derecho a un proceso con todas las garantías y a utilizar los medios de prueba pertinentes."}
      - {norma: "CE", articulo: "18", apartado: "1", tipo: "conexa", nota: "Derecho al honor, a la intimidad personal y familiar y a la propia imagen."}
      - {norma: "CE", articulo: "18", apartado: "2", tipo: "conexa", nota: "Domicilio inviolable: sin consentimiento o resolución judicial no hay entrada ni registro, salvo flagrante delito."}
      - {norma: "CE", articulo: "18", apartado: "3", tipo: "conexa", nota: "Secreto de las comunicaciones, salvo resolución judicial."}
      - {norma: "CE", articulo: "18", apartado: "4", tipo: "conexa", nota: "La ley limita el uso de la informática para proteger el honor y la intimidad."}
      - {norma: "LEC", articulo: "265", apartado: "1.5.º", tipo: "conexa", nota: "Informes de detectives habilitados: se aportan con la demanda o contestación; si no se reconocen los hechos, testifical."}
      - {norma: "LEC", articulo: "382", apartado: "1", tipo: "conexa", nota: "Grabaciones de palabra, imagen o sonido: se proponen como reproducción, con transcripción de lo relevante."}
      - {norma: "LEC", articulo: "459", tipo: "conexa", nota: "En apelación cabe alegar infracción de garantías procesales, acreditando que se denunció en su momento."}
    no_consta_en_norma:
      - "Grabar una conversación propia no vulnera el secreto de las comunicaciones (doctrina del TC); puede afectar a la intimidad."
      - "Alcance de la ineficacia de la prueba derivada (conexión de antijuridicidad): doctrina del TC y del TS."
      - "Prueba obtenida por un particular sin finalidad probatoria y su admisibilidad: jurisprudencial."
      - "Seguimientos de detective y cámaras de videovigilancia: sus límites los fija la doctrina sobre intimidad y la normativa de datos."
    fuera_de_la_herramienta:
      - "LO 3/2018, de Protección de Datos Personales y garantía de los derechos digitales: videovigilancia y tratamiento de datos."
      - "Ley 5/2014, de Seguridad Privada: actividades y límites de los detectives privados."
    afines: ["Derecho a la prueba y a un proceso con todas las garantías", "Pertinencia y utilidad de la prueba; protesta", "Medios de reproducción, correos y mensajería (WhatsApp) como prueba", "Tutela judicial efectiva e indefensión", "Juicio ordinario: práctica de la prueba y conclusiones", "Inviolabilidad del domicilio en la ejecución y el lanzamiento"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Presunciones y hechos exentos de prueba"
    sinonimos: ["presunción", "presunción legal", "presunción judicial", "prueba de indicios", "prueba indiciaria", "presunción iuris tantum", "presunción iuris et de iure", "hecho notorio", "hechos conformes", "hechos exentos de prueba", "prueba en contrario", "enlace preciso y directo"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "281", apartado: "3", tipo: "regula", nota: "Exentos de prueba los hechos en que hay plena conformidad de las partes, salvo materia indisponible."}
      - {norma: "LEC", articulo: "281", apartado: "4", tipo: "regula", nota: "No hay que probar los hechos de notoriedad absoluta y general."}
      - {norma: "LEC", articulo: "281", apartado: "2", tipo: "conexa", nota: "Costumbre y derecho extranjero se prueban; la costumbre no, si hay conformidad y no afecta al orden público."}
      - {norma: "LEC", articulo: "385", apartado: "1", tipo: "regula", nota: "La presunción legal dispensa de probar el hecho presunto, pero el indicio ha de quedar admitido o probado."}
      - {norma: "LEC", articulo: "385", apartado: "2", tipo: "regula", nota: "La prueba en contrario puede negar el hecho presunto o el enlace entre el indicio y lo presumido."}
      - {norma: "LEC", articulo: "385", apartado: "3", tipo: "regula", nota: "Toda presunción legal admite prueba en contrario, salvo que la ley la prohíba expresamente."}
