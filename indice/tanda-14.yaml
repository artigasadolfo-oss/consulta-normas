      - {norma: "LEC", articulo: "52", apartado: "1.14.º", tipo: "regula", nota: "No incorporación o nulidad: tribunal del domicilio del demandante; declarativa, cesación o retractación: del demandado."}
      - {norma: "LEC", articulo: "438 bis", apartado: "1", tipo: "regula", nota: "Antes de admitir, el LAJ avisa si hay pleitos previos iguales, sin control de transparencia ni vicios y con identidad sustancial."}
      - {norma: "LEC", articulo: "438 bis", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Actor y demandado pueden pedir en demanda o contestación que se siga este cauce, si concurren sus presupuestos."}
      - {norma: "LEC", articulo: "438 bis", apartado: "2", tipo: "regula", nota: "Auto de suspensión hasta la sentencia firme del procedimiento testigo, que es preferente; apelable con trámite urgente."}
      - {norma: "LEC", articulo: "438 bis", apartado: "3", tipo: "regula", nota: "Firme la sentencia testigo, providencia sobre qué queda por resolver; cinco días para desistir, seguir o pedir extensión."}
      - {norma: "LEC", articulo: "438 bis", apartado: "4", tipo: "regula", nota: "Si el actor desiste, decreto sin condena en costas."}
      - {norma: "LEC", articulo: "438 bis", apartado: "5", tipo: "regula", nota: "Si sigue pese a la providencia y solo obtiene lo ya resuelto en el testigo, cabe que cada parte pague sus costas."}
      - {norma: "LEC", articulo: "438 bis", apartado: "6", tipo: "conexa", nota: "La extensión de efectos de la sentencia testigo se tramita por el art. 519."}
      - {norma: "LEC", articulo: "519", apartado: "2", tipo: "regula", nota: "Extensión de sentencia firme tras apelación: misma situación y demandado, sin transparencia ni vicios, cláusula igual, competencia."}
      - {norma: "LEC", articulo: "519", apartado: "2, párrafo 2.º", tipo: "regula", nota: "Se pide por escrito en el plazo máximo de un año desde la firmeza de la sentencia que se quiere extender."}
      - {norma: "LEC", articulo: "519", apartado: "3", tipo: "conexa", nota: "Diez días al condenado para allanarse u oponerse; si no responde, se entiende que está conforme."}
      - {norma: "LEC", articulo: "519", apartado: "4", tipo: "conexa", nota: "Auto en cinco días; costas del art. 394 si se estima con oposición; sin costas si se rechaza."}
      - {norma: "LEC", articulo: "519", apartado: "5", tipo: "conexa", nota: "El auto que extiende o deniega la extensión es apelable, con tramitación preferente."}
      - {norma: "LEC", articulo: "455", apartado: "4", tipo: "conexa", nota: "Son preferentes las apelaciones contra las resoluciones del procedimiento testigo y los autos de suspensión."}
      - {norma: "LEC", articulo: "455", apartado: "1", tipo: "conexa", nota: "El límite de 3.000 euros para apelar rige solo en los verbales por cuantía, no en los verbales por materia como este."}
      - {norma: "LEC", articulo: "439", apartado: "5", tipo: "conexa", nota: "Cláusulas abusivas en préstamos hipotecarios: inadmisión sin la reclamación previa extrajudicial al prestamista."}
    no_consta_en_norma:
      - "Qué es «identidad sustancial» de las condiciones generales y cuándo sobra el control de transparencia: jurisprudencial."
      - "Si el actor que no pidió el cauce testigo puede oponerse eficazmente a la suspensión: el texto solo da apelación contra el auto."
      - "Relación entre la reclamación previa del 439.5 y el requisito de procedibilidad de la LO 1/2025: criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 7/1998, de Condiciones Generales de la Contratación: acciones individuales y colectivas a que remiten los arts. 250.1.14.º y 249.1.5.º LEC."
    afines: ["Control de oficio de cláusulas abusivas en el proceso", "Cláusulas abusivas: concepto, nulidad e integración", "Ámbito del juicio verbal por materia y cuantía", "Competencia territorial y fueros imperativos", "Acciones colectivas y de cesación de consumo", "Suspensión del proceso", "Requisito de procedibilidad (MASC)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Zonas de mercado residencial tensionado y límites de renta"
    sinonimos: ["zona tensionada", "zona de mercado residencial tensionado", "tope del alquiler", "límite de renta", "congelación del alquiler", "renta del contrato anterior", "índice de precios de referencia", "gran tenedor", "prórroga extraordinaria en zona tensionada", "incremento del 10 %", "IRAV", "alquiler por habitaciones en zona tensionada"]
    normas_base: ["LAU"]
    remisiones:
      - {norma: "LAU", articulo: "17", apartado: "6", tipo: "regula", nota: "Zona tensionada: la renta inicial no supera la última de vivienda de los cinco años previos, actualizada (texto de 08-10-2026)."}
      - {norma: "LAU", articulo: "17", apartado: "6, párrafo 2.º", tipo: "regula", nota: "Prohibido repercutir cuotas, gastos, servicios o tributos que no recogía el contrato anterior (servicios y tributos, desde 08-10-2026)."}
      - {norma: "LAU", articulo: "17", apartado: "6, párrafo 3.º", tipo: "regula", nota: "Hasta un 10 % más si hubo rehabilitación, mejora energética o de accesibilidad en dos años, o contrato de diez o más años."}
      - {norma: "LAU", articulo: "17", apartado: "7", tipo: "regula", nota: "Gran tenedor en zona tensionada: tope del índice de precios de referencia, sin repercutir conceptos que lo superen."}
      - {norma: "LAU", articulo: "17", apartado: "7, párrafo 2.º", tipo: "regula", nota: "Mismo tope para vivienda sin contrato en cinco años, si lo prevé la resolución ministerial que declara la zona."}
      - {norma: "LAU", articulo: "17", apartado: "8", tipo: "conexa", nota: "Temporales sucesivos en la misma vivienda: incremento anual no superior al IRAV (desde 08-10-2026)."}
      - {norma: "LAU", articulo: "17", apartado: "9", tipo: "conexa", nota: "Por habitaciones: la suma de las rentas parciales simultáneas no supera la renta unitaria de la vivienda completa (desde 08-10-2026)."}
      - {norma: "LAU", articulo: "17", apartado: "9, párrafo 2.º", tipo: "regula", nota: "Por habitaciones en zona tensionada: renta unitaria o suma de parciales dentro de los límites 6, 7 y 8 (desde 08-10-2026)."}
      - {norma: "LAU", articulo: "dt 7", tipo: "regula", nota: "El 17.7 rige para contratos desde la Ley 12/2023 y una vez aprobado el sistema de índices de precios de referencia."}
      - {norma: "LAU", articulo: "10", apartado: "3", tipo: "regula", nota: "Zona tensionada: prórroga extraordinaria anual hasta tres años a petición del inquilino; salvo pacto, nuevo contrato o necesidad."}
      - {norma: "LAU", articulo: "18", apartado: "1", tipo: "conexa", nota: "Actualización anual solo si se pacta; con tope del IRAV (texto de 08-10-2026)."}
      - {norma: "LAU", articulo: "da 11", tipo: "conexa", nota: "El INE define el IRAV como límite de referencia de la actualización del art. 18."}
      - {norma: "LAU", articulo: "6", tipo: "conexa", nota: "Son nulas las estipulaciones que modifiquen en perjuicio del arrendatario las normas del título II, salvo autorización legal."}
    no_consta_en_norma:
      - "Consecuencia de pactar una renta por encima del tope (nulidad del exceso, devolución, plazo): la LAU no la regula."
      - "Si la renta de un arrendamiento temporal previo cuenta como «última renta» del 17.6, que ahora dice «de vivienda» (su párrafo 3.º aún dice «de vivienda habitual»): sin criterio judicial."
      - "Vivienda antes destinada a uso turístico, sin contrato de arrendamiento de vivienda en los cinco años previos: no hay «última renta» del 17.6; solo cabe el 17.7, párrafo 2.º."
    fuera_de_la_herramienta:
      - "Ley 12/2023, por el derecho a la vivienda, arts. 3.k) (redacción del RDL 29/2026) y 18: concepto de gran tenedor y procedimiento de declaración de la zona."
      - "Resoluciones trimestrales del Ministerio de Vivienda (BOE) con las zonas declaradas y su vigencia; sistema estatal de índices de referencia."
      - "RDL 29/2026, disp. final 6.ª (sin convalidar): hasta 31-12-2027 sin nuevo pacto, subida máxima del 2 %; ninguna si la renta supera el índice."
      - "RDL 29/2026, disp. final 5.ª (sin convalidar): prórroga extraordinaria de hasta dos años, incompatible con la del 10.3 LAU, que prevalece."
      - "RDL 28/2026 (vigor 15-11-2026, sin convalidar): la prórroga del 10.3 pasa al 10.6; la oferta de nuevo contrato del 10.2.e) se ajusta al 17.6 aun fuera de zona tensionada."
      - "Ley 12/2023, disp. trans. 4.ª.1 (redacción del RDL 29/2026): los contratos anteriores a esa ley pueden acogerse a las prórrogas del art. 10 LAU y se actualizan con el tope de la da 11.ª y del 18.1 LAU."
    # PENDIENTE: verificar en el BOE (resoluciones trimestrales del Ministerio) que ningún municipio de la Comunitat Valenciana está declarado zona tensionada; solo consta en fuentes secundarias, a 29-07-2026.
    # VIGENCIA: LAU 10.1, 17.6 a 17.9 y 18.1 en la redacción del RDL 29/2026 (BOE 07-10-2026, vigor 08-10-2026), leída en la composición
    # 597314599f: el 17.6 dice ya «de vivienda» y separa en su párrafo 2.º la prohibición de repercutir; el 17.8 y el 17.9 son nuevos.
    # El 10.3 no lo toca el RDL 29/2026; el 15-11-2026 lo sustituye el 10.6 (RDL 28/2026) y hay que revisar de nuevo la voz.
    # LAU 6, da 11 y dt 7 sin cambios. Disp. finales 5.ª y 6.ª del RDL 29/2026 y disp. trans. 4.ª Ley 12/2023, leídas en boe.es.
    # AVISO: RDL 29/2026 no convalidado a esta fecha (Diputación Permanente, art. 86.2 CE); si se deroga, caen el 17.8, el 17.9, el IRAV
    # del 18.1 y la redacción nueva del 17.6 y del 17.7, como ocurrió con el RDL 26/2026. Va «provisional» por eso.
    afines: ["Renta: pago, recibo y actualización", "Duración y prórroga del arrendamiento de vivienda", "Arrendamiento de temporada y para uso distinto de vivienda", "Gastos generales, servicios e IBI", "Vivienda de uso turístico: exclusión de la LAU", "Vulnerabilidad y gran tenedor en la demanda"]
    estado: "provisional"
    espejo: "legalize-es@597314599f"
    revisada_el: "2026-10-09"
    revisor: "armero"
