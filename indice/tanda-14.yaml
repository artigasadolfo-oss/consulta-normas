      - {norma: "LEC", articulo: "435", apartado: "1.1.ª", tipo: "regula", nota: "No caben para pruebas que pudieron proponerse en tiempo, incluidas las que cabía proponer tras la advertencia del 429.1."}
      - {norma: "LEC", articulo: "435", apartado: "1.2.ª", tipo: "regula", nota: "Sí para pruebas admitidas que no se practicaron por causas ajenas a quien las propuso."}
