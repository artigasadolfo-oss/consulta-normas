      - {norma: "LAU", articulo: "26", tipo: "conexa", nota: "Puede desistir sin indemnización si las obras hacen inhabitable la vivienda."}
      - {norma: "LAU", articulo: "4", apartado: "3", tipo: "conexa", nota: "Uso distinto: el desistimiento depende de lo pactado; el art. 11 es del título II."}
      - {norma: "CC", articulo: "1124", tipo: "conexa", nota: "Fuera de los casos legales o pactados, abandonar es incumplir: resolución o cumplimiento, con daños."}
    no_consta_en_norma:
