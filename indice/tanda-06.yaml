      - {norma: "LAU", articulo: "9", apartado: "3, párrafo 3.º", tipo: "regula", nota: "Sin ocupación en tres meses: en treinta días, reposición hasta cinco años o una mensualidad por año restante."}
      - {norma: "LAU", articulo: "9", apartado: "1", tipo: "conexa", nota: "Prórroga obligatoria anual hasta 5 o 7 años, que es la que excluye la necesidad del 9.3."}
