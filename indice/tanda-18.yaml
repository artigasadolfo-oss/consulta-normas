# Índice de conceptos de «Consulta de normas» — tanda 18 (prioridad B: voces 183 y 186 a 196)
# Revisor: armero. Espejo: legalize-es@aca28304d, leído con `git show aca28304d:es/…` (no el árbol de trabajo, que hoy trae erratas).
# Todo precepto citado se ha leído en el espejo en esta pasada. Vigencia: contraste con la API de boe.es (08-10-2026).
# Ver tanda-18-notas.md.

voces:
  - voz: "Revisión de sentencias firmes"
    sinonimos: ["demanda de revisión", "recurso de revisión civil", "revisión por documentos recobrados", "maquinación fraudulenta", "sentencia ganada con cohecho o violencia", "falso testimonio de testigos o peritos", "documento declarado falso", "revisión por sentencia del TEDH", "plazo de cinco años", "plazo de tres meses desde el descubrimiento", "depósito de 300 euros", "rescisión de la sentencia por revisión"]
    normas_base: ["LEC", "LOPJ"]
    remisiones:
      - {norma: "LEC", articulo: "509", tipo: "regula", nota: "Se pide a la Sala de lo Civil del TS o a la Civil y Penal del TSJ, según la LOPJ."}
      - {norma: "LEC", articulo: "510", apartado: "1.1.º", tipo: "regula", nota: "Documentos decisivos recobrados después, retenidos por fuerza mayor o por la parte favorecida."}
      - {norma: "LEC", articulo: "510", apartado: "1.2.º", tipo: "regula", nota: "Sentencia basada en documentos declarados falsos en un proceso penal, antes ignorado por una parte o después."}
      - {norma: "LEC", articulo: "510", apartado: "1.3.º", tipo: "regula", nota: "Testigos o peritos condenados por falso testimonio en las declaraciones que fundaron la sentencia."}
      - {norma: "LEC", articulo: "510", apartado: "1.4.º", tipo: "regula", nota: "Sentencia ganada injustamente por cohecho, violencia o maquinación fraudulenta."}
      - {norma: "LEC", articulo: "510", apartado: "2", tipo: "regula", nota: "Resolución firme que el TEDH declara contraria al Convenio, con efectos persistentes; respeta a terceros de buena fe."}
      - {norma: "LEC", articulo: "511", tipo: "regula", nota: "Legitimada la parte perjudicada; en la revisión por sentencia del TEDH, solo quien demandó ante él."}
      - {norma: "LEC", articulo: "512", apartado: "1", tipo: "regula", nota: "Tope de cinco años desde la publicación de la sentencia; por sentencia del TEDH, un año desde su firmeza."}
      - {norma: "LEC", articulo: "512", apartado: "2", tipo: "regula", nota: "Dentro de los cinco años, tres meses desde que se descubre el documento, el cohecho, la violencia, el fraude o la falsedad."}
      - {norma: "LEC", articulo: "513", apartado: "1", tipo: "regula", nota: "Con la demanda se acredita un depósito de 300 euros, que se devuelve si se estima la revisión."}
      - {norma: "LEC", articulo: "513", apartado: "2", tipo: "regula", nota: "Sin depósito o insuficiente y no subsanado en el plazo del LAJ (cinco días como máximo): se repele de plano."}
      - {norma: "LEC", articulo: "514", apartado: "1", tipo: "regula", nota: "Admitida, se reclaman las actuaciones y se emplaza a los litigantes o sus causahabientes para contestar en veinte días."}
      - {norma: "LEC", articulo: "514", apartado: "2", tipo: "regula", nota: "Contestada o pasado el plazo, vista por los trámites del juicio verbal (arts. 440 y ss.)."}
      - {norma: "LEC", articulo: "514", apartado: "3", tipo: "regula", nota: "El Ministerio Fiscal informa siempre antes de la sentencia."}
      - {norma: "LEC", articulo: "514", apartado: "4", tipo: "conexa", nota: "Prejudicialidad penal surgida en la revisión: art. 40, y deja de correr el tope de cinco años del 512.1."}
      - {norma: "LEC", articulo: "515", tipo: "regula", nota: "La demanda de revisión no suspende la ejecución de la sentencia, salvo lo previsto en el art. 566."}
      - {norma: "LEC", articulo: "516", apartado: "1", tipo: "regula", nota: "Estimada, se rescinde la sentencia y se devuelven los autos; en el nuevo juicio no se discute lo declarado en la revisión."}
      - {norma: "LEC", articulo: "516", apartado: "2", tipo: "regula", nota: "Desestimada, costas al demandante y pérdida del depósito."}
      - {norma: "LEC", articulo: "516", apartado: "3", tipo: "regula", nota: "Contra la sentencia que resuelve la revisión no cabe recurso alguno."}
      - {norma: "LEC", articulo: "566", apartado: "1", tipo: "conexa", nota: "Admitida la revisión, cabe suspender la ejecución a instancia de parte, con caución por lo litigado y los daños; oído el Fiscal."}
      - {norma: "LEC", articulo: "566", apartado: "3", tipo: "conexa", nota: "Estimada la revisión, el LAJ sobresee la ejecución."}
      - {norma: "LEC", articulo: "207", apartado: "2", tipo: "conexa", nota: "Firme es la resolución contra la que no cabe recurso, por no preverlo la ley o por pasar el plazo sin recurrir."}
      - {norma: "LEC", articulo: "40", apartado: "4", tipo: "conexa", nota: "Causa penal por falsedad de un documento decisivo: suspensión del civil sin esperar a que quede pendiente de sentencia."}
      - {norma: "LOPJ", articulo: "56", apartado: "1.º", tipo: "conexa", nota: "La Sala de lo Civil del TS conoce de los recursos de casación, revisión y otros extraordinarios civiles."}
      - {norma: "LOPJ", articulo: "73", apartado: "1.b)", tipo: "conexa", nota: "La Sala de lo Civil y Penal del TSJ conoce de la revisión en Derecho civil propio si lo prevé el Estatuto."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "3.e)", tipo: "conexa", nota: "Fija 50 euros para la revisión, pero el apartado 14 de la misma disposición excluye la revisión civil."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "14", tipo: "regula", nota: "Este depósito no se aplica a la revisión en el orden civil, que sigue regulada por la LEC (300 euros, art. 513)."}
    no_consta_en_norma:
      - "Carácter tasado y de interpretación restrictiva de los motivos del 510: jurisprudencial."
      - "Qué es «documento decisivo» y «maquinación fraudulenta» (p. ej., emplazamiento edictal malicioso): jurisprudencial."
      - "Revisión de autos o decretos firmes y de sentencias sin cosa juzgada material: la LEC no lo resuelve aquí; casuística."
    afines: ["Rescisión de la sentencia firme a instancia del rebelde", "Cosa juzgada", "Nulidad de actuaciones", "Cuestiones prejudiciales (penal, administrativa, civil)", "Suspensión de la ejecución", "Depósito para recurrir", "Recurso de casación"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Separación y divorcio contenciosos"
    sinonimos: ["divorcio contencioso", "separación contenciosa", "divorcio a petición de uno de los cónyuges", "divorcio sin causa", "plazo de tres meses de matrimonio", "demanda de divorcio", "reconvención en el divorcio", "medidas definitivas", "proceso matrimonial", "efectos de la sentencia de divorcio", "reconciliación", "divorcio y violencia sobre la mujer"]
    normas_base: ["CC", "LEC", "LO 1/2025", "LOPJ"]
    remisiones:
      - {norma: "CC", articulo: "81", apartado: "2.º", tipo: "regula", nota: "Separación a petición de uno: tres meses de matrimonio, salvo riesgo acreditado para el demandante o los hijos."}
      - {norma: "CC", articulo: "86", tipo: "regula", nota: "Divorcio judicial a petición de uno, de ambos o de uno con consentimiento del otro, con los requisitos del art. 81."}
      - {norma: "CC", articulo: "85", tipo: "conexa", nota: "El matrimonio se disuelve por muerte, declaración de fallecimiento o divorcio."}
      - {norma: "CC", articulo: "88", tipo: "conexa", nota: "La acción de divorcio se extingue por muerte o reconciliación, que ha de ser expresa si es posterior a la demanda."}
      - {norma: "CC", articulo: "84", tipo: "conexa", nota: "La reconciliación pone fin al proceso de separación; ambos la comunican al juez, que decide sobre las medidas de los hijos."}
      - {norma: "CC", articulo: "83", tipo: "regula", nota: "Separación: efectos desde la firmeza; frente a terceros de buena fe, desde la inscripción en el Registro Civil."}
      - {norma: "CC", articulo: "89", tipo: "regula", nota: "Divorcio: efectos desde la firmeza; a terceros de buena fe no les perjudica hasta la inscripción."}
      - {norma: "CC", articulo: "91", tipo: "regula", nota: "Sin acuerdo aprobado, la sentencia fija las medidas sobre hijos, vivienda, animales, cargas, régimen económico y garantías."}
      - {norma: "CC", articulo: "95", tipo: "conexa", nota: "La sentencia firme disuelve el régimen económico y aprueba su liquidación si hay mutuo acuerdo."}
      - {norma: "CC", articulo: "107", apartado: "2", tipo: "conexa", nota: "Con elemento extranjero, separación y divorcio se rigen por las normas de DIPr de la UE o españolas."}
      - {norma: "LEC", articulo: "769", apartado: "1", tipo: "regula", nota: "Competente el juzgado del domicilio conyugal; si viven en partidos distintos, último domicilio o residencia del demandado."}
      - {norma: "LEC", articulo: "769", apartado: "4", tipo: "regula", nota: "El tribunal examina de oficio su competencia; son nulos los pactos en contrario."}
      - {norma: "LEC", articulo: "770", tipo: "regula", nota: "Se tramita por el juicio verbal con las reglas especiales de este artículo."}
      - {norma: "LEC", articulo: "770", apartado: "1.ª", tipo: "regula", nota: "Certificaciones de matrimonio y nacimientos; si hay medidas patrimoniales, ambas partes aportan su documentación económica."}
      - {norma: "LEC", articulo: "770", apartado: "2.ª", tipo: "regula", nota: "Reconvención con la contestación, solo en los casos tasados; el actor la contesta en diez días."}
      - {norma: "LEC", articulo: "770", apartado: "3.ª", tipo: "regula", nota: "Comparecencia personal y con abogado; la ausencia injustificada puede dar por admitidos hechos sobre medidas patrimoniales."}
      - {norma: "LEC", articulo: "770", apartado: "4.ª", tipo: "regula", nota: "Prueba pendiente en treinta días como máximo; prueba de oficio; los hijos de doce años o más son oídos siempre."}
      - {norma: "LEC", articulo: "770", apartado: "5.ª", tipo: "conexa", nota: "En cualquier momento puede seguirse por el trámite de mutuo acuerdo del art. 777."}
      - {norma: "LEC", articulo: "770", apartado: "7.ª", tipo: "conexa", nota: "Suspensión de común acuerdo para mediación (art. 19.4)."}
      - {norma: "LEC", articulo: "753", apartado: "1", tipo: "regula", nota: "Juicio verbal con contestación escrita en veinte días; traslado al Fiscal cuando proceda."}
      - {norma: "LEC", articulo: "753", apartado: "1, párrafo 2.º", tipo: "conexa", nota: "Consulta de registros para verificar si es competente el juzgado de violencia sobre la mujer (art. 49 bis)."}
      - {norma: "LEC", articulo: "751", apartado: "1", tipo: "regula", nota: "No surten efecto la renuncia, el allanamiento ni la transacción."}
      - {norma: "LEC", articulo: "751", apartado: "2.4.º", tipo: "regula", nota: "En separación y divorcio el desistimiento no requiere la conformidad del Fiscal."}
      - {norma: "LEC", articulo: "751", apartado: "3", tipo: "conexa", nota: "Sobre materias de libre disposición caben renuncia, allanamiento, transacción y desistimiento."}
      - {norma: "LEC", articulo: "752", apartado: "1", tipo: "regula", nota: "Se decide por los hechos probados, sea cual sea el momento de su alegación; prueba de oficio."}
      - {norma: "LEC", articulo: "752", apartado: "2", tipo: "regula", nota: "La conformidad o el silencio no vinculan; no rige la fuerza probatoria legal del interrogatorio ni de los documentos."}
      - {norma: "LEC", articulo: "752", apartado: "4", tipo: "conexa", nota: "Esas especialidades no se aplican a las pretensiones sobre materias de libre disposición."}
      - {norma: "LEC", articulo: "749", apartado: "2", tipo: "conexa", nota: "Intervención preceptiva del Fiscal si algún interesado es menor, persona con discapacidad o ausente."}
      - {norma: "LEC", articulo: "774", apartado: "4", tipo: "regula", nota: "Sin acuerdo o no aprobado, la sentencia fija las medidas que sustituyen a las provisionales."}
      - {norma: "LEC", articulo: "774", apartado: "5", tipo: "regula", nota: "Los recursos no suspenden las medidas; si solo se recurren estas, el LAJ declara firme el divorcio o la separación."}
      - {norma: "LEC", articulo: "755", tipo: "conexa", nota: "La sentencia se comunica de oficio al Registro Civil; a petición de parte, a otros Registros."}
      - {norma: "LEC", articulo: "49 bis", apartado: "1", tipo: "conexa", nota: "Iniciado proceso penal u orden de protección por violencia de género, el juez civil se inhibe salvo vista ya iniciada."}
      - {norma: "LOPJ", articulo: "89", apartado: "7", tipo: "conexa", nota: "Competencia civil exclusiva de la Sección de Violencia sobre la Mujer si concurren los cuatro requisitos."}
      - {norma: "LOPJ", articulo: "89", apartado: "9", tipo: "regula", nota: "En esos casos está vedado acudir a los medios adecuados de solución de controversias."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "2", tipo: "regula", nota: "MASC previo en los procesos del libro IV LEC; la separación y el divorcio no están entre las excepciones."}
    no_consta_en_norma:
      - "Fecha de efectos de las pensiones fijadas en la sentencia (demanda o sentencia): jurisprudencial."
      - "Alcance de la ficta admissio del 770.3.ª: limitada por la ley a medidas patrimoniales; aplicación casuística."
      - "Cómo se acredita el MASC en familia cuando el otro cónyuge no responde: casuística."
    fuera_de_la_herramienta:
      - "Reglamentos (UE) 2019/1111 (competencia) y 1259/2010 (ley aplicable): divorcio con elemento extranjero (art. 107.2 CC)."
    afines: ["Divorcio de mutuo acuerdo y convenio regulador", "Medidas provisionales en familia", "Guarda y custodia y régimen de visitas", "Pensión de alimentos a los hijos", "Pensión compensatoria", "Uso de la vivienda familiar", "Requisito de procedibilidad (MASC)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Divorcio de mutuo acuerdo y convenio regulador"
    sinonimos: ["divorcio de mutuo acuerdo", "separación de mutuo acuerdo", "divorcio consensual", "divorcio ante notario", "divorcio ante el letrado de la Administración de Justicia", "convenio regulador", "ratificación del convenio", "contenido mínimo del convenio", "aprobación del convenio", "convenio dañoso para los hijos", "una sola defensa y representación", "modificación del convenio"]
    normas_base: ["CC", "LEC", "LO 1/2025"]
    remisiones:
      - {norma: "CC", articulo: "81", apartado: "1.º", tipo: "regula", nota: "Con hijos menores o con apoyos atribuidos a los padres, separación judicial pasados tres meses, con propuesta de convenio."}
      - {norma: "CC", articulo: "86", tipo: "regula", nota: "Divorcio judicial de ambos o de uno con consentimiento del otro, con los requisitos del art. 81."}
      - {norma: "CC", articulo: "82", apartado: "1", tipo: "regula", nota: "Sin esos hijos, separación por convenio ante el LAJ o en escritura notarial, pasados tres meses de matrimonio."}
      - {norma: "CC", articulo: "82", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Intervención personal y con abogado; consienten los hijos mayores o emancipados sin ingresos que convivan."}
      - {norma: "CC", articulo: "82", apartado: "2", tipo: "regula", nota: "No cabe ante LAJ o notario si hay hijos menores no emancipados o mayores con apoyos atribuidos a los padres."}
      - {norma: "CC", articulo: "87", tipo: "regula", nota: "Divorcio por convenio ante el LAJ o notario con los requisitos del art. 82; no ante cónsules."}
      - {norma: "CC", articulo: "89", tipo: "conexa", nota: "Efectos desde la firmeza de la sentencia o decreto o desde el consentimiento en la escritura."}
      - {norma: "CC", articulo: "90", apartado: "1", tipo: "regula", nota: "Contenido mínimo: hijos, abuelos, animales, vivienda, cargas y alimentos, liquidación y pensión del art. 97."}
      - {norma: "CC", articulo: "90", apartado: "2", tipo: "regula", nota: "El juez aprueba salvo acuerdos dañosos para los hijos o gravemente perjudiciales para un cónyuge; denegación motivada."}
      - {norma: "CC", articulo: "90", apartado: "2, párrafo 4.º", tipo: "regula", nota: "Si el LAJ o el notario aprecian perjuicio, lo advierten y cierran el expediente: solo queda la vía judicial."}
      - {norma: "CC", articulo: "90", apartado: "2, párrafo 5.º", tipo: "regula", nota: "Desde la aprobación o la escritura, los acuerdos se ejecutan por la vía de apremio."}
      - {norma: "CC", articulo: "90", apartado: "3", tipo: "conexa", nota: "Modificación judicial o por nuevo convenio; los formalizados ante LAJ o notario, por nuevo acuerdo."}
      - {norma: "CC", articulo: "90", apartado: "4", tipo: "conexa", nota: "El juez o las partes pueden establecer garantías reales o personales del convenio."}
      - {norma: "LEC", articulo: "777", apartado: "1", tipo: "regula", nota: "Separación o divorcio de común acuerdo o de uno con consentimiento del otro: procedimiento de este artículo."}
      - {norma: "LEC", articulo: "777", apartado: "2", tipo: "regula", nota: "Con certificaciones, propuesta de convenio y documentos, incluido el acuerdo de mediación; prueba propuesta en el escrito."}
      - {norma: "LEC", articulo: "777", apartado: "3", tipo: "regula", nota: "Ratificación por separado en tres días; sin ella, archivo, recurrible en revisión, y queda la vía del 770."}
      - {norma: "LEC", articulo: "777", apartado: "4", tipo: "conexa", nota: "Diez días para completar documentación y practicar prueba."}
      - {norma: "LEC", articulo: "777", apartado: "5", tipo: "regula", nota: "Con hijos menores o con apoyos, informe del Fiscal sobre el convenio y audiencia de los hijos si se estima necesaria."}
      - {norma: "LEC", articulo: "777", apartado: "6", tipo: "regula", nota: "Sentencia que concede o deniega y se pronuncia sobre el convenio."}
      - {norma: "LEC", articulo: "777", apartado: "7", tipo: "regula", nota: "Si no aprueba el convenio, diez días para proponer otro sobre lo no aprobado; auto en tres días."}
      - {norma: "LEC", articulo: "777", apartado: "8", tipo: "regula", nota: "Apelables la denegación y el auto que se aparta del convenio; si se aprueba entero, solo recurre el Fiscal por los hijos."}
      - {norma: "LEC", articulo: "777", apartado: "9", tipo: "conexa", nota: "Modificación de común acuerdo por este artículo; si no, por el art. 775."}
      - {norma: "LEC", articulo: "777", apartado: "10", tipo: "regula", nota: "Sin hijos menores ni con apoyos, decreto del LAJ tras la ratificación; si ve perjuicio, cierra; decreto irrecurrible."}
      - {norma: "LEC", articulo: "769", apartado: "2", tipo: "regula", nota: "Competente el juzgado del último domicilio común o del domicilio de cualquiera de los solicitantes."}
      - {norma: "LEC", articulo: "750", apartado: "2", tipo: "regula", nota: "Cabe una sola defensa y representación; si no se aprueba algún pacto o se pide ejecución, cada uno nombra la suya."}
      - {norma: "LEC", articulo: "770", apartado: "5.ª", tipo: "conexa", nota: "Un proceso contencioso puede reconducirse al trámite del art. 777."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "2", tipo: "conexa", nota: "El MASC se exige en los procesos del libro IV LEC; el de mutuo acuerdo no figura entre las excepciones."}
    no_consta_en_norma:
      - "Si el procedimiento de mutuo acuerdo exige acreditar un MASC previo: la LO 1/2025 no lo aclara; criterio de cada juzgado."
      - "Eficacia de los pactos entre cónyuges no aprobados judicialmente: jurisprudencial."
      - "Alcance del control del notario o del LAJ sobre el convenio («gravemente perjudicial»): casuística."
    afines: ["Separación y divorcio contenciosos", "Modificación de medidas definitivas", "Ejecución de medidas de familia", "Pensión compensatoria", "Uso de la vivienda familiar", "Liquidación del régimen económico matrimonial (procedimiento)", "Requisito de procedibilidad (MASC)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Medidas provisionales en familia"
    sinonimos: ["medidas provisionalísimas", "medidas previas a la demanda de divorcio", "medidas coetáneas", "medidas provisionales coetáneas", "comparecencia de medidas provisionales", "efectos de la admisión de la demanda", "litis expensas", "contribución a las cargas del matrimonio", "uso provisional de la vivienda", "custodia provisional", "riesgo de sustracción del menor", "plazo de treinta días para demandar"]
    normas_base: ["CC", "LEC", "LO 1/2025"]
    remisiones:
      - {norma: "CC", articulo: "102", tipo: "regula", nota: "Admitida la demanda, por ley: vida separada, revocación de poderes y fin de la potestad doméstica sobre privativos."}
      - {norma: "CC", articulo: "103", apartado: "1.ª", tipo: "regula", nota: "Sin acuerdo aprobado, el juez decide con quién quedan los hijos, el régimen de comunicación y medidas contra la sustracción."}
      - {norma: "CC", articulo: "103", apartado: "2.ª", tipo: "regula", nota: "Uso de la vivienda según el interés familiar más necesitado de protección; inventario del ajuar."}
      - {norma: "CC", articulo: "103", apartado: "3.ª", tipo: "regula", nota: "Contribución a las cargas, incluidas las litis expensas, con bases de actualización y garantías."}
      - {norma: "CC", articulo: "103", apartado: "4.ª", tipo: "regula", nota: "Entrega de bienes gananciales o comunes, reglas de administración y rendición de cuentas."}
      - {norma: "CC", articulo: "104", tipo: "regula", nota: "Medidas antes de la demanda: solo subsisten si se demanda en los treinta días siguientes a su adopción."}
      - {norma: "CC", articulo: "105", tipo: "conexa", nota: "No incumple el deber de convivencia quien sale del domicilio con causa razonable y demanda en treinta días."}
      - {norma: "CC", articulo: "106", tipo: "regula", nota: "Terminan al sustituirse por las de la sentencia o al acabar el proceso; la revocación de poderes es definitiva."}
      - {norma: "LEC", articulo: "771", apartado: "1", tipo: "regula", nota: "Previas a la demanda, ante el tribunal del propio domicilio; la solicitud no requiere abogado ni procurador."}
      - {norma: "LEC", articulo: "771", apartado: "2", tipo: "regula", nota: "Comparecencia en diez días con intento de acuerdo; el demandado acude con abogado y procurador."}
      - {norma: "LEC", articulo: "771", apartado: "2, párrafo 2.º", tipo: "regula", nota: "Por urgencia, el tribunal puede acordar de inmediato efectos del art. 102 CC, custodia y vivienda, sin recurso."}
      - {norma: "LEC", articulo: "771", apartado: "3", tipo: "regula", nota: "Sin acuerdo o no aprobado, alegaciones y prueba; la pendiente se practica en diez días."}
      - {norma: "LEC", articulo: "771", apartado: "3, párrafo 2.º", tipo: "regula", nota: "La ausencia injustificada puede dar por admitidos los hechos del otro sobre medidas patrimoniales."}
      - {norma: "LEC", articulo: "771", apartado: "4", tipo: "regula", nota: "Auto en tres días, sin recurso."}
      - {norma: "LEC", articulo: "771", apartado: "5", tipo: "regula", nota: "Solo subsisten si se presenta la demanda en los treinta días siguientes a su adopción."}
      - {norma: "LEC", articulo: "772", apartado: "1", tipo: "regula", nota: "Admitida la demanda, las actuaciones de las medidas previas se unen a los autos."}
      - {norma: "LEC", articulo: "772", apartado: "2", tipo: "regula", nota: "Solo si procede completarlas o modificarlas hay nueva comparecencia; auto sin recurso."}
      - {norma: "LEC", articulo: "773", apartado: "1", tipo: "regula", nota: "Coetáneas: se piden en la demanda o se somete un acuerdo, que no vincula para las definitivas."}
      - {norma: "LEC", articulo: "773", apartado: "2", tipo: "regula", nota: "Admitida la demanda, el tribunal resuelve y, en todo caso, cumple el art. 103 CC."}
      - {norma: "LEC", articulo: "773", apartado: "3", tipo: "regula", nota: "Comparecencia previa conforme al art. 771; auto sin recurso."}
      - {norma: "LEC", articulo: "773", apartado: "4", tipo: "regula", nota: "El demandado las pide en la contestación; se resuelven en la vista si se señala en diez días."}
      - {norma: "LEC", articulo: "773", apartado: "5", tipo: "regula", nota: "Quedan sin efecto al sustituirlas la sentencia o al terminar el proceso de otro modo."}
      - {norma: "LEC", articulo: "770", apartado: "6.ª", tipo: "conexa", nota: "En los procesos solo de guarda o alimentos de hijos, las cautelares siguen estos mismos trámites."}
      - {norma: "LEC", articulo: "775", apartado: "3", tipo: "conexa", nota: "En la modificación de medidas cabe pedir la modificación provisional por el art. 773."}
      - {norma: "LEC", articulo: "753", apartado: "2", tipo: "conexa", nota: "En la comparecencia del 771, tras la prueba, conclusiones orales."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "3", tipo: "conexa", nota: "No hace falta MASC para pedir medidas cautelares antes de la demanda."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "2.b)", tipo: "conexa", nota: "Las medidas del art. 158 CC no exigen actividad negociadora previa."}
    no_consta_en_norma:
      - "Si las medidas del 771 LEC son «cautelares previas» a efectos del 5.3 LO 1/2025: la ley no lo dice; casuística."
      - "Cómputo de los treinta días del 771.5 LEC y del 104 CC: jurisprudencial."
