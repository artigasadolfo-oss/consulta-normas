      - {norma: "LOE", articulo: "6", apartado: "3", tipo: "regula", nota: "El promotor puede rechazar la obra no terminada o no conforme al contrato, motivándolo por escrito en el acta."}
      - {norma: "LOE", articulo: "6", apartado: "4", tipo: "regula", nota: "Salvo pacto, recepción en treinta días desde la notificación escrita del fin de obra; si no hay reservas ni rechazo, es tácita."}
      - {norma: "LOE", articulo: "6", apartado: "5", tipo: "regula", nota: "Los plazos de responsabilidad y garantía se cuentan desde el acta de recepción o desde la recepción tácita."}
      - {norma: "LOE", articulo: "17", apartado: "1", tipo: "regula", nota: "Los plazos de 10, 3 y 1 año corren desde la recepción sin reservas o desde la subsanación de estas."}
