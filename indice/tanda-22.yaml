    remisiones:
      - {norma: "LOE", articulo: "17", apartado: "1", tipo: "regula", nota: "La responsabilidad legal de los agentes es sin perjuicio de sus responsabilidades contractuales."}
      - {norma: "LOE", articulo: "17", apartado: "9", tipo: "regula", nota: "Queda a salvo la responsabilidad del vendedor ante el comprador por el contrato, los arts. 1484 y ss. CC y la ley de compraventa."}
      - {norma: "LOE", articulo: "18", apartado: "1", tipo: "regula", nota: "Las acciones de la LOE prescriben en dos años desde el daño, sin perjuicio de las acciones por incumplimiento contractual."}
      - {norma: "LOE", articulo: "dt1", tipo: "regula", nota: "La LOE se aplica a las obras cuyo proyecto pidió licencia tras su entrada en vigor; a las anteriores, no."}
      - {norma: "LOE", articulo: "df4", tipo: "conexa", nota: "La LOE entró en vigor a los seis meses de su publicación en el BOE."}
      - {norma: "CC", articulo: "1591", tipo: "regula", nota: "Ruina por vicios de construcción en diez años desde que concluyó: responde el contratista; el arquitecto, por vicio del suelo o dirección."}
      - {norma: "CC", articulo: "1591", apartado: "párrafo 2.º", tipo: "regula", nota: "Si la causa es que el contratista faltó a las condiciones del contrato, la acción de indemnización dura quince años."}
      - {norma: "CC", articulo: "1101", tipo: "regula", nota: "Indemnizan los daños quienes incurren en dolo, negligencia o morosidad o contravienen de cualquier modo la obligación."}
      - {norma: "CC", articulo: "1124", tipo: "conexa", nota: "Ante el incumplimiento, el perjudicado puede exigir el cumplimiento o la resolución, con indemnización en ambos casos."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "regula", nota: "Las acciones personales sin plazo especial prescriben a los cinco años desde que puede exigirse el cumplimiento."}
      - {norma: "CC", articulo: "1484", apartado: "1", tipo: "conexa", nota: "El vendedor responde de los defectos ocultos que hacen la cosa impropia para su uso o disminuyen este uso."}
      - {norma: "CC", articulo: "1486", tipo: "conexa", nota: "El comprador opta entre desistir o rebajar el precio; si el vendedor conocía los vicios, además indemnización."}
      - {norma: "CC", articulo: "1490", tipo: "conexa", nota: "Las acciones de saneamiento por vicios ocultos se extinguen a los seis meses desde la entrega."}
      - {norma: "CC", articulo: "1596", tipo: "conexa", nota: "El contratista responde del trabajo de las personas que emplea en la obra."}
      - {norma: "CC", articulo: "1907", tipo: "conexa", nota: "El propietario responde de los daños por ruina del edificio debida a falta de las reparaciones necesarias."}
      - {norma: "CC", articulo: "1909", tipo: "conexa", nota: "Si la ruina que daña a un tercero se debe a defecto de construcción, se repite contra el arquitecto o el constructor."}
      - {norma: "TRLGDCU", articulo: "149", tipo: "conexa", nota: "Quien construye o comercializa viviendas como empresario responde de sus defectos no cubiertos por un régimen legal específico."}
      - {norma: "LOE", articulo: "da7", tipo: "conexa", nota: "El agente demandado puede pedir, al contestar, que se notifique la demanda a otros agentes, a quienes vinculará la sentencia."}
    no_consta_en_norma:
      - "Concepto de ruina funcional (vicios que hacen inútil el edificio para su destino) bajo el art. 1591: jurisprudencial."
      - "Compatibilidad y elección entre la acción de la LOE, la contractual (1101 y 1124) y el saneamiento: jurisprudencial."
      - "Solidaridad impropia entre los agentes y su efecto sobre la interrupción de la prescripción: jurisprudencial."
      - "Si el art. 1591 sigue aplicándose a obras no residenciales o fuera del ámbito de la LOE: discutido; jurisprudencial."
