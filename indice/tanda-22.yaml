      - {norma: "LOE", articulo: "19", apartado: "2", tipo: "regula", nota: "Seguro de daños: tomador el constructor (1 año) o el promotor (3 y 10); asegurados el promotor y los sucesivos adquirentes."}
      - {norma: "LOE", articulo: "19", apartado: "3", tipo: "regula", nota: "Caución: asegurados los adquirentes; pago a primer requerimiento; sin excepciones contra el tomador."}
      - {norma: "LOE", articulo: "19", apartado: "4", tipo: "conexa", nota: "Iniciada la cobertura, no se puede rescindir ni resolver el seguro de mutuo acuerdo antes del plazo."}
      - {norma: "LOE", articulo: "19", apartado: "5", tipo: "regula", nota: "Capital mínimo sobre el coste final de ejecución material: 5 %, 30 % y 100 %, según la garantía."}
      - {norma: "LOE", articulo: "19", apartado: "6", tipo: "conexa", nota: "El asegurador elige entre pagar en metálico la valoración de los daños o repararlos."}
      - {norma: "LOE", articulo: "19", apartado: "7", tipo: "regula", nota: "Quien incumple la obligación de suscribir las garantías responde personalmente."}
      - {norma: "LOE", articulo: "19", apartado: "8", tipo: "regula", nota: "Sin franquicias en la garantía anual; en la trienal y la decenal, no más del 1 % del capital de cada unidad registral."}
      - {norma: "LOE", articulo: "19", apartado: "9", tipo: "regula", nota: "Salvo pacto, no cubren daños personales, a contiguos o muebles, obras posteriores, mal uso, fuerza mayor ni reservas pendientes."}
      - {norma: "LOE", articulo: "20", apartado: "1", tipo: "regula", nota: "No se autoriza ni inscribe la escritura de obra nueva sin acreditar y testimoniar las garantías del art. 19."}
      - {norma: "LOE", articulo: "20", apartado: "2", tipo: "conexa", nota: "Sin acreditar las garantías, no se cierra la hoja del promotor individual ni se inscribe la liquidación de la promotora."}
      - {norma: "LOE", articulo: "da2", tipo: "regula", nota: "Garantía decenal exigible en edificios de vivienda (no al autopromotor de vivienda propia, salvo si vende); las demás, por real decreto."}
      - {norma: "LOE", articulo: "9", apartado: "2.d)", tipo: "conexa", nota: "Es obligación del promotor suscribir los seguros del art. 19."}
      - {norma: "LOE", articulo: "11", apartado: "2.h)", tipo: "conexa", nota: "Es obligación del constructor suscribir las garantías del art. 19."}
      - {norma: "LOE", articulo: "16", apartado: "1", tipo: "conexa", nota: "El propietario debe recibir, conservar y transmitir los seguros y garantías con que cuente la obra."}
      - {norma: "LOE", articulo: "18", apartado: "2", tipo: "conexa", nota: "La repetición de los aseguradores contra los agentes prescribe en dos años desde la condena firme o el pago extrajudicial."}
      - {norma: "LOE", articulo: "6", apartado: "5", tipo: "conexa", nota: "Los plazos de responsabilidad y garantía se cuentan desde el acta de recepción o la recepción tácita."}
