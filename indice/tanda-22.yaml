    sinonimos: ["seguro decenal", "seguro de daños materiales", "seguro trienal", "seguro de caución de la edificación", "garantía financiera", "retención del 5 %", "garantía anual de acabados", "franquicia del seguro decenal", "exclusiones del seguro decenal", "reclamación a la aseguradora decenal", "autopromotor", "escritura de obra nueva sin seguro", "liquidación de la promotora", "capital asegurado"]
