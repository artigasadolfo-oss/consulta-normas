  - voz: "Concurrencia de la LOE con la responsabilidad contractual y el art. 1591 CC"
    sinonimos: ["ruina del edificio", "responsabilidad decenal del Código Civil", "artículo 1591", "ruina funcional", "vicios de la construcción", "defectos constructivos", "acción contractual contra el promotor vendedor", "incumplimiento contractual por defectos", "concurrencia de acciones", "edificios anteriores a la LOE", "licencia anterior a la LOE", "saneamiento del vendedor de vivienda", "acción de quince años", "prescripción de cinco años", "daños a terceros por defecto de construcción"]
