      - {norma: "LOE", articulo: "9", apartado: "2.c)", tipo: "conexa", nota: "El promotor debe suscribir el acta de recepción."}
      - {norma: "LOE", articulo: "11", apartado: "2.f)", tipo: "conexa", nota: "El constructor debe firmar el acta de replanteo y el acta de recepción."}
      - {norma: "LOE", articulo: "12", apartado: "3.e)", tipo: "conexa", nota: "El director de obra suscribe el certificado final de obra."}
      - {norma: "CC", articulo: "1592", tipo: "regula", nota: "Obra por piezas o medida: se puede exigir que se reciba y pague por partes; la parte pagada se presume aprobada y recibida."}
      - {norma: "CC", articulo: "1598", tipo: "regula", nota: "Obra a satisfacción del propietario: a falta de conformidad, decide el juicio pericial; si aprueba un tercero, se está a lo que decida."}
      - {norma: "CC", articulo: "1599", tipo: "regula", nota: "Salvo pacto o costumbre, el precio de la obra se paga al hacerse la entrega."}
      - {norma: "CC", articulo: "1589", tipo: "conexa", nota: "Si el contratista puso el material, sufre la pérdida de la obra destruida antes de entregarla, salvo mora en recibirla."}
