# Índice de conceptos de «Consulta de normas» — tanda 22 (prioridad B: voces 267 a 269, 275 a 278 y 285 a 289; cierre de los bloques 14 y 15 y parte del 16)
# Revisor: armero. Espejo: legalize-es@aca28304d, leído con `git show aca28304d:es/…` (no el árbol de trabajo, que hoy trae erratas).
# Todo precepto citado se ha leído en el espejo en esta pasada. Vigencia: contraste con la API de boe.es (08-10-2026).
# Ver tanda-22-notas.md.

voces:
  - voz: "Disolución y liquidación de la sociedad de gananciales"
    sinonimos: ["disolución de la sociedad de gananciales", "liquidación de gananciales", "fin de la sociedad de gananciales", "causas de disolución", "disolución judicial de gananciales", "separación de hecho de más de un año", "comunidad postganancial", "inventario de gananciales", "activo y pasivo de la sociedad", "reintegros y reembolsos entre cónyuges", "división por mitad", "adjudicación preferente", "vivienda del viudo en la liquidación", "alimentos durante la liquidación", "deudas tras la liquidación", "liquidación de dos matrimonios sucesivos"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1392", tipo: "regula", nota: "Concluye de pleno derecho por disolución o nulidad del matrimonio, separación legal o pacto de otro régimen."}
      - {norma: "CC", articulo: "1393", tipo: "regula", nota: "Disolución judicial a petición de uno: apoyos con representación plena, fraude, separación de hecho de más de un año, falta de información."}
      - {norma: "CC", articulo: "1394", tipo: "regula", nota: "Efectos desde que se acuerda; en el pleito, inventario, medidas de administración y licencia judicial para lo extraordinario."}
      - {norma: "CC", articulo: "1395", tipo: "conexa", nota: "Nulidad con un cónyuge de mala fe: el otro puede liquidar por las reglas de participación; el de mala fe no participa."}
      - {norma: "CC", articulo: "95", tipo: "regula", nota: "La sentencia, el decreto o la escritura del convenio disuelven el régimen y aprueban su liquidación si hay acuerdo."}
      - {norma: "CC", articulo: "1373", tipo: "conexa", nota: "Embargo de gananciales por deuda propia: el otro cónyuge puede pedir que se sustituya por la cuota del deudor y se disuelve."}
      - {norma: "CC", articulo: "1396", tipo: "regula", nota: "Disuelta la sociedad, se liquida empezando por un inventario del activo y del pasivo."}
      - {norma: "CC", articulo: "1397", tipo: "regula", nota: "Activo: gananciales existentes, valor actualizado de lo enajenado en fraude y lo pagado por la sociedad a cargo de un cónyuge."}
      - {norma: "CC", articulo: "1398", tipo: "regula", nota: "Pasivo: deudas de la sociedad, privativos gastados en su interés y lo pagado por un cónyuge a cargo de ella, actualizado."}
      - {norma: "CC", articulo: "1399", tipo: "regula", nota: "Se pagan primero las deudas de la sociedad, empezando por las alimenticias; si no alcanza, concurrencia y prelación de créditos."}
      - {norma: "CC", articulo: "1400", tipo: "conexa", nota: "Sin metálico, pueden ofrecerse bienes en pago; si un partícipe o acreedor lo pide, se venden y se paga con el precio."}
      - {norma: "CC", articulo: "1401", tipo: "regula", nota: "Los acreedores conservan su crédito contra el deudor; el no deudor responde con lo adjudicado si hubo inventario."}
      - {norma: "CC", articulo: "1402", tipo: "conexa", nota: "Los acreedores tienen en la liquidación los derechos que la ley les da en la partición de herencias."}
      - {norma: "CC", articulo: "1403", tipo: "regula", nota: "Pagadas las deudas, se abonan las indemnizaciones y reintegros de cada cónyuge, compensando lo que deba a la sociedad."}
      - {norma: "CC", articulo: "1404", tipo: "regula", nota: "El remanente es el haber de la sociedad y se divide por mitad entre los cónyuges o sus herederos."}
      - {norma: "CC", articulo: "1405", tipo: "conexa", nota: "El cónyuge acreedor personal del otro puede cobrarse con bienes comunes, salvo pago voluntario."}
      - {norma: "CC", articulo: "1406", tipo: "regula", nota: "Adjudicación preferente: bienes de uso personal, explotación que gestiona, local profesional y, por muerte del otro, la vivienda."}
      - {norma: "CC", articulo: "1407", tipo: "regula", nota: "Local o vivienda: en propiedad o con derecho de uso o habitación, abonando en dinero el exceso sobre el haber."}
      - {norma: "CC", articulo: "1408", tipo: "regula", nota: "Hasta entregar el haber, alimentos de la masa común a cónyuges e hijos, rebajados en lo que excedan de frutos y rentas."}
      - {norma: "CC", articulo: "1409", tipo: "conexa", nota: "Liquidación simultánea de dos matrimonios de una persona: toda clase de pruebas; en la duda, reparto proporcional."}
      - {norma: "CC", articulo: "1410", tipo: "regula", nota: "En lo no previsto (inventario, tasación, división, adjudicaciones), las normas de la partición de la herencia."}
      - {norma: "CC", articulo: "1062", tipo: "conexa", nota: "Cosa indivisible: se adjudica a uno abonando el exceso; basta que uno pida la venta en subasta con licitadores extraños."}
      - {norma: "CC", articulo: "1435", tipo: "conexa", nota: "Extinguida la sociedad constante matrimonio, rige la separación de bienes salvo que se pacte otro régimen."}
      - {norma: "CC", articulo: "1374", tipo: "conexa", nota: "Disuelta por embargo, rige la separación salvo que el cónyuge opte en tres meses por una nueva sociedad de gananciales."}
      - {norma: "CC", articulo: "1321", tipo: "conexa", nota: "Por muerte de un cónyuge, el ajuar de la vivienda común se entrega al viudo sin computárselo en su haber."}
      - {norma: "LEC", articulo: "808", apartado: "1", tipo: "conexa", nota: "Admitida la demanda matrimonial o iniciado el proceso de disolución, cualquier cónyuge o heredero pide el inventario."}
      - {norma: "LEC", articulo: "810", apartado: "1", tipo: "conexa", nota: "Concluido el inventario y firme la disolución, cualquier cónyuge o sus herederos piden la liquidación judicial."}
    no_consta_en_norma:
      - "Comunidad postganancial: régimen de los bienes entre la disolución y la liquidación; no lo regula el CC; jurisprudencial."
      - "Fecha de disolución cuando hubo separación de hecho larga y ruptura efectiva de la convivencia: jurisprudencial."
      - "Si la acción para pedir la liquidación prescribe: el CC no lo dice; jurisprudencial."
      - "Valoración de los bienes al tiempo de liquidar y actualización de reintegros (arts. 1358 y 1398): criterio jurisprudencial."
    afines: ["Liquidación del régimen económico matrimonial (procedimiento)", "Bienes privativos y gananciales", "Deudas y responsabilidad de la sociedad de gananciales", "Separación de bienes y compensación por trabajo doméstico", "Derechos del cónyuge viudo", "Partición de la herencia y su impugnación"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Separación de bienes y compensación por trabajo doméstico"
    sinonimos: ["separación de bienes", "régimen de separación", "capitulaciones de separación", "compensación por trabajo doméstico", "trabajo para la casa", "compensación del 1438", "contribución a las cargas del matrimonio", "cargas del matrimonio", "bienes de titularidad dudosa", "bienes en proindiviso entre cónyuges", "cónyuge que administra bienes del otro", "deudas de cada cónyuge", "régimen económico matrimonial valenciano", "Ley 10/2007 valenciana", "casados en la Comunidad Valenciana entre 2008 y 2016"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1435", tipo: "regula", nota: "Hay separación si se pactó, si se excluyó la sociedad de gananciales sin otra regla o si esta se extingue constante matrimonio."}
      - {norma: "CC", articulo: "1436", tipo: "conexa", nota: "La demanda de separación de bienes se anota y la sentencia firme se inscribe en el Registro de la Propiedad y en el Civil."}
      - {norma: "CC", articulo: "1437", tipo: "regula", nota: "Cada cónyuge es dueño de lo que tenía y de lo que adquiera, y lo administra, disfruta y dispone libremente."}
      - {norma: "CC", articulo: "1438", tipo: "regula", nota: "Cargas en proporción a los recursos; el trabajo para la casa es contribución y da derecho a compensación al extinguirse el régimen."}
      - {norma: "CC", articulo: "1439", tipo: "regula", nota: "El cónyuge que gestiona bienes del otro responde como mandatario, sin rendir cuentas de frutos consumidos en las cargas."}
      - {norma: "CC", articulo: "1440", tipo: "regula", nota: "Las obligaciones de cada cónyuge son de su exclusiva responsabilidad."}
      - {norma: "CC", articulo: "1440", apartado: "párrafo 2.º", tipo: "regula", nota: "Por la potestad doméstica ordinaria responden ambos según los arts. 1319 y 1438."}
      - {norma: "CC", articulo: "1441", tipo: "regula", nota: "Si no se puede acreditar a cuál de los cónyuges pertenece un bien, corresponde a ambos por mitad."}
      - {norma: "CC", articulo: "1442", tipo: "conexa", nota: "Declarado un cónyuge en concurso, se aplica la legislación concursal."}
      - {norma: "CC", articulo: "1443", tipo: "conexa", nota: "La separación decretada no se altera por la reconciliación ni por desaparecer la causa que la motivó."}
      - {norma: "CC", articulo: "1444", tipo: "conexa", nota: "Los cónyuges pueden pactar en capitulaciones volver al régimen anterior; lo aportado de nuevo se considera privativo."}
      - {norma: "CC", articulo: "1315", tipo: "regula", nota: "El régimen económico del matrimonio es el que los cónyuges estipulen en capitulaciones, con los límites del Código."}
      - {norma: "CC", articulo: "1316", tipo: "conexa", nota: "Sin capitulaciones o si son ineficaces, rige la sociedad de gananciales."}
      - {norma: "CC", articulo: "1317", tipo: "regula", nota: "El cambio de régimen durante el matrimonio no perjudica los derechos ya adquiridos por terceros."}
      - {norma: "CC", articulo: "1325", tipo: "regula", nota: "En capitulaciones se puede estipular, modificar o sustituir el régimen económico, antes o durante el matrimonio (1326)."}
      - {norma: "CC", articulo: "1327", tipo: "regula", nota: "Las capitulaciones solo valen si constan en escritura pública."}
      - {norma: "CC", articulo: "1328", tipo: "conexa", nota: "Es nula la estipulación contraria a las leyes o buenas costumbres o que limite la igualdad de derechos de los cónyuges."}
      - {norma: "CC", articulo: "1333", tipo: "conexa", nota: "Las capitulaciones y los cambios de régimen se mencionan en la inscripción del matrimonio y, si afectan a inmuebles, en el Registro."}
      - {norma: "CC", articulo: "1318", tipo: "regula", nota: "Los bienes de los cónyuges están sujetos a las cargas; si uno no contribuye, el juez adopta medidas a instancia del otro."}
      - {norma: "CC", articulo: "1319", apartado: "párrafo 2.º", tipo: "conexa", nota: "Deudas por necesidades ordinarias: responden los comunes y los del deudor; subsidiariamente, los del otro cónyuge."}
      - {norma: "CC", articulo: "1324", tipo: "conexa", nota: "Entre cónyuges basta la confesión del otro para probar la propiedad, sin perjudicar a legitimarios ni acreedores."}
      - {norma: "CC", articulo: "1323", tipo: "conexa", nota: "Los cónyuges pueden transmitirse bienes y contratar entre sí."}
      - {norma: "CC", articulo: "400", tipo: "conexa", nota: "Ningún copropietario está obligado a permanecer en la comunidad: cualquiera puede pedir la división."}
      - {norma: "CC", articulo: "97", apartado: "4.ª", tipo: "conexa", nota: "La dedicación pasada y futura a la familia es circunstancia para fijar la pensión compensatoria."}
      - {norma: "CC", articulo: "103", apartado: "3.ª", tipo: "conexa", nota: "Medida provisional sobre las cargas; el trabajo de atender a los hijos comunes se considera contribución."}
      - {norma: "LEC", articulo: "806", tipo: "conexa", nota: "El procedimiento de liquidación es para regímenes con masa común de bienes; la separación de bienes no la tiene."}
    no_consta_en_norma:
      - "Requisitos de la compensación del art. 1438 (dedicación exclusiva o no, trabajo fuera de casa) y su cálculo: jurisprudencial."
      - "Compatibilidad de la compensación del art. 1438 con la pensión compensatoria y cauce procesal para pedirla: jurisprudencial."
      - "Aplicación del art. 1438 a las parejas de hecho: no lo prevé el CC; jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley valenciana 10/2007 (separación de bienes como régimen supletorio): nula por la STC 82/2016, de 28 de abril."
      - "STC 82/2016, FJ 8: no afecta a situaciones consolidadas; los casados bajo esa ley siguen en su régimen salvo capitulaciones."
    afines: ["Bienes privativos y gananciales", "Disolución y liquidación de la sociedad de gananciales", "Capitulaciones matrimoniales", "Pensión compensatoria", "Copropiedad y acción de división de cosa común", "Ley aplicable al régimen económico de extranjeros"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Vivienda familiar: disposición por el cónyuge titular"
    sinonimos: ["venta de la vivienda familiar", "hipotecar la vivienda familiar", "consentimiento del cónyuge no titular", "vivienda habitual de la familia", "autorización judicial para vender la vivienda", "anulabilidad por falta de consentimiento del cónyuge", "manifestación sobre el carácter de vivienda habitual", "adquirente de buena fe", "vivienda con uso atribuido en el divorcio", "disposición de la vivienda privativa", "muebles de uso ordinario", "renuncia al arrendamiento de la vivienda familiar", "desistimiento del arrendatario casado", "actos dispositivos sin consentimiento del cónyuge"]
    normas_base: ["CC", "LAU"]
    remisiones:
      - {norma: "CC", articulo: "1320", tipo: "regula", nota: "Disponer de derechos sobre la vivienda habitual y los muebles de uso ordinario exige el consentimiento de ambos o autorización judicial."}
      - {norma: "CC", articulo: "1320", apartado: "párrafo 2.º", tipo: "regula", nota: "La manifestación errónea o falsa del disponente sobre el carácter de la vivienda no perjudica al adquirente de buena fe."}
      - {norma: "CC", articulo: "1322", tipo: "regula", nota: "Lo hecho sin el consentimiento exigido y no confirmado es anulable a instancia del cónyuge omitido o de sus herederos."}
      - {norma: "CC", articulo: "1322", apartado: "párrafo 2.º", tipo: "conexa", nota: "Son nulos los actos a título gratuito sobre bienes comunes sin el consentimiento del otro cónyuge."}
      - {norma: "CC", articulo: "1301", apartado: "5.º", tipo: "regula", nota: "La acción caduca a los cuatro años desde la disolución de la sociedad o del matrimonio, salvo conocimiento suficiente anterior."}
      - {norma: "CC", articulo: "96", apartado: "3", tipo: "regula", nota: "Vivienda con uso atribuido: para disponer, consentimiento de ambos o autorización judicial; se hace constar en el Registro."}
      - {norma: "CC", articulo: "103", apartado: "2.ª", tipo: "conexa", nota: "Admitida la demanda matrimonial, el juez decide qué cónyuge sigue en el uso de la vivienda familiar."}
      - {norma: "CC", articulo: "1377", tipo: "regula", nota: "Si la vivienda es ganancial: actos onerosos con consentimiento de ambos; si uno lo niega, el juez puede autorizarlos."}
      - {norma: "CC", articulo: "1378", tipo: "conexa", nota: "Son nulos los actos a título gratuito sobre gananciales sin el consentimiento de ambos, salvo liberalidades de uso."}
      - {norma: "CC", articulo: "1389", apartado: "párrafo 2.º", tipo: "conexa", nota: "El cónyuge administrador por apoyo o abandono necesita autorización judicial para disponer de inmuebles."}
      - {norma: "CC", articulo: "1391", tipo: "conexa", nota: "Acto en fraude del consorte: el autor debe su importe a la sociedad y, si el adquirente obró de mala fe, el acto es rescindible."}
      - {norma: "CC", articulo: "1406", tipo: "conexa", nota: "Por muerte del otro cónyuge, el viudo puede pedir que se incluya con preferencia en su haber la vivienda habitual."}
      - {norma: "LAU", articulo: "12", apartado: "1", tipo: "conexa", nota: "Si el arrendatario desiste o no renueva sin consentimiento del cónyuge conviviente, el arriendo puede seguir a favor de este."}
      - {norma: "LAU", articulo: "12", apartado: "3", tipo: "conexa", nota: "Abandono sin manifestación: sigue a favor del cónyuge que notifique por escrito al arrendador en un mes."}
      - {norma: "LAU", articulo: "12", apartado: "4", tipo: "conexa", nota: "Se aplica también a la pareja con dos años de convivencia o con descendencia común."}
    no_consta_en_norma:
      - "Si el art. 1320 alcanza a la hipoteca, al arrendamiento o a la renuncia de derechos sobre la vivienda: jurisprudencial."
      - "Concepto de vivienda habitual de la familia (separación de hecho, segunda residencia): jurisprudencial."
      - "Si el art. 1320 alcanza al embargo y a la ejecución forzosa de la vivienda familiar por deudas del titular: no lo dice; jurisprudencial."
      - "Aplicación del art. 1320 a las parejas de hecho: no lo prevé el CC; jurisprudencial."
    fuera_de_la_herramienta:
      - "Reglamento Hipotecario, art. 91.1: para inscribir la disposición, el titular manifiesta en la escritura que no es vivienda familiar."
    afines: ["Uso de la vivienda familiar", "Bienes privativos y gananciales", "Nulidad y anulabilidad del contrato", "Separación y divorcio contenciosos", "Medidas provisionales en familia", "Separación o divorcio del arrendatario"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Agentes de la edificación y sus obligaciones"
    sinonimos: ["agentes de la edificación", "promotor", "promotor inmobiliario", "proyectista", "arquitecto", "constructor", "contratista", "jefe de obra", "subcontratista", "director de obra", "director de la ejecución de la obra", "arquitecto técnico", "aparejador", "dirección facultativa", "laboratorio de control de calidad", "suministrador de productos de construcción", "gestor de cooperativas", "obligaciones del propietario del edificio", "Libro del Edificio", "ámbito de la LOE"]
    normas_base: ["LOE"]
    remisiones:
      - {norma: "LOE", articulo: "8", tipo: "regula", nota: "Agentes: toda persona que interviene en la edificación; sus obligaciones las fijan la LOE, otras normas y su contrato."}
      - {norma: "LOE", articulo: "9", apartado: "1", tipo: "regula", nota: "Promotor: quien decide, impulsa, programa y financia las obras, para sí o para enajenarlas o cederlas."}
      - {norma: "LOE", articulo: "9", apartado: "2", tipo: "regula", nota: "Obligaciones del promotor: título sobre el solar, licencias, acta de recepción, seguros y documentación al adquirente."}
      - {norma: "LOE", articulo: "10", apartado: "1", tipo: "regula", nota: "Proyectista: redacta el proyecto por encargo del promotor; cada autor de un proyecto parcial asume su titularidad."}
      - {norma: "LOE", articulo: "10", apartado: "2", tipo: "regula", nota: "Obligaciones del proyectista: titulación habilitante según el uso del edificio y proyecto ajustado a la normativa y al contrato."}
      - {norma: "LOE", articulo: "11", apartado: "1", tipo: "regula", nota: "Constructor: asume ante el promotor ejecutar la obra con medios propios o ajenos, sujeto al proyecto y al contrato."}
      - {norma: "LOE", articulo: "11", apartado: "2", tipo: "regula", nota: "Obligaciones del constructor: ejecutar según proyecto e instrucciones, jefe de obra, subcontratas, acta de recepción y garantías."}
      - {norma: "LOE", articulo: "12", apartado: "1", tipo: "regula", nota: "Director de obra: dirige el desarrollo de la obra en lo técnico, estético, urbanístico y medioambiental."}
      - {norma: "LOE", articulo: "12", apartado: "3", tipo: "regula", nota: "Obligaciones del director de obra: verificar cimentación y estructura, resolver contingencias, certificado final."}
      - {norma: "LOE", articulo: "13", apartado: "1", tipo: "regula", nota: "Director de la ejecución: dirige la ejecución material y controla la construcción y la calidad de lo edificado."}
      - {norma: "LOE", articulo: "13", apartado: "2", tipo: "regula", nota: "Sus obligaciones: verificar los productos recibidos, dirigir la ejecución material, Libro de Órdenes y certificado final."}
      - {norma: "LOE", articulo: "14", apartado: "3", tipo: "conexa", nota: "Entidades y laboratorios de control de calidad: asistencia técnica y entrega de resultados al responsable de su aceptación."}
      - {norma: "LOE", articulo: "15", apartado: "3", tipo: "conexa", nota: "Suministrador: entregar los productos según el pedido, respondiendo de origen, identidad y calidad."}
      - {norma: "LOE", articulo: "16", apartado: "1", tipo: "regula", nota: "Propietarios: conservar el edificio con uso y mantenimiento adecuados y transmitir documentación, seguros y garantías."}
      - {norma: "LOE", articulo: "16", apartado: "2", tipo: "conexa", nota: "Usuarios: usar el edificio conforme a las instrucciones de uso y mantenimiento."}
      - {norma: "LOE", articulo: "17", apartado: "4", tipo: "regula", nota: "Responden como promotores el gestor de cooperativas o de comunidades de propietarios y figuras análogas."}
      - {norma: "LOE", articulo: "17", apartado: "6", tipo: "regula", nota: "El constructor responde directamente de su jefe de obra, de sus subcontratistas y de los productos que acepta."}
      - {norma: "LOE", articulo: "17", apartado: "7", tipo: "regula", nota: "Los directores responden de la veracidad del certificado final; quien dirige un proyecto ajeno asume sus defectos."}
      - {norma: "LOE", articulo: "17", apartado: "5", tipo: "conexa", nota: "Varios proyectistas contratados conjuntamente responden solidariamente; el proyectista responde de los cálculos que encarga."}
      - {norma: "LOE", articulo: "7", tipo: "conexa", nota: "Documentación de la obra ejecutada (Libro del Edificio): acta de recepción, agentes e instrucciones de uso; se entrega a los usuarios."}
      - {norma: "LOE", articulo: "2", apartado: "1", tipo: "conexa", nota: "La LOE se aplica a la construcción de edificios permanentes, públicos o privados, de los usos que enumera."}
      - {norma: "LOE", articulo: "2", apartado: "2", tipo: "conexa", nota: "Son edificación la obra nueva (salvo la de escasa entidad) y las intervenciones que alteran la configuración arquitectónica."}
      - {norma: "LOE", articulo: "1", apartado: "3", tipo: "conexa", nota: "Las Administraciones que actúan como agentes se rigen por la legislación de contratos públicos y, en lo demás, por la LOE."}
    no_consta_en_norma:
