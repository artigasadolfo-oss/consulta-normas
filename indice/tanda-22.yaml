      - {norma: "TRLGDCU", articulo: "98", apartado: "7", tipo: "regula", nota: "Confirmación del contrato en soporte duradero, a más tardar al entregar los bienes o antes de iniciar el servicio."}
      - {norma: "TRLGDCU", articulo: "99", apartado: "1", tipo: "regula", nota: "Fuera del establecimiento, la información se da en papel u otro soporte duradero aceptado, al menos en castellano."}
