      - {norma: "TRLGDCU", articulo: "60", apartado: "2", tipo: "regula", nota: "Información relevante: características, identidad, precio, pago y entrega, garantías, duración, desistimiento y reclamaciones."}
      - {norma: "TRLGDCU", articulo: "60", apartado: "2.c)", tipo: "regula", nota: "Precio total con impuestos; en toda información y publicidad, desglosando incrementos, descuentos y gastos repercutidos."}
      - {norma: "TRLGDCU", articulo: "60", apartado: "4", tipo: "regula", nota: "Gratis y al menos en castellano; a petición de parte, también en la otra lengua oficial del lugar."}
      - {norma: "TRLGDCU", articulo: "60", apartado: "5", tipo: "regula", nota: "La carga de probar que se cumplió el deber de información incumbe al empresario."}
      - {norma: "TRLGDCU", articulo: "60 bis", apartado: "1", tipo: "regula", nota: "Todo pago adicional exige consentimiento expreso; no vale el deducido de opciones por defecto que haya que rechazar."}
      - {norma: "TRLGDCU", articulo: "60 ter", apartado: "1", tipo: "conexa", nota: "El cargo por usar un medio de pago no puede superar el coste que soporta el empresario."}
      - {norma: "TRLGDCU", articulo: "61", apartado: "1", tipo: "regula", nota: "Oferta, promoción y publicidad se ajustan a la naturaleza y características del bien o servicio y a las condiciones del contrato."}
      - {norma: "TRLGDCU", articulo: "61", apartado: "2", tipo: "regula", nota: "Lo ofrecido en la oferta o la publicidad es exigible aunque no figure en el contrato, y cuenta para la conformidad."}
      - {norma: "TRLGDCU", articulo: "61", apartado: "3", tipo: "regula", nota: "Si el contrato tiene cláusulas más beneficiosas, prevalecen sobre la oferta o la publicidad."}
      - {norma: "TRLGDCU", articulo: "65", tipo: "regula", nota: "El contrato se integra en beneficio del consumidor por la buena fe objetiva, también si se omitió información relevante."}
      - {norma: "TRLGDCU", articulo: "63", apartado: "1", tipo: "regula", nota: "Se entrega al consumidor justificante o copia con las condiciones esenciales, incluidas las generales aceptadas."}
      - {norma: "TRLGDCU", articulo: "63", apartado: "3", tipo: "conexa", nota: "Derecho a factura en papel sin coste; la electrónica exige consentimiento expreso y revocable."}
      - {norma: "TRLGDCU", articulo: "62", apartado: "1", tipo: "conexa", nota: "Debe constar de forma inequívoca la voluntad del consumidor de contratar o de poner fin al contrato."}
      - {norma: "TRLGDCU", articulo: "64", tipo: "regula", nota: "En la primera transmisión de viviendas se entrega además la documentación de la LOE o la norma autonómica."}
      - {norma: "TRLGDCU", articulo: "20", apartado: "1", tipo: "regula", nota: "La oferta comercial con precio y características debe identificar al empresario, el precio final completo y el desistimiento."}
      - {norma: "TRLGDCU", articulo: "20", apartado: "6", tipo: "conexa", nota: "Incumplirlo es práctica desleal por engañosa a efectos de la Ley de Competencia Desleal."}
      - {norma: "TRLGDCU", articulo: "18", apartado: "1", tipo: "conexa", nota: "El etiquetado y la presentación no deben inducir a error sobre características, cualidades o efectos del bien o servicio."}
      - {norma: "TRLGDCU", articulo: "8", apartado: "1.d)", tipo: "conexa", nota: "La información correcta sobre bienes y servicios es derecho básico del consumidor."}
      - {norma: "TRLGDCU", articulo: "97", apartado: "1", tipo: "conexa", nota: "En contratos a distancia y fuera del establecimiento, lista reforzada de información precontractual."}
      - {norma: "TRLGDCU", articulo: "59", apartado: "2", tipo: "conexa", nota: "Lo no previsto en el TRLGDCU o leyes especiales se rige por el derecho común de los contratos."}
      - {norma: "CC", articulo: "1258", tipo: "conexa", nota: "El contrato obliga a lo pactado y a las consecuencias conformes a la buena fe, al uso y a la ley."}
      - {norma: "CC", articulo: "1288", tipo: "conexa", nota: "La cláusula oscura no se interpreta a favor de quien causó la oscuridad."}
      - {norma: "CC", articulo: "1266", tipo: "conexa", nota: "El error invalida si recae sobre la sustancia o las condiciones que principalmente motivaron el contrato."}
      - {norma: "LOE", articulo: "7", tipo: "conexa", nota: "La documentación de la obra ejecutada (Libro del Edificio) se entrega a los usuarios finales."}
      - {norma: "LEC", articulo: "217", apartado: "4", tipo: "conexa", nota: "En los procesos sobre publicidad ilícita, el demandado prueba la exactitud y veracidad de lo que la publicidad expresa."}
    no_consta_en_norma:
      - "Vinculación de la memoria de calidades y los folletos de la promotora en la compraventa de vivienda: aplicación jurisprudencial del art. 61."
      - "Efecto civil de omitir información relevante (integración, anulabilidad por error o dolo, indemnización): jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 3/1991, de Competencia Desleal, art. 7 (omisiones engañosas), al que remite el art. 20.6 TRLGDCU."
    afines: ["Contratos a distancia y fuera del establecimiento", "Concepto de consumidor y de empresario", "Cláusulas abusivas: concepto, nulidad e integración", "Garantía de conformidad de los bienes", "Vicios del consentimiento: error, dolo e intimidación", "Interpretación de los contratos"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Viajes combinados y servicios de viaje vinculados"
    sinonimos: ["viaje combinado", "paquete turístico", "viaje organizado", "agencia de viajes", "organizador", "minorista", "servicios de viaje vinculados", "cancelación del viaje", "anulación del viaje por el viajero", "penalización por cancelación", "circunstancias inevitables y extraordinarias", "subida del precio del viaje", "cesión del viaje", "falta de conformidad en el viaje", "hotel distinto del contratado", "reducción del precio del viaje", "indemnización por vacaciones frustradas", "repatriación", "insolvencia de la agencia", "garantía de la agencia", "error en la reserva"]
    normas_base: ["TRLGDCU"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "150", apartado: "1", tipo: "regula", nota: "El libro cuarto rige la oferta, contratación y ejecución de viajes combinados y servicios de viaje vinculados."}
      - {norma: "TRLGDCU", articulo: "150", apartado: "2", tipo: "conexa", nota: "Excluidos: viajes de menos de 24 horas sin alojamiento, ocasionales sin ánimo de lucro y los de negocios con convenio general."}
      - {norma: "TRLGDCU", articulo: "150", apartado: "3", tipo: "regula", nota: "No se eximen quienes declaren actuar como meros intermediarios o prestadores de un solo servicio."}
      - {norma: "TRLGDCU", articulo: "151", apartado: "1", tipo: "regula", nota: "Definiciones: servicio de viaje, viaje combinado, servicios vinculados, organizador, minorista, falta de conformidad."}
      - {norma: "TRLGDCU", articulo: "152", tipo: "conexa", nota: "El empresario responde de los errores técnicos de su sistema de reservas y de los cometidos al gestionar la reserva."}
      - {norma: "TRLGDCU", articulo: "153", apartado: "1", tipo: "regula", nota: "Información precontractual: formulario normalizado, características, precio total, pagos, mínimo de viajeros, documentación."}
      - {norma: "TRLGDCU", articulo: "154", apartado: "1", tipo: "regula", nota: "La información sobre servicios, precio, pagos, mínimo de personas y penalización forma parte del contrato."}
      - {norma: "TRLGDCU", articulo: "154", apartado: "2", tipo: "conexa", nota: "Si no se informó de comisiones, recargos u otros costes adicionales, el viajero no los soporta."}
      - {norma: "TRLGDCU", articulo: "155", apartado: "1", tipo: "regula", nota: "Copia o confirmación del contrato en soporte duradero; en papel si se celebró en presencia de ambas partes."}
      - {norma: "TRLGDCU", articulo: "156", tipo: "regula", nota: "La carga de probar el cumplimiento de los deberes de información recae en el empresario."}
      - {norma: "TRLGDCU", articulo: "157", tipo: "regula", nota: "Cesión del viaje a quien reúna las condiciones, avisando con siete días naturales; cedente y cesionario responden solidariamente."}
      - {norma: "TRLGDCU", articulo: "158", tipo: "regula", nota: "Subida del precio solo si se pactó, por combustible, tasas o divisas, notificada veinte días antes; más del 8 %: art. 159."}
      - {norma: "TRLGDCU", articulo: "159", tipo: "regula", nota: "Cambio sustancial antes del viaje o subida superior al 8 %: el viajero acepta o resuelve sin penalización; reembolso en 14 días."}
      - {norma: "TRLGDCU", articulo: "160", apartado: "1", tipo: "regula", nota: "El viajero puede resolver antes del inicio pagando una penalización adecuada y justificable."}
      - {norma: "TRLGDCU", articulo: "160", apartado: "2", tipo: "regula", nota: "Circunstancias inevitables y extraordinarias en destino: resolución sin penalización y reembolso íntegro, sin más compensación."}
      - {norma: "TRLGDCU", articulo: "160", apartado: "3", tipo: "regula", nota: "El organizador puede cancelar sin compensar si no hay el mínimo de viajeros, avisando en plazo, o por circunstancias inevitables."}
      - {norma: "TRLGDCU", articulo: "160", apartado: "4", tipo: "regula", nota: "Los reembolsos se hacen sin demora indebida y en un máximo de catorce días naturales."}
      - {norma: "TRLGDCU", articulo: "160", apartado: "5", tipo: "conexa", nota: "Contratado fuera del establecimiento: desistimiento en catorce días sin justificación."}
      - {norma: "TRLGDCU", articulo: "161", apartado: "1", tipo: "regula", nota: "Organizador y minorista responden de la ejecución según su ámbito de gestión; si no gestionan la reclamación, solidariamente."}
      - {norma: "TRLGDCU", articulo: "161", apartado: "2", tipo: "regula", nota: "El viajero debe comunicar sin demora indebida la falta de conformidad que observe durante el viaje."}
      - {norma: "TRLGDCU", articulo: "161", apartado: "3", tipo: "regula", nota: "El organizador debe subsanar la falta de conformidad salvo imposibilidad o coste desproporcionado."}
      - {norma: "TRLGDCU", articulo: "161", apartado: "6", tipo: "regula", nota: "Falta de conformidad sustancial no subsanada: resolución sin penalización, reducción, indemnización y repatriación."}
      - {norma: "TRLGDCU", articulo: "162", apartado: "1", tipo: "regula", nota: "Reducción del precio por todo periodo con falta de conformidad, salvo que sea imputable al viajero."}
      - {norma: "TRLGDCU", articulo: "162", apartado: "2", tipo: "regula", nota: "Indemnización adecuada por cualquier daño o perjuicio derivado de la falta de conformidad, pagada sin demora."}
      - {norma: "TRLGDCU", articulo: "162", apartado: "3", tipo: "regula", nota: "No hay indemnización si la falta es imputable al viajero, a un tercero ajeno e imprevisible o a circunstancias inevitables."}
      - {norma: "TRLGDCU", articulo: "162", apartado: "5", tipo: "conexa", nota: "Compatible con los derechos de los reglamentos de pasajeros, descontándose lo cobrado por una u otra vía."}
      - {norma: "TRLGDCU", articulo: "163", apartado: "2", tipo: "conexa", nota: "Organizador y minorista deben prestar asistencia adecuada al viajero en dificultades."}
      - {norma: "TRLGDCU", articulo: "164", apartado: "1", tipo: "regula", nota: "Organizadores y minoristas deben constituir una garantía frente a su insolvencia, con repatriación si incluye transporte."}
      - {norma: "TRLGDCU", articulo: "165", tipo: "regula", nota: "Garantía de la responsabilidad contractual, que el viajero puede reclamar directamente al sistema de cobertura."}
      - {norma: "TRLGDCU", articulo: "167", apartado: "1", tipo: "regula", nota: "Servicios de viaje vinculados: el empresario garantiza el reembolso de los pagos si un servicio no se ejecuta por su insolvencia."}
      - {norma: "TRLGDCU", articulo: "168", apartado: "1", tipo: "regula", nota: "En los vinculados debe informar de que no rigen los derechos del viaje combinado y cada prestador responde de lo suyo."}
      - {norma: "TRLGDCU", articulo: "168", apartado: "2", tipo: "regula", nota: "Si no garantiza ni informa, se aplican los derechos de cesión, resolución y ejecución del viaje combinado."}
      - {norma: "TRLGDCU", articulo: "169", tipo: "regula", nota: "Las reclamaciones de este libro prescriben a los dos años."}
      - {norma: "TRLGDCU", articulo: "93", apartado: "g)", tipo: "conexa", nota: "Al viaje combinado no se aplica el título de contratos a distancia, salvo los apartados 2 y 6 del art. 98."}
    no_consta_en_norma:
      - "Daño moral por vacaciones frustradas y su cuantificación: jurisprudencial."
      - "Dies a quo del plazo de dos años del art. 169 (fin del viaje o fecha prevista): no lo fija la ley; jurisprudencial."
    fuera_de_la_herramienta:
      - "Reglamento (CE) 261/2004: compensación y asistencia a pasajeros aéreos, citado por el art. 162.5 TRLGDCU."
    afines: ["Contratos a distancia y fuera del establecimiento", "Información precontractual e integración de la oferta y la publicidad", "Concepto de consumidor y de empresario", "Fuerza mayor y caso fortuito", "Daños y perjuicios por incumplimiento contractual", "Cláusulas abusivas: lista legal (gastos, sumisión, penalizaciones)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Responsabilidad por productos defectuosos"
    sinonimos: ["producto defectuoso", "responsabilidad del fabricante", "responsabilidad del productor", "importador en la Unión Europea", "defecto de fabricación", "defecto de diseño", "defecto de información", "seguridad legítimamente esperada", "daños por un electrodoméstico", "explosión o incendio de un aparato", "riesgos del desarrollo", "franquicia de 500 euros", "plazo de tres años", "extinción a los diez años", "proveedor que no identifica al fabricante", "culpa de la víctima", "responsabilidad solidaria de productores"]
    normas_base: ["TRLGDCU", "CC", "LEC"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "128", tipo: "regula", nota: "Todo perjudicado tiene derecho a ser indemnizado por los daños causados por los bienes o servicios en los términos de este libro."}
      - {norma: "TRLGDCU", articulo: "128", apartado: "párrafo 2.º", tipo: "conexa", nota: "Estas acciones no excluyen las contractuales (incluida la falta de conformidad) ni la extracontractual, con daños morales."}
      - {norma: "TRLGDCU", articulo: "129", apartado: "1", tipo: "regula", nota: "Cubre daños personales, incluida la muerte, y materiales en bienes destinados y usados principalmente para uso privado."}
      - {norma: "TRLGDCU", articulo: "130", tipo: "regula", nota: "Son ineficaces frente al perjudicado las cláusulas que excluyan o limiten esta responsabilidad."}
      - {norma: "TRLGDCU", articulo: "132", tipo: "regula", nota: "Los responsables del mismo daño lo son solidariamente; quien paga repite según su participación."}
      - {norma: "TRLGDCU", articulo: "133", tipo: "conexa", nota: "La intervención de un tercero no reduce la responsabilidad; el que paga puede reclamarle su parte."}
      - {norma: "TRLGDCU", articulo: "134", apartado: "1", tipo: "conexa", nota: "Desde la declaración judicial de responsabilidad hasta el pago, compensación sobre la indemnización según la LEC."}
      - {norma: "TRLGDCU", articulo: "135", tipo: "regula", nota: "Los productores responden de los daños causados por los defectos de los productos que fabriquen o importen."}
      - {norma: "TRLGDCU", articulo: "136", tipo: "regula", nota: "Producto: cualquier bien mueble, aunque esté unido o incorporado a otro mueble o inmueble, y el gas y la electricidad."}
      - {norma: "TRLGDCU", articulo: "137", apartado: "1", tipo: "regula", nota: "Defectuoso: no ofrece la seguridad legítimamente esperable según su presentación, uso previsible y momento de circulación."}
      - {norma: "TRLGDCU", articulo: "137", apartado: "2", tipo: "regula", nota: "Es defectuoso, en todo caso, el que no ofrece la seguridad de los demás ejemplares de la misma serie."}
      - {norma: "TRLGDCU", articulo: "137", apartado: "3", tipo: "conexa", nota: "No es defectuoso solo porque después se ponga en circulación otro más perfeccionado."}
      - {norma: "TRLGDCU", articulo: "138", apartado: "1", tipo: "regula", nota: "Productor: el del art. 5 y el fabricante o importador en la UE del producto terminado, de un componente o de la materia prima."}
      - {norma: "TRLGDCU", articulo: "138", apartado: "2", tipo: "regula", nota: "Si no se identifica al productor, responde el proveedor salvo que lo identifique en tres meses."}
      - {norma: "TRLGDCU", articulo: "5", tipo: "conexa", nota: "Productor es también quien se presenta como tal poniendo su nombre, marca o signo en el bien o su envase."}
      - {norma: "TRLGDCU", articulo: "139", tipo: "regula", nota: "El perjudicado debe probar el defecto, el daño y la relación de causalidad entre ambos."}
      - {norma: "TRLGDCU", articulo: "140", apartado: "1", tipo: "regula", nota: "Se exonera si prueba: no lo puso en circulación, defecto posterior, uso no profesional, norma imperativa o riesgos del desarrollo."}
      - {norma: "TRLGDCU", articulo: "140", apartado: "3", tipo: "conexa", nota: "En medicamentos y alimentos no cabe alegar los riesgos del desarrollo."}
      - {norma: "TRLGDCU", articulo: "141", tipo: "regula", nota: "Franquicia de 500 euros en daños materiales y límite global por muerte y lesiones de una serie con el mismo defecto."}
      - {norma: "TRLGDCU", articulo: "142", tipo: "regula", nota: "El daño en el propio producto no se indemniza por este régimen, sino por la legislación civil y mercantil."}
      - {norma: "TRLGDCU", articulo: "143", apartado: "1", tipo: "regula", nota: "Prescribe a los tres años desde el perjuicio si se conoce al responsable; la repetición, al año desde el pago."}
      - {norma: "TRLGDCU", articulo: "143", apartado: "2", tipo: "conexa", nota: "La interrupción de la prescripción se rige por el Código Civil."}
      - {norma: "TRLGDCU", articulo: "144", tipo: "regula", nota: "Los derechos se extinguen a los diez años de la puesta en circulación del producto, salvo reclamación judicial iniciada."}
      - {norma: "TRLGDCU", articulo: "145", tipo: "regula", nota: "Culpa concurrente del perjudicado o de quien dependa de él: la responsabilidad puede reducirse o suprimirse."}
      - {norma: "TRLGDCU", articulo: "146", tipo: "regula", nota: "El proveedor que suministró sabiendo del defecto responde como productor, con repetición contra este."}
      - {norma: "CC", articulo: "1902", tipo: "conexa", nota: "Régimen general: quien por acción u omisión culposa causa daño a otro debe repararlo."}
      - {norma: "CC", articulo: "1968", apartado: "2.º", tipo: "conexa", nota: "La acción extracontractual del art. 1902 prescribe al año desde que lo supo el agraviado."}
      - {norma: "LEC", articulo: "576", apartado: "1", tipo: "conexa", nota: "La condena dineraria devenga desde la primera instancia el interés legal más dos puntos."}
    # VIGENCIA: TRLGDCU 128 a 146 idénticos al texto vigente de boe.es. La Directiva (UE) 2024/2853 debe transponerse a más tardar el 09-12-2026 (ver notas).
    no_consta_en_norma:
      - "Distinción entre defecto de fabricación, de diseño y de información, y prueba del defecto por presunciones: jurisprudencial."
      - "Si el daño en el propio producto se reclama por saneamiento, conformidad o art. 1101 CC: jurisprudencial."
    fuera_de_la_herramienta:
      - "Directiva (UE) 2024/2853, art. 2.1: se aplica a productos introducidos en el mercado después del 09-12-2026."
      - "Directiva (UE) 2024/2853, art. 22.1: transposición a más tardar el 09-12-2026; deroga la Directiva 85/374/CEE (art. 21)."
    afines: ["Responsabilidad por servicios defectuosos", "Responsabilidad extracontractual", "Garantía de conformidad de los bienes", "Concepto de consumidor y de empresario", "Daños causados por animales, edificios y cosas", "Carga de la prueba"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Responsabilidad por servicios defectuosos"
    sinonimos: ["servicio defectuoso", "responsabilidad del prestador de servicios", "daños causados por un servicio", "reparación de vivienda mal hecha", "rehabilitación de vivienda", "ascensor averiado", "taller mecánico", "instalación de gas o electricidad", "servicios sanitarios", "responsabilidad médica privada", "transporte", "responsabilidad objetiva del art. 148", "inversión de la carga de la prueba", "límite de 3.005.060,52 euros", "daños por defectos de la vivienda", "promotor y vendedor de viviendas"]
    normas_base: ["TRLGDCU", "CC"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "147", tipo: "regula", nota: "El prestador responde de los daños salvo que pruebe que cumplió los requisitos reglamentarios y la diligencia del servicio."}
      - {norma: "TRLGDCU", articulo: "148", tipo: "regula", nota: "Régimen especial: responde de los daños en el correcto uso de servicios que garantizan niveles de eficacia o seguridad con controles."}
      - {norma: "TRLGDCU", articulo: "148", apartado: "párrafo 2.º", tipo: "regula", nota: "Incluye siempre sanitarios, reparación de electrodomésticos, ascensores y vehículos, obras en viviendas, gas, electricidad y transporte."}
      - {norma: "TRLGDCU", articulo: "148", apartado: "párrafo 3.º", tipo: "conexa", nota: "Salvo otras leyes, esta responsabilidad tiene un límite de 3.005.060,52 euros."}
      - {norma: "TRLGDCU", articulo: "149", tipo: "regula", nota: "El art. 148 se aplica a quien construye o comercializa viviendas como empresario, por defectos sin régimen legal específico."}
      - {norma: "TRLGDCU", articulo: "128", tipo: "regula", nota: "Derecho a indemnización por daños de bienes o servicios, sin perjuicio de las acciones contractuales o extracontractuales."}
      - {norma: "TRLGDCU", articulo: "129", apartado: "1", tipo: "conexa", nota: "Daños personales y materiales en bienes de uso o consumo privado usados principalmente así por el perjudicado."}
      - {norma: "TRLGDCU", articulo: "130", tipo: "regula", nota: "Son ineficaces frente al perjudicado las cláusulas de exoneración o limitación de responsabilidad."}
      - {norma: "TRLGDCU", articulo: "132", tipo: "regula", nota: "Varios responsables del mismo daño responden solidariamente, con repetición según su participación."}
