      - {norma: "TRLGDCU", articulo: "100", apartado: "1", tipo: "regula", nota: "Sin copia ni confirmación del contrato, el consumidor puede anularlo por vía de acción o de excepción."}
      - {norma: "TRLGDCU", articulo: "100", apartado: "2", tipo: "conexa", nota: "El empresario no puede invocar esa nulidad, salvo incumplimiento exclusivo del consumidor."}
      - {norma: "TRLGDCU", articulo: "101", apartado: "1", tipo: "regula", nota: "La falta de respuesta a la oferta nunca vale como aceptación."}
