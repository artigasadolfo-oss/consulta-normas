# Índice de conceptos de «Consulta de normas» — tanda 8 (obras comunes de la PH y ejecución)
# Revisor: armero. Espejo: legalize-es@aca28304d. Todo precepto citado se ha leído en el espejo en esta pasada.
# Vigencia: contraste con la API de boe.es (scripts/contraste_boe.py --solo "LEC,LPH,CC,CE,LO 1/2025", 08-10-2026 07:43): distintos
# LEC 22 y 685, LPH 10 (versión futura 23-10-2026), CC 396 (errata del espejo). Ver tanda-08-notas.md.
# AVISO: el espejo YA muestra el art. 10 LPH en la redacción de la Ley 4/2026, que no rige hasta el 23-10-2026.
# Voces 122 y 131 a 141 de la lista maestra: 12 voces, 224 remisiones, 107 artículos distintos; 10 vigentes y 2 provisionales.

voces:
  - voz: "Obras en elementos comunes y accesibilidad"
    sinonimos: ["obras de conservación", "obras necesarias de la comunidad", "obras de accesibilidad", "instalación de ascensor", "supresión de barreras arquitectónicas", "derrama de obras", "obras de mejora", "eficiencia energética del edificio", "rampa", "ajustes razonables"]
    normas_base: ["LPH", "LEC"]
    remisiones:
      - {norma: "LPH", articulo: "10", apartado: "1.a)", tipo: "regula", nota: "Conservación, seguridad, habitabilidad, accesibilidad universal y ornato: obras obligatorias, sin acuerdo previo de la junta."}
      - {norma: "LPH", articulo: "10", apartado: "1.b)", tipo: "regula", nota: "Accesibilidad pedida por discapacitados o mayores de 70: obligatoria si lo repercutido al año, neto de ayudas, no pasa de 12 cuotas."}
      - {norma: "LPH", articulo: "10", apartado: "1.b), párrafo 3.º", tipo: "regula", nota: "Hasta el 22-10-2026: obligatoria si las ayudas accesibles llegan al 75 %. Desde el 23-10: 70 % concedido y deber de pedirlas."}
      - {norma: "LPH", articulo: "10", apartado: "1.b), párrafo 4.º", tipo: "regula", nota: "Solo desde el 23-10-2026: si la comunidad no ejecuta la obra obligatoria, el interesado puede pedir al juez que se la imponga."}
      - {norma: "LPH", articulo: "10", apartado: "1.b), párrafo 5.º", tipo: "regula", nota: "Sigue siendo obligatoria si quien la pide asume el exceso sobre las 12 cuotas o sobre lo que no cubran las ayudas."}
      - {norma: "LPH", articulo: "10", apartado: "1.c)", tipo: "conexa", nota: "Ocupar elementos comunes mientras duran esas obras también es obligatorio."}
      - {norma: "LPH", articulo: "10", apartado: "2.a)", tipo: "regula", nota: "Las obras obligatorias las pagan los propietarios; la junta solo reparte la derrama y fija cómo se abona."}
      - {norma: "LPH", articulo: "10", apartado: "2.c)", tipo: "conexa", nota: "Los pisos quedan afectos al pago de esas obras como a los gastos generales del art. 9."}
      - {norma: "LPH", articulo: "10", apartado: "3.b)", tipo: "regula", nota: "Nuevas plantas, alterar estructura, cerrar terrazas o la envolvente: autorización administrativa, mayoría y consentimiento del afectado."}
      - {norma: "LPH", articulo: "17", apartado: "2", tipo: "regula", nota: "Barreras arquitectónicas y ascensor: mayoría de propietarios y de cuotas; aprobadas, se pagan aunque pasen de 12 cuotas."}
      - {norma: "LPH", articulo: "17", apartado: "2, párrafo 3.º", tipo: "regula", nota: "Eficiencia energética, renovables comunes y su financiación: mayoría simple si lo repercutido no pasa de 12 cuotas."}
      - {norma: "LPH", articulo: "17", apartado: "4, párrafo 2.º", tipo: "regula", nota: "Mejoras no exigibles por 3/5: el disidente no paga si la cuota pasa de 3 mensualidades; puede sumarse luego pagando."}
      - {norma: "LPH", articulo: "17", apartado: "4, párrafo 3.º", tipo: "regula", nota: "Tres quintos para nuevas plantas, alterar la estructura o fábrica, cerrar terrazas o modificar cosas comunes."}
      - {norma: "LPH", articulo: "17", apartado: "4, párrafo 4.º", tipo: "conexa", nota: "Innovación que deja inservible parte del edificio para un propietario: exige su consentimiento expreso."}
      - {norma: "LPH", articulo: "17", apartado: "1", tipo: "conexa", nota: "Telecomunicaciones, renovables (aerotermia, geotermia) y nuevos suministros: un tercio; no paga quien no votó a favor."}
      - {norma: "LPH", articulo: "17", apartado: "3", tipo: "conexa", nota: "Eficiencia energética o hídrica fuera del 17.1 y arrendar elementos comunes sin uso asignado: tres quintos."}
      - {norma: "LPH", articulo: "17", apartado: "10", tipo: "conexa", nota: "Discrepancia sobre la naturaleza de las obras: decide la junta; cabe arbitraje o dictamen técnico."}
      - {norma: "LPH", articulo: "17", apartado: "11", tipo: "conexa", nota: "Derramas de mejoras: a cargo de quien sea propietario cuando las cantidades sean exigibles."}
      - {norma: "LPH", articulo: "9", apartado: "1.c)", tipo: "conexa", nota: "Consentir en el piso reparaciones y servidumbres imprescindibles para obras comunes, con resarcimiento de daños."}
      - {norma: "LPH", articulo: "9", apartado: "1.f)", tipo: "conexa", nota: "El fondo de reserva atiende conservación, reparación, rehabilitación y las obras de accesibilidad de los arts. 10.1.b) y 17.2."}
      - {norma: "LPH", articulo: "14", apartado: "c)", tipo: "conexa", nota: "La junta aprueba presupuestos y obras de reparación, ordinarias o extraordinarias, y conoce las urgentes del administrador."}
      - {norma: "LPH", articulo: "20", apartado: "1.c)", tipo: "conexa", nota: "El administrador dispone las reparaciones urgentes y da cuenta inmediata al presidente o a los propietarios."}
      - {norma: "LPH", articulo: "7", apartado: "1, párrafo 2.º", tipo: "conexa", nota: "El propietario no puede alterar el resto del inmueble; si ve una reparación urgente, la comunica al administrador."}
      - {norma: "LEC", articulo: "249", apartado: "1.8.º", tipo: "conexa", nota: "Acciones de la LPH que no son solo de cantidad (impugnar el acuerdo de obras, exigir su ejecución): juicio ordinario."}
      - {norma: "LEC", articulo: "250", apartado: "1.15.º", tipo: "conexa", nota: "Reclamar solo la derrama o su reintegro: juicio verbal, sea cual sea la cuantía."}
    no_consta_en_norma:
      - "Deslinde entre obra necesaria (10.1.a) y mejora o innovación (17.4): criterio jurisprudencial."
      - "Ascensor que ocupa parte de un elemento privativo (servidumbre del 9.1.c) o desafectación): criterio jurisprudencial."
      - "Obras de accesibilidad pedidas antes del 23-10-2026: la Ley 4/2026 no trae transitoria para la LPH; qué texto rige, no lo resuelve."
      - "Cerramiento de terrazas que altera la configuración exterior: si basta el 17.4 o hace falta unanimidad, criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 15/1995, de límites del dominio para eliminar barreras arquitectónicas: rige junto a los arts. 10 y 17 LPH."
      - "Texto refundido de la Ley de Suelo (RDLeg. 7/2015) y normativa urbanística: autorización administrativa del 10.3 LPH."
      - "Ayudas autonómicas a la accesibilidad y rehabilitación (Comunitat Valenciana): a ellas remiten los arts. 10.1.b) y 17.2 LPH."
    afines: ["Obras en elementos privativos", "Mayorías y cómputo de votos", "Gastos comunes, cuota y fondo de reserva", "Servidumbres y acceso para obras e instalaciones comunes", "Impugnación de acuerdos (plazo del art. 18)", "Resolución judicial en equidad ante falta de mayoría"]
    vigilar:
      - {norma: "LPH", articulo: "da 3"}
    # VIGENCIA: LPH 10 con versión futura 23-10-2026 (Ley 4/2026, df 1.ª): el espejo ya trae la futura; notas con ambos textos.
    # La df 18.ª de la Ley 4/2026 autoriza un texto refundido de los arts. 10 y 17 LPH en doce meses: vigilar ambos.
    estado: "provisional"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Títulos ejecutivos"
    sinonimos: ["título ejecutivo", "acción ejecutiva", "aparejada ejecución", "sentencia firme de condena", "escritura pública ejecutiva", "póliza", "laudo", "acuerdo de mediación ejecutivo", "acuerdo MASC ejecutivo"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "517", apartado: "1", tipo: "regula", nota: "La acción ejecutiva debe fundarse en un título que tenga aparejada ejecución."}
      - {norma: "LEC", articulo: "517", apartado: "2.1.º", tipo: "regula", nota: "La sentencia de condena firme."}
      - {norma: "LEC", articulo: "517", apartado: "2.2.º", tipo: "regula", nota: "Laudos; acuerdos de mediación y de cualquier otro MASC, estos solo si se han elevado a escritura pública."}
      - {norma: "LEC", articulo: "517", apartado: "2.3.º", tipo: "regula", nota: "Resoluciones que aprueban u homologan transacciones y acuerdos logrados en el proceso, con testimonio si hace falta."}
      - {norma: "LEC", articulo: "517", apartado: "2.4.º", tipo: "regula", nota: "Copia de la escritura pública matriz que el interesado pida que se expida con carácter ejecutivo."}
      - {norma: "LEC", articulo: "517", apartado: "2.5.º", tipo: "regula", nota: "Póliza: testimonio notarial del original o copia autorizada, con la certificación del art. 572.2."}
      - {norma: "LEC", articulo: "517", apartado: "2.9.º", tipo: "regula", nota: "Las demás resoluciones y documentos a los que esta u otra ley den aparejada ejecución."}
      - {norma: "LEC", articulo: "520", apartado: "1", tipo: "regula", nota: "Títulos de los n.º 4.º a 7.º: solo por cantidad determinada de más de 300 euros, sumando títulos si hace falta."}
      - {norma: "LEC", articulo: "521", apartado: "1", tipo: "conexa", nota: "No se despacha ejecución de sentencias meramente declarativas ni constitutivas."}
      - {norma: "LEC", articulo: "521", apartado: "3", tipo: "conexa", nota: "Si la constitutiva incluye pronunciamientos de condena, estos sí se ejecutan."}
      - {norma: "LEC", articulo: "524", apartado: "2", tipo: "conexa", nota: "La sentencia de condena no firme se ejecuta provisionalmente, como la ordinaria."}
      - {norma: "LEC", articulo: "523", apartado: "1", tipo: "conexa", nota: "Títulos extranjeros: según tratados y normas de cooperación jurídica internacional."}
      - {norma: "LEC", articulo: "572", apartado: "1", tipo: "conexa", nota: "Cantidad líquida: la expresada en el título; si hay disconformidad, prevalece la escrita en letras."}
      - {norma: "LEC", articulo: "816", apartado: "1", tipo: "conexa", nota: "Monitorio sin pago ni oposición: decreto y ejecución por mera solicitud, sin esperar los veinte días del 548."}
      - {norma: "LEC", articulo: "415", apartado: "2", tipo: "conexa", nota: "Acuerdo homologado en la audiencia previa: efectos de transacción judicial y ejecución como las sentencias."}
      - {norma: "LEC", articulo: "21", apartado: "2", tipo: "conexa", nota: "El auto que acoge un allanamiento parcial es ejecutable conforme a los arts. 517 y siguientes."}
      - {norma: "LEC", articulo: "34", apartado: "3", tipo: "conexa", nota: "Cuenta del procurador no impugnada: se despacha ejecución por su importe."}
      - {norma: "LEC", articulo: "35", apartado: "3", tipo: "conexa", nota: "Minuta del abogado no impugnada: se despacha ejecución por su importe."}
      - {norma: "LO 1/2025", articulo: "13", apartado: "2", tipo: "regula", nota: "El acuerdo MASC es título ejecutivo si se eleva a escritura, se homologa o consta en la certificación del 103 bis LH."}
      - {norma: "LO 1/2025", articulo: "12", apartado: "3", tipo: "conexa", nota: "Cada parte puede compeler a la otra a elevar el acuerdo a escritura; si no acude, cabe otorgarla unilateralmente."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "3", tipo: "conexa", nota: "La demanda ejecutiva no exige acudir antes a un MASC."}
    no_consta_en_norma:
      - "Acuerdo MASC distinto de la mediación elevado a escritura: si sigue el régimen de los títulos judiciales (548, 556) o el del 557, no lo dice."
      - "Escritura con cantidad no expresada pero determinable por simple operación aritmética: si es líquida (572.1), criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 5/2012 de mediación y Ley 60/2003 de arbitraje (requisitos del acuerdo y del laudo): no están en la herramienta."
      - "Reglamento (UE) 1215/2012 y Ley 29/2015 de cooperación jurídica internacional: títulos extranjeros del art. 523."
      - "Ley Hipotecaria, art. 103 bis (conciliación registral): a él remite el art. 13.2 LO 1/2025."
    afines: ["Despacho de la ejecución y plazo de espera", "Oposición por defectos procesales", "Caducidad de la acción ejecutiva", "Ejecución provisional y su oposición", "Juicio monitorio y oposición", "Acuerdo alcanzado en el MASC: eficacia y ejecución", "Ejecución de títulos extranjeros", "Transacción judicial"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Despacho de la ejecución y plazo de espera"
    sinonimos: ["demanda ejecutiva", "auto de despacho", "orden general de ejecución", "plazo de espera de veinte días", "decreto de medidas ejecutivas", "denegación del despacho", "competencia para la ejecución", "declinatoria en la ejecución"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "548", tipo: "regula", nota: "Resoluciones, laudos y acuerdos de mediación: no se despacha ejecución en los veinte días siguientes a la firmeza o notificación."}
      - {norma: "LEC", articulo: "549", apartado: "1", tipo: "regula", nota: "Demanda: título, tutela y cantidad pedidas (575), bienes conocidos, averiguación interesada y ejecutados."}
      - {norma: "LEC", articulo: "549", apartado: "2", tipo: "regula", nota: "Si el título es resolución del mismo tribunal o del LAJ, basta pedir el despacho identificándola."}
      - {norma: "LEC", articulo: "549", apartado: "4", tipo: "conexa", nota: "Desahucio por impago o expiración: no rige la espera del 548; en vivienda habitual, antes, los trámites del 441.5 a 7."}
      - {norma: "LEC", articulo: "550", apartado: "1", tipo: "regula", nota: "Se acompaña el título (salvo que conste en autos), el apoderamiento y, si es acuerdo MASC, las actas inicial y final."}
      - {norma: "LEC", articulo: "551", apartado: "1", tipo: "regula", nota: "Auto de despacho si hay presupuestos, título regular, cláusulas no abusivas y actos conformes al título."}
      - {norma: "LEC", articulo: "551", apartado: "2", tipo: "regula", nota: "El auto expresa partes, solidaridad o mancomunidad, cantidad, no abusividad y lo delegado en el procurador."}
      - {norma: "LEC", articulo: "551", apartado: "3", tipo: "regula", nota: "El LAJ dicta decreto ese día o el hábil siguiente: medidas ejecutivas, embargo, averiguación y requerimiento de pago."}
      - {norma: "LEC", articulo: "551", apartado: "4", tipo: "regula", nota: "Contra el auto de despacho no cabe recurso, solo oposición; se advierte que la abusividad no discutida precluye."}
      - {norma: "LEC", articulo: "551", apartado: "5", tipo: "conexa", nota: "Contra el decreto del LAJ, revisión sin efecto suspensivo."}
      - {norma: "LEC", articulo: "552", apartado: "1", tipo: "regula", nota: "Denegación por auto; examen de oficio de cláusulas abusivas en títulos del 557.1, con audiencia de quince días."}
      - {norma: "LEC", articulo: "552", apartado: "2", tipo: "regula", nota: "El auto que deniega es apelable directamente, solo con el acreedor; este puede intentar antes reposición."}
      - {norma: "LEC", articulo: "552", apartado: "3", tipo: "conexa", nota: "Firme la denegación, solo queda el declarativo, si no lo impide la cosa juzgada."}
      - {norma: "LEC", articulo: "553", tipo: "regula", nota: "Auto, decreto y demanda se notifican al ejecutado sin citación ni emplazamiento; puede personarse cuando quiera."}
      - {norma: "LEC", articulo: "554", apartado: "1", tipo: "conexa", nota: "Sin requerimiento de pago, la averiguación de bienes se practica de inmediato, sin oír al ejecutado."}
      - {norma: "LEC", articulo: "545", apartado: "1", tipo: "regula", nota: "Títulos judiciales: competente el tribunal de la primera instancia o el que homologó la transacción o acuerdo."}
      - {norma: "LEC", articulo: "545", apartado: "3", tipo: "regula", nota: "Otros títulos: fueros de los arts. 50 y 51, lugar de cumplimiento o de bienes embargables; sin sumisión."}
      - {norma: "LEC", articulo: "546", apartado: "1", tipo: "conexa", nota: "Antes de despachar se examina de oficio la competencia territorial; despachada, ya no de oficio (546.2)."}
      - {norma: "LEC", articulo: "547", tipo: "conexa", nota: "Declinatoria del ejecutado: cinco días desde la primera notificación; se tramita por el art. 65."}
      - {norma: "LEC", articulo: "580", tipo: "conexa", nota: "Títulos judiciales, arbitrales o de mediación: se embarga sin requerir antes de pago."}
      - {norma: "LEC", articulo: "581", apartado: "1", tipo: "conexa", nota: "Títulos no judiciales: tras el despacho se requiere de pago; si no paga, embargo."}
      - {norma: "LEC", articulo: "581", apartado: "2", tipo: "conexa", nota: "No hay requerimiento si se acompaña acta notarial de requerimiento hecho con diez días de antelación."}
      - {norma: "LEC", articulo: "816", apartado: "1", tipo: "conexa", nota: "Decreto que cierra el monitorio sin oposición: ejecución por mera solicitud, sin la espera del 548."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "3", tipo: "conexa", nota: "La demanda ejecutiva no exige MASC previo."}
    no_consta_en_norma:
      - "Cómputo de los veinte días del 548 (días hábiles, plazo procesal): criterio jurisprudencial."
      - "Si la espera del 548 alcanza a acuerdos MASC distintos de la mediación elevados a escritura: no lo resuelve el texto."
    fuera_de_la_herramienta:
      - "Texto refundido de la Ley Concursal (consulta al Registro Público Concursal del 551.1 y 568): no está en la herramienta."
    afines: ["Títulos ejecutivos", "Requerimiento de pago", "Averiguación patrimonial", "Oposición por defectos procesales", "Declinatoria", "Control de oficio de cláusulas abusivas en el proceso", "Competencia territorial y fueros imperativos"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Oposición a la ejecución por motivos de fondo"
    sinonimos: ["oposición a la ejecución", "oposición por pago", "pluspetición", "oposición por cláusulas abusivas", "compensación en la ejecución", "prescripción en la ejecución", "quita o espera", "vista de oposición"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "556", apartado: "1", tipo: "regula", nota: "Título judicial, laudo o mediación: diez días desde el auto; solo pago o cumplimiento justificado documentalmente."}
      - {norma: "LEC", articulo: "556", apartado: "1, párrafo 2.º", tipo: "regula", nota: "También caducidad de la acción ejecutiva y pactos o transacciones para evitar la ejecución, en documento público."}
      - {norma: "LEC", articulo: "556", apartado: "2", tipo: "regula", nota: "Esa oposición no suspende el curso de la ejecución."}
      - {norma: "LEC", articulo: "556", apartado: "3", tipo: "conexa", nota: "Auto de cuantía máxima del seguro del automóvil: suspende; además, culpa de la víctima, fuerza mayor o concurrencia."}
      - {norma: "LEC", articulo: "557", apartado: "1", tipo: "regula", nota: "Títulos no judiciales: pago, compensación, pluspetición, prescripción, caducidad, quita, espera, transacción, abusividad."}
      - {norma: "LEC", articulo: "557", apartado: "2", tipo: "regula", nota: "Esta oposición suspende la ejecución por diligencia del LAJ."}
      - {norma: "LEC", articulo: "558", apartado: "1", tipo: "regula", nota: "Pluspetición sola: no suspende salvo que se consigne lo que se reconoce; el exceso del remate queda retenido."}
      - {norma: "LEC", articulo: "558", apartado: "2", tipo: "conexa", nota: "Saldos de cuenta e intereses variables: el LAJ puede nombrar perito, a instancia del ejecutado."}
      - {norma: "LEC", articulo: "560", tipo: "regula", nota: "Impugnación en cinco días; vista si se pide y hace falta; si el ejecutado no comparece, se le tiene por desistido."}
      - {norma: "LEC", articulo: "561", apartado: "1.1.ª", tipo: "regula", nota: "Desestimada la oposición, sigue la ejecución (o por lo que proceda si hay pluspetición) y costas al ejecutado."}
      - {norma: "LEC", articulo: "561", apartado: "1.2.ª", tipo: "regula", nota: "Estimado un motivo de los arts. 556 o 557, o la pluspetición entera: no procede la ejecución."}
      - {norma: "LEC", articulo: "561", apartado: "2", tipo: "regula", nota: "Cláusula abusiva: improcedencia o ejecución sin ella; firme el auto, la abusividad tiene fuerza de cosa juzgada."}
      - {norma: "LEC", articulo: "561", apartado: "3", tipo: "conexa", nota: "Estimada, se alzan embargos, se reintegra al ejecutado (533 y 534) y se imponen las costas al ejecutante."}
      - {norma: "LEC", articulo: "561", apartado: "4", tipo: "regula", nota: "Apelación; si desestima, no suspende; si estima, cabe mantener embargos prestando caución."}
      - {norma: "LEC", articulo: "564", tipo: "regula", nota: "Hechos posteriores no previstos como causa de oposición: se hacen valer en el proceso que corresponda."}
      - {norma: "LEC", articulo: "541", apartado: "2", tipo: "conexa", nota: "El cónyuge notificado puede oponer además que los gananciales no responden; la prueba incumbe al acreedor."}
      - {norma: "LEC", articulo: "551", apartado: "4", tipo: "conexa", nota: "Si el auto de despacho examinó la abusividad, el deudor debe oponerse en plazo o no podrá discutirla después."}
      - {norma: "LO 1/2025", articulo: "13", apartado: "1", tipo: "conexa", nota: "Contra el acuerdo MASC, solo la acción de nulidad contractual, sin perjuicio de la oposición en la ejecución."}
    no_consta_en_norma:
      - "Pago o cumplimiento sin prueba documental frente a título judicial: el 556.1 lo excluye; sus límites, criterio jurisprudencial."
      - "Si el 557 alcanza a los acuerdos MASC elevados a escritura (517.2.2.º): no lo resuelve el texto."
      - "Prescripción de la acción de título extrajudicial: plazo según la obligación (1964 CC u otro), criterio jurisprudencial."
    afines: ["Oposición por defectos procesales", "Títulos ejecutivos", "Caducidad de la acción ejecutiva", "Prescripción (como excepción)", "Cláusulas abusivas: concepto, nulidad e integración", "Suspensión de la ejecución", "Compensación y nulidad alegadas por el demandado"]
