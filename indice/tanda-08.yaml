  - voz: "Oposición por defectos procesales"
    sinonimos: ["oposición procesal a la ejecución", "falta de carácter o representación del ejecutado", "nulidad del despacho", "título sin requisitos", "defectos subsanables en la ejecución", "infracción en actos de ejecución", "sucesión en la ejecución"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "559", apartado: "1.1.º", tipo: "regula", nota: "Carecer el ejecutado del carácter o representación con que se le demanda."}
      - {norma: "LEC", articulo: "559", apartado: "1.2.º", tipo: "regula", nota: "Falta de capacidad o representación del ejecutante, o no acreditar el carácter o representación con que demanda."}
      - {norma: "LEC", articulo: "559", apartado: "1.3.º", tipo: "regula", nota: "Nulidad radical: sentencia o laudo sin condena, título sin requisitos para ejecutarse o infracción del art. 520."}
      - {norma: "LEC", articulo: "559", apartado: "1.4.º", tipo: "regula", nota: "Laudo no protocolizado notarialmente: falta de autenticidad."}
      - {norma: "LEC", articulo: "559", apartado: "2", tipo: "regula", nota: "Alegaciones del ejecutante en cinco días; defecto subsanable: diez días; si no, auto que deja sin efecto la ejecución."}
      - {norma: "LEC", articulo: "559", apartado: "2, párrafo 2.º", tipo: "regula", nota: "Costas al ejecutante si se estima; si no hay defecto, auto que manda seguir y costas al ejecutado."}
      - {norma: "LEC", articulo: "560", tipo: "conexa", nota: "Los motivos de fondo se tramitan después de resolver los procesales."}
      - {norma: "LEC", articulo: "556", apartado: "1", tipo: "conexa", nota: "Plazo de diez días desde la notificación del auto de despacho para oponerse por escrito."}
      - {norma: "LEC", articulo: "547", tipo: "regula", nota: "La competencia se impugna por declinatoria, en cinco días desde la primera notificación (art. 65)."}
      - {norma: "LEC", articulo: "546", apartado: "2", tipo: "conexa", nota: "Despachada la ejecución, el tribunal ya no revisa de oficio su competencia territorial."}
      - {norma: "LEC", articulo: "538", apartado: "2", tipo: "conexa", nota: "Solo cabe ejecutar frente al deudor del título, el responsable legal o fiador con documento público y el dueño de bienes afectos."}
      - {norma: "LEC", articulo: "540", apartado: "2", tipo: "conexa", nota: "Sucesión del ejecutante o ejecutado: documentos fehacientes; si faltan, audiencia de quince días (540.3)."}
      - {norma: "LEC", articulo: "544", tipo: "conexa", nota: "Ejecución frente a socios o gestores de entidades sin personalidad; no se aplica a las comunidades de propietarios."}
      - {norma: "LEC", articulo: "562", apartado: "1", tipo: "regula", nota: "Infracción en actos concretos de ejecución: reposición, apelación si se prevé o escrito al tribunal."}
      - {norma: "LEC", articulo: "562", apartado: "2", tipo: "conexa", nota: "Si la infracción entraña nulidad de actuaciones, se aplican los arts. 225 y siguientes."}
      - {norma: "LEC", articulo: "563", apartado: "1", tipo: "regula", nota: "Actos contrarios al título judicial: reposición y apelación; si son del LAJ, reposición, revisión y apelación."}
      - {norma: "LEC", articulo: "563", apartado: "2", tipo: "conexa", nota: "Quien recurre puede pedir suspender la actividad impugnada prestando caución."}
      - {norma: "LEC", articulo: "545", apartado: "5.2.º", tipo: "conexa", nota: "La oposición a la ejecución definitiva, procesal o de fondo, se resuelve por auto."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "3", tipo: "conexa", nota: "La demanda ejecutiva no exige MASC previo: su falta no es defecto procesal de la ejecución."}
    no_consta_en_norma:
      - "Plazo de la oposición procesal: el 559 no lo fija; se toma el de diez días de los arts. 556 y 557, criterio jurisprudencial."
      - "Si en la oposición del 559 cabe denunciar la falta de competencia objetiva o de jurisdicción: criterio jurisprudencial."
    afines: ["Oposición a la ejecución por motivos de fondo", "Declinatoria", "Impugnación de actos de ejecución contrarios a la ley", "Falta de legitimación", "Falta de capacidad para ser parte / procesal", "Nulidad de actuaciones", "Títulos ejecutivos"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Caducidad de la acción ejecutiva"
    sinonimos: ["plazo para ejecutar la sentencia", "cinco años para ejecutar", "caducidad de la ejecución", "prescripción de la acción ejecutiva", "ejecución paralizada", "demanda ejecutiva fuera de plazo"]
    normas_base: ["LEC", "CC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "518", tipo: "regula", nota: "Sentencia, transacción o acuerdo aprobados, laudo o acuerdo de mediación: caduca a los cinco años desde la firmeza."}
      - {norma: "LEC", articulo: "556", apartado: "1, párrafo 2.º", tipo: "regula", nota: "La caducidad de la acción ejecutiva se opone en los diez días de oposición."}
      - {norma: "LEC", articulo: "557", apartado: "1.4.ª", tipo: "regula", nota: "Títulos no judiciales: prescripción y caducidad como causa de oposición, según su régimen sustantivo."}
      - {norma: "LEC", articulo: "239", tipo: "regula", nota: "No hay caducidad de la instancia en la ejecución: puede proseguirse aunque haya estado parada."}
      - {norma: "LEC", articulo: "570", tipo: "conexa", nota: "La ejecución solo termina con la completa satisfacción del acreedor, por decreto del LAJ."}
      - {norma: "LEC", articulo: "548", tipo: "conexa", nota: "Los veinte días de espera también corren desde la firmeza o la notificación."}
      - {norma: "CC", articulo: "1971", tipo: "regula", nota: "La prescripción de la acción para exigir lo declarado por sentencia corre desde que esta quedó firme."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "conexa", nota: "Acciones personales sin plazo especial: cinco años desde que puede exigirse el cumplimiento."}
      - {norma: "LO 1/2025", articulo: "7", apartado: "1", tipo: "conexa", nota: "La solicitud de MASC suspende la caducidad; si se aplica a la acción ejecutiva, no lo dice (ver no_consta)."}
      - {norma: "LEC", articulo: "565", apartado: "1, párrafo 2.º", tipo: "conexa", nota: "Iniciada la ejecución, acudir a mediación u otro MASC suspende su curso."}
    no_consta_en_norma:
      - "Si el plazo del 518 admite suspensión o interrupción (reclamación, MASC del art. 7 LO 1/2025): criterio jurisprudencial."
      - "Relación entre la caducidad del 518 LEC y la prescripción del 1971 CC: criterio jurisprudencial."
      - "Acuerdo de un MASC distinto de la mediación elevado a escritura: el 518 no lo nombra; qué plazo rige, no lo resuelve el texto."
      - "Condena a prestaciones periódicas o de futuro: desde cuándo corren los cinco años de cada vencimiento, criterio jurisprudencial."
    afines: ["Títulos ejecutivos", "Oposición a la ejecución por motivos de fondo", "Caducidad de la acción (como excepción)", "Prescripción (como excepción)", "Caducidad de la instancia"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Ejecución provisional y su oposición"
    sinonimos: ["ejecución provisional de sentencia", "ejecutar sentencia recurrida", "sentencia no firme", "oposición a la ejecución provisional", "revocación de la sentencia ejecutada", "caución en la ejecución provisional"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "524", apartado: "1", tipo: "regula", nota: "Se insta por demanda o simple solicitud, conforme al art. 549."}
      - {norma: "LEC", articulo: "524", apartado: "2", tipo: "regula", nota: "Se despacha y sigue como la ordinaria, ante el tribunal de la primera instancia."}
      - {norma: "LEC", articulo: "524", apartado: "4", tipo: "conexa", nota: "Sentencias que dan acceso al Registro: solo anotación preventiva mientras no sean firmes."}
      - {norma: "LEC", articulo: "525", apartado: "1", tipo: "regula", nota: "No ejecutables: filiación, matrimonio, capacidad y estado civil (salvo lo patrimonial), declaración de voluntad, propiedad industrial."}
      - {norma: "LEC", articulo: "525", apartado: "3", tipo: "conexa", nota: "Tampoco las indemnizaciones por vulneración del honor, la intimidad o la propia imagen."}
      - {norma: "LEC", articulo: "526", tipo: "regula", nota: "Quien obtiene condena en primera instancia puede pedirla sin prestar caución."}
      - {norma: "LEC", articulo: "527", apartado: "1", tipo: "regula", nota: "Desde que se tiene por interpuesta la apelación (o la adhesión del apelado) y antes de la sentencia de apelación."}
      - {norma: "LEC", articulo: "527", apartado: "3", tipo: "regula", nota: "Se despacha salvo sentencia del art. 525 o sin condena a favor del solicitante."}
      - {norma: "LEC", articulo: "527", apartado: "4", tipo: "regula", nota: "El auto que la deniega es apelable con preferencia; el que la despacha no tiene recurso, solo oposición."}
      - {norma: "LEC", articulo: "527", apartado: "5", tipo: "regula", nota: "Las costas de la ejecución provisional no son del ejecutado si cumple en veinte días desde la notificación."}
      - {norma: "LEC", articulo: "528", apartado: "2", tipo: "regula", nota: "Causas: infracción del art. 527 y, en condena no dineraria, imposibilidad de restaurar o compensar si se revoca."}
      - {norma: "LEC", articulo: "528", apartado: "3", tipo: "regula", nota: "Condena dineraria: solo oposición a actuaciones concretas, proponiendo alternativas y ofreciendo caución."}
      - {norma: "LEC", articulo: "528", apartado: "4", tipo: "regula", nota: "También pago o cumplimiento documentado y pactos o transacciones documentados en el proceso."}
      - {norma: "LEC", articulo: "529", apartado: "1", tipo: "regula", nota: "Escrito de oposición en cinco días desde la notificación del despacho o de la actuación concreta."}
      - {norma: "LEC", articulo: "529", apartado: "3", tipo: "conexa", nota: "En condena no dineraria, el ejecutante puede ofrecer caución para restaurar o resarcir si se revoca."}
      - {norma: "LEC", articulo: "530", apartado: "4", tipo: "regula", nota: "Contra el auto que resuelve la oposición no cabe recurso."}
      - {norma: "LEC", articulo: "531", tipo: "regula", nota: "Condena dineraria: el LAJ la suspende si el ejecutado consigna principal, intereses y costas."}
      - {norma: "LEC", articulo: "533", apartado: "1", tipo: "regula", nota: "Revocación total de condena dineraria: se sobresee y el ejecutante devuelve, reintegra costas e indemniza."}
      - {norma: "LEC", articulo: "533", apartado: "2", tipo: "regula", nota: "Revocación parcial: se devuelve la diferencia con el interés legal anual desde la percepción."}
      - {norma: "LEC", articulo: "534", apartado: "1", tipo: "conexa", nota: "Condena a entregar un bien revocada: se restituye con rentas y frutos o se indemniza si no es posible."}
      - {norma: "LEC", articulo: "535", apartado: "2", tipo: "conexa", nota: "Sentencia de segunda instancia: desde que se tiene por interpuesta la casación, ante el tribunal de la primera."}
    no_consta_en_norma:
      - "Ejecución provisional del pronunciamiento de costas de una sentencia no firme: criterio jurisprudencial."
      - "Ejecución provisional de la condena al desalojo en el desahucio: el 525 no la excluye; su alcance, criterio jurisprudencial."
    afines: ["Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Títulos ejecutivos", "Despacho de la ejecución y plazo de espera", "Caución", "Intereses de la mora procesal"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Embargo e inembargabilidad"
    sinonimos: ["embargo de bienes", "traba", "bienes inembargables", "orden de embargo", "suficiencia del embargo", "nulidad del embargo", "consignación para evitar el embargo", "embargo de bienes gananciales", "reembargo"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "CC", articulo: "1911", tipo: "regula", nota: "El deudor responde del cumplimiento con todos sus bienes, presentes y futuros."}
      - {norma: "LEC", articulo: "584", tipo: "regula", nota: "No se embargan bienes de valor previsible superior a lo despachado, salvo que no haya otros y sea necesario."}
      - {norma: "LEC", articulo: "585", tipo: "regula", nota: "Consignar lo despachado suspende el embargo; después, consignar antes de resolverse la oposición lo alza."}
      - {norma: "LEC", articulo: "587", apartado: "1", tipo: "regula", nota: "El embargo existe desde que lo decreta el LAJ o se reseña el bien en el acta, aunque falten garantía y publicidad."}
      - {norma: "LEC", articulo: "588", apartado: "1", tipo: "regula", nota: "Es nulo el embargo de bienes y derechos cuya efectiva existencia no conste."}
      - {norma: "LEC", articulo: "588", apartado: "2", tipo: "conexa", nota: "Saldos bancarios: embargables con un límite máximo fijado por el LAJ; del exceso dispone el ejecutado."}
      - {norma: "LEC", articulo: "588", apartado: "3", tipo: "conexa", nota: "Cuentas con varios titulares: solo la parte del deudor, a partes iguales salvo prueba de otra titularidad material."}
      - {norma: "LEC", articulo: "592", apartado: "1", tipo: "regula", nota: "Sin pacto, se embarga atendiendo a la mayor facilidad de enajenación y la menor onerosidad para el ejecutado."}
      - {norma: "LEC", articulo: "592", apartado: "2", tipo: "regula", nota: "Orden supletorio: dinero, créditos a corto, joyas, rentas, frutos, muebles, inmuebles, sueldos y créditos a largo."}
      - {norma: "LEC", articulo: "593", apartado: "1", tipo: "regula", nota: "La pertenencia al ejecutado se juzga por indicios y signos externos, sin investigaciones."}
      - {norma: "LEC", articulo: "593", apartado: "3", tipo: "conexa", nota: "Bienes registrables: se embargan salvo certificación de titularidad registral del tercero; vivienda familiar, regla propia."}
      - {norma: "LEC", articulo: "605", tipo: "regula", nota: "Absolutamente inembargables: animales de compañía, bienes inalienables, accesorios, sin valor patrimonial y los de ley."}
      - {norma: "LEC", articulo: "606", apartado: "1.º", tipo: "regula", nota: "Mobiliario, menaje y ropa no superfluos, y lo imprescindible para la subsistencia digna del ejecutado y los suyos."}
      - {norma: "LEC", articulo: "606", apartado: "2.º", tipo: "regula", nota: "Libros e instrumentos de la profesión, cuando su valor no guarde proporción con la deuda."}
      - {norma: "LEC", articulo: "606", apartado: "4.º", tipo: "conexa", nota: "Cantidades declaradas inembargables por ley (y, en el 5.º, por tratados)."}
      - {norma: "LEC", articulo: "607", apartado: "1", tipo: "conexa", nota: "Sueldo o pensión hasta el salario mínimo interprofesional: inembargable."}
      - {norma: "LEC", articulo: "609", tipo: "regula", nota: "El embargo de inembargables es nulo de pleno derecho; se denuncia por recurso o comparecencia ante el LAJ."}
      - {norma: "LEC", articulo: "610", apartado: "1", tipo: "conexa", nota: "Cabe reembargo: el reembargante cobra lo que sobre tras los embargantes anteriores."}
      - {norma: "LEC", articulo: "612", apartado: "1", tipo: "conexa", nota: "Mejora o modificación a petición del ejecutante; reducción a petición del ejecutado, con el criterio del 584."}
      - {norma: "LEC", articulo: "613", apartado: "1", tipo: "conexa", nota: "El embargo da derecho a cobrar del producto de la realización la deuda, los intereses y las costas."}
      - {norma: "LEC", articulo: "541", apartado: "3", tipo: "conexa", nota: "Deuda propia de un cónyuge y bienes comunes: embargo notificado al otro, que puede pedir la disolución."}
    no_consta_en_norma:
      - "Qué bienes son superfluos o imprescindibles (606.1.º): lo aprecia el tribunal caso por caso; criterio jurisprudencial."
      - "Embargo de la vivienda habitual por deudas de escasa cuantía (proporcionalidad, 584): criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "Leyes especiales de inembargabilidad (prestaciones públicas, Seguridad Social): a ellas remiten los arts. 605.4.º y 606.4.º."
      - "Ley y Reglamento Hipotecarios (anotación preventiva de embargo y su rango): no están en la herramienta."
    afines: ["Embargo de sueldos y pensiones", "Tercería de dominio", "Orden de embargo, mejora y reducción", "Embargo de cuentas y saldos", "Averiguación patrimonial", "Ejecución frente a herederos y frente al cónyuge"]
    # VIGENCIA: CC 1911 figura en contraste_conocidas.json (rótulo «Arts. 1912 a 1920 derogados» pegado al cuerpo): sin cambio de fondo.
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Embargo de sueldos y pensiones"
    sinonimos: ["embargo de nómina", "embargo de salario", "embargo de pensión", "escala del 607", "salario mínimo inembargable", "retención de nómina", "embargo por alimentos", "cuenta nómina"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "607", apartado: "1", tipo: "regula", nota: "Es inembargable el sueldo, pensión o retribución que no exceda del salario mínimo interprofesional."}
      - {norma: "LEC", articulo: "607", apartado: "2", tipo: "regula", nota: "Sobre el SMI: 30 % hasta 2 SMI, 50 % hasta 3, 60 % hasta 4, 75 % hasta 5 y 90 % en lo que exceda."}
      - {norma: "LEC", articulo: "607", apartado: "3", tipo: "regula", nota: "Se acumulan todas las percepciones, y las de los cónyuges salvo separación de bienes acreditada al LAJ."}
      - {norma: "LEC", articulo: "607", apartado: "4", tipo: "regula", nota: "Por cargas familiares, el LAJ puede rebajar de un 10 a un 15 % los porcentajes de los tramos 1.º a 4.º."}
      - {norma: "LEC", articulo: "607", apartado: "5", tipo: "regula", nota: "La base es el líquido percibido, tras los descuentos fiscales y de Seguridad Social."}
      - {norma: "LEC", articulo: "607", apartado: "6", tipo: "regula", nota: "La escala se aplica también a ingresos de actividades profesionales y mercantiles autónomas."}
      - {norma: "LEC", articulo: "607", apartado: "7", tipo: "conexa", nota: "Lo retenido puede entregarse directamente al ejecutante, con informe trimestral de pagador y ejecutante al LAJ."}
      - {norma: "LEC", articulo: "608", tipo: "regula", nota: "Alimentos legales: no rige el 607 y el tribunal fija lo embargable; pensión compensatoria, si se pide y se acredita necesidad."}
      - {norma: "LEC", articulo: "588", apartado: "4", tipo: "regula", nota: "Cuenta donde se cobra el sueldo: los límites se aplican a lo ingresado como sueldo en el mes del embargo o el anterior."}
      - {norma: "LEC", articulo: "621", apartado: "3", tipo: "conexa", nota: "Orden al pagador de retener y transferir a la Cuenta de Consignaciones, salvo entrega directa del 607.7."}
      - {norma: "LEC", articulo: "592", apartado: "2", tipo: "conexa", nota: "En el orden supletorio, sueldos y pensiones van en octavo lugar, tras los inmuebles."}
      - {norma: "LEC", articulo: "609", tipo: "conexa", nota: "Embargar la parte inembargable es nulo de pleno derecho."}
    no_consta_en_norma:
      - "Pagas extraordinarias: si se suman al mes en que se cobran o se prorratean para aplicar la escala: criterio jurisprudencial."
      - "Si la rebaja del 607.4 alcanza al tramo del 90 % (5.º): el texto la limita a los tramos 1.º a 4.º; su aplicación, criterio judicial."
    fuera_de_la_herramienta:
      - "Real decreto anual del salario mínimo interprofesional: fija la cuantía a la que remite el art. 607.1."
      - "Inembargabilidad de prestaciones públicas (ingreso mínimo vital y otras): régimen de sus leyes propias."
    afines: ["Embargo e inembargabilidad", "Embargo de cuentas y saldos", "Pensión de alimentos a los hijos", "Pensión compensatoria", "Ejecución de medidas de familia"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Tercería de dominio"
    sinonimos: ["tercería", "tercerista", "alzamiento del embargo", "embargo de bien ajeno", "bien embargado de un tercero", "principio de prueba por escrito"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "595", apartado: "1", tipo: "regula", nota: "La interpone, por demanda, quien no es parte y afirma ser dueño del bien embargado, no adquirido tras la traba."}
      - {norma: "LEC", articulo: "595", apartado: "2", tipo: "regula", nota: "También los titulares de derechos que por ley expresa pueden oponerse al embargo o a la realización."}
      - {norma: "LEC", articulo: "595", apartado: "3", tipo: "regula", nota: "Hay que aportar con la demanda un principio de prueba por escrito."}
      - {norma: "LEC", articulo: "596", apartado: "1", tipo: "regula", nota: "Cabe desde que se embarga el bien, aunque el embargo sea preventivo."}
      - {norma: "LEC", articulo: "596", apartado: "2", tipo: "regula", nota: "Rechazo de plano sin principio de prueba o si se presenta después de transmitirse el bien según la ley civil."}
      - {norma: "LEC", articulo: "597", tipo: "regula", nota: "No cabe segunda tercería sobre los mismos bienes con títulos que ya se tenían al formular la primera."}
      - {norma: "LEC", articulo: "598", apartado: "1", tipo: "regula", nota: "Admitida, solo suspende la ejecución respecto del bien al que se refiere."}
      - {norma: "LEC", articulo: "598", apartado: "2", tipo: "regula", nota: "El tribunal puede condicionar la suspensión a que el tercerista preste caución."}
      - {norma: "LEC", articulo: "598", apartado: "3", tipo: "conexa", nota: "Admitir la tercería basta para pedir la mejora del embargo."}
      - {norma: "LEC", articulo: "599", tipo: "regula", nota: "Se presenta ante el LAJ de la ejecución, la resuelve el tribunal que despachó y se tramita como juicio verbal."}
      - {norma: "LEC", articulo: "600", tipo: "regula", nota: "Se demanda al ejecutante y al ejecutado si este designó el bien; si no, puede intervenir."}
      - {norma: "LEC", articulo: "601", apartado: "1", tipo: "regula", nota: "El tercerista solo puede pedir el alzamiento del embargo."}
      - {norma: "LEC", articulo: "602", tipo: "regula", nota: "Si los demandados no contestan, se entiende que admiten los hechos de la demanda."}
      - {norma: "LEC", articulo: "603", tipo: "regula", nota: "Se resuelve por auto sobre la pertenencia del bien a efectos de esa ejecución, sin cosa juzgada sobre la titularidad."}
      - {norma: "LEC", articulo: "603", apartado: "párrafo 2.º", tipo: "conexa", nota: "Costas según el art. 394; al demandado que no contesta, solo si hay mala fe razonada."}
      - {norma: "LEC", articulo: "604", tipo: "regula", nota: "Estimada, se alza la traba, se remueve el depósito y se cancelan la anotación y demás garantías."}
      - {norma: "LEC", articulo: "593", apartado: "2", tipo: "conexa", nota: "Si el bien puede ser de un tercero, se le avisa; tiene cinco días para oponerse antes de la traba."}
      - {norma: "LEC", articulo: "593", apartado: "3", tipo: "conexa", nota: "Bien registrable: se embarga salvo que el tercero acredite ser titular registral."}
      - {norma: "LEC", articulo: "594", apartado: "1", tipo: "conexa", nota: "El embargo de bien ajeno es eficaz; sin tercería, el dueño no impugna la adquisición irreivindicable del rematante."}
    no_consta_en_norma:
      - "Momento de la transmisión que cierra la tercería (596.2): aprobación del remate, decreto de adjudicación o inscripción; jurisprudencial."
      - "Comprador con documento privado no inscrito frente a embargo anotado: criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley Hipotecaria (fe pública registral y prioridad de la anotación de embargo): no está en la herramienta."
    afines: ["Embargo e inembargabilidad", "Tercería de mejor derecho", "Acción reivindicatoria y declarativa de dominio", "Ejecución frente a herederos y frente al cónyuge", "Caución"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Intereses de la mora procesal"
    sinonimos: ["interés procesal", "interés legal más dos puntos", "intereses del 576", "mora procesal", "intereses de la sentencia", "interés de demora procesal"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "576", apartado: "1", tipo: "regula", nota: "Desde la sentencia de primera instancia que condena a cantidad líquida: interés legal más dos puntos, salvo pacto o ley."}
      - {norma: "LEC", articulo: "576", apartado: "2", tipo: "regula", nota: "Revocación parcial: el tribunal resuelve sobre estos intereses según su prudente arbitrio, razonándolo."}
      - {norma: "LEC", articulo: "576", apartado: "3", tipo: "regula", nota: "Se aplica a resoluciones de cualquier orden, laudos y acuerdos de mediación, salvo especialidades de Haciendas."}
      - {norma: "LEC", articulo: "816", apartado: "2, párrafo 2.º", tipo: "regula", nota: "Monitorio: el interés del 576 corre desde el auto que despacha ejecución."}
      - {norma: "LEC", articulo: "575", apartado: "1", tipo: "conexa", nota: "Se despacha además una cantidad provisional para intereses y costas, de hasta el 30 % de lo reclamado."}
      - {norma: "LEC", articulo: "572", apartado: "1", tipo: "conexa", nota: "Para despachar no hace falta que sean líquidos los intereses que se devenguen durante la ejecución."}
      - {norma: "LEC", articulo: "577", apartado: "1", tipo: "conexa", nota: "Deuda en moneda extranjera: los intereses de demora procesal se pagan en moneda nacional."}
      - {norma: "LEC", articulo: "533", apartado: "2", tipo: "conexa", nota: "Ejecución provisional revocada en parte: se devuelve la diferencia con el interés legal."}
      - {norma: "LEC", articulo: "583", apartado: "3", tipo: "conexa", nota: "Satisfechos intereses y costas, el LAJ da por terminada la ejecución."}
      - {norma: "CC", articulo: "1108", tipo: "conexa", nota: "Mora en deuda de dinero: intereses pactados o, en su defecto, el interés legal."}
      - {norma: "CC", articulo: "1109", tipo: "conexa", nota: "Los intereses vencidos devengan interés legal desde que se reclaman judicialmente."}
      - {norma: "CC", articulo: "1100", tipo: "conexa", nota: "La mora sustantiva empieza con la exigencia judicial o extrajudicial, salvo sus excepciones."}
    no_consta_en_norma:
      - "Concurrencia del interés del 576 con el moratorio pactado o con el especial de las aseguradoras: criterio jurisprudencial."
      - "Condena ilíquida que se liquida después: desde cuándo corre el 576, criterio jurisprudencial."
      - "Si el 576.3 alcanza a acuerdos MASC elevados a escritura: solo nombra la mediación; no lo resuelve el texto."
    fuera_de_la_herramienta:
      - "Ley de Presupuestos Generales de cada año: fija el interés legal del dinero."
      - "Ley de Contrato de Seguro, art. 20 (interés especial de la aseguradora): no está en la herramienta."
    afines: ["Mora del deudor e intereses moratorios", "Liquidación de intereses y tasación de costas en la ejecución", "Ejecución provisional y su oposición", "Préstamo e intereses"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Lanzamiento"
    sinonimos: ["lanzamiento", "desalojo", "fecha del lanzamiento", "diligencia de lanzamiento", "suspensión del lanzamiento", "entrega de la posesión", "ocupantes del inmueble", "vulnerabilidad en el lanzamiento"]
    normas_base: ["LEC", "CE"]
    remisiones:
      - {norma: "LEC", articulo: "549", apartado: "3", tipo: "regula", nota: "Desahucio: pedir la ejecución en la demanda basta para lanzar en el día y hora ya señalados, sin más trámite."}
      - {norma: "LEC", articulo: "549", apartado: "4", tipo: "regula", nota: "Desahucio por impago o expiración: sin espera del 548; en vivienda habitual, antes, lo del art. 441.5 a 7."}
      - {norma: "LEC", articulo: "438", apartado: "5, párrafo 3.º", tipo: "regula", nota: "El requerimiento del desahucio por impago fija día y hora exactos del lanzamiento si no hay oposición."}
      - {norma: "LEC", articulo: "438", apartado: "5, párrafo 5.º", tipo: "regula", nota: "Si no paga, no desaloja ni se opone: decreto que termina el juicio y lanzamiento en la fecha fijada."}
      - {norma: "LEC", articulo: "438", apartado: "6", tipo: "regula", nota: "Con oposición, lanzamiento antes de treinta días desde la vista; toda resolución que lo señale fija día y hora exactos."}
      - {norma: "LEC", articulo: "447", apartado: "1, párrafo 2.º", tipo: "conexa", nota: "Allanamiento con compromiso de desalojo: lanzamiento subsidiario dentro de los quince días siguientes al plazo."}
      - {norma: "LEC", articulo: "21", apartado: "3", tipo: "conexa", nota: "Transacción de desalojo incumplida: lanzamiento sin más trámite ni notificación."}
      - {norma: "LEC", articulo: "441", apartado: "5", tipo: "regula", nota: "Vivienda habitual: aviso a servicios sociales; si hay vulnerabilidad, traslado y posible suspensión de vista o lanzamiento."}
      - {norma: "LEC", articulo: "441", apartado: "6", tipo: "regula", nota: "Suspensión por auto: hasta dos meses si el actor es persona física, cuatro si es jurídica."}
      - {norma: "LEC", articulo: "441", apartado: "7", tipo: "conexa", nota: "Ponderación y criterios de vulnerabilidad económica (30 % de ingresos, límites IPREM) y social."}
      - {norma: "LEC", articulo: "150", apartado: "4", tipo: "regula", nota: "La resolución que fija el lanzamiento de una vivienda se comunica a los servicios sociales competentes."}
      - {norma: "LEC", articulo: "703", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Cosas ajenas al título: requerimiento para retirarlas; si no, se consideran abandonadas."}
      - {norma: "LEC", articulo: "703", apartado: "1, párrafo 3.º", tipo: "regula", nota: "Desahucio por impago o expiración: basta un funcionario gestor, que puede pedir el auxilio de la fuerza pública."}
      - {norma: "LEC", articulo: "703", apartado: "2", tipo: "conexa", nota: "Plantaciones o instalaciones no separables: su abono se pide en cinco días desde el desalojo."}
      - {norma: "LEC", articulo: "703", apartado: "3", tipo: "conexa", nota: "Desperfectos constatados: retención en depósito de bienes del responsable."}
      - {norma: "LEC", articulo: "703", apartado: "4", tipo: "conexa", nota: "Entrega anticipada de la posesión: decreto que da por ejecutada la sentencia y cancela la diligencia."}
      - {norma: "LEC", articulo: "704", apartado: "1", tipo: "regula", nota: "Vivienda habitual del ejecutado: un mes para desalojar, prorrogable otro; luego lanzamiento en día y hora exactos."}
      - {norma: "LEC", articulo: "704", apartado: "2", tipo: "regula", nota: "Terceros ocupantes: diez días para presentar títulos; lanzamiento de los de mero hecho por el cauce del 675."}
      - {norma: "LEC", articulo: "675", apartado: "2", tipo: "conexa", nota: "Inmueble subastado ocupado: lanzamiento a petición del adquirente, en el plazo de un año desde la adquisición."}
      - {norma: "LEC", articulo: "441", apartado: "1 bis", tipo: "conexa", nota: "Recuperación de vivienda ocupada: desalojo por auto si los ocupantes no justifican título en cinco días."}
      - {norma: "CE", articulo: "18", apartado: "2", tipo: "conexa", nota: "El domicilio es inviolable: sin consentimiento, solo se entra por resolución judicial."}
      - {norma: "CE", articulo: "47", tipo: "conexa", nota: "Derecho a una vivienda digna y adecuada; los poderes públicos promueven las condiciones para hacerlo efectivo."}
    no_consta_en_norma:
      - "Si el mes del 704.1 rige en el desahucio arrendaticio (el 549.4 solo excluye la espera del 548): criterio jurisprudencial."
      - "Suspensión del lanzamiento a petición del arrendatario sin vulnerabilidad acreditada: no la prevé el texto; criterio judicial."
    fuera_de_la_herramienta:
      - "RDL 29/2026, art. 2 (por convalidar): suspende hasta el 31-12-2030 procesos y lanzamientos de vulnerables sin alternativa."
      - "RDL 29/2026: nuevo art. 22.6 LEC (enervación a cargo de la Administración, lanzamiento suspendido dos meses). El espejo no lo trae."
      - "Ley 12/2023 por el derecho a la vivienda y normativa autonómica de servicios sociales: fuera de la herramienta."
    afines: ["Desahucio por falta de pago", "Desahucio por expiración del plazo", "Vulnerabilidad y gran tenedor en la demanda", "Ocupación ilegal de vivienda (desahucio exprés)", "Enervación del desahucio", "Inviolabilidad del domicilio en la ejecución y el lanzamiento", "Cargas anteriores y ocupantes del inmueble subastado"]
    vigilar:
      - {norma: "LEC", articulo: "22"}
    # VIGENCIA: arts. citados idénticos al texto vigente; LEC 22 distinto (RDL 29/2026): por eso «vigilar» y estado provisional.
    estado: "provisional"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"
