  - voz: "Dictamen pericial de parte y judicial"
    sinonimos: ["prueba pericial", "perito de parte", "perito judicial", "dictamen pericial", "designación judicial de perito", "provisión de fondos del perito", "ratificación del perito", "tacha de peritos", "recusación de peritos", "anuncio de dictamen"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "335", apartado: "1", tipo: "regula", nota: "Hacen falta conocimientos científicos, técnicos o prácticos: dictamen de parte o de perito judicial."}
      - {norma: "LEC", articulo: "335", apartado: "2", tipo: "regula", nota: "Todo perito jura o promete actuar con objetividad y conocer las sanciones penales."}
      - {norma: "LEC", articulo: "336", apartado: "1", tipo: "regula", nota: "El dictamen de parte se aporta con la demanda o con la contestación."}
      - {norma: "LEC", articulo: "336", apartado: "3", tipo: "regula", nota: "El actor solo puede no aportarlo si justifica que no podía esperar al dictamen para demandar."}
      - {norma: "LEC", articulo: "336", apartado: "4", tipo: "regula", nota: "El demandado debe justificar que no pudo pedirlo y obtenerlo en el plazo para contestar."}
      - {norma: "LEC", articulo: "337", apartado: "1", tipo: "regula", nota: "Anunciado: cinco días antes de la audiencia previa (ordinario) o treinta desde demanda o contestación (verbal)."}
      - {norma: "LEC", articulo: "337", apartado: "2", tipo: "regula", nota: "Aportado, las partes dicen si el perito debe ir al juicio o vista y para qué."}
      - {norma: "LEC", articulo: "338", apartado: "2", tipo: "regula", nota: "Dictamen motivado por la contestación o la audiencia previa: al menos cinco días antes del juicio o vista."}
      - {norma: "LEC", articulo: "339", apartado: "2", tipo: "regula", nota: "Perito judicial pedido en demanda o contestación, a costa de quien lo pide; se designa en cinco días."}
      - {norma: "LEC", articulo: "339", apartado: "3", tipo: "regula", nota: "Ordinario: perito judicial por lo alegado en la audiencia previa; verbal: pedido en la vista, que se interrumpe."}
      - {norma: "LEC", articulo: "340", apartado: "1", tipo: "regula", nota: "Título oficial de la materia, o persona entendida si no hay título oficial."}
      - {norma: "LEC", articulo: "341", apartado: "1", tipo: "regula", nota: "Designación judicial: listas de colegios; la primera por sorteo y luego por orden correlativo."}
      - {norma: "LEC", articulo: "342", apartado: "3", tipo: "regula", nota: "Provisión de fondos: si no se consigna en cinco días, el perito queda eximido y no se nombra otro."}
      - {norma: "LEC", articulo: "343", apartado: "1", tipo: "regula", nota: "Solo se recusa al perito judicial; al de parte se le tacha (parentesco, interés, dependencia, amistad…)."}
      - {norma: "LEC", articulo: "343", apartado: "2", tipo: "regula", nota: "Tachas: en el ordinario, las del perito de demanda o contestación, en la audiencia previa; nunca tras el juicio."}
      - {norma: "LEC", articulo: "344", apartado: "2", tipo: "regula", nota: "La tacha se valora con la prueba; tacha temeraria o desleal: multa de 60 a 600 euros."}
      - {norma: "LEC", articulo: "346", tipo: "regula", nota: "El perito judicial dictamina por escrito; va al juicio si lo piden las partes o lo acuerda el tribunal."}
      - {norma: "LEC", articulo: "347", apartado: "1", tipo: "regula", nota: "En el juicio: exposición, explicación, preguntas y objeciones, ampliación, crítica del perito contrario y tachas."}
      - {norma: "LEC", articulo: "347", apartado: "2", tipo: "regula", nota: "El tribunal puede preguntar, pero no ordenar de oficio que se amplíe el dictamen (salvo el art. 339.5)."}
      - {norma: "LEC", articulo: "348", tipo: "regula", nota: "Los dictámenes se valoran según las reglas de la sana crítica."}
      - {norma: "LEC", articulo: "339", apartado: "1", tipo: "conexa", nota: "Beneficiario de justicia gratuita: anuncia el dictamen y se designa perito judicial."}
      - {norma: "LEC", articulo: "339", apartado: "6", tipo: "conexa", nota: "Un solo perito titular por cada cuestión o conjunto de cuestiones."}
      - {norma: "LEC", articulo: "336", apartado: "5", tipo: "conexa", nota: "El demandado puede pedir examinar cosas y lugares o, en daños personales, que el actor sea reconocido."}
      - {norma: "LEC", articulo: "345", apartado: "1", tipo: "conexa", nota: "Las partes pueden presenciar las operaciones periciales si no estorban al perito."}
      - {norma: "LEC", articulo: "124", apartado: "3", tipo: "conexa", nota: "Causas de recusación del perito judicial, además de las de la LOPJ."}
      - {norma: "LEC", articulo: "427", apartado: "2", tipo: "conexa", nota: "Audiencia previa: los dictámenes presentados se admiten, contradicen o se pide su ampliación."}
      - {norma: "LEC", articulo: "429", apartado: "8", tipo: "conexa", nota: "Si nadie pide la presencia de los peritos y no hay más prueba: sentencia sin juicio."}
      - {norma: "LEC", articulo: "352", tipo: "conexa", nota: "Dictámenes instrumentales para entender o valorar otros medios de prueba (arts. 299.2 y 299.3)."}
    no_consta_en_norma:
      - "Valor del dictamen de parte impugnado cuyo autor no comparece a ratificarlo: jurisprudencial."
      - "Criterios de la sana crítica para preferir un dictamen a otro: jurisprudenciales."
    fuera_de_la_herramienta:
      - "Ley 1/1996, de asistencia jurídica gratuita: designación y pago del perito del beneficiario (art. 339.1 LEC)."
    afines: ["Recusación y tacha de peritos", "Documentos y pruebas posteriores (preclusión)", "Prueba anticipada y aseguramiento de la prueba", "Testigos y tachas", "Medios de reproducción, correos y mensajería (WhatsApp) como prueba"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Medios de reproducción, correos y mensajería (WhatsApp) como prueba"
    sinonimos: ["WhatsApp como prueba", "capturas de pantalla", "pantallazos", "correo electrónico como prueba", "grabación de audio", "grabación de vídeo", "prueba electrónica", "prueba digital", "documento electrónico", "mensajes de texto", "transcripción de grabaciones"]
    normas_base: ["LEC", "LOPJ", "CE"]
    remisiones:
      - {norma: "LEC", articulo: "299", apartado: "2", tipo: "regula", nota: "Medios de reproducción de palabra, sonido e imagen e instrumentos que archivan palabras, datos o cifras."}
      - {norma: "LEC", articulo: "299", apartado: "3", tipo: "regula", nota: "Cualquier otro medio que dé certeza sobre hechos relevantes, a instancia de parte."}
      - {norma: "LEC", articulo: "265", apartado: "1.2.º", tipo: "regula", nota: "Si la pretensión se funda en ellos, se aportan con la demanda o con la contestación."}
      - {norma: "LEC", articulo: "382", apartado: "1", tipo: "regula", nota: "Reproducción ante el tribunal de palabras, imágenes y sonidos, con transcripción escrita de lo relevante."}
      - {norma: "LEC", articulo: "382", apartado: "2", tipo: "regula", nota: "El proponente aporta dictámenes y pruebas instrumentales; la contraria, los suyos si discute la autenticidad."}
      - {norma: "LEC", articulo: "382", apartado: "3", tipo: "regula", nota: "Las reproducciones se valoran según la sana crítica."}
      - {norma: "LEC", articulo: "384", apartado: "1", tipo: "regula", nota: "Instrumentos de archivo de datos: los examina el tribunal y las partes pueden alegar con idéntico conocimiento."}
      - {norma: "LEC", articulo: "384", apartado: "3", tipo: "regula", nota: "Se valoran por la sana crítica propia de su naturaleza."}
      - {norma: "LEC", articulo: "326", apartado: "3", tipo: "regula", nota: "Documento electrónico impugnado (autenticidad, integridad, fecha): prueba del art. 326.2 y reglas del eIDAS."}
      - {norma: "LEC", articulo: "326", apartado: "4", tipo: "regula", nota: "Con servicio de confianza cualificado se presume correcto; comprueba y paga el impugnante; multa de 300 a 1.200."}
      - {norma: "LEC", articulo: "352", tipo: "regula", nota: "Dictamen pericial para conocer el contenido o valorar estos medios (arts. 299.2 y 299.3)."}
      - {norma: "LEC", articulo: "287", apartado: "1", tipo: "regula", nota: "Si se obtuvo vulnerando derechos fundamentales, se alega de inmediato y se resuelve en el juicio."}
      - {norma: "LOPJ", articulo: "11", apartado: "1", tipo: "regula", nota: "No surten efecto las pruebas obtenidas, directa o indirectamente, violentando derechos fundamentales."}
      - {norma: "LEC", articulo: "383", apartado: "1", tipo: "conexa", nota: "Acta de la reproducción, con lo necesario para identificar grabaciones y lo aportado sobre ellas."}
      - {norma: "LEC", articulo: "383", apartado: "2", tipo: "conexa", nota: "El soporte se conserva por el LAJ o en el expediente electrónico, sin alteraciones."}
      - {norma: "LEC", articulo: "334", apartado: "1", tipo: "conexa", nota: "Copia impugnada: cotejo con el original o, si no es posible, sana crítica."}
      - {norma: "LEC", articulo: "297", apartado: "1", tipo: "conexa", nota: "Aseguramiento de la prueba, incluso antes del pleito, si puede destruirse o alterarse."}
      - {norma: "LEC", articulo: "289", apartado: "2", tipo: "conexa", nota: "Es inexcusable la presencia del juez en la reproducción de palabras, sonidos, imágenes y datos."}
      - {norma: "CE", articulo: "18", apartado: "3", tipo: "conexa", nota: "Secreto de las comunicaciones, salvo resolución judicial."}
      - {norma: "CE", articulo: "18", apartado: "1", tipo: "conexa", nota: "Derecho a la intimidad personal y familiar y a la propia imagen."}
    no_consta_en_norma:
      - "Si un correo o un mensaje es documento (art. 326) o medio de los arts. 382 a 384: la ley no lo dice; jurisprudencial."
      - "Si la captura de pantalla impugnada exige pericial o basta otra prueba (p. ej., el otro interlocutor): jurisprudencial."
      - "Si grabar una conversación en la que uno participa lesiona el secreto de las comunicaciones o la intimidad: jurisprudencial."
    fuera_de_la_herramienta:
      - "Reglamento (UE) 910/2014 (eIDAS): servicios de confianza y firma electrónica a que remite el art. 326.3 y 4 LEC."
      - "LO 3/2018, de protección de datos personales, y RGPD: licitud del tratamiento de imágenes y datos que se aportan."
    afines: ["Documentos: aportación e impugnación", "Prueba ilícita", "Dictamen pericial de parte y judicial", "Prueba anticipada y aseguramiento de la prueba", "Fuerza probatoria de documentos públicos y privados"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"
