      - {norma: "CC", articulo: "1969", tipo: "conexa", nota: "La prescripción corre desde el día en que la acción pudo ejercitarse, salvo regla especial."}
      - {norma: "CC", articulo: "1005", tipo: "conexa", nota: "Ejemplo legal de plazo civil en días naturales: treinta días para aceptar o repudiar tras la interpelación notarial."}
      - {norma: "LEC", articulo: "133", apartado: "2", tipo: "conexa", nota: "Contraste: en los plazos procesales por días se excluyen los inhábiles."}
      - {norma: "LEC", articulo: "133", apartado: "4", tipo: "conexa", nota: "Contraste: el plazo procesal que concluye en día inhábil se prorroga al siguiente hábil."}
      - {norma: "LEC", articulo: "135", apartado: "5", tipo: "regula", nota: "Escrito sujeto a plazo procesal o sustantivo: se puede presentar hasta las quince horas del día hábil siguiente."}
      - {norma: "LOPJ", articulo: "185", apartado: "1", tipo: "conexa", nota: "Los plazos procesales se computan según el CC, pero en los de días se excluyen los inhábiles."}
      - {norma: "LOPJ", articulo: "185", apartado: "2", tipo: "conexa", nota: "Contraste: el plazo procesal cuyo último día es inhábil se prorroga al primer hábil siguiente."}
    no_consta_en_norma:
      - "Si el plazo civil que vence en día inhábil se prorroga al siguiente hábil: el art. 5 CC no lo dice; criterio jurisprudencial."
      - "Agosto es hábil para los plazos sustantivos (prescripción, caducidad) aunque se ejerzan con demanda: jurisprudencial."
