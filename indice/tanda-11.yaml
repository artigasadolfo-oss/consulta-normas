      - {norma: "CC", articulo: "1462", tipo: "conexa", nota: "Tradición: poner la cosa en poder del comprador; la escritura pública equivale a la entrega salvo lo contrario."}
      - {norma: "CC", articulo: "1473", tipo: "conexa", nota: "Doble venta: inmuebles, al primero que inscribe; sin inscripción, primer poseedor de buena fe o título más antiguo."}
      - {norma: "CC", articulo: "448", tipo: "regula", nota: "El poseedor en concepto de dueño se presume con justo título y no se le puede obligar a exhibirlo."}
      - {norma: "CC", articulo: "464", tipo: "regula", nota: "Muebles: la posesión de buena fe equivale al título; quien perdió la cosa o fue privado ilegalmente puede reivindicarla."}
      - {norma: "CC", articulo: "1962", tipo: "regula", nota: "Acciones reales sobre muebles: seis años desde perdida la posesión, salvo usucapión anterior o hurto y robo."}
      - {norma: "CC", articulo: "1963", tipo: "regula", nota: "Acciones reales sobre inmuebles: treinta años, sin perjuicio de la usucapión ganada por otro."}
      - {norma: "CC", articulo: "1949", tipo: "conexa", nota: "Contra título inscrito no hay prescripción ordinaria en perjuicio de tercero sino por otro título inscrito."}
      - {norma: "LEC", articulo: "250", apartado: "1.7.º", tipo: "conexa", nota: "Verbal para el titular de derecho real inscrito frente a quien se opone sin título inscrito."}
      - {norma: "LEC", articulo: "251", apartado: "3.ª", tipo: "regula", nota: "Cuantía: valor del bien en las demandas sobre el disfrute, la validez o la existencia y extensión del dominio."}
    no_consta_en_norma:
      - "Requisitos de la reivindicatoria: título de dominio, identificación de la cosa y posesión del demandado: jurisprudencial."
      - "Acción declarativa de dominio (sin pedir la entrega de la cosa): construcción jurisprudencial, solo exige título e identificación."
      - "Si la reivindicatoria prescribe sola a los treinta años o solo se pierde cuando otro usucape: discutido; el 1963 salva la usucapión."
