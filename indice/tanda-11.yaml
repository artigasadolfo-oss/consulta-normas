    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "348", apartado: "párrafo 2.º", tipo: "regula", nota: "El propietario tiene acción contra el tenedor y el poseedor de la cosa o del animal para reivindicarlo."}
      - {norma: "CC", articulo: "348", apartado: "párrafo 1.º", tipo: "conexa", nota: "Propiedad: gozar y disponer de la cosa sin más limitaciones que las legales."}
