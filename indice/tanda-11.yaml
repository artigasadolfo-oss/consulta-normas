      - "Plazo de la acción de complemento y de la de reducción de donaciones inoficiosas: no consta en norma; criterio jurisprudencial."
      - "Legítima como pars bonorum (se paga con bienes de la herencia salvo norma que permita el metálico): jurisprudencial."
    fuera_de_la_herramienta:
      - "Reglamento (UE) 650/2012: la ley de la residencia habitual o la nacional elegida decide si hay legítimas (extranjeros en Benidorm)."
      - "Derechos civiles forales o especiales con legítimas propias (Aragón, Cataluña, Navarra, Baleares, Galicia, País Vasco)."
