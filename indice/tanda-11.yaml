# Índice de conceptos de «Consulta de normas» — tanda 11 (contratos, propiedad y sucesiones)
# Revisor: armero. Espejo: legalize-es@aca28304d. Todo precepto citado se ha leído en el espejo en esta pasada.
# Vigencia: contraste con la API de boe.es (scripts/contraste_boe.py --solo "CC,LEC,LOE,TRLGDCU,LOPJ,LAU,LPH", 08-10-2026).
# Distintos: LEC 22 y 685, CC 396 (errata del espejo), LPH 10 y 34 artículos de la LAU. Ninguno está citado; ninguna versión futura
# en los artículos citados. Voces 209 a 215, 239, 240 y 253 a 255 de la lista maestra (12 voces). Ver tanda-11-notas.md.

voces:
  - voz: "Ofrecimiento de pago y consignación"
    sinonimos: ["consignación judicial", "consignación notarial", "ofrecimiento de pago", "mora del acreedor", "mora accipiendi", "negativa a recibir el pago", "acreedor desconocido", "liberación del deudor", "consignar la renta", "consignación de la cosa debida"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "1176", apartado: "párrafo 1.º", tipo: "regula", nota: "Si el acreedor rehúsa sin razón el pago ofrecido, el recibo o la cancelación de la garantía, el deudor se libera consignando."}
      - {norma: "CC", articulo: "1176", apartado: "párrafo 2.º", tipo: "regula", nota: "Basta consignar sin ofrecimiento: acreedor ausente o impedido, varios pretendientes, acreedor desconocido o título extraviado."}
      - {norma: "CC", articulo: "1176", apartado: "párrafo 3.º", tipo: "regula", nota: "También cabe cuando el cumplimiento se hace más gravoso al deudor por causas no imputables a él."}
      - {norma: "CC", articulo: "1177", tipo: "regula", nota: "Hay que anunciarla antes a los interesados; es ineficaz si no se ajusta estrictamente a las reglas del pago."}
      - {norma: "CC", articulo: "1178", tipo: "regula", nota: "La hace el deudor o un tercero, a disposición del Juzgado o del Notario, según la LJV o la legislación notarial."}
      - {norma: "CC", articulo: "1179", tipo: "regula", nota: "Los gastos de la consignación procedente son de cuenta del acreedor."}
      - {norma: "CC", articulo: "1180", tipo: "regula", nota: "Extingue la obligación su aceptación o la declaración de bien hecha; hasta entonces el deudor puede retirarla."}
      - {norma: "CC", articulo: "1181", tipo: "regula", nota: "Si el acreedor autoriza la retirada, pierde su preferencia sobre la cosa y quedan libres codeudores y fiadores."}
      - {norma: "CC", articulo: "1157", tipo: "conexa", nota: "Solo hay pago con la entrega completa de la cosa o la prestación debida: un ofrecimiento parcial no libera."}
      - {norma: "CC", articulo: "1166", tipo: "conexa", nota: "No se puede obligar al acreedor a recibir cosa distinta de la debida, aunque valga igual o más."}
      - {norma: "CC", articulo: "1169", tipo: "conexa", nota: "Salvo pacto, el acreedor no tiene que aceptar pagos parciales; sí el de la parte líquida de la deuda."}
      - {norma: "CC", articulo: "1171", tipo: "conexa", nota: "Lugar del pago: el pactado; si no, donde estaba la cosa determinada; en otro caso, el domicilio del deudor."}
    no_consta_en_norma:
      - "Mora del acreedor y traslado del riesgo y de los intereses desde el ofrecimiento rechazado: jurisprudencial, el CC no la regula en general."
      - "Ofrecimiento sin consignación posterior: no libera ni detiene los intereses moratorios: jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 15/2015, de Jurisdicción Voluntaria, arts. 98 y 99: expediente de consignación judicial (a ella remite el art. 1178 CC)."
      - "Ley del Notariado, art. 69: consignación ante notario (a la legislación notarial remite el art. 1178 CC)."
    afines: ["Pago: prueba, imputación y pago por tercero", "Mora del deudor e intereses moratorios", "Renta: pago, recibo y actualización", "Enervación del desahucio"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Arras y señal"
    sinonimos: ["arras", "señal", "arras penitenciales", "arras confirmatorias", "arras penales", "contrato de arras", "devolver las arras duplicadas", "perder la señal", "desistimiento con arras", "reserva de compra"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "1454", tipo: "regula", nota: "Compraventa con arras o señal: se puede desistir perdiéndolas el comprador o devolviéndolas duplicadas el vendedor."}
      - {norma: "CC", articulo: "1255", tipo: "conexa", nota: "Autonomía de la voluntad: las partes pactan qué función cumplen las arras, dentro de la ley, la moral y el orden público."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 2.º", tipo: "conexa", nota: "Si las arras no son penitenciales, ante el incumplimiento: cumplimiento o resolución con daños e intereses."}
      - {norma: "CC", articulo: "1152", tipo: "conexa", nota: "Arras penales: funcionan como cláusula penal y sustituyen a la indemnización salvo pacto en contrario."}
      - {norma: "CC", articulo: "1153", tipo: "conexa", nota: "Sin pacto claro, el acreedor no acumula cumplimiento y pena, ni el deudor se libera pagando la pena."}
      - {norma: "CC", articulo: "1154", tipo: "conexa", nota: "El juez modera la pena si la obligación se cumplió en parte o irregularmente."}
      - {norma: "CC", articulo: "1281", apartado: "párrafo 1.º", tipo: "conexa", nota: "Si los términos son claros, se está a su sentido literal: decisivo para calificar las arras."}
      - {norma: "CC", articulo: "1279", tipo: "conexa", nota: "Perfecto el contrato, las partes pueden compelerse a otorgar la escritura pública."}
    no_consta_en_norma:
      - "Las arras son confirmatorias (parte del precio) salvo pacto claro de que son penitenciales: interpretación restrictiva jurisprudencial."
      - "Arras penales como categoría distinta de las penitenciales y las confirmatorias: construcción jurisprudencial."
      - "Ejercicio del desistimiento del 1454 antes de que se cumpla el contrato (no tras la entrega o el pago): jurisprudencial."
    afines: ["Cláusula penal", "Incumplimiento y facultad resolutoria (art. 1124)", "Compraventa: entrega, precio y riesgos", "Interpretación de los contratos", "Forma del contrato y elevación a escritura pública"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Saneamiento por vicios ocultos"
    sinonimos: ["vicios ocultos", "defectos ocultos", "acción redhibitoria", "acción quanti minoris", "acción estimatoria", "rebaja del precio", "seis meses vicios ocultos", "falta de conformidad", "garantía legal", "aliud pro alio", "vicios redhibitorios"]
    normas_base: ["CC", "TRLGDCU", "LOE"]
    remisiones:
      - {norma: "CC", articulo: "1461", tipo: "conexa", nota: "El vendedor está obligado a la entrega y al saneamiento de la cosa vendida."}
      - {norma: "CC", articulo: "1474", tipo: "conexa", nota: "El saneamiento comprende la posesión legal y pacífica (evicción) y los vicios o defectos ocultos."}
      - {norma: "CC", articulo: "1484", apartado: "1", tipo: "regula", nota: "Vicio oculto que hace la cosa impropia para su uso o lo disminuye; no los manifiestos ni los que un perito comprador debía ver."}
      - {norma: "CC", articulo: "1484", apartado: "2", tipo: "conexa", nota: "Venta de animales: el vendedor responde de la lesión, enfermedad o conducta con origen anterior a la venta."}
      - {norma: "CC", articulo: "1485", tipo: "regula", nota: "Responde aunque ignorase los vicios; el pacto de exclusión solo vale si el vendedor los ignoraba."}
      - {norma: "CC", articulo: "1486", tipo: "regula", nota: "Opción: desistir con abono de gastos o rebaja proporcional del precio; si conocía el vicio y calló, además daños."}
      - {norma: "CC", articulo: "1487", tipo: "regula", nota: "Pérdida de la cosa por el vicio: restitución del precio y gastos; con daños si el vendedor lo conocía."}
      - {norma: "CC", articulo: "1488", tipo: "conexa", nota: "Pérdida posterior por caso fortuito o culpa del comprador: precio pagado menos el valor al perderse."}
      - {norma: "CC", articulo: "1489", tipo: "conexa", nota: "En las ventas judiciales no hay daños y perjuicios, pero sí lo demás."}
      - {norma: "CC", articulo: "1490", tipo: "regula", nota: "Las acciones de los arts. 1485 a 1489 se extinguen a los seis meses desde la entrega de la cosa vendida."}
      - {norma: "CC", articulo: "1496", tipo: "conexa", nota: "Animales: acción redhibitoria en cuarenta días desde la entrega, salvo usos locales distintos."}
      - {norma: "TRLGDCU", articulo: "116", tipo: "regula", nota: "Con consumidor: las acciones de conformidad excluyen las de saneamiento del CC; siempre cabe indemnización."}
      - {norma: "TRLGDCU", articulo: "117", apartado: "1", tipo: "regula", nota: "Falta de conformidad a la entrega: subsanación, rebaja o resolución por simple declaración, más daños; cabe suspender el pago."}
      - {norma: "TRLGDCU", articulo: "120", apartado: "1", tipo: "regula", nota: "Responde de lo que se manifieste en tres años desde la entrega del bien; segunda mano, pacto de al menos un año."}
      - {norma: "TRLGDCU", articulo: "121", apartado: "1", tipo: "regula", nota: "Se presume que la falta manifestada en los dos años siguientes a la entrega ya existía."}
      - {norma: "TRLGDCU", articulo: "124", tipo: "regula", nota: "La acción prescribe a los cinco años desde que se manifiesta la falta de conformidad."}
      - {norma: "TRLGDCU", articulo: "59 bis", apartado: "2", tipo: "regula", nota: "Para la garantía de conformidad, «bienes» son solo las cosas muebles corporales: no alcanza a los inmuebles."}
      - {norma: "TRLGDCU", articulo: "6", tipo: "conexa", nota: "Producto es todo bien mueble según el art. 335 CC."}
      - {norma: "LOE", articulo: "17", apartado: "9", tipo: "conexa", nota: "La responsabilidad de los agentes de la edificación no excluye la del vendedor por los arts. 1484 y siguientes CC."}
    no_consta_en_norma:
      - "El plazo de seis meses del 1490 es de caducidad, no de prescripción, y no se interrumpe: jurisprudencial."
      - "Aliud pro alio (cosa inhábil para su fin): incumplimiento del 1124 con plazo del 1964, no saneamiento: jurisprudencial."
    fuera_de_la_herramienta:
      - "Código de Comercio, arts. 336 y 342: venta mercantil; cuatro días si llegó embalada (cantidad o calidad) y treinta días para vicios internos."
    afines: ["Saneamiento por evicción", "Compraventa: entrega, precio y riesgos", "Incumplimiento y facultad resolutoria (art. 1124)", "Responsabilidad de los agentes: plazos de 10, 3 y 1 año", "Caducidad de la acción (como excepción)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Contrato de obra: precio, riesgo y vicios"
    sinonimos: ["contrato de obra", "arrendamiento de obra", "ejecución de obra", "precio alzado", "ajuste alzado", "desistimiento del comitente", "riesgo de la obra", "ruina del edificio", "acción directa del subcontratista", "derecho de retención del contratista", "vicios de la construcción", "1591 CC"]
    normas_base: ["CC", "LOE"]
    remisiones:
      - {norma: "CC", articulo: "1544", tipo: "regula", nota: "Arrendamiento de obra: una parte ejecuta una obra para la otra por precio cierto."}
      - {norma: "CC", articulo: "1588", tipo: "regula", nota: "Se puede pactar que el contratista ponga solo su trabajo o también el material."}
      - {norma: "CC", articulo: "1589", tipo: "regula", nota: "Si pone el material, sufre la pérdida de la obra destruida antes de entregarla, salvo mora del dueño en recibirla."}
      - {norma: "CC", articulo: "1590", tipo: "regula", nota: "Si solo pone trabajo, pierde el precio si la obra se destruye antes de entregarla, salvo mora o mala calidad avisada."}
      - {norma: "CC", articulo: "1591", apartado: "párrafo 1.º", tipo: "regula", nota: "Ruina por vicios de construcción en diez años desde que concluyó: contratista; y arquitecto si es del suelo o la dirección."}
      - {norma: "CC", articulo: "1591", apartado: "párrafo 2.º", tipo: "regula", nota: "Si la causa es que el contratista faltó a las condiciones del contrato, la acción dura quince años."}
      - {norma: "CC", articulo: "1592", tipo: "regula", nota: "Obra por piezas o medida: recepción y pago por partes; la parte pagada se presume aprobada y recibida."}
      - {norma: "CC", articulo: "1593", tipo: "regula", nota: "Ajuste alzado sobre plano: no hay aumento de precio, salvo cambio de plano con aumento de obra autorizado por el dueño."}
      - {norma: "CC", articulo: "1594", tipo: "regula", nota: "El dueño puede desistir aunque la obra haya empezado, indemnizando gastos, trabajo y utilidad esperada."}
      - {norma: "CC", articulo: "1595", tipo: "conexa", nota: "Obra encargada por las cualidades del constructor: se extingue por su muerte; se paga lo ejecutado útil."}
      - {norma: "CC", articulo: "1596", tipo: "conexa", nota: "El contratista responde del trabajo de las personas que ocupa en la obra."}
      - {norma: "CC", articulo: "1597", tipo: "regula", nota: "Acción directa de quienes ponen trabajo o materiales contra el dueño, hasta lo que este deba al contratista."}
      - {norma: "CC", articulo: "1598", tipo: "regula", nota: "Obra a satisfacción del dueño: sin conformidad, decide el juicio pericial; si aprueba un tercero, se está a él."}
      - {norma: "CC", articulo: "1599", tipo: "regula", nota: "Salvo pacto o costumbre, el precio se paga al entregarse la obra."}
      - {norma: "CC", articulo: "1600", tipo: "regula", nota: "Obra en cosa mueble: el que la ejecutó puede retenerla en prenda hasta que se le pague."}
      - {norma: "CC", articulo: "1101", tipo: "conexa", nota: "Defectos que no son ruina: indemnización por cumplimiento defectuoso, contravención del tenor de la obligación."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "conexa", nota: "La acción contractual por cumplimiento defectuoso prescribe a los cinco años desde que pudo exigirse."}
      - {norma: "LOE", articulo: "17", apartado: "1", tipo: "regula", nota: "Desde la recepción: diez años estructura, tres habitabilidad y un año (constructor) acabados; sin perjuicio del contrato."}
      - {norma: "LOE", articulo: "17", apartado: "6", tipo: "conexa", nota: "El constructor responde de su personal, de sus subcontratistas y de los productos que adquiere o acepta."}
      - {norma: "LOE", articulo: "18", apartado: "1", tipo: "regula", nota: "Las acciones del art. 17 prescriben a los dos años desde que se producen los daños; quedan las contractuales."}
      - {norma: "LOE", articulo: "dt 1", tipo: "regula", nota: "La LOE solo se aplica a obras cuya licencia se solicitó desde su entrada en vigor; antes, rige el 1591 CC."}
    no_consta_en_norma:
      - "Ruina funcional (defectos que hacen el edificio inútil para su fin, no solo el derrumbe): concepto jurisprudencial del 1591."
      - "El plazo de diez años del 1591 es de garantía; la acción prescribe en el plazo general desde la ruina: jurisprudencial."
      - "Obra de reforma sin licencia de edificación ni proyecto: si entra en la LOE o solo en el CC, criterio jurisprudencial."
    afines: ["Responsabilidad de los agentes: plazos de 10, 3 y 1 año", "Concurrencia de la LOE con la responsabilidad contractual y el art. 1591 CC", "Recepción de la obra", "Daños y perjuicios por incumplimiento contractual", "Incumplimiento y facultad resolutoria (art. 1124)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Responsabilidad extracontractual"
    sinonimos: ["responsabilidad aquiliana", "culpa extracontractual", "art. 1902", "daños sin contrato", "responsabilidad por culpa", "responsabilidad civil", "plazo de un año del 1902", "indemnización de daños", "responsabilidad del empresario por sus empleados", "responsabilidad de los padres", "cosas arrojadas o caídas"]
    normas_base: ["CC", "TRLGDCU"]
    remisiones:
      - {norma: "CC", articulo: "1902", tipo: "regula", nota: "Quien por acción u omisión causa daño a otro, interviniendo culpa o negligencia, debe repararlo."}
      - {norma: "CC", articulo: "1903", tipo: "regula", nota: "Por hecho ajeno: padres, tutores, curadores representativos, empresarios, centros docentes; cesa probando la diligencia."}
      - {norma: "CC", articulo: "1904", tipo: "conexa", nota: "Quien paga por sus dependientes repite contra ellos; el centro docente, contra el profesor solo por dolo o culpa grave."}
      - {norma: "CC", articulo: "1905", tipo: "regula", nota: "Poseedor del animal: responde aunque escape; solo le exime la fuerza mayor o la culpa del perjudicado."}
      - {norma: "CC", articulo: "1907", tipo: "regula", nota: "Propietario del edificio: daños por su ruina total o parcial debida a falta de las reparaciones necesarias."}
      - {norma: "CC", articulo: "1908", tipo: "regula", nota: "Propietarios: explosiones, humos nocivos, caída de árboles en sitios de tránsito y emanaciones de cloacas."}
      - {norma: "CC", articulo: "1909", tipo: "conexa", nota: "Si el daño de los arts. 1907 y 1908 viene de defecto de construcción, el tercero repite contra arquitecto o constructor."}
      - {norma: "CC", articulo: "1910", tipo: "regula", nota: "El cabeza de familia que habita la casa responde de las cosas que se arrojan o caen de ella."}
      - {norma: "CC", articulo: "1968", apartado: "2.º", tipo: "regula", nota: "La acción prescribe al año desde que lo supo el agraviado."}
      - {norma: "CC", articulo: "1969", tipo: "conexa", nota: "Sin regla especial, la prescripción se cuenta desde el día en que la acción pudo ejercitarse."}
      - {norma: "CC", articulo: "1973", tipo: "conexa", nota: "Se interrumpe por demanda, reclamación extrajudicial o reconocimiento del deudor."}
      - {norma: "CC", articulo: "1089", tipo: "conexa", nota: "Fuentes de las obligaciones: también los actos y omisiones en que interviene culpa o negligencia."}
      - {norma: "CC", articulo: "1092", tipo: "conexa", nota: "La responsabilidad civil nacida de delito se rige por el Código Penal."}
      - {norma: "CC", articulo: "1093", tipo: "conexa", nota: "La culpa no penada por la ley se rige por el capítulo II del título XVI (arts. 1902 y siguientes)."}
      - {norma: "CC", articulo: "1104", tipo: "conexa", nota: "Medida de la diligencia: la que exige la naturaleza de la obligación y las circunstancias; si no, buen padre de familia."}
      - {norma: "CC", articulo: "1105", tipo: "conexa", nota: "Nadie responde de lo imprevisible o, previsto, inevitable, salvo ley o pacto."}
      - {norma: "TRLGDCU", articulo: "128", tipo: "conexa", nota: "Daños por bienes o servicios defectuosos: el régimen especial no excluye la responsabilidad extracontractual."}
      - {norma: "TRLGDCU", articulo: "143", apartado: "1", tipo: "conexa", nota: "Productos defectuosos: la acción prescribe a los tres años, no al año del 1968."}
    no_consta_en_norma:
      - "Inversión de la carga de la prueba y objetivación del riesgo en actividades peligrosas: jurisprudencial."
      - "Solidaridad impropia entre corresponsables del daño (y su efecto en la interrupción de la prescripción): jurisprudencial."
      - "Daños continuados: el año corre desde el resultado definitivo; daños permanentes, desde que se conocen: jurisprudencial."
      - "Daño moral indemnizable y su cuantificación: jurisprudencial."
    fuera_de_la_herramienta:
      - "Código Penal, arts. 109 a 122: responsabilidad civil derivada de delito (a él remite el art. 1092 CC)."
      - "Ley sobre responsabilidad civil y seguro en la circulación de vehículos a motor (RDLeg 8/2004) y su baremo."
      - "Ley 50/1980, de Contrato de Seguro, art. 76: acción directa contra la aseguradora del responsable."
    afines: ["Responsabilidad por hecho ajeno", "Daños causados por animales, edificios y cosas", "Daños entre comunidad y propietarios (filtraciones)", "Daños y perjuicios por incumplimiento contractual", "Prescripción (como excepción)", "Interrupción de la prescripción", "Fuerza mayor y caso fortuito"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Abuso de derecho y buena fe"
    sinonimos: ["abuso del derecho", "ejercicio antisocial del derecho", "buena fe", "mala fe", "doctrina de los actos propios", "venire contra factum proprium", "retraso desleal", "buena fe procesal", "integración del contrato", "multa por mala fe procesal", "abuso del servicio público de Justicia"]
    normas_base: ["CC", "LEC", "LOPJ", "TRLGDCU"]
    remisiones:
      - {norma: "CC", articulo: "7", apartado: "1", tipo: "regula", nota: "Los derechos deben ejercitarse conforme a las exigencias de la buena fe."}
      - {norma: "CC", articulo: "7", apartado: "2", tipo: "regula", nota: "No se ampara el abuso: exceso manifiesto por intención, objeto o circunstancias, con daño a tercero; indemnización y cese."}
      - {norma: "CC", articulo: "1258", tipo: "regula", nota: "El contrato obliga también a las consecuencias conformes a la buena fe, al uso y a la ley."}
      - {norma: "CC", articulo: "6", apartado: "4", tipo: "conexa", nota: "Fraude de ley: el acto al amparo de una norma con resultado prohibido no impide aplicar la norma eludida."}
      - {norma: "CC", articulo: "1255", tipo: "conexa", nota: "Autonomía de la voluntad: límite de las leyes, la moral y el orden público."}
      - {norma: "LEC", articulo: "247", apartado: "1", tipo: "regula", nota: "Todos los intervinientes en el proceso deben ajustarse a las reglas de la buena fe."}
      - {norma: "LEC", articulo: "247", apartado: "2", tipo: "regula", nota: "Se rechazan fundadamente las peticiones con manifiesto abuso de derecho o fraude de ley o procesal."}
      - {norma: "LEC", articulo: "247", apartado: "3", tipo: "regula", nota: "Multa de 180 a 6.000 euros, sin pasar de un tercio de la cuantía, por mala fe procesal o abuso del servicio."}
      - {norma: "LEC", articulo: "247", apartado: "4", tipo: "conexa", nota: "Si la conducta es imputable al profesional, traslado al colegio y, con justicia gratuita, a la Comisión."}
