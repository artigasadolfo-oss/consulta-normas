    afines: ["Usucapión", "Posesión: clases, adquisición y efectos", "Liquidación del estado posesorio: frutos, gastos y mejoras", "Tercería de dominio", "Tutela sumaria de la posesión", "Desahucio por precario", "Cuantía del proceso y su impugnación"]
