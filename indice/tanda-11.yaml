    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Partición de la herencia y su impugnación"
    sinonimos: ["partición de la herencia", "partición hereditaria", "cuaderno particional", "contador-partidor", "rescisión de la partición por lesión", "lesión en más de la cuarta parte", "nulidad de la partición", "adición de la partición", "complemento de la partición", "partición hecha por el testador", "heredero preterido en la partición", "retracto de coherederos"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1051", tipo: "regula", nota: "Nadie está obligado a seguir en la indivisión, salvo prohibición del testador, que cede ante las causas de extinción de la sociedad."}
      - {norma: "CC", articulo: "1052", tipo: "regula", nota: "Cualquier coheredero con libre disposición puede pedir la partición en todo momento; reglas para ausentes y apoyos."}
      - {norma: "CC", articulo: "1056", apartado: "párrafo 1.º", tipo: "regula", nota: "Se pasa por la partición hecha por el testador en cuanto no perjudique la legítima."}
      - {norma: "CC", articulo: "1057", tipo: "regula", nota: "Contador-partidor testamentario; si no lo hay, dativo nombrado por LAJ o Notario a instancia del 50 % del haber."}
      - {norma: "CC", articulo: "1058", tipo: "regula", nota: "Herederos mayores y con libre administración: reparten como tengan por conveniente."}
      - {norma: "CC", articulo: "1059", tipo: "regula", nota: "Si no se entienden, queda a salvo la división judicial conforme a la LEC."}
      - {norma: "CC", articulo: "1060", tipo: "conexa", nota: "Menores y personas con apoyos: aprobación judicial de la partición en los casos que indica."}
      - {norma: "CC", articulo: "1061", tipo: "regula", nota: "Se guarda la posible igualdad, con lotes o cosas de la misma naturaleza, calidad o especie."}
      - {norma: "CC", articulo: "1062", tipo: "regula", nota: "Cosa indivisible: a uno con abono en dinero; pero basta que uno pida la subasta con licitadores extraños."}
      - {norma: "CC", articulo: "1063", tipo: "conexa", nota: "Abonos recíprocos: frutos y rentas percibidos, gastos útiles y necesarios y daños por malicia o negligencia."}
      - {norma: "CC", articulo: "1067", tipo: "conexa", nota: "Retracto de coherederos: si uno vende su cuota a un extraño antes de partir, un mes desde que se les hace saber."}
      - {norma: "CC", articulo: "1068", tipo: "regula", nota: "La partición legalmente hecha da a cada heredero la propiedad exclusiva de lo adjudicado."}
      - {norma: "CC", articulo: "1069", tipo: "conexa", nota: "Tras la partición, los coherederos se deben recíprocamente evicción y saneamiento."}
      - {norma: "CC", articulo: "1073", tipo: "regula", nota: "La partición se rescinde por las mismas causas que las obligaciones."}
      - {norma: "CC", articulo: "1074", tipo: "regula", nota: "Rescisión por lesión en más de la cuarta parte, según el valor de las cosas al adjudicarse."}
      - {norma: "CC", articulo: "1075", tipo: "regula", nota: "La partición del testador solo se impugna por lesión si perjudica la legítima o consta otra voluntad suya."}
      - {norma: "CC", articulo: "1076", tipo: "regula", nota: "La acción rescisoria por lesión dura cuatro años desde que se hizo la partición."}
      - {norma: "CC", articulo: "1077", tipo: "regula", nota: "El demandado elige indemnizar (en dinero o en la cosa) o consentir nueva partición, que no alcanza a los no afectados."}
      - {norma: "CC", articulo: "1078", tipo: "conexa", nota: "No rescinde por lesión quien enajenó el todo o parte considerable de los inmuebles adjudicados."}
