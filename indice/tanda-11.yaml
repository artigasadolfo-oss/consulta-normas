      - {norma: "CC", articulo: "394", tipo: "regula", nota: "Cada partícipe usa la cosa conforme a su destino, sin perjudicar a la comunidad ni impedir el uso de los demás."}
      - {norma: "CC", articulo: "395", tipo: "regula", nota: "Todos deben contribuir a los gastos de conservación; solo se exime quien renuncia a su parte."}
      - {norma: "CC", articulo: "397", tipo: "regula", nota: "Ninguno puede hacer alteraciones en la cosa común sin consentimiento de los demás, aunque fueran ventajosas."}
      - {norma: "CC", articulo: "398", tipo: "regula", nota: "Administración por mayoría de intereses; sin mayoría o con acuerdo gravemente perjudicial, provee el juez."}
      - {norma: "CC", articulo: "399", tipo: "regula", nota: "Cada condueño puede enajenar o hipotecar su parte, con efecto limitado a lo que se le adjudique al dividir."}
      - {norma: "CC", articulo: "400", tipo: "regula", nota: "Nadie está obligado a permanecer en comunidad; pacto de indivisión de hasta diez años, prorrogable."}
      - {norma: "CC", articulo: "401", tipo: "regula", nota: "No cabe dividir si la cosa queda inservible para su uso; un edificio puede dividirse en pisos o locales."}
      - {norma: "CC", articulo: "402", tipo: "conexa", nota: "La división la hacen los interesados o árbitros o amigables componedores, con lotes proporcionales."}
      - {norma: "CC", articulo: "403", tipo: "conexa", nota: "Acreedores y cesionarios de los partícipes pueden concurrir y oponerse; la división hecha solo se impugna por fraude u oposición."}
      - {norma: "CC", articulo: "404", tipo: "regula", nota: "Cosa esencialmente indivisible: adjudicación a uno que indemniza a los demás o, sin acuerdo, venta y reparto del precio."}
      - {norma: "CC", articulo: "405", tipo: "conexa", nota: "La división no perjudica a tercero: subsisten hipotecas, servidumbres y derechos personales contra la comunidad."}
      - {norma: "CC", articulo: "406", tipo: "regula", nota: "A la división se aplican las reglas de la partición de la herencia."}
      - {norma: "CC", articulo: "1062", tipo: "conexa", nota: "Por remisión del 406: basta que uno pida la venta en pública subasta con licitadores extraños."}
      - {norma: "CC", articulo: "1965", tipo: "regula", nota: "No prescribe entre condueños la acción para pedir la división de la cosa común."}
      - {norma: "CC", articulo: "1522", tipo: "conexa", nota: "Retracto de comuneros si se vende a un extraño la parte de uno o de todos los demás."}
      - {norma: "LEC", articulo: "250", apartado: "1.16.º", tipo: "regula", nota: "La acción de división de cosa común se tramita por el juicio verbal, sea cual sea la cuantía."}
      - {norma: "LEC", articulo: "251", apartado: "3.ª", tipo: "conexa", nota: "Cuantía de la división de la cosa común: valor del bien (regla 3.ª, 6.º)."}
      - {norma: "LEC", articulo: "437", apartado: "4.4.ª", tipo: "conexa", nota: "En separación, divorcio o nulidad cualquiera de los cónyuges puede acumular la división de bienes en comunidad ordinaria."}
    no_consta_en_norma:
      - "Indivisibilidad económica (la cosa desmerece mucho al dividirse) equiparada a la material: jurisprudencial."
      - "Comunero que usa en exclusiva la cosa común: debe compensar a los demás desde que se le reclama: jurisprudencial."
      - "Subasta de la cosa común en ejecución de sentencia, con licitadores extraños si alguno lo pide: práctica jurisprudencial."
