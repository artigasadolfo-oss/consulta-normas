  - voz: "Legítimas: cuantía y cálculo"
    sinonimos: ["legítima", "herederos forzosos", "legitimarios", "legítima estricta", "tercio de mejora", "tercio de libre disposición", "cálculo de la legítima", "relictum y donatum", "complemento de legítima", "suplemento de legítima", "reducción de disposiciones inoficiosas", "cuota viudal", "usufructo del viudo"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "806", tipo: "regula", nota: "Legítima: porción de bienes que el testador no puede disponer porque la ley la reserva a los herederos forzosos."}
      - {norma: "CC", articulo: "807", tipo: "regula", nota: "Herederos forzosos: descendientes; a falta de ellos, ascendientes; y el viudo en la forma que fija el Código."}
      - {norma: "CC", articulo: "808", tipo: "regula", nota: "Hijos: dos tercios (uno puede ser mejora) y un tercio libre; legítima estricta a favor del hijo con discapacidad."}
      - {norma: "CC", articulo: "809", tipo: "regula", nota: "Ascendientes: la mitad de la herencia; un tercio si concurren con el viudo del causante."}
      - {norma: "CC", articulo: "810", tipo: "conexa", nota: "Reparto de la legítima de los ascendientes entre padres y entre líneas."}
      - {norma: "CC", articulo: "813", tipo: "regula", nota: "No se priva de la legítima sino por causa legal ni se grava, salvo usufructo viudal y arts. 782 y 808."}
      - {norma: "CC", articulo: "815", tipo: "regula", nota: "El legitimario que recibió menos de su legítima puede pedir el complemento."}
      - {norma: "CC", articulo: "816", tipo: "regula", nota: "Es nula la renuncia o transacción sobre la legítima futura; lo recibido por ella se colaciona."}
      - {norma: "CC", articulo: "817", tipo: "regula", nota: "Las disposiciones testamentarias que mengüen la legítima se reducen a petición del legitimario."}
      - {norma: "CC", articulo: "818", tipo: "regula", nota: "Base: valor de los bienes a la muerte menos deudas y cargas (no las testamentarias), más las donaciones colacionables."}
      - {norma: "CC", articulo: "819", tipo: "regula", nota: "Imputación: donaciones a hijos sin carácter de mejora, a su legítima; a extraños, al tercio libre."}
      - {norma: "CC", articulo: "820", tipo: "regula", nota: "Reducción: primero los legados, a prorrata; las donaciones se respetan mientras se cubra la legítima."}
      - {norma: "CC", articulo: "821", tipo: "conexa", nota: "Legado reducible de finca indivisible: para el legatario si la reducción no absorbe la mitad del valor; si no, a los forzosos."}
      - {norma: "CC", articulo: "822", tipo: "conexa", nota: "Habitación sobre la vivienda a favor del legitimario con discapacidad conviviente: no computa para las legítimas."}
      - {norma: "CC", articulo: "834", tipo: "regula", nota: "Viudo no separado legalmente o de hecho que concurre con descendientes: usufructo del tercio de mejora."}
      - {norma: "CC", articulo: "837", tipo: "regula", nota: "Viudo que concurre con ascendientes: usufructo de la mitad de la herencia."}
      - {norma: "CC", articulo: "838", tipo: "regula", nota: "Viudo sin descendientes ni ascendientes: usufructo de dos tercios de la herencia."}
      - {norma: "CC", articulo: "839", tipo: "conexa", nota: "Conmutación del usufructo viudal por renta, productos de bienes o capital, de mutuo acuerdo o por mandato judicial."}
      - {norma: "CC", articulo: "840", tipo: "conexa", nota: "Viudo con hijos solo del causante: puede exigir capital o lote de bienes, a elección de los hijos."}
      - {norma: "CC", articulo: "636", tipo: "conexa", nota: "Nadie puede dar por donación más de lo que puede dar por testamento; el exceso es inoficioso."}
      - {norma: "CC", articulo: "654", tipo: "conexa", nota: "Donaciones inoficiosas: se reducen por el valor líquido a la muerte; surten efecto en vida y el donatario hace suyos los frutos."}
      - {norma: "CC", articulo: "655", tipo: "conexa", nota: "Solo los legitimarios y sus causahabientes piden la reducción; no pueden renunciarla en vida del donante."}
      - {norma: "CC", articulo: "656", tipo: "conexa", nota: "Si no caben todas las donaciones, se reducen primero las de fecha más reciente."}
      - {norma: "CC", articulo: "1035", tipo: "conexa", nota: "El legitimario trae a la masa lo recibido a título lucrativo para computar legítimas y hacer la partición."}
      - {norma: "CC", articulo: "1045", tipo: "conexa", nota: "Se colaciona el valor de lo donado al tiempo de evaluar los bienes hereditarios, no la cosa misma."}
      - {norma: "CC", articulo: "1056", apartado: "párrafo 2.º", tipo: "conexa", nota: "Para conservar una empresa o sociedad, el testador puede ordenar pagar la legítima en metálico, aplazable hasta cinco años."}
    no_consta_en_norma:
