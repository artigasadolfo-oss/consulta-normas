  - voz: "Copropiedad y acción de división de cosa común"
    sinonimos: ["comunidad de bienes", "proindiviso", "condominio", "copropiedad", "acción de división", "actio communi dividundo", "extinción de condominio", "venta en pública subasta de la cosa común", "cosa indivisible", "pacto de indivisión", "administración de la cosa común", "uso de la cosa común"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "392", tipo: "regula", nota: "Hay comunidad cuando la propiedad de una cosa o derecho es pro indiviso de varios; a falta de pacto, rige este título."}
