# Índice de conceptos de «Consulta de normas» — tanda 21 (prioridad B: voces 247, 248 y 257 a 266, cierre del bloque 13 y bloque 14)
# Revisor: armero. Espejo: legalize-es@aca28304d, leído con `git show aca28304d:es/…` (no el árbol de trabajo, que hoy trae erratas).
# Todo precepto citado se ha leído en el espejo en esta pasada. Vigencia: contraste con la API de boe.es (08-10-2026).
# Ver tanda-21-notas.md.

voces:
  - voz: "Luces, vistas y distancias"
    sinonimos: ["servidumbre de luces", "servidumbre de vistas", "ventanas sobre finca vecina", "vistas rectas", "vistas oblicuas", "vistas de costado", "balcones y voladizos", "huecos de 30 centímetros", "distancia de dos metros", "distancia de 60 centímetros", "cerrar huecos del vecino", "edificar a menos de tres metros", "distancia de plantaciones", "árboles cerca de la linde", "ramas y raíces del vecino", "aguas del tejado", "vertiente de tejados", "servidumbre de desagüe", "construcciones nocivas junto a pared ajena"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "580", tipo: "regula", nota: "Ningún medianero puede abrir ventana ni hueco en pared medianera sin consentimiento del otro."}
      - {norma: "CC", articulo: "581", tipo: "regula", nota: "En pared propia contigua a finca ajena: huecos de luces de 30 cm en cuadro, junto al techo, con reja de hierro y red de alambre."}
      - {norma: "CC", articulo: "581", apartado: "párrafo 2.º", tipo: "regula", nota: "El vecino puede cerrar esos huecos si adquiere la medianería y no se pactó lo contrario."}
      - {norma: "CC", articulo: "581", apartado: "párrafo 3.º", tipo: "regula", nota: "También puede cubrirlos edificando en su terreno o levantando pared contigua a la del hueco."}
      - {norma: "CC", articulo: "582", tipo: "regula", nota: "Vistas rectas, balcones o voladizos sobre finca vecina: exigen dos metros entre la pared y la propiedad ajena."}
      - {norma: "CC", articulo: "582", apartado: "párrafo 2.º", tipo: "regula", nota: "Vistas de costado u oblicuas: exigen 60 centímetros de distancia."}
      - {norma: "CC", articulo: "583", tipo: "regula", nota: "Cómputo: rectas, desde la línea exterior de la pared o del voladizo; oblicuas, desde la línea de separación."}
      - {norma: "CC", articulo: "584", tipo: "regula", nota: "Las distancias del 582 no se aplican a edificios separados por una vía pública."}
      - {norma: "CC", articulo: "585", tipo: "regula", nota: "Adquirido el derecho a vistas directas, balcones o miradores, el sirviente no puede edificar a menos de tres metros."}
      - {norma: "CC", articulo: "537", tipo: "conexa", nota: "Las servidumbres continuas y aparentes se adquieren por título o por prescripción de veinte años."}
      - {norma: "CC", articulo: "538", tipo: "regula", nota: "Prescripción: en las negativas, el plazo corre desde que el dominante prohíbe por acto formal al sirviente el hecho lícito."}
      - {norma: "CC", articulo: "533", tipo: "conexa", nota: "Servidumbre negativa: prohíbe al dueño del sirviente hacer algo que le sería lícito sin ella."}
      - {norma: "CC", articulo: "541", tipo: "conexa", nota: "El signo aparente puesto por el dueño de dos fincas vale como título al enajenar una, salvo exclusión o retirada."}
      - {norma: "CC", articulo: "546", apartado: "2.º", tipo: "conexa", nota: "Extinción por no uso de veinte años; en las continuas, desde un acto contrario a la servidumbre."}
      - {norma: "CC", articulo: "586", tipo: "regula", nota: "Los tejados deben verter las aguas pluviales sobre suelo propio o vía pública, recogiéndolas sin perjudicar al contiguo."}
      - {norma: "CC", articulo: "587", tipo: "conexa", nota: "El predio que sufre la vertiente puede edificar recibiendo las aguas en su tejado o dándoles otra salida sin perjuicio."}
      - {norma: "CC", articulo: "588", tipo: "conexa", nota: "Patio enclavado sin salida para las aguas: servidumbre forzosa de desagüe, con indemnización."}
      - {norma: "CC", articulo: "590", tipo: "regula", nota: "Pozos, chimeneas, hornos, establos o industrias nocivas junto a pared ajena: distancias reglamentarias y obras de resguardo."}
      - {norma: "CC", articulo: "590", apartado: "párrafo 2.º", tipo: "conexa", nota: "A falta de reglamento, las precauciones necesarias previo dictamen pericial."}
      - {norma: "CC", articulo: "591", tipo: "regula", nota: "Árboles: distancia de ordenanza o costumbre; en su defecto, dos metros los altos y 50 cm los arbustos o árboles bajos."}
      - {norma: "CC", articulo: "591", apartado: "párrafo 2.º", tipo: "regula", nota: "El vecino puede pedir que se arranquen los árboles plantados después a menor distancia."}
      - {norma: "CC", articulo: "592", tipo: "regula", nota: "Ramas que invaden: pedir que se corten; raíces que invaden: el dueño del suelo las corta por sí mismo."}
      - {norma: "CC", articulo: "593", tipo: "conexa", nota: "Árboles de seto vivo medianero: se presumen medianeros y cabe exigir su derribo, salvo los que sirven de mojón."}
      - {norma: "CC", articulo: "589", tipo: "conexa", nota: "Edificar o plantar cerca de plazas fuertes o fortalezas se sujeta a sus leyes y reglamentos."}
    no_consta_en_norma:
      - "Que abrir huecos en pared propia sea acto tolerado y no posesorio, sin hacer correr la prescripción: jurisprudencial."
      - "Calificación del balcón o voladizo sobre finca ajena como servidumbre positiva desde su apertura: jurisprudencial."
      - "Aplicación de estas distancias entre pisos de un mismo edificio en propiedad horizontal: no lo regula el CC; jurisprudencial."
    afines: ["Servidumbres: constitución, extinción y acciones", "Medianería", "Inmisiones y relaciones de vecindad", "Usucapión", "Obra nueva y obra ruinosa"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Usufructo"
    sinonimos: ["usufructuario", "nudo propietario", "nuda propiedad", "derecho de usufructo", "usufructo vitalicio", "usufructo sucesivo", "frutos del usufructo", "inventario y fianza del usufructuario", "reparaciones ordinarias y extraordinarias", "IBI y cargas del usufructo", "arrendamiento por el usufructuario", "extinción del usufructo", "abuso del usufructuario", "usufructo de cosas consumibles", "cuasiusufructo", "usufructo de herencia y deudas"]
    normas_base: ["CC", "LAU"]
    remisiones:
      - {norma: "CC", articulo: "467", tipo: "regula", nota: "Derecho a disfrutar bienes ajenos conservando su forma y sustancia, salvo que el título o la ley autoricen otra cosa."}
      - {norma: "CC", articulo: "468", tipo: "regula", nota: "Se constituye por ley, por actos entre vivos o de última voluntad y por prescripción."}
      - {norma: "CC", articulo: "469", tipo: "conexa", nota: "Sobre todos o parte de los frutos, a favor de uno o varios, simultánea o sucesivamente, a plazo o bajo condición."}
      - {norma: "CC", articulo: "470", tipo: "regula", nota: "Rige el título constitutivo; en su defecto o por insuficiencia, las normas del Código."}
      - {norma: "CC", articulo: "471", tipo: "regula", nota: "El usufructuario percibe todos los frutos naturales, industriales y civiles."}
      - {norma: "CC", articulo: "472", tipo: "conexa", nota: "Frutos pendientes: al empezar, del usufructuario; al extinguirse, del propietario, que abona los gastos de cultivo."}
      - {norma: "CC", articulo: "474", tipo: "regula", nota: "Los frutos civiles se perciben día por día y son del usufructuario en proporción al tiempo del usufructo."}
      - {norma: "CC", articulo: "480", tipo: "regula", nota: "Puede usar, arrendar y enajenar su derecho, pero sus contratos se resuelven al fin del usufructo (salvo rústicos)."}
      - {norma: "CC", articulo: "481", tipo: "conexa", nota: "Cosas que se deterioran con el uso: se restituyen como estén, indemnizando el deterioro por dolo o negligencia."}
      - {norma: "CC", articulo: "482", tipo: "regula", nota: "Cosas consumibles: pagar el avalúo si se dieron estimadas; si no, restituir igual cantidad y calidad o su precio."}
      - {norma: "CC", articulo: "487", tipo: "regula", nota: "Mejoras útiles o de recreo sin derecho a indemnización; puede retirarlas si no daña los bienes."}
      - {norma: "CC", articulo: "488", tipo: "conexa", nota: "El usufructuario puede compensar los desperfectos con las mejoras hechas."}
      - {norma: "CC", articulo: "489", tipo: "regula", nota: "El nudo propietario puede enajenar, pero no alterar forma ni sustancia ni perjudicar al usufructuario."}
      - {norma: "CC", articulo: "490", tipo: "conexa", nota: "Usufructo de cuota de cosa común: ejerce la administración; dividida la cosa, recae sobre la parte adjudicada."}
      - {norma: "CC", articulo: "491", tipo: "regula", nota: "Antes de entrar en el goce: inventario con citación del propietario y fianza."}
      - {norma: "CC", articulo: "492", tipo: "regula", nota: "Sin fianza: vendedor o donante con reserva de usufructo, padres y cónyuge viudo (salvo nuevo matrimonio)."}
      - {norma: "CC", articulo: "493", tipo: "conexa", nota: "Puede dispensarse de inventario o fianza si no resulta perjuicio a nadie."}
      - {norma: "CC", articulo: "494", tipo: "conexa", nota: "Sin fianza debida: administración de inmuebles, venta de muebles, inversión del metálico o retención por el propietario."}
      - {norma: "CC", articulo: "497", tipo: "regula", nota: "El usufructuario cuida las cosas como un buen padre de familia."}
      - {norma: "CC", articulo: "498", tipo: "conexa", nota: "Si enajena o arrienda su derecho, responde del menoscabo causado por culpa del sustituto."}
      - {norma: "CC", articulo: "500", tipo: "regula", nota: "Reparaciones ordinarias, a cargo del usufructuario; si no las hace tras requerimiento, las hace el propietario a su costa."}
      - {norma: "CC", articulo: "501", tipo: "regula", nota: "Reparaciones extraordinarias, a cargo del propietario; el usufructuario avisa si son urgentes."}
      - {norma: "CC", articulo: "502", tipo: "regula", nota: "Extraordinarias: el propietario que las hace cobra interés legal; si no, las hace el usufructuario y cobra el aumento de valor."}
      - {norma: "CC", articulo: "503", tipo: "conexa", nota: "El propietario puede hacer obras y mejoras si no disminuye el valor del usufructo."}
      - {norma: "CC", articulo: "504", tipo: "regula", nota: "Cargas y contribuciones anuales y gravámenes de los frutos, a cargo del usufructuario mientras dure el usufructo."}
      - {norma: "CC", articulo: "505", tipo: "regula", nota: "Contribuciones impuestas directamente sobre el capital, a cargo del propietario, con intereses a cargo del usufructuario."}
      - {norma: "CC", articulo: "507", tipo: "conexa", nota: "Cobro de créditos usufructuados: libre con fianza; sin ella, con autorización del propietario o del juez."}
      - {norma: "CC", articulo: "508", tipo: "conexa", nota: "El usufructuario universal paga el legado de renta vitalicia o alimentos; el de cuota, en proporción."}
      - {norma: "CC", articulo: "509", tipo: "conexa", nota: "El usufructuario de finca hipotecada no paga la deuda garantizada; si la pierde por ejecución, le responde el propietario."}
      - {norma: "CC", articulo: "510", tipo: "conexa", nota: "Usufructo de herencia: puede anticipar lo de las deudas y recuperarlo sin interés al extinguirse."}
      - {norma: "CC", articulo: "511", tipo: "conexa", nota: "Debe comunicar al propietario los actos de terceros que lesionen la propiedad, o responde de los daños."}
      - {norma: "CC", articulo: "512", tipo: "conexa", nota: "Gastos, costas y condenas de los pleitos sobre el usufructo, a cargo del usufructuario."}
      - {norma: "CC", articulo: "513", tipo: "regula", nota: "Extinción: muerte, plazo o condición, consolidación, renuncia, pérdida total, resolución del derecho del constituyente, prescripción."}
      - {norma: "CC", articulo: "514", tipo: "conexa", nota: "Pérdida parcial: el usufructo continúa sobre la parte restante."}
      - {norma: "CC", articulo: "515", tipo: "conexa", nota: "A favor de pueblo, corporación o sociedad, no más de treinta años."}
      - {norma: "CC", articulo: "517", tipo: "conexa", nota: "Perecido el edificio, el usufructuario disfruta del suelo y de los materiales."}
      - {norma: "CC", articulo: "520", tipo: "regula", nota: "El mal uso no extingue el usufructo; con perjuicio considerable, el propietario puede pedir la entrega pagando el líquido."}
      - {norma: "CC", articulo: "521", tipo: "conexa", nota: "Usufructo a favor de varias personas vivas: dura hasta la muerte de la última."}
      - {norma: "CC", articulo: "522", tipo: "regula", nota: "Terminado, se entrega la cosa al propietario, salvo retención por desembolsos reintegrables; se cancela la fianza."}
      - {norma: "CC", articulo: "528", tipo: "conexa", nota: "Las normas del usufructo se aplican a los derechos de uso y habitación en lo que no se opongan."}
      - {norma: "LAU", articulo: "13", apartado: "2", tipo: "conexa", nota: "Los arrendamientos otorgados por el usufructuario se extinguen al término de su derecho, además de por las causas de la LAU."}
    no_consta_en_norma:
      - "Usufructo con facultad de disponer y sus límites: construcción jurisprudencial y notarial."
      - "Reparto entre usufructuario y nudo propietario de las derramas extraordinarias de la comunidad: no lo resuelve el CC; jurisprudencial."
    afines: ["Derechos de uso y habitación", "Derechos del cónyuge viudo", "Legítimas: cuantía y cálculo", "Liquidación del estado posesorio: frutos, gastos y mejoras", "Arrendamiento de cosas en el Código Civil (régimen supletorio)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Preterición y desheredación"
    sinonimos: ["preterición", "heredero forzoso omitido", "hijo olvidado en el testamento", "preterición intencional", "preterición no intencional", "desheredación", "desheredar a un hijo", "causas de desheredación", "maltrato de obra", "injurias graves al testador", "negación de alimentos", "desheredación injusta", "reconciliación", "complemento de la legítima", "indignidad para suceder", "intangibilidad de la legítima"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "813", tipo: "regula", nota: "Solo se priva de la legítima en los casos legales; sobre ella no cabe gravamen, condición ni sustitución, salvo excepciones."}
      - {norma: "CC", articulo: "814", tipo: "regula", nota: "La preterición no perjudica la legítima: se reduce la institución de heredero antes que legados y mejoras."}
      - {norma: "CC", articulo: "814", apartado: "párrafo 2.º", tipo: "regula", nota: "Preterición no intencional de descendientes: si son todos, se anula lo patrimonial; si no, la institución de heredero."}
      - {norma: "CC", articulo: "815", tipo: "regula", nota: "El legitimario que recibió por cualquier título menos de su legítima puede pedir el complemento."}
      - {norma: "CC", articulo: "806", tipo: "conexa", nota: "Legítima: porción reservada por la ley a los herederos forzosos, de la que el testador no puede disponer."}
      - {norma: "CC", articulo: "807", tipo: "conexa", nota: "Herederos forzosos: descendientes; a falta de ellos, ascendientes; y el viudo en la forma que fija el Código."}
      - {norma: "CC", articulo: "848", tipo: "regula", nota: "La desheredación solo cabe por alguna de las causas que expresamente señala la ley."}
      - {norma: "CC", articulo: "849", tipo: "regula", nota: "Solo puede hacerse en testamento, expresando la causa legal en que se funda."}
      - {norma: "CC", articulo: "850", tipo: "regula", nota: "Si el desheredado niega la causa, la prueba de su certeza corresponde a los herederos del testador."}
      - {norma: "CC", articulo: "851", tipo: "regula", nota: "Desheredación injusta: anula la institución de heredero en lo que perjudique al desheredado; valen legados y mejoras."}
      - {norma: "CC", articulo: "852", tipo: "regula", nota: "Son causas de desheredación las de indignidad del art. 756, números 1.º, 2.º, 3.º, 5.º y 6.º, en los términos de los arts. 853 a 855."}
      - {norma: "CC", articulo: "853", tipo: "regula", nota: "Descendientes: además, negar alimentos sin motivo legítimo y maltratar de obra o injuriar gravemente de palabra."}
      - {norma: "CC", articulo: "854", tipo: "regula", nota: "Ascendientes: pérdida de la patria potestad (art. 170), negar alimentos o atentar contra la vida del otro progenitor."}
      - {norma: "CC", articulo: "855", tipo: "regula", nota: "Cónyuge: incumplir grave o reiteradamente los deberes conyugales, negar alimentos o atentar contra la vida del testador."}
      - {norma: "CC", articulo: "856", tipo: "regula", nota: "La reconciliación posterior priva del derecho a desheredar y deja sin efecto la desheredación ya hecha."}
      - {norma: "CC", articulo: "857", tipo: "regula", nota: "Los descendientes del desheredado ocupan su lugar y conservan los derechos de herederos forzosos a la legítima."}
      - {norma: "CC", articulo: "756", tipo: "conexa", nota: "Causas de indignidad para suceder (atentados, delitos contra la familia, denuncia falsa, coacción sobre el testamento)."}
      - {norma: "CC", articulo: "757", tipo: "conexa", nota: "La indignidad no surte efecto si el testador la conocía al testar o la remite después en documento público."}
      - {norma: "CC", articulo: "816", tipo: "conexa", nota: "Es nula la renuncia o transacción sobre la legítima futura; lo recibido por ella se trae a colación."}
    # VIGENCIA: CC 756.2.º trae en el espejo la errata «de un menoro del ejercicio» (léase «menor o del»); contraste_boe.py no la ve porque compara sin espacios. Sin cambio de fondo. (Ver notas.)
    no_consta_en_norma:
      - "Maltrato psicológico y abandono emocional como maltrato de obra del art. 853.2.ª: jurisprudencial."
      - "Distinción entre preterición intencional y no intencional y su prueba: jurisprudencial."
      - "Plazo para impugnar la desheredación o hacer valer la preterición: el CC no lo fija expresamente; jurisprudencial."
    afines: ["Legítimas: cuantía y cálculo", "Nulidad e interpretación del testamento", "Reducción de donaciones inoficiosas", "Sucesión intestada", "Alimentos entre parientes", "Partición de la herencia y su impugnación"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Reducción de donaciones inoficiosas"
    sinonimos: ["donación inoficiosa", "inoficiosidad", "reducción de donaciones", "reducción de legados", "donaciones que perjudican la legítima", "cómputo de la legítima", "relictum y donatum", "imputación de donaciones", "donación a un hijo como anticipo de legítima", "donación a extraños", "legado de usufructo que excede el tercio libre", "cautela socini", "finca indivisible en la reducción"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "636", tipo: "regula", nota: "Nadie puede dar ni recibir por donación más de lo que puede dar o recibir por testamento; el exceso es inoficioso."}
      - {norma: "CC", articulo: "654", tipo: "regula", nota: "Se reducen en el exceso, computando el líquido al morir el donante; surten efecto en vida y el donatario hace suyos los frutos."}
      - {norma: "CC", articulo: "654", apartado: "párrafo 2.º", tipo: "conexa", nota: "La reducción se rige por este capítulo y por los arts. 820 y 821."}
      - {norma: "CC", articulo: "655", tipo: "regula", nota: "Solo piden la reducción los legitimarios o herederos de cuota y sus herederos o causahabientes."}
      - {norma: "CC", articulo: "655", apartado: "párrafo 2.º", tipo: "regula", nota: "No pueden renunciar a ese derecho en vida del donante, ni expresamente ni consintiendo la donación."}
      - {norma: "CC", articulo: "655", apartado: "párrafo 3.º", tipo: "regula", nota: "Ni donatarios, ni legatarios que no sean de parte alícuota, ni acreedores del difunto pueden pedirla ni aprovecharla."}
      - {norma: "CC", articulo: "656", tipo: "regula", nota: "Si no caben todas en la parte disponible, se suprimen o reducen primero las de fecha más reciente."}
      - {norma: "CC", articulo: "817", tipo: "regula", nota: "Las disposiciones testamentarias que mengüen la legítima se reducen, a petición del legitimario, en lo inoficioso."}
      - {norma: "CC", articulo: "818", tipo: "regula", nota: "Legítima: valor de los bienes al morir, menos deudas y cargas (no las testamentarias)."}
      - {norma: "CC", articulo: "818", apartado: "párrafo 2.º", tipo: "regula", nota: "Al valor líquido se agrega el de las donaciones colacionables."}
      - {norma: "CC", articulo: "819", tipo: "regula", nota: "Donaciones a hijos sin carácter de mejora: a su legítima; a extraños: a la parte libre; el exceso se reduce."}
      - {norma: "CC", articulo: "820", tipo: "regula", nota: "Orden: se respetan las donaciones mientras se cubra la legítima, reduciendo antes las mandas, a prorrata."}
      - {norma: "CC", articulo: "820", apartado: "3.º", tipo: "regula", nota: "Legado de usufructo o renta vitalicia que excede lo disponible: cumplirlo o entregar la parte libre."}
      - {norma: "CC", articulo: "821", tipo: "regula", nota: "Finca indivisible: para el legatario si la reducción no absorbe la mitad de su valor; si no, para los legitimarios."}
      - {norma: "CC", articulo: "822", tipo: "conexa", nota: "No computa para la legítima la habitación de la vivienda habitual a favor del legitimario con discapacidad conviviente."}
      - {norma: "CC", articulo: "825", tipo: "conexa", nota: "La donación a un descendiente legitimario no es mejora si el donante no declara expresamente la voluntad de mejorar."}
      - {norma: "CC", articulo: "815", tipo: "conexa", nota: "El legitimario que recibió menos de su legítima puede pedir el complemento."}
      - {norma: "CC", articulo: "1035", tipo: "conexa", nota: "El heredero forzoso que concurre con otros trae a la masa lo recibido del causante en vida, para computar legítimas y partir."}
