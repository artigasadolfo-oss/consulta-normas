      - {norma: "CC", articulo: "837", tipo: "regula", nota: "Sin descendientes pero con ascendientes: usufructo de la mitad de la herencia."}
      - {norma: "CC", articulo: "838", tipo: "regula", nota: "Sin descendientes ni ascendientes: usufructo de los dos tercios de la herencia."}
      - {norma: "CC", articulo: "839", tipo: "regula", nota: "Los herederos pueden conmutar el usufructo por renta vitalicia, productos de bienes o capital, por acuerdo o mandato judicial."}
      - {norma: "CC", articulo: "839", apartado: "párrafo 2.º", tipo: "regula", nota: "Mientras no se conmute, todos los bienes de la herencia quedan afectos al pago del usufructo del viudo."}
      - {norma: "CC", articulo: "840", tipo: "regula", nota: "Con hijos solo del causante, el viudo puede exigir la conmutación por capital o lote de bienes, a elección de los hijos."}
      - {norma: "CC", articulo: "813", apartado: "párrafo 2.º", tipo: "conexa", nota: "El usufructo del viudo es excepción a la prohibición de gravar la legítima."}
      - {norma: "CC", articulo: "492", tipo: "conexa", nota: "El cónyuge sobreviviente no presta fianza por la cuota legal usufructuaria, salvo que contraiga nuevo matrimonio."}
      - {norma: "CC", articulo: "944", tipo: "regula", nota: "Abintestato, sin descendientes ni ascendientes, el viudo hereda todo antes que los colaterales."}
      - {norma: "CC", articulo: "945", tipo: "regula", nota: "No hay llamamiento abintestato si el cónyuge estaba separado legalmente o de hecho."}
      - {norma: "CC", articulo: "1321", tipo: "regula", nota: "El ajuar de la vivienda habitual común se entrega al viudo sin computárselo en su haber, salvo objetos de extraordinario valor."}
      - {norma: "CC", articulo: "1406", tipo: "regula", nota: "En la liquidación de gananciales, por muerte del otro, el viudo puede pedir que se incluya en su haber la vivienda habitual."}
      - {norma: "CC", articulo: "1407", tipo: "regula", nota: "Puede pedir la propiedad o un derecho de uso o habitación, abonando en dinero el exceso sobre su haber."}
      - {norma: "CC", articulo: "822", apartado: "párrafo 4.º", tipo: "conexa", nota: "La habitación del legitimario con discapacidad coexiste con los derechos del cónyuge de los arts. 1406 y 1407."}
      - {norma: "CC", articulo: "831", tipo: "conexa", nota: "Puede conferirse al cónyuge en testamento la facultad de mejorar y distribuir la herencia entre los hijos comunes."}
      - {norma: "CC", articulo: "855", tipo: "conexa", nota: "Causas específicas para desheredar al cónyuge."}
      - {norma: "CC", articulo: "9", apartado: "8", tipo: "conexa", nota: "Los derechos que por ley se atribuyen al cónyuge supérstite se rigen por la ley de los efectos del matrimonio."}
    no_consta_en_norma:
      - "Derechos sucesorios de la pareja de hecho: el CC no se los reconoce; solo por testamento o derecho autonómico."
      - "Cálculo del valor del usufructo viudal para conmutarlo: no lo fija el CC; se acude a criterios fiscales o periciales."
    afines: ["Usufructo", "Sucesión intestada", "Legítimas: cuantía y cálculo", "Disolución y liquidación de la sociedad de gananciales", "Uso de la vivienda familiar", "Derechos de uso y habitación"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Albacea y contador-partidor"
    sinonimos: ["albacea", "albaceazgo", "ejecutor testamentario", "albacea universal", "albaceas mancomunados", "plazo del albaceazgo", "prórroga del albaceazgo", "rendición de cuentas del albacea", "remoción del albacea", "contador-partidor", "comisario partidor", "contador-partidor dativo", "partición por contador", "pago en metálico de la legítima", "aprobación de la partición por notario o LAJ"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "892", tipo: "regula", nota: "El testador puede nombrar uno o más albaceas."}
      - {norma: "CC", articulo: "893", tipo: "conexa", nota: "No puede ser albacea quien no tenga capacidad para obligarse, ni el menor."}
      - {norma: "CC", articulo: "894", tipo: "conexa", nota: "El albacea puede ser universal o particular; varios, mancomunada, sucesiva o solidariamente."}
      - {norma: "CC", articulo: "895", tipo: "regula", nota: "Mancomunados: vale lo hecho por todos, por uno autorizado por los demás o, en disidencia, por la mayoría."}
      - {norma: "CC", articulo: "896", tipo: "conexa", nota: "En caso de suma urgencia, uno de los mancomunados puede actuar bajo su responsabilidad, dando cuenta a los demás."}
      - {norma: "CC", articulo: "897", tipo: "conexa", nota: "Sin solidaridad ni orden fijados por el testador, se entienden nombrados mancomunadamente."}
      - {norma: "CC", articulo: "898", tipo: "regula", nota: "Cargo voluntario: se entiende aceptado si no se excusa en seis días desde que conoce el nombramiento o la muerte."}
      - {norma: "CC", articulo: "899", tipo: "conexa", nota: "Aceptado, debe desempeñarlo; puede renunciar con justa causa a criterio del LAJ o del notario."}
      - {norma: "CC", articulo: "900", tipo: "conexa", nota: "Si no acepta o renuncia sin justa causa, pierde lo que le dejó el testador, salvo la legítima."}
      - {norma: "CC", articulo: "901", tipo: "regula", nota: "El albacea tiene las facultades que le confiera expresamente el testador y no sean contrarias a la ley."}
      - {norma: "CC", articulo: "902", tipo: "regula", nota: "Facultades legales: funeral, pagar legados en metálico con beneplácito del heredero, vigilar la ejecución y conservar bienes."}
      - {norma: "CC", articulo: "903", tipo: "conexa", nota: "Sin dinero para funeral y legados, promueve la venta de muebles y, si no basta, de inmuebles, con intervención de herederos."}
      - {norma: "CC", articulo: "904", tipo: "regula", nota: "Sin plazo fijado, un año desde la aceptación o desde que terminen los litigios sobre la validez del testamento."}
      - {norma: "CC", articulo: "905", tipo: "regula", nota: "Prórroga testamentaria; sin fijarla, un año más; después, el LAJ o el notario pueden conceder otra."}
      - {norma: "CC", articulo: "906", tipo: "conexa", nota: "Herederos y legatarios pueden prorrogar el plazo por acuerdo unánime; por mayoría, no más de un año."}
      - {norma: "CC", articulo: "907", tipo: "regula", nota: "El albacea rinde cuentas a los herederos; si debía distribuir bienes según el testador, al juez; no cabe dispensa."}
      - {norma: "CC", articulo: "908", tipo: "regula", nota: "Cargo gratuito salvo remuneración del testador, sin perjuicio de cobrar los trabajos de partición."}
      - {norma: "CC", articulo: "909", tipo: "conexa", nota: "El albacea no puede delegar el cargo sin autorización expresa del testador."}
      - {norma: "CC", articulo: "910", tipo: "regula", nota: "Termina por muerte, imposibilidad, renuncia, remoción (apreciada por el juez) o expiración del plazo."}
      - {norma: "CC", articulo: "911", tipo: "conexa", nota: "Terminado el albaceazgo o no aceptado, la ejecución corresponde a los herederos."}
      - {norma: "CC", articulo: "1057", tipo: "regula", nota: "El testador puede encomendar la partición a cualquier persona que no sea coheredero."}
      - {norma: "CC", articulo: "1057", apartado: "párrafo 2.º", tipo: "regula", nota: "Contador-partidor dativo: lo nombra el LAJ o el notario a petición de quienes representen al menos el 50 % del haber."}
      - {norma: "CC", articulo: "1057", apartado: "párrafo 3.º", tipo: "conexa", nota: "Con coherederos menores o sujetos a tutela, el contador inventaría con citación de sus representantes."}
      - {norma: "CC", articulo: "1056", tipo: "conexa", nota: "Se pasa por la partición hecha por el testador en cuanto no perjudique la legítima."}
      - {norma: "CC", articulo: "841", tipo: "regula", nota: "El testador o el contador-partidor autorizado pueden adjudicar bienes a un descendiente y pagar en metálico a los demás."}
      - {norma: "CC", articulo: "843", tipo: "conexa", nota: "Esa partición requiere aprobación del LAJ o notario, salvo confirmación expresa de todos los descendientes."}
      - {norma: "CC", articulo: "844", tipo: "conexa", nota: "La decisión de pago en metálico caduca si no se comunica en un año desde la apertura o no se paga en otro año."}
    no_consta_en_norma:
      - "Facultad del contador-partidor de interpretar el testamento y límites de su partición (no puede disponer ni transigir): jurisprudencial."
      - "Plazo del contador-partidor: el CC no lo fija; se aplica por analogía el del albacea (art. 904), según la jurisprudencia."
    afines: ["Partición de la herencia y su impugnación", "División judicial de la herencia", "Nulidad e interpretación del testamento", "Administración e intervención del caudal hereditario", "Mandato y rendición de cuentas"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Ley aplicable a la sucesión de extranjeros"
    sinonimos: ["sucesión internacional", "herencia de extranjero", "residente extranjero fallecido en España", "ley nacional del causante", "residencia habitual del causante", "professio iuris", "elección de ley en testamento", "reenvío", "orden público y ley extranjera", "prueba del derecho extranjero", "competencia internacional en sucesiones", "testamento otorgado en el extranjero", "forma del testamento internacional", "vecindad civil", "británicos en Benidorm", "certificado sucesorio europeo"]
    normas_base: ["CC", "LEC", "LOPJ"]
    remisiones:
      - {norma: "CC", articulo: "9", apartado: "8", tipo: "regula", nota: "Norma interna: ley nacional del causante al fallecer; testamento válido según la ley nacional al otorgarlo, ajustando legítimas."}
      - {norma: "CC", articulo: "9", apartado: "1", tipo: "conexa", nota: "La ley personal es la de la nacionalidad y rige, entre otras materias, la sucesión por causa de muerte."}
      - {norma: "CC", articulo: "12", apartado: "1", tipo: "conexa", nota: "La calificación para determinar la norma de conflicto se hace siempre con arreglo a la ley española."}
      - {norma: "CC", articulo: "12", apartado: "2", tipo: "regula", nota: "La remisión al derecho extranjero es a su ley material, sin reenvío salvo el que se haga a la ley española."}
      - {norma: "CC", articulo: "12", apartado: "3", tipo: "regula", nota: "No se aplica la ley extranjera contraria al orden público."}
      - {norma: "CC", articulo: "12", apartado: "6", tipo: "regula", nota: "Tribunales y autoridades aplican de oficio las normas de conflicto del derecho español."}
      - {norma: "CC", articulo: "11", apartado: "1", tipo: "regula", nota: "Forma del testamento: ley del lugar de otorgamiento, la del contenido, la personal del disponente o la del inmueble."}
      - {norma: "CC", articulo: "16", apartado: "1", tipo: "conexa", nota: "Conflictos internos entre derechos civiles españoles: ley personal por vecindad civil, sin reglas de orden público ni reenvío."}
      - {norma: "CC", articulo: "14", apartado: "1", tipo: "conexa", nota: "La sujeción al derecho civil común o foral se determina por la vecindad civil."}
      - {norma: "CC", articulo: "732", tipo: "conexa", nota: "Los españoles pueden testar en el extranjero con las formas del país donde se hallen."}
      - {norma: "LEC", articulo: "281", apartado: "2", tipo: "regula", nota: "El derecho extranjero debe probarse en su contenido y vigencia; el tribunal puede valerse de otros medios de averiguación."}
      - {norma: "LOPJ", articulo: "22 quater", apartado: "g)", tipo: "regula", nota: "Competencia española en sucesiones: última residencia habitual en España, o bienes en España y causante español."}
    fuera_de_la_herramienta:
      - "Reglamento (UE) 650/2012, art. 83.1: se aplica a las sucesiones de quienes fallezcan el 17-08-2015 o después."
      - "Reglamento (UE) 650/2012, art. 21: ley de la residencia habitual del causante al fallecer, salvo vínculo manifiestamente más estrecho."
      - "Reglamento (UE) 650/2012, art. 22: el causante puede elegir en disposición mortis causa la ley de su nacionalidad."
      - "Reglamento (UE) 650/2012, art. 23: esa ley rige toda la sucesión (legítimas, desheredación, colación, partición, deudas)."
      - "Reglamento (UE) 650/2012, art. 34: reenvío limitado desde la ley de un tercer Estado; nunca si hubo elección de ley."
      - "Reglamento (UE) 650/2012, art. 4: competencia de los tribunales del Estado de la última residencia habitual del causante."
    no_consta_en_norma:
      - "Concepto de residencia habitual del causante: autónomo del Reglamento; lo perfilan el TJUE y sus considerandos."
      - "Aplicación del art. 9.8 CC tras el Reglamento: queda para sucesiones anteriores al 17-08-2015 y conflictos internos (vecindad civil)."
    afines: ["Nulidad e interpretación del testamento", "Sucesión intestada", "Legítimas: cuantía y cálculo", "Falta de jurisdicción / competencia internacional", "Ley aplicable al régimen económico de extranjeros", "Derechos del cónyuge viudo"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Bienes privativos y gananciales"
    sinonimos: ["sociedad de gananciales", "bien ganancial", "bien privativo", "carácter privativo o ganancial", "presunción de ganancialidad", "vivienda comprada antes del matrimonio", "compra con dinero privativo y ganancial", "atribución de ganancialidad", "confesión de privatividad", "herencia o donación a un cónyuge", "frutos de bienes privativos", "mejoras en bienes privativos", "reembolso a la sociedad", "subrogación real", "precio aplazado"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "1344", tipo: "regula", nota: "Son comunes las ganancias o beneficios obtenidos por cualquiera de los cónyuges, que se atribuyen por mitad al disolverse."}
      - {norma: "CC", articulo: "1345", tipo: "conexa", nota: "La sociedad empieza al celebrarse el matrimonio o, después, al pactarse en capitulaciones."}
      - {norma: "CC", articulo: "1316", tipo: "conexa", nota: "Sin capitulaciones, o si son ineficaces, el régimen es el de gananciales."}
      - {norma: "CC", articulo: "1346", tipo: "regula", nota: "Privativos: lo anterior al matrimonio, lo adquirido gratis o en sustitución de lo privativo, lo personal y los daños a la persona."}
      - {norma: "CC", articulo: "1347", tipo: "regula", nota: "Gananciales: lo obtenido con el trabajo, los frutos de privativos y gananciales y lo adquirido onerosamente con fondos comunes."}
      - {norma: "CC", articulo: "1348", tipo: "conexa", nota: "Los plazos cobrados de un crédito privativo pagadero en años no son gananciales."}
      - {norma: "CC", articulo: "1349", tipo: "conexa", nota: "El usufructo o pensión de un cónyuge es privativo; los frutos devengados durante el matrimonio, gananciales."}
      - {norma: "CC", articulo: "1351", tipo: "conexa", nota: "Las ganancias del juego y otras que eximan de restitución son gananciales."}
      - {norma: "CC", articulo: "1352", tipo: "conexa", nota: "Las acciones suscritas por la titularidad de otras privativas son privativas; si se pagaron con fondos comunes, se reembolsa."}
      - {norma: "CC", articulo: "1353", tipo: "conexa", nota: "Lo donado o dejado en testamento a ambos cónyuges sin designar partes es ganancial si lo aceptan ambos."}
      - {norma: "CC", articulo: "1354", tipo: "regula", nota: "Bien pagado en parte con dinero ganancial y en parte privativo: pro indiviso, en proporción a las aportaciones."}
      - {norma: "CC", articulo: "1355", tipo: "regula", nota: "Los cónyuges pueden atribuir de común acuerdo carácter ganancial a lo adquirido onerosamente, venga de donde venga el precio."}
      - {norma: "CC", articulo: "1355", apartado: "párrafo 2.º", tipo: "regula", nota: "Adquisición conjunta sin atribución de cuotas: se presume la voluntad de que sea ganancial."}
      - {norma: "CC", articulo: "1356", tipo: "regula", nota: "Compra a plazos durante la sociedad: el carácter lo determina el primer desembolso."}
      - {norma: "CC", articulo: "1357", tipo: "regula", nota: "Lo comprado a plazos antes de la sociedad es privativo aunque se pague después con dinero ganancial."}
      - {norma: "CC", articulo: "1357", apartado: "párrafo 2.º", tipo: "regula", nota: "Excepción: vivienda y ajuar familiares, a los que se aplica el art. 1354."}
      - {norma: "CC", articulo: "1358", tipo: "regula", nota: "Debe reembolsarse el valor pagado con el caudal ajeno al carácter del bien, actualizado al tiempo de liquidar."}
      - {norma: "CC", articulo: "1359", tipo: "regula", nota: "Edificaciones y mejoras siguen el carácter del bien al que afectan, sin perjuicio del reembolso."}
      - {norma: "CC", articulo: "1359", apartado: "párrafo 2.º", tipo: "regula", nota: "Mejora de privativo con fondos comunes o trabajo de un cónyuge: la sociedad es acreedora del aumento de valor."}
      - {norma: "CC", articulo: "1360", tipo: "conexa", nota: "Las mismas reglas se aplican a los incrementos patrimoniales incorporados a una empresa o establecimiento."}
      - {norma: "CC", articulo: "1361", tipo: "regula", nota: "Se presumen gananciales los bienes existentes en el matrimonio mientras no se pruebe que son privativos."}
      - {norma: "CC", articulo: "1324", tipo: "regula", nota: "Entre cónyuges basta la confesión del otro para probar la privatividad, pero no perjudica a legitimarios ni acreedores."}
      - {norma: "CC", articulo: "1323", tipo: "conexa", nota: "Los cónyuges pueden transmitirse bienes y contratar entre sí."}
      - {norma: "CC", articulo: "1381", tipo: "conexa", nota: "Los frutos de los privativos y las ganancias de los cónyuges forman parte del haber común."}
    no_consta_en_norma:
      - "Prueba de la privatividad del dinero invertido (rastreo de fondos) para destruir la presunción del art. 1361: jurisprudencial."
      - "Calificación de indemnizaciones por despido, planes de pensiones y derechos de jubilación: jurisprudencial."
      - "Cálculo de las cuotas en la vivienda familiar comprada antes del matrimonio y pagada después (arts. 1357 y 1354): jurisprudencial."
    afines: ["Deudas y responsabilidad de la sociedad de gananciales", "Disolución y liquidación de la sociedad de gananciales", "Capitulaciones matrimoniales", "Vivienda familiar: disposición por el cónyuge titular", "Ley aplicable al régimen económico de extranjeros"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Deudas y responsabilidad de la sociedad de gananciales"
    sinonimos: ["deudas gananciales", "deudas privativas", "cargas de la sociedad de gananciales", "responsabilidad de los bienes gananciales", "potestad doméstica", "deudas de un solo cónyuge", "embargo de bienes gananciales", "notificación del embargo al cónyuge", "sustitución del embargo por la cuota", "disolución por embargo", "deudas del negocio de un cónyuge", "deudas de juego", "precio aplazado de bien ganancial", "reintegro entre sociedad y cónyuge", "responsabilidad del cónyuge no deudor tras la liquidación"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1362", tipo: "regula", nota: "Cargas de la sociedad: sostenimiento de la familia e hijos comunes, bienes comunes, administración ordinaria y negocio o profesión."}
      - {norma: "CC", articulo: "1363", tipo: "conexa", nota: "También lo donado o prometido por ambos cónyuges de común acuerdo, salvo pacto de pago con privativos."}
      - {norma: "CC", articulo: "1364", tipo: "regula", nota: "El cónyuge que pagó con privativos un gasto a cargo de la sociedad tiene derecho a reintegro."}
      - {norma: "CC", articulo: "1365", tipo: "regula", nota: "Los gananciales responden directamente de las deudas de un cónyuge por potestad doméstica, gestión de gananciales o profesión."}
      - {norma: "CC", articulo: "1366", tipo: "regula", nota: "Obligaciones extracontractuales de un cónyuge en beneficio de la sociedad o administrando bienes: a su cargo, salvo dolo o culpa grave."}
      - {norma: "CC", articulo: "1367", tipo: "regula", nota: "Los gananciales responden siempre de lo contraído por ambos o por uno con consentimiento expreso del otro."}
      - {norma: "CC", articulo: "1368", tipo: "conexa", nota: "Y de lo contraído por uno, en separación de hecho, para el sostenimiento y educación de los hijos a cargo de la sociedad."}
      - {norma: "CC", articulo: "1369", tipo: "regula", nota: "De las deudas de un cónyuge que lo sean también de la sociedad responden solidariamente los bienes de esta."}
      - {norma: "CC", articulo: "1370", tipo: "conexa", nota: "Del precio aplazado del bien ganancial comprado por uno sin consentimiento del otro responde siempre el bien adquirido."}
      - {norma: "CC", articulo: "1371", tipo: "conexa", nota: "Lo perdido y pagado en el juego no disminuye la parte de gananciales si es moderado según los usos de la familia."}
      - {norma: "CC", articulo: "1372", tipo: "conexa", nota: "De lo perdido y no pagado en juegos con acción para reclamar responden solo los privativos del deudor."}
      - {norma: "CC", articulo: "1373", tipo: "regula", nota: "Deudas propias: responde el privativo; si no basta, embargo de gananciales, que el otro puede sustituir por la cuota del deudor."}
      - {norma: "CC", articulo: "1373", apartado: "párrafo 2.º", tipo: "regula", nota: "Ejecutados bienes comunes, el deudor se entiende que los recibió a cuenta de su participación."}
      - {norma: "CC", articulo: "1374", tipo: "regula", nota: "Disuelta así la sociedad, rige la separación de bienes salvo que el otro opte en tres meses por nueva sociedad de gananciales."}
      - {norma: "CC", articulo: "1319", apartado: "párrafo 2.º", tipo: "regula", nota: "Deudas por necesidades ordinarias de la familia: solidariamente comunes y del deudor; subsidiariamente, los del otro cónyuge."}
      - {norma: "CC", articulo: "1318", tipo: "conexa", nota: "Los bienes de los cónyuges están sujetos al levantamiento de las cargas del matrimonio."}
      - {norma: "CC", articulo: "1385", apartado: "párrafo 2.º", tipo: "conexa", nota: "Cualquiera de los cónyuges puede defender los bienes y derechos comunes por vía de acción o de excepción."}
      - {norma: "CC", articulo: "1390", tipo: "conexa", nota: "El cónyuge que con un acto propio obtiene lucro exclusivo o daña dolosamente a la sociedad le debe su importe."}
      - {norma: "CC", articulo: "1399", tipo: "conexa", nota: "En la liquidación se pagan primero las deudas de la sociedad, empezando por las alimenticias."}
      - {norma: "CC", articulo: "1401", tipo: "regula", nota: "Tras liquidar, los acreedores conservan su crédito contra el deudor; el no deudor responde con lo adjudicado si hubo inventario."}
      - {norma: "CC", articulo: "1401", apartado: "párrafo 2.º", tipo: "conexa", nota: "El cónyuge que pagó más de lo que le era imputable puede repetir contra el otro."}
      - {norma: "LEC", articulo: "541", apartado: "1", tipo: "regula", nota: "No se despacha ejecución frente a la comunidad de gananciales."}
      - {norma: "LEC", articulo: "541", apartado: "2", tipo: "regula", nota: "Deuda de un cónyuge de la que responde la sociedad: embargo notificado al otro, que puede oponerse; el acreedor prueba la responsabilidad."}
      - {norma: "LEC", articulo: "541", apartado: "3", tipo: "regula", nota: "Deuda propia con embargo de bienes comunes: notificación al no deudor, que puede pedir la disolución; se suspende la ejecución sobre ellos."}
      - {norma: "LEC", articulo: "541", apartado: "4", tipo: "conexa", nota: "El cónyuge notificado puede usar los recursos y medios de impugnación del ejecutado en defensa de los gananciales."}
