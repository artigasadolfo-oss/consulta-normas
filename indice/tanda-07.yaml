      - {norma: "LEC", articulo: "249", apartado: "1.8.º", tipo: "conexa", nota: "Acciones de la LPH que no son solo de cantidad (p. ej., obras más indemnización): juicio ordinario."}
      - {norma: "LEC", articulo: "250", apartado: "1.15.º", tipo: "conexa", nota: "Acciones de la LPH solo de cantidad: juicio verbal, sea cual fuere la cuantía."}
      - {norma: "LEC", articulo: "52", apartado: "1.8.º", tipo: "conexa", nota: "Juicios en materia de propiedad horizontal: tribunal del lugar de la finca."}
