  - voz: "Daños entre comunidad y propietarios (filtraciones)"
    sinonimos: ["filtraciones", "humedades", "goteras", "daños por agua", "responsabilidad de la comunidad", "daños del vecino de arriba", "bajante comunitaria"]
    normas_base: ["LPH", "CC", "LOE", "LEC"]
    remisiones:
      - {norma: "LPH", articulo: "10", apartado: "1.a)", tipo: "regula", nota: "Obras de conservación del inmueble y de sus instalaciones comunes: obligatorias, sin acuerdo previo de la junta."}
      - {norma: "LPH", articulo: "20", apartado: "c)", tipo: "regula", nota: "El administrador dispone las reparaciones urgentes y da cuenta inmediata al presidente o a los propietarios."}
      - {norma: "LPH", articulo: "14", apartado: "c)", tipo: "conexa", nota: "La junta aprueba las obras de reparación y es informada de las medidas urgentes del administrador."}
      - {norma: "LPH", articulo: "7", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Quien advierta reparaciones urgentes en lo común debe comunicarlo sin dilación al administrador."}
      - {norma: "LPH", articulo: "9", apartado: "1.a)", tipo: "regula", nota: "Respetar instalaciones y elementos comunes, también los de uso privativo, evitando daños o desperfectos."}
      - {norma: "LPH", articulo: "9", apartado: "1.b)", tipo: "regula", nota: "Conservar el piso y sus instalaciones privativas; resarcir los daños por su descuido o el de quienes dependan de él."}
      - {norma: "LPH", articulo: "9", apartado: "1.c)", tipo: "regula", nota: "Consentir reparaciones y servidumbres para el servicio del inmueble; la comunidad resarce los daños que cause."}
      - {norma: "LPH", articulo: "9", apartado: "1.d)", tipo: "conexa", nota: "Permitir la entrada en el piso para esas reparaciones."}
      - {norma: "LPH", articulo: "9", apartado: "1.g)", tipo: "regula", nota: "Cada titular responde ante los demás de las infracciones cometidas y de los daños causados."}
      - {norma: "LPH", articulo: "9", apartado: "1.f), párrafo 3.º", tipo: "conexa", nota: "Con cargo al fondo de reserva cabe un seguro de daños de la finca."}
      - {norma: "LPH", articulo: "22", apartado: "1", tipo: "conexa", nota: "Condena a la comunidad: sus fondos y, subsidiariamente, cada propietario que fue parte, por su cuota."}
      - {norma: "CC", articulo: "396", tipo: "regula", nota: "Comunes las conducciones de agua, desagüe, gas o electricidad hasta la entrada al privativo, cubiertas y fachadas."}
      - {norma: "CC", articulo: "1902", tipo: "regula", nota: "Responsabilidad por culpa o negligencia: base de la reclamación entre vecinos o frente a la comunidad."}
      - {norma: "CC", articulo: "1907", tipo: "regula", nota: "El propietario del edificio responde de los daños por ruina debida a falta de las reparaciones necesarias."}
      - {norma: "CC", articulo: "1910", tipo: "conexa", nota: "Quien habita la casa responde de los daños por lo que se arroje o caiga de ella."}
      - {norma: "CC", articulo: "1968", apartado: "2.º", tipo: "regula", nota: "Un año desde que lo supo el agraviado para la acción del art. 1902."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "conexa", nota: "Cinco años para la acción personal sin plazo especial."}
      - {norma: "LOE", articulo: "17", apartado: "1.b)", tipo: "conexa", nota: "Vicios que afectan a la habitabilidad: los agentes responden tres años desde la recepción de la obra."}
      - {norma: "LOE", articulo: "3", apartado: "1.c)", tipo: "conexa", nota: "La habitabilidad incluye la salubridad y la estanqueidad del ambiente interior (c.1)."}
