      - {norma: "LEC", articulo: "725", apartado: "1", tipo: "regula", nota: "Antes de la demanda no cabe declinatoria territorial; el tribunal examina de oficio jurisdicción y competencia."}
      - {norma: "LEC", articulo: "725", apartado: "2", tipo: "regula", nota: "Si se cree territorialmente incompetente, puede acordar en prevención las medidas más urgentes y remitir."}
      - {norma: "LEC", articulo: "724", tipo: "conexa", nota: "Arbitraje o proceso extranjero: tribunal del lugar de ejecución del laudo o donde la medida deba surtir efecto."}
      - {norma: "LEC", articulo: "722", tipo: "conexa", nota: "Pueden pedirlas las partes de un convenio arbitral o de un proceso extranjero."}
      - {norma: "LEC", articulo: "727", apartado: "5.ª", tipo: "conexa", nota: "Cabe anotar preventivamente el inicio de un medio de solución de controversias sobre bienes inscribibles."}
      - {norma: "LEC", articulo: "733", apartado: "2", tipo: "conexa", nota: "Con urgencia acreditada, la medida puede acordarse sin oír al futuro demandado."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "3", tipo: "regula", nota: "No hace falta acudir antes a un MASC para pedir medidas cautelares previas a la demanda."}
      - {norma: "LO 1/2025", articulo: "7", apartado: "3, párrafo 2.º", tipo: "regula", nota: "Medidas acordadas durante la negociación: demanda ante el mismo tribunal en 20 días desde el fin sin acuerdo."}
