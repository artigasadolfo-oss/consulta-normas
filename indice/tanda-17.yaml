      - {norma: "LEC", articulo: "741", apartado: "3", tipo: "regula", nota: "El auto sobre la oposición es apelable sin efecto suspensivo."}
      - {norma: "LEC", articulo: "742", tipo: "regula", nota: "Firme la estimación de la oposición, se liquidan los daños por los arts. 712 y ss. y se exigen al solicitante."}
