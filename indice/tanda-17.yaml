      - "Costas de los recursos de reposición, revisión y queja: la LEC no tiene regla propia; casuística."
      - "Costas de la impugnación de la sentencia por el apelado (art. 461): jurisprudencial."
    afines: ["Costas: vencimiento, temeridad y allanamiento", "Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Impugnación de la sentencia por el apelado", "Recurso de casación", "Depósito para recurrir", "Tasación de costas y su impugnación"]
