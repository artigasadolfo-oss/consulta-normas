      - {norma: "LEC", articulo: "398", apartado: "3", tipo: "regula", nota: "Casación estimada total o parcialmente: no se imponen costas a ninguna parte."}
      - {norma: "LEC", articulo: "397", tipo: "regula", nota: "La apelación que impugna la condena o no condena en costas de la instancia se resuelve con el art. 394."}
      - {norma: "LEC", articulo: "394", apartado: "1", tipo: "conexa", nota: "Vencimiento: costas a quien ve rechazadas todas sus pretensiones, salvo serias dudas de hecho o de derecho."}
      - {norma: "LEC", articulo: "394", apartado: "2", tipo: "conexa", nota: "Estimación parcial: cada parte las suyas y las comunes por mitad, salvo temeridad."}
      - {norma: "LEC", articulo: "394", apartado: "3", tipo: "conexa", nota: "Honorarios no sujetos a arancel: tope de un tercio de la cuantía, salvo temeridad."}
      - {norma: "LEC", articulo: "736", apartado: "1", tipo: "conexa", nota: "Apelación del auto que deniega medidas cautelares: costas según el art. 394."}
      - {norma: "LEC", articulo: "716", apartado: "párrafo 2.º", tipo: "conexa", nota: "El auto de liquidación de daños es apelable con pronunciamiento expreso de costas (art. 394)."}
      - {norma: "LEC", articulo: "241", apartado: "1.3.º", tipo: "conexa", nota: "Los depósitos necesarios para recurrir forman parte de las costas."}
      - {norma: "LEC", articulo: "450", apartado: "1", tipo: "conexa", nota: "Se puede desistir del recurso antes de resolverlo; de la casación, solo hasta el señalamiento."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "8", tipo: "regula", nota: "Estimado total o parcialmente el recurso, la misma resolución ordena devolver todo el depósito."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "9", tipo: "regula", nota: "Inadmitido el recurso o confirmada la resolución, el recurrente pierde el depósito."}
