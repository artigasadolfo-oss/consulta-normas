  - voz: "Medidas cautelares antes de la demanda"
    sinonimos: ["medidas cautelares previas a la demanda", "medidas cautelares urgentes", "medidas ante causam", "plazo de veinte días para demandar", "medidas que quedan sin efecto", "medidas en prevención", "medidas durante el MASC", "medidas antes del arbitraje", "competencia para medidas previas", "alzamiento por no presentar la demanda", "medidas cautelares y negociación previa"]
    normas_base: ["LEC", "LO 1/2025"]
