      - {norma: "LEC", articulo: "478", apartado: "1", tipo: "regula", nota: "Competencia de la Sala Primera del TS; del TSJ si se funda en Derecho civil propio y lo prevé el Estatuto."}
      - {norma: "LEC", articulo: "478", apartado: "2", tipo: "conexa", nota: "Si la misma parte recurre ante el TS y el TSJ, se tiene por no presentado el primero."}
      - {norma: "LEC", articulo: "479", apartado: "1", tipo: "regula", nota: "Se interpone ante el tribunal que dictó la resolución en veinte días desde el siguiente a la notificación."}
      - {norma: "LEC", articulo: "479", apartado: "2", tipo: "regula", nota: "El LAJ lo tiene por interpuesto en tres días si es recurrible, en plazo y con denuncia previa de lo procesal."}
      - {norma: "LEC", articulo: "481", apartado: "1", tipo: "regula", nota: "El escrito identifica el cauce, la modalidad y justificación del interés casacional, la norma infringida y lo que se pide."}
      - {norma: "LEC", articulo: "481", apartado: "2", tipo: "regula", nota: "Se articula en motivos; no se acumulan infracciones distintas en un mismo motivo."}
      - {norma: "LEC", articulo: "481", apartado: "3", tipo: "regula", nota: "Solo infracciones relevantes para el fallo, invocadas oportunamente o consideradas por la Audiencia."}
      - {norma: "LEC", articulo: "481", apartado: "4", tipo: "regula", nota: "Cada motivo se encabeza con la cita precisa de la norma infringida y el resumen de la infracción."}
      - {norma: "LEC", articulo: "481", apartado: "8", tipo: "conexa", nota: "La Sala de Gobierno del TS puede fijar extensión máxima y formato de los escritos de interposición y oposición."}
      - {norma: "LEC", articulo: "482", apartado: "1", tipo: "conexa", nota: "Remisión de autos y emplazamiento por treinta días; si el recurrente no comparece, recurso desierto."}
      - {norma: "LEC", articulo: "483", apartado: "1", tipo: "regula", nota: "El LAJ inadmite por decreto si faltan tiempo, forma, denuncia previa, depósitos o requisitos del 449."}
      - {norma: "LEC", articulo: "483", apartado: "3", tipo: "regula", nota: "Se inadmite por providencia sucintamente motivada y se admite por auto que razona por qué debe pronunciarse la Sala."}
      - {norma: "LEC", articulo: "483", apartado: "4", tipo: "regula", nota: "Contra la providencia o el auto sobre la admisión no cabe recurso."}
      - {norma: "LEC", articulo: "485", tipo: "conexa", nota: "Admitido, traslado a los recurridos para oponerse en veinte días y decir si quieren vista."}
      - {norma: "LEC", articulo: "486", apartado: "1", tipo: "conexa", nota: "Vista solo si la Sala la considera conveniente; si no, deliberación, votación y fallo."}
      - {norma: "LEC", articulo: "487", apartado: "1", tipo: "regula", nota: "Se resuelve por sentencia o, si se opone a doctrina ya fijada, por auto que casa y devuelve al tribunal de origen."}
      - {norma: "LEC", articulo: "487", apartado: "3", tipo: "regula", nota: "Con infracciones procesales y sustantivas, se resuelven primero las que llevarían a reponer actuaciones."}
      - {norma: "LEC", articulo: "487", apartado: "4", tipo: "conexa", nota: "Contra la sentencia o el auto que resuelve la casación no cabe recurso."}
      - {norma: "LEC", articulo: "449", apartado: "1", tipo: "conexa", nota: "Procesos con lanzamiento: el demandado debe acreditar el pago de rentas para recurrir en casación."}
      - {norma: "LEC", articulo: "398", apartado: "2", tipo: "conexa", nota: "Casación desestimada del todo: costas al recurrente, salvo circunstancias especiales."}
      - {norma: "LOPJ", articulo: "56", apartado: "1.º", tipo: "conexa", nota: "La Sala de lo Civil del TS conoce de los recursos de casación, revisión y otros extraordinarios civiles."}
      - {norma: "LOPJ", articulo: "73", apartado: "1.a)", tipo: "conexa", nota: "La Sala de lo Civil y Penal del TSJ conoce de la casación fundada en Derecho civil propio si lo prevé el Estatuto."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "3.d)", tipo: "conexa", nota: "Depósito de 50 euros para recurrir en casación."}
      - {norma: "CE", articulo: "123", apartado: "1", tipo: "conexa", nota: "El Tribunal Supremo es el órgano jurisdiccional superior en todos los órdenes, salvo garantías constitucionales."}
    no_consta_en_norma:
      - "Contenido de la «doctrina jurisprudencial» y del interés casacional notorio: los fija la Sala Primera en su práctica de admisión."
      - "Interés casacional por falta de doctrina del TS sobre la norma: requisitos de antigüedad de la norma, jurisprudencial."
      - "Error patente del 477.5: estándar fijado por la jurisprudencia de la Sala Primera."
    fuera_de_la_herramienta:
      - "Acuerdo de 8 de septiembre de 2023 de la Sala de Gobierno del TS (BOE-A-2023-19798): escritos de casación civil de 50.000 caracteres como máximo."
      - "Real Decreto-ley 5/2023, disposición transitoria 10.ª.4: la casación nueva rige frente a resoluciones dictadas desde su entrada en vigor."
      # PENDIENTE: no he comprobado en esta pasada qué dice el Estatuto valenciano sobre la casación ante el TSJ; la línea no afirma su contenido.
      - "Estatuto de Autonomía de la Comunitat Valenciana: decide si el TSJ conoce de la casación en Derecho civil valenciano (art. 478.1 LEC)."
    afines: ["Recurso extraordinario por infracción procesal", "Recurso de queja", "Costas en los recursos", "Depósito para recurrir", "Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Tutela judicial efectiva e indefensión"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Recurso extraordinario por infracción procesal"
    sinonimos: ["REIP", "recurso por infracción procesal", "infracción procesal en casación", "motivo procesal de casación", "denuncia previa en la instancia", "vulneración del art. 24 CE en casación", "régimen transitorio de la casación civil", "recurso extraordinario suprimido", "infracción de normas reguladoras de la sentencia", "nulidad por infracción procesal en casación"]
    normas_base: ["LEC", "LOPJ", "CE"]
    remisiones:
      - {norma: "LEC", articulo: "468", tipo: "conexa", nota: "Sin contenido desde el 20-03-2024 (RDL 6/2023), como los arts. 469 a 476: el recurso ya no existe."}
      - {norma: "LEC", articulo: "469", tipo: "conexa", nota: "Sin contenido; recogía los motivos (jurisdicción, sentencia, garantías procesales, art. 24 CE)."}
      - {norma: "LEC", articulo: "df 16", tipo: "conexa", nota: "Suprimida por el RDL 6/2023: era el régimen transitorio que atribuía este recurso a la Sala Primera."}
      - {norma: "LEC", articulo: "466", tipo: "regula", nota: "Contra las sentencias de segunda instancia de las Audiencias cabe ya solo el recurso de casación."}
      - {norma: "LEC", articulo: "477", apartado: "2", tipo: "regula", nota: "La casación se funda en infracción de norma procesal o sustantiva, siempre con interés casacional."}
      - {norma: "LEC", articulo: "477", apartado: "5", tipo: "regula", nota: "Valoración de la prueba y hechos fuera de la casación, salvo error de hecho patente e inmediatamente verificable."}
      - {norma: "LEC", articulo: "477", apartado: "6", tipo: "regula", nota: "Infracción procesal: hay que acreditar su denuncia previa en la instancia y, si era subsanable, la petición de subsanación."}
      - {norma: "LEC", articulo: "479", apartado: "2", tipo: "regula", nota: "Si el motivo es procesal, el recurso solo se tiene por interpuesto si consta la denuncia previa de la infracción."}
      - {norma: "LEC", articulo: "481", apartado: "1", tipo: "conexa", nota: "El escrito expresa la norma procesal o sustantiva infringida."}
      - {norma: "LEC", articulo: "483", apartado: "1", tipo: "regula", nota: "El LAJ inadmite por decreto si falta la denuncia previa en la instancia de la infracción procesal."}
      - {norma: "LEC", articulo: "487", apartado: "3", tipo: "regula", nota: "Se resuelven primero los motivos cuya estimación llevaría a reponer las actuaciones."}
      - {norma: "LEC", articulo: "488", tipo: "conexa", nota: "Sigue en el texto pero presupone el recurso suprimido y remite al 467, que está sin contenido."}
      - {norma: "LEC", articulo: "459", tipo: "conexa", nota: "En apelación se alega la infracción procesal de la primera instancia, acreditando su denuncia oportuna."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "3.c)", tipo: "conexa", nota: "Aún fija 50 euros de depósito para este recurso, aunque la LEC lo ha suprimido."}
      - {norma: "CE", articulo: "24", apartado: "1", tipo: "conexa", nota: "Tutela judicial efectiva sin indefensión: fundamento de los motivos procesales."}
    no_consta_en_norma:
      - "Si una infracción procesal sin interés casacional puede acceder a la casación: el 477.2 exige interés en todo caso; jurisprudencial."
      - "Recursos por infracción procesal aún pendientes contra resoluciones anteriores a la reforma: rige la ley anterior; casuística."
    fuera_de_la_herramienta:
      - "Real Decreto-ley 5/2023, disposición transitoria 10.ª.4: los recursos contra resoluciones anteriores a su vigor siguen la ley anterior."
      - "Real Decreto-ley 6/2023, art. 103.92: deja sin contenido los arts. 468 a 476 LEC con efectos de 20 de marzo de 2024."
    afines: ["Recurso de casación", "Nulidad de actuaciones", "Tutela judicial efectiva e indefensión", "Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Congruencia y motivación de la sentencia", "Recurso de queja"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Rescisión de la sentencia firme a instancia del rebelde"
    sinonimos: ["rescisión de sentencia firme", "audiencia al rebelde", "rebelde involuntario", "demandado rebelde", "fuerza mayor ininterrumpida", "desconocimiento del pleito", "emplazamiento por edictos", "cédula no recibida", "plazo de cuatro meses", "plazo máximo de dieciséis meses", "nueva sentencia tras la rescisión"]
    normas_base: ["LEC", "LOPJ"]
    remisiones:
      - {norma: "LEC", articulo: "501", tipo: "regula", nota: "El demandado que estuvo siempre en rebeldía puede pedir al tribunal que dictó la sentencia firme su rescisión."}
      - {norma: "LEC", articulo: "501", apartado: "1.º", tipo: "regula", nota: "Fuerza mayor ininterrumpida que le impidió comparecer, aunque conociera el pleito."}
      - {norma: "LEC", articulo: "501", apartado: "2.º", tipo: "regula", nota: "Desconocimiento del pleito: la cédula del art. 161 no llegó a su poder por causa no imputable."}
      - {norma: "LEC", articulo: "501", apartado: "3.º", tipo: "regula", nota: "Desconocimiento del pleito: emplazado por edictos y ausente del lugar del proceso y de donde se publicaron."}
      - {norma: "LEC", articulo: "502", apartado: "1.1.º", tipo: "regula", nota: "Veinte días desde la notificación personal de la sentencia firme."}
      - {norma: "LEC", articulo: "502", apartado: "1.2.º", tipo: "regula", nota: "Cuatro meses desde la publicación del edicto, si no se notificó personalmente."}
      - {norma: "LEC", articulo: "502", apartado: "2", tipo: "regula", nota: "Prórroga si persiste la fuerza mayor (134.2), con tope de dieciséis meses desde la notificación."}
      - {norma: "LEC", articulo: "503", tipo: "regula", nota: "No cabe contra sentencias firmes que por ley carecen de efecto de cosa juzgada."}
      - {norma: "LEC", articulo: "504", apartado: "1", tipo: "regula", nota: "La demanda no suspende la ejecución, salvo lo previsto en el art. 566."}
      - {norma: "LEC", articulo: "504", apartado: "2", tipo: "regula", nota: "Se tramita por el juicio ordinario."}
      - {norma: "LEC", articulo: "505", apartado: "1", tipo: "regula", nota: "Tras la prueba sobre las causas, sentencia sobre la rescisión, sin recurso."}
      - {norma: "LEC", articulo: "505", apartado: "2", tipo: "regula", nota: "Estimada, a instancia de parte se suspende la ejecución de la sentencia rescindida."}
      - {norma: "LEC", articulo: "506", apartado: "1", tipo: "regula", nota: "Desestimada, todas las costas al rebelde."}
      - {norma: "LEC", articulo: "506", apartado: "2", tipo: "regula", nota: "Estimada, sin costas salvo temeridad."}
      - {norma: "LEC", articulo: "507", apartado: "1", tipo: "regula", nota: "Estimada, diez días al rebelde para alegar como en la contestación; luego, el juicio que corresponda."}
      - {norma: "LEC", articulo: "508", tipo: "regula", nota: "Si el rebelde no alega, nueva sentencia en los mismos términos que la rescindida, sin recurso."}
      - {norma: "LEC", articulo: "566", apartado: "1", tipo: "conexa", nota: "Admitida la demanda, cabe suspender la ejecución con caución por lo litigado y los daños."}
      - {norma: "LEC", articulo: "500", tipo: "conexa", nota: "Si no se notificó personalmente, los recursos ordinarios corren desde el edicto en el Tablón Edictal Judicial Único."}
      - {norma: "LEC", articulo: "497", apartado: "2", tipo: "conexa", nota: "La sentencia se notifica al rebelde personalmente; en paradero desconocido, por extracto en el TEJU."}
      - {norma: "LEC", articulo: "164", tipo: "conexa", nota: "La comunicación edictal se hace por el Tablón Edictal Judicial Único, tras las averiguaciones del art. 156."}
      - {norma: "LEC", articulo: "524", apartado: "4", tipo: "conexa", nota: "Mientras corre el plazo de rescisión, solo cabe anotación preventiva de sentencias inscribibles."}
      - {norma: "LEC", articulo: "134", apartado: "2", tipo: "conexa", nota: "La fuerza mayor interrumpe los plazos; la aprecia el LAJ por decreto, recurrible en revisión."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "3.b)", tipo: "conexa", nota: "La rescisión a instancia del rebelde exige un depósito de 50 euros."}
    no_consta_en_norma:
      - "El 501.3.º y el 502.1.2.º aún hablan de edictos en Boletines Oficiales, hoy sustituidos por el TEJU (164): ajuste interpretativo."
      - "Rescisión o incidente de nulidad (228) ante un emplazamiento edictal sin agotar averiguaciones: jurisprudencial."
      - "Cómputo de los dieciséis meses del 502.2 cuando nunca hubo notificación: casuística."
    afines: ["Rebeldía del demandado", "Actos de comunicación: domicilio, emplazamiento y edictos", "Nulidad de actuaciones", "Revisión de sentencias firmes", "Suspensión de la ejecución", "Depósito para recurrir"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"
