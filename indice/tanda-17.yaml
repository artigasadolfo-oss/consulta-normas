      - {norma: "LEC", articulo: "730", apartado: "2, párrafo 2.º", tipo: "regula", nota: "Sin demanda ante el mismo tribunal en 20 días: alzamiento de oficio, costas y responsabilidad por daños."}
      - {norma: "LEC", articulo: "730", apartado: "2, párrafo 3.º", tipo: "regula", nota: "Medidas antes o durante un MASC: el acuerdo se comunica y decide sobre alzamiento o mantenimiento."}
      - {norma: "LEC", articulo: "730", apartado: "2, párrafo 4.º", tipo: "regula", nota: "Sin acuerdo, alzamiento a petición en 20 días desde el fin de la negociación o la propuesta sin respuesta."}
