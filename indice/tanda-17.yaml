voces:
  - voz: "Ejecución por entrega de cosas"
    sinonimos: ["ejecución no dineraria", "entrega de cosa mueble determinada", "entrega de cosas genéricas", "entrega de bien inmueble", "puesta en posesión del ejecutante", "condena a entregar", "embargo de garantía", "ocupantes del inmueble que debe entregarse", "cosas no separables en el lanzamiento", "desperfectos en el lanzamiento", "equivalente pecuniario", "cosa no hallada"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "699", tipo: "regula", nota: "El auto que despacha requiere al ejecutado para que cumpla en sus propios términos y en el plazo que fije, con apercibimientos."}
      - {norma: "LEC", articulo: "700", apartado: "párrafo 2.º", tipo: "regula", nota: "Si no cabe cumplimiento inmediato, embargo a petición del ejecutante para indemnizaciones sustitutorias y costas."}
      - {norma: "LEC", articulo: "700", apartado: "párrafo 3.º", tipo: "conexa", nota: "El embargo se alza si el ejecutado presta la caución que fije el LAJ (formas del 529.3)."}
      - {norma: "LEC", articulo: "701", apartado: "1", tipo: "regula", nota: "Cosa mueble determinada: el LAJ pone al ejecutante en posesión con apremios; lugares cerrados, con autorización judicial."}
      - {norma: "LEC", articulo: "701", apartado: "2", tipo: "conexa", nota: "Si no se halla la cosa, el LAJ interroga al ejecutado o a terceros con apercibimiento de desobediencia."}
      - {norma: "LEC", articulo: "701", apartado: "3", tipo: "regula", nota: "Si no aparece, el tribunal la sustituye a instancia del ejecutante por una justa compensación pecuniaria (712 y ss.)."}
      - {norma: "LEC", articulo: "702", apartado: "1", tipo: "regula", nota: "Cosas genéricas: puesta en posesión o facultad de adquirirlas a costa del ejecutado, con embargo para pagarlas."}
      - {norma: "LEC", articulo: "702", apartado: "2", tipo: "regula", nota: "Si la adquisición tardía ya no satisface al ejecutante, se fija el equivalente pecuniario con daños y perjuicios."}
      - {norma: "LEC", articulo: "703", apartado: "1", tipo: "regula", nota: "Inmueble: el LAJ ordena de inmediato lo que proceda según la condena y adecúa el Registro al título."}
      - {norma: "LEC", articulo: "703", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Cosas ajenas al título que haya en el inmueble: requerimiento para retirarlas; si no, se tienen por abandonadas."}
      - {norma: "LEC", articulo: "703", apartado: "2", tipo: "conexa", nota: "Plantaciones o instalaciones no separables reclamadas en el lanzamiento: se decide su abono si se insta en cinco días."}
      - {norma: "LEC", articulo: "703", apartado: "3", tipo: "conexa", nota: "Desperfectos del ejecutado u ocupantes: retención y depósito de sus bienes; daños liquidados por los arts. 712 y ss."}
      - {norma: "LEC", articulo: "704", apartado: "1", tipo: "regula", nota: "Vivienda habitual del ejecutado: un mes para desalojar, prorrogable otro con motivo fundado; día y hora del lanzamiento."}
      - {norma: "LEC", articulo: "704", apartado: "2", tipo: "regula", nota: "Terceros ocupantes: se les notifica para que presenten títulos en diez días; lanzamiento de los de mero hecho por el 675."}
      - {norma: "LEC", articulo: "675", apartado: "3", tipo: "conexa", nota: "Vista con los ocupantes en diez días; auto sin recurso; si no comparecen sin justa causa, se decreta el lanzamiento."}
      - {norma: "LEC", articulo: "548", tipo: "conexa", nota: "Resoluciones procesales o arbitrales: no se despacha ejecución en los veinte días siguientes a la firmeza."}
      - {norma: "LEC", articulo: "712", tipo: "conexa", nota: "Procedimiento para fijar el equivalente pecuniario de una prestación no dineraria o los daños y perjuicios."}
      - {norma: "LEC", articulo: "717", tipo: "conexa", nota: "Equivalente pecuniario: estimación razonada, traslado de diez días y trámite de los arts. 714 a 716."}
      - {norma: "CC", articulo: "1096", tipo: "regula", nota: "Cosa determinada: el acreedor puede compeler a la entrega; genérica: cumplimiento a costa del deudor; riesgo en mora."}
    no_consta_en_norma:
      - "Plazo del requerimiento del 699: lo fija el tribunal según el caso; la ley no da mínimo ni máximo."
      - "Destino y gastos de las cosas abandonadas del 703.1, párrafo 2.º: casuística."
      - "Momento de valoración del equivalente pecuniario (incumplimiento o liquidación): jurisprudencial."
    afines: ["Lanzamiento", "Ejecución de obligaciones de hacer y no hacer", "Liquidación de daños, frutos y rendición de cuentas", "Cargas anteriores y ocupantes del inmueble subastado", "Despacho de la ejecución y plazo de espera", "Títulos ejecutivos"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Ejecución de obligaciones de hacer y no hacer"
    sinonimos: ["condena de hacer", "condena de no hacer", "hacer personalísimo", "hacer no personalísimo", "ejecución a costa del deudor", "realización por tercero", "multas coercitivas", "deshacer lo mal hecho", "condena a emitir una declaración de voluntad", "elevación a escritura pública por el juez", "quebrantamiento de la condena de no hacer", "publicación de la sentencia"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "699", tipo: "regula", nota: "El auto que despacha requiere al ejecutado para que cumpla en sus propios términos y en el plazo que fije, con apercibimientos."}
      - {norma: "LEC", articulo: "700", apartado: "párrafo 2.º", tipo: "conexa", nota: "A petición del ejecutante, embargo para asegurar indemnizaciones sustitutorias y costas; revisión sin efecto suspensivo."}
      - {norma: "LEC", articulo: "705", tipo: "regula", nota: "Hacer: requerimiento con plazo según su naturaleza; el procurador del ejecutante puede practicarlo a su costa."}
      - {norma: "LEC", articulo: "706", apartado: "1", tipo: "regula", nota: "Hacer no personalísimo incumplido: el ejecutante elige encargarlo a un tercero a costa del ejecutado o el resarcimiento."}
      - {norma: "LEC", articulo: "706", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Si el título regula el incumplimiento, se está a él, sin opción del ejecutante."}
      - {norma: "LEC", articulo: "706", apartado: "2", tipo: "regula", nota: "Por tercero: un perito fija el coste; si el ejecutado no lo deposita ni afianza, embargo y realización inmediatos."}
      - {norma: "LEC", articulo: "707", tipo: "conexa", nota: "Condena a publicar la sentencia: se requiere al ejecutado para que contrate los anuncios a su costa."}
      - {norma: "LEC", articulo: "708", apartado: "1", tipo: "regula", nota: "Declaración de voluntad: pasados los 20 días del 548, auto que la tiene por emitida si constan los elementos esenciales."}
      - {norma: "LEC", articulo: "708", apartado: "2", tipo: "regula", nota: "Los elementos no esenciales los fija el tribunal según el uso; si faltan esenciales, solo daños y perjuicios."}
      - {norma: "LEC", articulo: "709", apartado: "1", tipo: "regula", nota: "Personalísimo: el ejecutante opta por equivalente pecuniario o multas mensuales; si no lo es, se sigue el art. 706."}
      - {norma: "LEC", articulo: "709", apartado: "2", tipo: "conexa", nota: "Si se sigue por el equivalente pecuniario, se impone además una multa única (art. 711)."}
      - {norma: "LEC", articulo: "709", apartado: "3", tipo: "regula", nota: "Multas mensuales: requerimientos trimestrales durante un año; después, equivalente u otras medidas idóneas."}
      - {norma: "LEC", articulo: "709", apartado: "4", tipo: "conexa", nota: "Si el título prevé el incumplimiento, se está a lo que disponga."}
      - {norma: "LEC", articulo: "710", apartado: "1", tipo: "regula", nota: "No hacer quebrantado: requerimiento para deshacer, indemnizar y no reiterar, bajo desobediencia; multas mensuales."}
      - {norma: "LEC", articulo: "710", apartado: "2", tipo: "regula", nota: "Si no cabe reiterar ni deshacer lo hecho, la ejecución sigue para resarcir daños y perjuicios."}
      - {norma: "LEC", articulo: "711", apartado: "1", tipo: "regula", nota: "Cuantía de las multas: precio del título o coste de mercado; mensual hasta el 20 % y única hasta el 50 %."}
      - {norma: "LEC", articulo: "711", apartado: "2", tipo: "conexa", nota: "Cesación en defensa de consumidores: multa de 600 a 60.000 euros por día de retraso, ingresada en el Tesoro."}
      - {norma: "LEC", articulo: "713", apartado: "1", tipo: "conexa", nota: "Liquidación de daños: relación detallada y valorada, con dictámenes y documentos."}
      - {norma: "LEC", articulo: "714", apartado: "2", tipo: "conexa", nota: "Si el deudor calla diez días o niega en genérico, se le tiene por conforme con los hechos alegados."}
      - {norma: "LEC", articulo: "715", tipo: "conexa", nota: "Oposición motivada: trámite del juicio verbal; cabe perito designado por el tribunal."}
      - {norma: "LEC", articulo: "716", tipo: "conexa", nota: "Auto que fija la cantidad en cinco días tras la vista; apelable sin efecto suspensivo; costas del 394."}
      - {norma: "CC", articulo: "1098", tipo: "regula", nota: "Si el obligado a hacer no lo hace, se ejecuta a su costa; si lo hace mal, puede ordenarse deshacerlo."}
      - {norma: "CC", articulo: "1099", tipo: "regula", nota: "Lo mismo si la obligación es de no hacer y el deudor ejecuta lo prohibido."}
      - {norma: "CC", articulo: "1101", tipo: "conexa", nota: "Indemnización de daños por dolo, negligencia o morosidad en el cumplimiento."}
    no_consta_en_norma:
      - "Línea entre hacer personalísimo y no personalísimo: la decide el tribunal por auto (709.1); casuística."
      - "Destino de las multas coercitivas de los arts. 709 y 710: la ley solo lo fija para la cesación de consumo (711.2)."
      - "Compatibilidad de las multas coercitivas con la indemnización de daños: jurisprudencial."
    fuera_de_la_herramienta:
      - "Código Penal, art. 556: desobediencia grave a la autoridad, con la que se apercibe en los arts. 701.2 y 710.1 LEC."
    afines: ["Ejecución por entrega de cosas", "Liquidación de daños, frutos y rendición de cuentas", "Despacho de la ejecución y plazo de espera", "Forma del contrato y elevación a escritura pública", "Daños y perjuicios por incumplimiento contractual", "Acciones colectivas y de cesación de consumo"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Embargo preventivo"
    sinonimos: ["embargo cautelar", "aseguramiento de una condena dineraria", "traba preventiva de bienes", "embargo preventivo en el juicio cambiario", "embargo preventivo en la venta a plazos", "anotación del embargo preventivo", "tercería en el embargo preventivo", "alzamiento del embargo preventivo", "mantenimiento del embargo tras la sentencia", "manifestación de bienes", "riesgo de insolvencia"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "727", apartado: "1.ª", tipo: "regula", nota: "Embargo preventivo para asegurar condenas a entregar dinero, frutos, rentas o cosas fungibles valorables."}
      - {norma: "LEC", articulo: "727", apartado: "1.ª, párrafo 2.º", tipo: "regula", nota: "Fuera de esos casos, cabe si es idóneo y no sustituible por otra medida igual de eficaz y menos onerosa."}
      - {norma: "LEC", articulo: "726", apartado: "1", tipo: "conexa", nota: "Solo cabe la medida conducente a la efectividad de la tutela y no sustituible por otra menos gravosa."}
      - {norma: "LEC", articulo: "728", apartado: "1", tipo: "regula", nota: "Peligro por la mora procesal: justificar que sin la medida se impediría o dificultaría la tutela."}
      - {norma: "LEC", articulo: "728", apartado: "2", tipo: "regula", nota: "Apariencia de buen derecho: datos y documentos para un juicio provisional e indiciario favorable."}
      - {norma: "LEC", articulo: "728", apartado: "3", tipo: "regula", nota: "Salvo norma en contra, el solicitante presta caución por los daños que la medida pueda causar al demandado."}
      - {norma: "LEC", articulo: "738", apartado: "2", tipo: "regula", nota: "Se traba por los arts. 584 y ss., sin manifestación de bienes del 589; mejora y reducción las decide el tribunal."}
      - {norma: "LEC", articulo: "729", tipo: "regula", nota: "Cabe tercería de dominio; la de mejor derecho, solo si el tercerista reclama dinero al deudor en otro proceso."}
      - {norma: "LEC", articulo: "729", apartado: "párrafo 2.º", tipo: "conexa", nota: "Conoce de esas tercerías el tribunal que acordó el embargo preventivo."}
      - {norma: "LEC", articulo: "731", apartado: "1", tipo: "regula", nota: "Con sentencia de condena, se mantiene hasta pasar el plazo del 548; si no se pide la ejecución, se alza."}
      - {norma: "LEC", articulo: "731", apartado: "1, párrafo 2.º", tipo: "conexa", nota: "Se alza si el proceso queda en suspenso más de seis meses por causa imputable al solicitante."}
      - {norma: "LEC", articulo: "731", apartado: "2", tipo: "conexa", nota: "Despachada la ejecución provisional, se alzan las medidas cautelares que guarden relación con ella."}
      - {norma: "LEC", articulo: "629", apartado: "1", tipo: "conexa", nota: "Bienes inscribibles: mandamiento de anotación preventiva de embargo; puede diligenciarlo el procurador."}
      - {norma: "LEC", articulo: "584", tipo: "conexa", nota: "No se embargan bienes cuyo valor exceda de lo asegurado, salvo que solo existan bienes de valor superior y sean necesarios."}
      - {norma: "LEC", articulo: "744", apartado: "1", tipo: "conexa", nota: "Absuelto el demandado en primera o segunda instancia, se alzan las medidas salvo que el recurrente pida mantenerlas."}
      - {norma: "LEC", articulo: "745", tipo: "conexa", nota: "Sentencia absolutoria firme, renuncia o desistimiento: alzamiento de oficio y daños y perjuicios por el 742."}
      - {norma: "LEC", articulo: "441", apartado: "4", tipo: "conexa", nota: "Venta a plazos inscrita (250.1.10.º): embargo preventivo inmediato, sin caución ni oposición del demandado."}
      - {norma: "LEC", articulo: "821", apartado: "2.2.ª", tipo: "regula", nota: "Juicio cambiario: embargo preventivo inmediato por el importe del título más intereses, gastos y costas."}
      - {norma: "LEC", articulo: "823", apartado: "1", tipo: "conexa", nota: "Cambiario: puede alzarse si en cinco días el deudor niega categóricamente su firma o la representación."}
      - {norma: "CC", articulo: "1923", apartado: "4.º", tipo: "conexa", nota: "El crédito preventivamente anotado por embargo prefiere sobre el bien, pero solo frente a créditos posteriores."}
    no_consta_en_norma:
      - "Si rige en el embargo preventivo el orden de embargo del 592: la remisión del 738.2 es genérica; casuística."
      - "Conversión del embargo preventivo en ejecutivo al despachar la ejecución: sin regla expresa; criterio de cada oficina."
      - "Prueba del peligro de insolvencia que se exige para embargar dinero: jurisprudencial."
    fuera_de_la_herramienta:
      - "Reglamento (UE) 655/2014: orden europea de retención de cuentas, con medidas de aplicación en la disposición final 27.ª LEC."
    afines: ["Medidas cautelares: presupuestos", "Caución", "Medidas cautelares sin audiencia y oposición", "Orden de embargo, mejora y reducción", "Tercería de dominio", "Tercería de mejor derecho", "Juicio cambiario"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Anotación preventiva de demanda"
    sinonimos: ["anotación de demanda", "anotación preventiva en el Registro de la Propiedad", "publicidad registral del pleito", "anotación de inicio de MASC", "anotación de inicio de negociación", "otras anotaciones registrales", "anotación preventiva de sentencia no firme", "cancelación de la anotación", "caducidad de la anotación", "tercero adquirente y litigio pendiente", "prohibición de disponer cautelar"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "727", apartado: "5.ª", tipo: "regula", nota: "Anotación de demanda o de inicio de MASC, arbitraje o litigio extranjero sobre bienes o derechos inscribibles."}
      - {norma: "LEC", articulo: "727", apartado: "6.ª", tipo: "regula", nota: "Otras anotaciones registrales, cuando la publicidad registral sea útil para el buen fin de la ejecución."}
      - {norma: "LEC", articulo: "727", apartado: "11.ª", tipo: "conexa", nota: "Otras medidas que prevean las leyes o que sean necesarias para asegurar la efectividad de la tutela."}
      - {norma: "LEC", articulo: "738", apartado: "2, párrafo 3.º", tipo: "regula", nota: "Acordada la anotación preventiva, se practica conforme a las normas del Registro correspondiente."}
      - {norma: "LEC", articulo: "730", apartado: "2, párrafo 3.º", tipo: "regula", nota: "Si se anotó el inicio del medio extrajudicial, la anotación de demanda surte efectos desde aquella fecha."}
      - {norma: "LEC", articulo: "728", apartado: "1", tipo: "regula", nota: "Presupuesto de peligro por la mora procesal: la medida debe evitar que se frustre la tutela."}
      - {norma: "LEC", articulo: "728", apartado: "2", tipo: "regula", nota: "Apariencia de buen derecho con datos y documentos; si faltan, prueba propuesta en el mismo escrito."}
      - {norma: "LEC", articulo: "728", apartado: "3", tipo: "regula", nota: "El solicitante presta caución, que el tribunal fija según la pretensión y el fundamento de la solicitud."}
      - {norma: "LEC", articulo: "737", tipo: "conexa", nota: "La caución se presta antes de cualquier acto de cumplimiento; su idoneidad se decide por providencia."}
      - {norma: "LEC", articulo: "722", tipo: "conexa", nota: "Pueden pedir la medida las partes de un convenio o proceso arbitral o de un proceso extranjero."}
      - {norma: "LEC", articulo: "524", apartado: "4", tipo: "regula", nota: "Sentencia no firme o en plazo de rescisión por rebeldía: solo anotación preventiva de lo inscribible o cancelable."}
      - {norma: "LEC", articulo: "731", apartado: "1", tipo: "conexa", nota: "Terminado el proceso sin condena, la medida no se mantiene; con condena, hasta pasar el plazo del 548."}
      - {norma: "LEC", articulo: "744", apartado: "1", tipo: "conexa", nota: "Absuelto el demandado, se alza la medida salvo que el recurrente pida su mantenimiento al recurrir."}
      - {norma: "LEC", articulo: "745", tipo: "conexa", nota: "Sentencia absolutoria firme, renuncia o desistimiento: alzamiento de oficio de las medidas."}
      - {norma: "LEC", articulo: "629", apartado: "2", tipo: "conexa", nota: "Bien no inmatriculado o inscrito a nombre de otro: anotación de suspensión según la legislación hipotecaria."}
    no_consta_en_norma:
      - "Qué acciones permiten anotar (reales o con trascendencia real): criterio registral y jurisprudencial."
      - "Efectos frente a terceros adquirentes y fe pública registral: Ley Hipotecaria (fuera de la herramienta) y jurisprudencia."
      - "Cuantía de la caución en la anotación de demanda: la fija el tribunal (728.3); casuística."
    fuera_de_la_herramienta:
      - "Ley Hipotecaria, art. 42.1.º: anotación preventiva de quien demanda la propiedad o un derecho real sobre inmuebles."
      - "Ley Hipotecaria, art. 71: lo anotado puede enajenarse o gravarse sin perjuicio del derecho del anotante."
      - "Ley Hipotecaria, art. 86: las anotaciones preventivas caducan a los cuatro años, prorrogables otros cuatro."
    afines: ["Medidas cautelares: presupuestos", "Caución", "Medidas cautelares antes de la demanda", "Acción reivindicatoria y declarativa de dominio", "Tutela de derechos reales inscritos", "Requisito de procedibilidad (MASC)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Caución"
    sinonimos: ["caución del solicitante de la medida cautelar", "fianza judicial", "aval bancario a primer requerimiento", "caución sustitutoria", "contracautela", "consignación en dinero", "garantía de daños y perjuicios", "caución para suspender la ejecución", "caución en diligencias preliminares", "caución en la obra nueva", "dispensa de caución", "idoneidad y suficiencia de la caución"]
    normas_base: ["LEC", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "728", apartado: "3", tipo: "regula", nota: "Salvo norma en contra, el solicitante de la medida presta caución suficiente por los daños que cause al demandado."}
      - {norma: "LEC", articulo: "728", apartado: "3, párrafo 2.º", tipo: "regula", nota: "Se fija según la naturaleza de la pretensión y el fundamento apreciado en la solicitud."}
      - {norma: "LEC", articulo: "728", apartado: "3, párrafo 3.º", tipo: "regula", nota: "Puede prestarse en cualquiera de las formas del párrafo segundo del art. 529.3."}
      - {norma: "LEC", articulo: "728", apartado: "3, párrafo 4.º", tipo: "regula", nota: "Acción de cesación en defensa de consumidores: el tribunal puede dispensar de la caución."}
      - {norma: "LEC", articulo: "529", apartado: "3, párrafo 2.º", tipo: "regula", nota: "Formas: dinero, aval solidario indefinido a primer requerimiento de banco o SGR, u otro medio de disponibilidad inmediata."}
      - {norma: "LEC", articulo: "64", apartado: "2, párrafo 2.º", tipo: "conexa", nota: "Mismas formas en la declinatoria; a este precepto remiten las diligencias preliminares y la obra nueva."}
      - {norma: "LEC", articulo: "732", apartado: "3", tipo: "regula", nota: "La solicitud ofrece la caución, especifica su tipo y justifica el importe propuesto."}
      - {norma: "LEC", articulo: "735", apartado: "2", tipo: "conexa", nota: "El auto que acuerda la medida fija la forma, cuantía y tiempo de prestar la caución."}
