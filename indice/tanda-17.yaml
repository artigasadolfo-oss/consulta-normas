      - {norma: "LEC", articulo: "739", tipo: "regula", nota: "Medida adoptada sin audiencia: oposición en veinte días desde la notificación del auto."}
      - {norma: "LEC", articulo: "740", tipo: "regula", nota: "Se puede alegar sin limitación todo hecho o razón contra la procedencia, requisitos, alcance o tipo de la medida."}
