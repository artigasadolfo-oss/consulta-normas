# Índice de conceptos de «Consulta de normas» — tanda 16 (prioridad B: ejecución, bloque 8, voces 145 a 156)
# Revisor: armero. Espejo: legalize-es@aca28304d, leído con `git show aca28304d:es/…` (no el árbol de trabajo, que hoy trae erratas).
# Todo precepto citado se ha leído en el espejo en esta pasada. Vigencia: scripts/contraste_boe.py --solo "LEC,CC,LOPJ,CE,LAU,LPH"
# --espejo-commit aca28304d (08-10-2026). Distintos citados: LEC 685 (solo en la voz 152; el apartado 5 citado es idéntico).
# Ver tanda-16-notas.md.

voces:
  - voz: "Requerimiento de pago"
    sinonimos: ["requerimiento de pago al ejecutado", "requerir de pago", "requerimiento notarial de pago", "acta notarial de requerimiento", "pago en el acto del requerimiento", "costas del pago en el requerimiento", "requerimiento en el domicilio del título", "ejecutado no hallado", "requerimiento por edictos", "ejecución sin requerimiento de pago", "requerimiento en la ejecución hipotecaria", "notificación del saldo deudor"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "580", tipo: "regula", nota: "Título judicial, arbitral, transacción o acuerdo de mediación: se embarga sin requerir antes de pago al ejecutado."}
      - {norma: "LEC", articulo: "581", apartado: "1", tipo: "regula", nota: "Título no judicial: despachada la ejecución se requiere de pago (principal e intereses a la demanda); si no paga, se embarga."}
      - {norma: "LEC", articulo: "581", apartado: "2", tipo: "regula", nota: "No hay requerimiento judicial si se aporta acta notarial de requerimiento hecho con al menos diez días de antelación."}
      - {norma: "LEC", articulo: "582", apartado: "párrafo 1.º", tipo: "regula", nota: "Se requiere en el domicilio del título, en la sede electrónica si está obligado y, a petición, donde se le halle."}
      - {norma: "LEC", articulo: "582", apartado: "párrafo 2.º", tipo: "regula", nota: "No hallado en el domicilio del título: cabe embargar ya, a petición, y se reintenta por cédula o por edictos."}
      - {norma: "LEC", articulo: "583", apartado: "1", tipo: "regula", nota: "Si paga en el acto o antes del despacho, el LAJ entrega la suma al ejecutante y da justificante al ejecutado."}
      - {norma: "LEC", articulo: "583", apartado: "2", tipo: "regula", nota: "Aunque pague en el acto, el deudor carga con las costas, salvo que no pudiera pagar antes por causa no imputable."}
      - {norma: "LEC", articulo: "583", apartado: "3", tipo: "conexa", nota: "Satisfechos intereses y costas, el LAJ dicta decreto que da por terminada la ejecución."}
      - {norma: "LEC", articulo: "551", apartado: "3.3.º", tipo: "conexa", nota: "El decreto del LAJ fija el contenido del requerimiento y si lo practica el auxilio judicial o el procurador."}
      - {norma: "LEC", articulo: "554", apartado: "1", tipo: "conexa", nota: "Sin requerimiento, la localización de bienes se ejecuta de inmediato, sin oír al ejecutado."}
      - {norma: "LEC", articulo: "554", apartado: "2", tipo: "conexa", nota: "Con requerimiento, también de inmediato si el ejecutante justifica que la demora frustraría la ejecución."}
      - {norma: "LEC", articulo: "572", apartado: "2, párrafo 2.º", tipo: "conexa", nota: "Ejecución por saldo: solo se despacha si se notificó antes al deudor y al fiador la cantidad exigible."}
      - {norma: "LEC", articulo: "573", apartado: "1.3.º", tipo: "conexa", nota: "Con la demanda por saldo va el documento que acredita esa notificación al deudor y al fiador."}
      - {norma: "LEC", articulo: "585", tipo: "conexa", nota: "Consignando lo despachado se suspende el embargo; después, y antes de resolver la oposición, se alzan los trabados."}
      - {norma: "LEC", articulo: "686", apartado: "1", tipo: "regula", nota: "Hipotecaria: se requiere al deudor, hipotecante no deudor o tercer poseedor en el domicilio vigente en el Registro."}
      - {norma: "LEC", articulo: "686", apartado: "2", tipo: "regula", nota: "No se requiere si consta el requerimiento extrajudicial; el notarial se hace en el domicilio registral y con las cautelas fijadas."}
      - {norma: "LEC", articulo: "686", apartado: "3", tipo: "conexa", nota: "Fallido en el domicilio registral y hechas las averiguaciones, se requiere por edictos (art. 164)."}
      - {norma: "LEC", articulo: "687", apartado: "2", tipo: "conexa", nota: "Prenda o vehículo hipotecado: depósito si hubo requerimiento extrajudicial; si no, primero se requiere de pago."}
      - {norma: "LEC", articulo: "164", tipo: "conexa", nota: "Comunicación edictal por el Tablón Edictal Judicial Único cuando no se halla al destinatario."}
    no_consta_en_norma:
      - "Cómputo de los diez días del acta notarial (naturales o hábiles): el 581.2 no lo precisa; sin criterio uniforme."
      - "Requerimiento en domicilio distinto del título o del Registro: si causa nulidad o solo irregularidad, casuística (indefensión)."
      - "Contenido mínimo del acta notarial (cantidad exacta, desglose): jurisprudencial."
    afines: ["Despacho de la ejecución y plazo de espera", "Títulos ejecutivos", "Ejecución hipotecaria: especialidades", "Actos de comunicación: domicilio, emplazamiento y edictos", "Averiguación patrimonial", "Liquidación de intereses y tasación de costas en la ejecución"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Averiguación patrimonial"
    sinonimos: ["manifestación de bienes", "relación de bienes del ejecutado", "investigación del patrimonio", "localización de bienes", "oficios a entidades y registros", "averiguación domiciliaria y patrimonial", "multas coercitivas al ejecutado", "deber de colaboración", "punto neutro judicial", "ejecutado sin bienes", "insolvencia del ejecutado", "bienes ocultos"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "589", apartado: "1", tipo: "regula", nota: "Salvo que el ejecutante señale bienes suficientes, el LAJ requiere de oficio al ejecutado que manifieste bienes, cargas y ocupantes."}
      - {norma: "LEC", articulo: "589", apartado: "2", tipo: "regula", nota: "Con apercibimiento de sanción, al menos por desobediencia grave, si omite, oculta o falsea bienes o cargas."}
      - {norma: "LEC", articulo: "589", apartado: "3", tipo: "regula", nota: "Sin bienes o insuficientes: decreto que advierte del plan de reestructuración y del deber de pedir concurso en dos meses."}
      - {norma: "LEC", articulo: "589", apartado: "4", tipo: "regula", nota: "Multas coercitivas periódicas al ejecutado que no responde; se fijan según cuantía, resistencia y capacidad; revisión."}
      - {norma: "LEC", articulo: "590", apartado: "párrafo 1.º", tipo: "regula", nota: "Si el ejecutante no puede designar bienes, el LAJ oficia a entidades, registros y personas que indique, con razones."}
      - {norma: "LEC", articulo: "590", apartado: "párrafo 2.º", tipo: "regula", nota: "El LAJ no pide datos que el ejecutante pueda obtener por sí o por su procurador facultado."}
      - {norma: "LEC", articulo: "591", apartado: "1", tipo: "regula", nota: "Todos deben colaborar y entregar datos acordados; solo frenan los derechos fundamentales o límites legales expresos."}
      - {norma: "LEC", articulo: "591", apartado: "2", tipo: "regula", nota: "Multas coercitivas periódicas, en pieza separada y con audiencia, a quien no colabore."}
      - {norma: "LEC", articulo: "591", apartado: "3", tipo: "conexa", nota: "Las sanciones a terceros se recurren por el régimen del título V del libro VII de la LOPJ."}
      - {norma: "LEC", articulo: "545", apartado: "4", tipo: "conexa", nota: "Corresponde al LAJ concretar los bienes y ordenar la averiguación de los arts. 589 y 590."}
      - {norma: "LEC", articulo: "549", apartado: "1.3.º", tipo: "conexa", nota: "La demanda ejecutiva expresa los bienes embargables conocidos y si se consideran suficientes."}
      - {norma: "LEC", articulo: "549", apartado: "1.4.º", tipo: "conexa", nota: "La demanda pide, en su caso, las medidas de localización e investigación del art. 590."}
      - {norma: "LEC", articulo: "551", apartado: "3.2.º", tipo: "conexa", nota: "El decreto del LAJ contiene las medidas de localización y averiguación de bienes que procedan."}
      - {norma: "LEC", articulo: "593", apartado: "1", tipo: "conexa", nota: "La pertenencia al ejecutado se juzga por indicios y signos externos, sin más investigación."}
      - {norma: "LEC", articulo: "661", apartado: "1", tipo: "conexa", nota: "Ocupantes del inmueble conocidos por la manifestación de bienes: se les notifica la ejecución."}
      - {norma: "LEC", articulo: "657", apartado: "3", tipo: "conexa", nota: "El acreedor preferente que no informa del estado de su crédito puede ser apercibido con las multas de los arts. 589 y 591."}
    no_consta_en_norma:
      - "Consultas por el Punto Neutro Judicial (AEAT, TGSS, DGT, Catastro): práctica de la oficina judicial; la LEC no las nombra."
      - "Remisión desfasada: el 591.2 manda aplicar los criterios del 589.3, que desde la Ley 16/2022 están en el 589.4."
      - "Investigación de cuentas en el extranjero o de criptoactivos: sin regla propia en la LEC."
    fuera_de_la_herramienta:
      - "Código Penal, art. 258: relación de bienes incompleta o mendaz en un procedimiento de ejecución (frustración de la ejecución)."
      - "Texto refundido de la Ley Concursal (RDLeg 1/2020): plan de reestructuración y deber de pedir concurso a que alude el 589.3."
    afines: ["Embargo e inembargabilidad", "Orden de embargo, mejora y reducción", "Embargo de cuentas y saldos", "Despacho de la ejecución y plazo de espera", "Requerimiento de pago", "Cargas anteriores y ocupantes del inmueble subastado"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Orden de embargo, mejora y reducción"
    sinonimos: ["orden de los embargos", "prelación de bienes embargables", "menor onerosidad", "pacto sobre el orden de embargo", "mejora de embargo", "reducción de embargo", "modificación del embargo", "suficiencia del embargo", "sobreembargo", "embargo de empresa", "reembargo", "embargo del sobrante"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "592", apartado: "1", tipo: "regula", nota: "Salvo pacto, el LAJ embarga atendiendo a la mayor facilidad de enajenación y a la menor onerosidad para el ejecutado."}
      - {norma: "LEC", articulo: "592", apartado: "2", tipo: "regula", nota: "Si no es posible: dinero y cuentas, créditos a corto, joyas, rentas, frutos, muebles, inmuebles, sueldos y créditos a largo."}
      - {norma: "LEC", articulo: "592", apartado: "3", tipo: "regula", nota: "Cabe embargar la empresa entera cuando sea preferible a embargar sus elementos por separado."}
      - {norma: "LEC", articulo: "584", tipo: "regula", nota: "No se embargan bienes que excedan de lo despachado, salvo que solo existan bienes de valor superior y sean necesarios."}
      - {norma: "LEC", articulo: "612", apartado: "1", tipo: "regula", nota: "Ejecutante: mejora o modificación si cambian las circunstancias. Ejecutado: reducción o modificación sin riesgo para la ejecución."}
      - {norma: "LEC", articulo: "612", apartado: "2", tipo: "regula", nota: "Lo resuelve el LAJ por decreto, con recurso directo de revisión sin efectos suspensivos."}
      - {norma: "LEC", articulo: "612", apartado: "3", tipo: "conexa", nota: "También cabe mejora cuando se amplía en la anotación la cantidad por intereses y costas (613.4)."}
      - {norma: "LEC", articulo: "598", apartado: "3", tipo: "conexa", nota: "Admitida una tercería de dominio, el LAJ puede ordenar la mejora del embargo a instancia de parte."}
      - {norma: "LEC", articulo: "578", apartado: "3", tipo: "conexa", nota: "La ampliación por nuevos vencimientos justifica la mejora del embargo y su constancia en la anotación."}
      - {norma: "LEC", articulo: "613", apartado: "4", tipo: "conexa", nota: "El ejecutante puede pedir que la anotación refleje el aumento de intereses y costas que superen lo anotado."}
      - {norma: "LEC", articulo: "587", apartado: "1", tipo: "conexa", nota: "El embargo existe desde el decreto o desde la reseña del bien en el acta, aunque falten garantía y publicidad."}
      - {norma: "LEC", articulo: "585", tipo: "conexa", nota: "La consignación de lo despachado evita el embargo o alza los ya trabados antes de resolver la oposición."}
      - {norma: "LEC", articulo: "610", apartado: "1", tipo: "conexa", nota: "Reembargo: el reembargante cobra del producto una vez satisfechos los embargantes anteriores."}
      - {norma: "LEC", articulo: "610", apartado: "2", tipo: "conexa", nota: "Alzado el primer embargo, el reembargante ocupa su lugar; puede pedir la realización si no perjudica a los anteriores."}
      - {norma: "LEC", articulo: "611", tipo: "conexa", nota: "Cabe embargar el sobrante de la realización en otra ejecución; en inmuebles, tras pagar a ejecutante y posteriores preferentes."}
      - {norma: "LEC", articulo: "609", tipo: "conexa", nota: "El embargo de bienes inembargables es nulo de pleno derecho; se denuncia por recurso o por simple comparecencia."}
    no_consta_en_norma:
      - "Si el ejecutado puede imponer el orden del 592.2 frente al bien elegido por el ejecutante: el 592.1 deja criterio al LAJ; casuística."
      - "Sobreembargo y responsabilidad del ejecutante: el 538.4 solo prevé daños por extender la ejecución a personas o bienes no autorizados."
      - "Sustitución del bien embargado por aval bancario a petición del ejecutado: no tiene regla expresa (cabe vía 612.1); casuística."
    afines: ["Embargo e inembargabilidad", "Embargo de sueldos y pensiones", "Embargo de cuentas y saldos", "Averiguación patrimonial", "Tercería de dominio", "Avalúo de los bienes embargados"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Embargo de cuentas y saldos"
    sinonimos: ["embargo de cuenta bancaria", "embargo de saldos", "orden de retención", "cuenta nómina", "cuenta indistinta", "cotitular de la cuenta", "límite máximo del embargo", "embargo de depósitos bancarios", "entrega directa al ejecutante", "embargo de la pensión en cuenta", "saldos con vencimiento diferido", "retención por la entidad"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "588", apartado: "1", tipo: "conexa", nota: "Es nulo el embargo de bienes o derechos cuya existencia efectiva no conste."}
      - {norma: "LEC", articulo: "588", apartado: "2", tipo: "regula", nota: "Depósitos y saldos son embargables si el LAJ fija una cantidad máxima; del exceso dispone libremente el ejecutado."}
      - {norma: "LEC", articulo: "588", apartado: "3", tipo: "regula", nota: "Cuenta de varios titulares: solo la parte del deudor; se presumen partes iguales salvo titularidad material distinta."}
      - {norma: "LEC", articulo: "588", apartado: "4", tipo: "regula", nota: "Cuenta donde se cobra sueldo o pensión: límites del 607 sobre lo ingresado por ese concepto en el mes o el anterior."}
      - {norma: "LEC", articulo: "621", apartado: "1", tipo: "conexa", nota: "Lo embargado en dinero o divisas convertibles se ingresa en la Cuenta de Depósitos y Consignaciones."}
      - {norma: "LEC", articulo: "621", apartado: "2", tipo: "regula", nota: "Orden de retención a la entidad, que la cumple al presentarse y da recibo con el saldo; puede diligenciarla el procurador."}
      - {norma: "LEC", articulo: "621", apartado: "3", tipo: "conexa", nota: "Sueldos y pensiones: entrega directa del 607.7 o retención y transferencia a la Cuenta de Consignaciones."}
      - {norma: "LEC", articulo: "592", apartado: "2.1.º", tipo: "conexa", nota: "En el orden legal de embargo, el dinero y las cuentas corrientes van en primer lugar."}
      - {norma: "LEC", articulo: "634", apartado: "1.2.º", tipo: "regula", nota: "Los saldos de cuentas de inmediata disposición se entregan directamente al ejecutante por su valor nominal."}
      - {norma: "LEC", articulo: "634", apartado: "2", tipo: "conexa", nota: "Las cantidades periódicas embargadas pueden entregarse con una sola resolución hasta el completo pago."}
      - {norma: "LEC", articulo: "634", apartado: "3", tipo: "conexa", nota: "Saldos con vencimiento diferido: el LAJ adopta medidas de cobro y puede nombrar administrador."}
      - {norma: "LEC", articulo: "607", apartado: "1", tipo: "conexa", nota: "Es inembargable el sueldo o pensión que no exceda del salario mínimo interprofesional."}
      - {norma: "LEC", articulo: "607", apartado: "3", tipo: "conexa", nota: "Varias percepciones se acumulan; también las de los cónyuges salvo régimen de separación acreditado."}
      - {norma: "LEC", articulo: "591", apartado: "1", tipo: "conexa", nota: "Las entidades están obligadas a colaborar y a entregar los datos acordados por el LAJ."}
      - {norma: "LEC", articulo: "625", tipo: "conexa", nota: "El dinero embargado es efecto o caudal público desde que se deposita o se ordena su retención."}
      - {norma: "LEC", articulo: "609", tipo: "conexa", nota: "Embargo de lo inembargable: nulo de pleno derecho; denunciable por recurso o comparecencia ante el LAJ."}
    no_consta_en_norma:
      - "Cotitular no deudor que prueba que los fondos son suyos: cauce (alegación al LAJ o tercería de dominio), casuística."
      - "Ingresos en la cuenta nómina que no son salario (ayudas, devoluciones): si los protege el 588.4, casuística."
      - "Embargo de saldos futuros o de ingresos posteriores a la orden de retención: sin regla expresa; criterio de cada oficina."
    fuera_de_la_herramienta:
      - "Leyes especiales que declaran inembargables ciertas prestaciones públicas (a ellas remite el art. 606.4.º LEC)."
    afines: ["Embargo de sueldos y pensiones", "Embargo e inembargabilidad", "Orden de embargo, mejora y reducción", "Averiguación patrimonial", "Tercería de dominio"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Tercería de mejor derecho"
    sinonimos: ["tercería de preferencia", "crédito preferente", "prelación de créditos", "graduación de créditos", "preferencia de cobro", "tercerista", "crédito en escritura pública", "crédito reconocido en sentencia firme", "preferencia de la comunidad de propietarios", "anotación preventiva de embargo y preferencia", "tres quintas partes de las costas", "concurrencia de acreedores"]
    normas_base: ["LEC", "CC", "LPH"]
    remisiones:
      - {norma: "LEC", articulo: "614", apartado: "1", tipo: "regula", nota: "Quien afirme un crédito preferente al del ejecutante interpone demanda de tercería con principio de prueba del crédito."}
      - {norma: "LEC", articulo: "614", apartado: "2", tipo: "regula", nota: "Sin ese principio de prueba no se admite; nunca segunda tercería fundada en títulos que ya se tenían."}
      - {norma: "LEC", articulo: "615", apartado: "1", tipo: "regula", nota: "Cabe desde el embargo del bien, si la preferencia es especial, o desde el despacho de la ejecución, si es general."}
      - {norma: "LEC", articulo: "615", apartado: "2", tipo: "regula", nota: "No se admite tras entregar al ejecutante lo obtenido o, si se le adjudicó el bien, tras adquirir su titularidad."}
      - {norma: "LEC", articulo: "616", apartado: "1", tipo: "regula", nota: "La ejecución sigue hasta realizar los bienes; lo obtenido se consigna para costas del ejecutante y pago por orden de preferencia."}
      - {norma: "LEC", articulo: "616", apartado: "2", tipo: "regula", nota: "Tercerista con título ejecutivo: interviene en la ejecución desde que se admite la demanda; sin título, solo si se estima."}
      - {norma: "LEC", articulo: "617", apartado: "1", tipo: "regula", nota: "Se dirige siempre contra el ejecutante y se tramita como juicio verbal."}
      - {norma: "LEC", articulo: "617", apartado: "2", tipo: "regula", nota: "El ejecutado puede intervenir y ha de ser demandado si el crédito del tercerista no consta en título ejecutivo."}
      - {norma: "LEC", articulo: "618", tipo: "conexa", nota: "Si los demandados no contestan, se entiende que admiten los hechos de la demanda de tercería."}
      - {norma: "LEC", articulo: "619", apartado: "1", tipo: "regula", nota: "Allanamiento del ejecutante: se paga antes al tercerista, pero cobrando el ejecutante 3/5 de sus costas hasta la demanda."}
      - {norma: "LEC", articulo: "619", apartado: "2", tipo: "conexa", nota: "Desistimiento del ejecutante: la ejecución sigue para el tercerista con título; si no lo tiene, se archiva salvo acuerdo del ejecutado."}
      - {norma: "LEC", articulo: "620", apartado: "1", tipo: "regula", nota: "La sentencia fija privilegio y orden de pago solo en esa ejecución, sin prejuzgar otras acciones; reglas propias de costas."}
      - {norma: "LEC", articulo: "620", apartado: "2", tipo: "regula", nota: "Estimada, nada se entrega al tercerista hasta pagar al ejecutante 3/5 de las costas causadas hasta la sentencia."}
      - {norma: "LEC", articulo: "613", apartado: "2", tipo: "regula", nota: "Hasta reintegrar al ejecutante, lo realizado solo se aplica a otro crédito si una sentencia de tercería lo declara preferente."}
      - {norma: "CC", articulo: "1921", tipo: "regula", nota: "Los créditos se clasifican y pagan según este capítulo; en concurso rige la Ley Concursal."}
      - {norma: "CC", articulo: "1922", tipo: "conexa", nota: "Preferencias sobre muebles concretos: precio o reparación, prenda, transporte, hospedaje, rentas de un año del arrendador."}
      - {norma: "CC", articulo: "1923", tipo: "regula", nota: "Sobre inmuebles: impuestos del último año, seguro, hipotecas y refacciones inscritas, embargos anotados (solo frente a posteriores)."}
      - {norma: "CC", articulo: "1924", tipo: "regula", nota: "Sobre los demás bienes: tributos locales, funerales, salarios del último año y créditos en escritura pública o sentencia firme."}
      - {norma: "CC", articulo: "1925", tipo: "conexa", nota: "Ningún otro crédito goza de preferencia fuera de los enumerados en los artículos anteriores."}
      - {norma: "CC", articulo: "1927", tipo: "regula", nota: "Concurrencia sobre inmuebles: primero 1923.1.º y 2.º; hipotecas y embargos anotados, por antigüedad registral."}
      - {norma: "CC", articulo: "1929", tipo: "regula", nota: "Créditos sin preferencia especial: orden del 1924, los de fecha por su antigüedad y los comunes a prorrata."}
      - {norma: "LPH", articulo: "9", apartado: "1.e), párrafo 2.º", tipo: "regula", nota: "Cuotas de la comunidad del año en curso y los tres anteriores: preferentes del 1923 CC, por delante de los n.º 3.º, 4.º y 5.º."}
    no_consta_en_norma:
      - "La anotación de embargo solo prefiere frente a créditos posteriores (CC 1923.4.º): qué fecha cuenta frente a una sentencia, jurisprudencial."
      - "Fecha relevante del crédito en sentencia firme a efectos del 1924.3.º (sentencia o firmeza): jurisprudencial."
      - "Tercería de mejor derecho de la comunidad de propietarios frente a la hipoteca: alcance de la preferencia del 9.1.e) LPH, jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 58/2003, General Tributaria, art. 77: prelación de la Hacienda Pública para los créditos tributarios."
      - "Estatuto de los Trabajadores (RDLeg 2/2015), art. 32: garantías y preferencia de los créditos salariales."
      - "Texto refundido de la Ley Concursal (RDLeg 1/2020): clasificación de créditos en concurso (CC 1921, párrafo 2.º)."
    afines: ["Tercería de dominio", "Deudas con la comunidad, preferencia y afección", "Embargo e inembargabilidad", "Orden de embargo, mejora y reducción", "Ejecución hipotecaria: especialidades"]
    estado: "vigente"
