  - voz: "Garantía de conformidad de los bienes"
    sinonimos: ["garantía legal", "garantía de tres años", "falta de conformidad", "reparación o sustitución", "rebaja del precio", "resolución por falta de conformidad", "producto defectuoso de consumo", "garantía de segunda mano", "garantía comercial", "reclamar al fabricante", "presunción de dos años", "conformidad de contenidos digitales"]
    normas_base: ["TRLGDCU", "CC"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "114", apartado: "1", tipo: "regula", nota: "Rige en la compraventa de bienes, existentes o por fabricar, y en el suministro de contenidos o servicios digitales."}
      - {norma: "TRLGDCU", articulo: "114", apartado: "2", tipo: "conexa", nota: "Excluidos, entre otros: animales vivos, segunda mano en subasta administrativa, servicios no digitales y financieros."}
      - {norma: "TRLGDCU", articulo: "59 bis", apartado: "2", tipo: "regula", nota: "Para esta garantía, «bienes» son las cosas muebles corporales: no alcanza a los inmuebles."}
      - {norma: "TRLGDCU", articulo: "115", tipo: "regula", nota: "Hay conformidad si se cumplen los requisitos subjetivos y objetivos y, en su caso, la instalación o integración es correcta."}
      - {norma: "TRLGDCU", articulo: "115 bis", tipo: "regula", nota: "Subjetivos: descripción, cantidad, calidad y funciones pactadas, aptitud para el fin aceptado, accesorios y actualizaciones."}
      - {norma: "TRLGDCU", articulo: "115 ter", apartado: "1", tipo: "regula", nota: "Objetivos: aptitud para el uso normal, muestra o modelo, accesorios y cualidades esperables según la publicidad."}
      - {norma: "TRLGDCU", articulo: "115 ter", apartado: "5", tipo: "conexa", nota: "No hay falta si al contratar se informó de la divergencia concreta y el consumidor la aceptó expresamente y por separado."}
      - {norma: "TRLGDCU", articulo: "115 quater", tipo: "conexa", nota: "La instalación incorrecta hecha por el empresario o por instrucciones deficientes equivale a falta de conformidad."}
      - {norma: "TRLGDCU", articulo: "116", tipo: "regula", nota: "Estas acciones excluyen las de saneamiento del CC; siempre cabe la indemnización de daños y perjuicios."}
      - {norma: "TRLGDCU", articulo: "117", apartado: "1", tipo: "regula", nota: "Responde de la falta existente a la entrega: subsanación, rebaja o resolución por simple declaración; cabe suspender el pago."}
      - {norma: "TRLGDCU", articulo: "118", apartado: "1", tipo: "regula", nota: "El consumidor elige reparación o sustitución, salvo que una sea imposible o de coste desproporcionado frente a la otra."}
      - {norma: "TRLGDCU", articulo: "118", apartado: "4", tipo: "regula", nota: "La puesta en conformidad es gratuita (envío, mano de obra, materiales), en plazo razonable y sin mayores inconvenientes."}
      - {norma: "TRLGDCU", articulo: "119", tipo: "regula", nota: "Rebaja o resolución si la reparación es imposible, no se hace o no en plazo, reaparece la falta o esta es muy grave."}
      - {norma: "TRLGDCU", articulo: "119 ter", apartado: "2", tipo: "regula", nota: "No cabe resolver por falta de escasa importancia; la prueba de que lo es corresponde al empresario."}
      - {norma: "TRLGDCU", articulo: "119 quater", apartado: "1", tipo: "conexa", nota: "El reembolso por rebaja o resolución se hace en catorce días, sin cargo alguno."}
      - {norma: "TRLGDCU", articulo: "120", apartado: "1", tipo: "regula", nota: "Responde de lo que se manifieste en tres años desde la entrega (dos en lo digital); segunda mano, pacto de al menos un año."}
      - {norma: "TRLGDCU", articulo: "121", apartado: "1", tipo: "regula", nota: "Se presume que la falta manifestada en los dos años siguientes a la entrega ya existía (un año en lo digital)."}
      - {norma: "TRLGDCU", articulo: "122", tipo: "regula", nota: "La reparación suspende los plazos; durante un año tras la entrega ya conforme se responde de la misma falta."}
      - {norma: "TRLGDCU", articulo: "123", apartado: "1", tipo: "conexa", nota: "Salvo prueba en contrario, la entrega se fecha por la factura, el tique o el albarán posterior."}
      - {norma: "TRLGDCU", articulo: "124", tipo: "regula", nota: "La acción prescribe a los cinco años desde que se manifiesta la falta de conformidad."}
      - {norma: "TRLGDCU", articulo: "125", apartado: "1", tipo: "regula", nota: "Si dirigirse al vendedor es imposible o muy gravoso, se reclama al productor la puesta en conformidad."}
      - {norma: "TRLGDCU", articulo: "125", apartado: "2", tipo: "conexa", nota: "Quien respondió ante el consumidor repite contra el responsable en un año desde que ejecutó la medida."}
      - {norma: "TRLGDCU", articulo: "127", apartado: "1", tipo: "conexa", nota: "La garantía comercial vincula en sus términos y en los de la publicidad, si esta es más favorable."}
      - {norma: "TRLGDCU", articulo: "86", apartado: "1", tipo: "conexa", nota: "Es abusiva la cláusula que modifica en perjuicio del consumidor las normas legales sobre conformidad."}
      - {norma: "TRLGDCU", articulo: "67", apartado: "3", tipo: "conexa", nota: "Los arts. 114 a 126 se aplican aunque se elija otra ley si el contrato tiene vínculo estrecho con el EEE."}
      - {norma: "CC", articulo: "1490", tipo: "conexa", nota: "Contraste: el saneamiento del CC por vicios ocultos se extingue a los seis meses desde la entrega."}
    no_consta_en_norma:
      - "Falta manifestada después de la presunción del 121: la carga de probar que ya existía a la entrega recae en el consumidor: interpretación a contrario."
      - "Si una reparación fallida permite pasar directamente a la resolución o exige un segundo intento: casuística jurisprudencial."
    fuera_de_la_herramienta:
      - "Directivas (UE) 2019/771 (compraventa de bienes) y 2019/770 (contenidos y servicios digitales), que estos artículos transponen."
    afines: ["Saneamiento por vicios ocultos", "Concepto de consumidor y de empresario", "Responsabilidad por productos defectuosos", "Reclamaciones de consumo y servicio de atención al cliente", "Cláusulas abusivas: lista legal (gastos, sumisión, penalizaciones)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Desistimiento del consumidor"
    sinonimos: ["derecho de desistimiento", "devolución en catorce días", "catorce días naturales", "compra por internet", "venta a distancia", "contrato fuera del establecimiento", "venta a domicilio", "formulario de desistimiento", "derecho de retracto del consumidor", "devolver la compra", "excursión promocional", "reembolso del precio"]
    normas_base: ["TRLGDCU"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "68", apartado: "1", tipo: "regula", nota: "Facultad de dejar sin efecto el contrato en plazo, sin justificar ni penalización; son nulas las cláusulas que penalicen."}
      - {norma: "TRLGDCU", articulo: "68", apartado: "2", tipo: "regula", nota: "Solo existe cuando lo prevén la ley o un reglamento, o lo reconocen la oferta, la publicidad o el contrato."}
      - {norma: "TRLGDCU", articulo: "68", apartado: "3", tipo: "conexa", nota: "El desistimiento legal se rige primero por su norma específica y, en su defecto, por este título."}
      - {norma: "TRLGDCU", articulo: "69", apartado: "1", tipo: "regula", nota: "El empresario informa por escrito en el contrato y entrega un documento de desistimiento; la prueba es suya (69.2)."}
      - {norma: "TRLGDCU", articulo: "70", tipo: "regula", nota: "Sin formalidad: basta acreditarlo; vale el envío del documento o la devolución de los productos."}
      - {norma: "TRLGDCU", articulo: "71", apartado: "1", tipo: "regula", nota: "Plazo mínimo de catorce días naturales."}
      - {norma: "TRLGDCU", articulo: "71", apartado: "3", tipo: "regula", nota: "Sin información, el plazo acaba doce meses después del inicial; si se informa antes, corre desde entonces."}
      - {norma: "TRLGDCU", articulo: "73", tipo: "conexa", nota: "Desistir no implica gasto alguno para el consumidor."}
      - {norma: "TRLGDCU", articulo: "74", apartado: "1", tipo: "conexa", nota: "Ejercido el desistimiento, las partes se restituyen las prestaciones según los arts. 1303 y 1308 CC."}
      - {norma: "TRLGDCU", articulo: "76", tipo: "regula", nota: "El empresario devuelve lo cobrado en 14 días naturales sin retener gastos; si no, el consumidor lo reclama duplicado."}
      - {norma: "TRLGDCU", articulo: "77", tipo: "conexa", nota: "Desistir del contrato financiado resuelve también el crédito vinculado, sin penalización."}
      - {norma: "TRLGDCU", articulo: "78", tipo: "conexa", nota: "No desistir en plazo no impide después las acciones de nulidad o resolución."}
      - {norma: "TRLGDCU", articulo: "79", tipo: "conexa", nota: "Desistimiento pactado: a falta de reglas propias, este título; no se puede exigir anticipo ni garantía por él."}
      - {norma: "TRLGDCU", articulo: "92", apartado: "1", tipo: "regula", nota: "Contratos a distancia: sistema organizado sin presencia física simultánea (correo, internet, teléfono)."}
      - {norma: "TRLGDCU", articulo: "92", apartado: "2", tipo: "regula", nota: "Fuera del establecimiento: en otro lugar, tras contacto personal fuera de él o en excursión organizada."}
      - {norma: "TRLGDCU", articulo: "93", apartado: "e)", tipo: "conexa", nota: "No se aplica a la creación, adquisición o transmisión de inmuebles o derechos sobre ellos."}
      - {norma: "TRLGDCU", articulo: "93", apartado: "f)", tipo: "conexa", nota: "Tampoco a construir edificios nuevos, transformarlos sustancialmente o alquilar alojamiento como vivienda."}
      - {norma: "TRLGDCU", articulo: "102", apartado: "1", tipo: "regula", nota: "A distancia o fuera del establecimiento: catorce días naturales sin motivo; treinta en visitas no solicitadas o excursiones."}
      - {norma: "TRLGDCU", articulo: "102", apartado: "2", tipo: "regula", nota: "Son nulas la penalización por desistir y la renuncia al derecho."}
      - {norma: "TRLGDCU", articulo: "103", tipo: "regula", nota: "Excepciones: servicio ya ejecutado, bienes personalizados, perecederos, desprecintados por higiene, subastas, etc."}
      - {norma: "TRLGDCU", articulo: "103", apartado: "l)", tipo: "regula", nota: "Sin desistimiento: alojamiento no destinado a vivienda, alquiler de vehículos y ocio con fecha o periodo fijados."}
      - {norma: "TRLGDCU", articulo: "104", tipo: "regula", nota: "El plazo corre desde el contrato en los servicios y desde que se recibe el bien (o el último) en las ventas."}
      - {norma: "TRLGDCU", articulo: "105", apartado: "1", tipo: "regula", nota: "Si no se informó del desistimiento, el plazo termina doce meses después del inicial."}
      - {norma: "TRLGDCU", articulo: "106", apartado: "1", tipo: "regula", nota: "Se comunica con el formulario del anexo B o con otra declaración inequívoca antes de que venza el plazo."}
      - {norma: "TRLGDCU", articulo: "106", apartado: "2", tipo: "regula", nota: "Basta enviar la comunicación dentro del plazo: cuenta la fecha de expedición."}
      - {norma: "TRLGDCU", articulo: "106", apartado: "4", tipo: "conexa", nota: "La carga de probar que se desistió recae en el consumidor."}
      - {norma: "TRLGDCU", articulo: "107", apartado: "1", tipo: "regula", nota: "Reembolso de todo lo pagado, también la entrega, en 14 días naturales y por el mismo medio de pago."}
      - {norma: "TRLGDCU", articulo: "107", apartado: "3", tipo: "conexa", nota: "En las ventas, el empresario puede retener el reembolso hasta recibir los bienes o la prueba de su devolución."}
      - {norma: "TRLGDCU", articulo: "108", apartado: "1", tipo: "regula", nota: "El consumidor devuelve en 14 días y paga solo los costes directos de devolución si fue informado de ello."}
      - {norma: "TRLGDCU", articulo: "108", apartado: "2", tipo: "conexa", nota: "Solo responde de la pérdida de valor por manipular el bien más de lo necesario para probarlo."}
      - {norma: "TRLGDCU", articulo: "108", apartado: "4", tipo: "conexa", nota: "Si pidió que el servicio empezara en el plazo, paga la parte proporcional ya prestada."}
    no_consta_en_norma:
      - "Alcance de las excepciones de bienes personalizados o desprecintados (colchones, cosméticos): casuística jurisprudencial (TJUE)."
      - "Reserva de alojamiento turístico por plataforma: si entra en la excepción del 103.l depende de su finalidad: casuística jurisprudencial."
      - "Uso intensivo del bien antes de devolverlo: solo genera responsabilidad por disminución de valor (108.2); sus límites, jurisprudenciales."
    fuera_de_la_herramienta:
      - "Ley 16/2011, de contratos de crédito al consumo, art. 28: desistimiento de catorce días naturales del contrato de crédito."
      - "Ley 4/2012, de aprovechamiento por turno de bienes de uso turístico: régimen propio, excluido de este título (93.h)."
    afines: ["Contratos a distancia y fuera del establecimiento", "Información precontractual e integración de la oferta y la publicidad", "Concepto de consumidor y de empresario", "Viajes combinados y servicios de viaje vinculados", "Irrenunciabilidad de los derechos del consumidor"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Tutela judicial efectiva e indefensión"
    sinonimos: ["tutela judicial efectiva", "indefensión", "artículo 24 CE", "derecho de acceso a la jurisdicción", "pro actione", "derecho a una resolución motivada", "derecho al recurso", "incidente de nulidad de actuaciones", "nulidad por indefensión", "amparo constitucional", "emplazamiento defectuoso", "subsanación de defectos"]
    normas_base: ["CE", "LOPJ", "LEC"]
    remisiones:
      - {norma: "CE", articulo: "24", apartado: "1", tipo: "regula", nota: "Todos tienen derecho a la tutela efectiva de jueces y tribunales sin que, en ningún caso, pueda producirse indefensión."}
      - {norma: "CE", articulo: "24", apartado: "2", tipo: "conexa", nota: "Juez predeterminado, defensa y letrado, proceso público sin dilaciones y con garantías, y prueba pertinente."}
      - {norma: "CE", articulo: "53", apartado: "2", tipo: "conexa", nota: "Los derechos del art. 14 y de la sección primera se tutelan ante los tribunales ordinarios y en amparo ante el TC."}
      - {norma: "CE", articulo: "117", apartado: "3", tipo: "conexa", nota: "Juzgar y hacer ejecutar lo juzgado corresponde exclusivamente a los juzgados y tribunales."}
      - {norma: "CE", articulo: "118", tipo: "conexa", nota: "Es obligado cumplir las sentencias firmes y colaborar con los tribunales en el proceso y en la ejecución."}
      - {norma: "CE", articulo: "119", tipo: "conexa", nota: "La justicia es gratuita cuando lo disponga la ley y, siempre, para quien acredite insuficiencia de recursos."}
      - {norma: "CE", articulo: "120", apartado: "3", tipo: "conexa", nota: "Las sentencias serán siempre motivadas y se pronunciarán en audiencia pública."}
      - {norma: "LOPJ", articulo: "7", apartado: "3", tipo: "regula", nota: "Los jueces protegen los derechos e intereses legítimos, individuales y colectivos, sin que pueda haber indefensión."}
      - {norma: "LOPJ", articulo: "11", apartado: "3", tipo: "regula", nota: "Se resuelve siempre sobre lo pedido; solo cabe desestimar por motivos formales si el defecto es insubsanable o no se subsana."}
      - {norma: "LOPJ", articulo: "5", apartado: "1", tipo: "conexa", nota: "Las leyes se interpretan y aplican conforme a la Constitución y a la doctrina del Tribunal Constitucional."}
      - {norma: "LOPJ", articulo: "5", apartado: "4", tipo: "conexa", nota: "Donde cabe casación, basta para fundarla la infracción de precepto constitucional."}
      - {norma: "LOPJ", articulo: "238", apartado: "3.º", tipo: "regula", nota: "Nulidad de pleno derecho si se prescinde de normas esenciales del procedimiento y pudo producirse indefensión."}
      - {norma: "LOPJ", articulo: "240", apartado: "1", tipo: "conexa", nota: "La nulidad y los defectos que causan indefensión se hacen valer por los recursos contra la resolución."}
      - {norma: "LOPJ", articulo: "241", apartado: "1", tipo: "regula", nota: "Incidente excepcional de nulidad por vulneración de un derecho del 53.2 CE: veinte días, máximo cinco años."}
      - {norma: "LEC", articulo: "225", apartado: "3.º", tipo: "regula", nota: "Es nulo el acto que prescinde de normas esenciales del procedimiento cuando pudo causar indefensión."}
      - {norma: "LEC", articulo: "227", apartado: "2", tipo: "conexa", nota: "Antes de la resolución final, nulidad de oficio o a instancia, oídas las partes, si no cabe subsanar."}
      - {norma: "LEC", articulo: "228", apartado: "1", tipo: "regula", nota: "Incidente de nulidad contra resolución firme: solo derechos del 53.2 CE no denunciables antes; veinte días."}
      - {norma: "LEC", articulo: "231", tipo: "regula", nota: "El tribunal y el LAJ cuidan de que puedan subsanarse los defectos de los actos procesales de las partes."}
      - {norma: "LEC", articulo: "459", tipo: "regula", nota: "Apelación por infracción procesal: citar la norma, alegar la indefensión y acreditar que se denunció a tiempo."}
      - {norma: "LEC", articulo: "477", apartado: "6", tipo: "conexa", nota: "Casación por infracción procesal: la infracción debe haberse denunciado en la instancia y reproducido en la segunda."}
      - {norma: "LEC", articulo: "218", apartado: "2", tipo: "conexa", nota: "Motivación: razonamientos fácticos y jurídicos sobre la prueba y el derecho, según la lógica y la razón."}
    no_consta_en_norma:
      - "Indefensión material, real y no imputable a la propia parte, como requisito de la nulidad: doctrina del Tribunal Constitucional."
      - "Principio pro actione en el acceso a la jurisdicción; el acceso al recurso es de configuración legal: doctrina del TC."
      - "Edictos solo tras agotar razonablemente la averiguación del domicilio del demandado: doctrina del TC sobre el 24.1."
      - "Incongruencia omisiva o por exceso como lesión del 24.1: doctrina del TC."
    fuera_de_la_herramienta:
      - "Ley Orgánica 2/1979, del Tribunal Constitucional, art. 44: amparo contra actos judiciales; agotar la vía, denuncia previa y 30 días."
    afines: ["Nulidad de actuaciones", "Derecho a la prueba y a un proceso con todas las garantías", "Congruencia y motivación de la sentencia", "Actos de comunicación: domicilio, emplazamiento y edictos", "Rescisión de la sentencia firme a instancia del rebelde", "Recurso de casación", "Recurso de apelación (plazo, interposición, prueba en segunda instancia)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Derecho a la prueba y a un proceso con todas las garantías"
    sinonimos: ["derecho a la prueba", "artículo 24.2 CE", "prueba pertinente", "denegación de prueba", "protesta", "proceso con todas las garantías", "proceso equitativo", "dilaciones indebidas", "prueba ilícita", "prueba en segunda instancia", "valoración de la prueba", "igualdad de armas"]
    normas_base: ["CE", "LEC", "LOPJ"]
    remisiones:
      - {norma: "CE", articulo: "24", apartado: "2", tipo: "regula", nota: "Derecho a un proceso público sin dilaciones indebidas y con todas las garantías y a usar los medios de prueba pertinentes."}
      - {norma: "CE", articulo: "24", apartado: "1", tipo: "conexa", nota: "Tutela judicial efectiva sin indefensión: la denegación de prueba decisiva la produce."}
      - {norma: "CE", articulo: "120", apartado: "1", tipo: "conexa", nota: "Las actuaciones judiciales son públicas, con las excepciones de las leyes procesales."}
      - {norma: "CE", articulo: "10", apartado: "2", tipo: "conexa", nota: "Los derechos fundamentales se interpretan conforme a la Declaración Universal y a los tratados ratificados por España."}
      - {norma: "LOPJ", articulo: "11", apartado: "1", tipo: "regula", nota: "No surten efecto las pruebas obtenidas, directa o indirectamente, violentando derechos o libertades fundamentales."}
      - {norma: "LEC", articulo: "281", apartado: "1", tipo: "regula", nota: "La prueba tiene por objeto los hechos que guardan relación con la tutela judicial que se pretende."}
      - {norma: "LEC", articulo: "281", apartado: "3", tipo: "conexa", nota: "Están exentos de prueba los hechos en que hay plena conformidad, salvo materia indisponible."}
      - {norma: "LEC", articulo: "281", apartado: "4", tipo: "conexa", nota: "No hay que probar los hechos de notoriedad absoluta y general."}
      - {norma: "LEC", articulo: "283", apartado: "1", tipo: "regula", nota: "No se admite la prueba impertinente, sin relación con el objeto del proceso."}
      - {norma: "LEC", articulo: "283", apartado: "2", tipo: "regula", nota: "Tampoco la inútil, que según criterios razonables y seguros nunca aclararía los hechos controvertidos."}
      - {norma: "LEC", articulo: "283", apartado: "3", tipo: "conexa", nota: "Nunca se admite como prueba una actividad prohibida por la ley."}
      - {norma: "LEC", articulo: "285", apartado: "2", tipo: "regula", nota: "Contra la admisión o inadmisión, solo reposición en el acto y, si se desestima, protesta para la segunda instancia."}
      - {norma: "LEC", articulo: "446", tipo: "regula", nota: "En la vista del verbal, igual: reposición en el acto y protesta para hacerla valer en segunda instancia."}
      - {norma: "LEC", articulo: "287", apartado: "1", tipo: "regula", nota: "La ilicitud de una prueba se alega de inmediato; el tribunal resuelve en el juicio, oídas las partes."}
      - {norma: "LEC", articulo: "287", apartado: "2", tipo: "conexa", nota: "Contra esa resolución, reposición en el acto; se puede reproducir la impugnación en la apelación."}
      - {norma: "LEC", articulo: "429", apartado: "1, párrafo 3.º", tipo: "conexa", nota: "Si la prueba propuesta parece insuficiente, el tribunal lo advierte y puede señalar la prueba conveniente."}
      - {norma: "LEC", articulo: "460", apartado: "2", tipo: "regula", nota: "En apelación: prueba denegada con reposición o protesta, la admitida no practicada y la de hechos nuevos."}
      - {norma: "LEC", articulo: "459", tipo: "conexa", nota: "La infracción procesal se alega en la apelación citando la norma, la indefensión y su denuncia oportuna."}
      - {norma: "LEC", articulo: "218", apartado: "2", tipo: "conexa", nota: "La sentencia motiva la apreciación y valoración de las pruebas, según la lógica y la razón."}
      - {norma: "LEC", articulo: "477", apartado: "5", tipo: "conexa", nota: "La valoración de la prueba no es casable, salvo error de hecho patente e inmediatamente verificable."}
    no_consta_en_norma:
      - "Solo hay lesión del derecho a la prueba si la denegada o no practicada era decisiva para el fallo: doctrina del TC."
      - "Denegación inmotivada o arbitraria y prueba admitida que no se practica sin causa: lesionan el 24.2: doctrina del TC."
      - "Prueba derivada de la ilícita y conexión de antijuridicidad: doctrina jurisprudencial."
      - "Dilaciones indebidas: se miden por la complejidad, la conducta de las partes y la del órgano: doctrina del TC y del TEDH."
    fuera_de_la_herramienta:
      - "Convenio Europeo de Derechos Humanos, art. 6: proceso equitativo, interpretado por el TEDH (CE art. 10.2)."
      - "Ley Orgánica 2/1979, del Tribunal Constitucional, art. 44: amparo por lesión del 24.2 imputable al órgano judicial."
    afines: ["Tutela judicial efectiva e indefensión", "Pertinencia y utilidad de la prueba; protesta", "Prueba ilícita", "Proposición de prueba", "Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Carga de la prueba"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"
