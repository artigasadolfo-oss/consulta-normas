# Índice de conceptos de «Consulta de normas» — tanda 12 (sucesiones, LOE, consumo y CE)
# Revisor: armero. Espejo: legalize-es@aca28304d. Todo precepto citado se ha leído en el espejo en esta pasada.
# Vigencia: contraste con la API de boe.es (scripts/contraste_boe.py --solo "CC,LEC,LOE,TRLGDCU,LOPJ,CE,LAU,LPH", 08-10-2026).
# Distintos: LEC 22 y 685, CC 396 (errata del espejo), LPH 10 y 34 artículos de la LAU. Ninguno está citado; ninguna versión futura
# en los artículos citados. Voces 256, 272, 273, 274, 280 a 284, 299 y 300 de la lista maestra (11 voces). Ver tanda-12-notas.md.

voces:
  - voz: "Responsabilidad del heredero por deudas y beneficio de inventario"
    sinonimos: ["beneficio de inventario", "deudas de la herencia", "deudas del causante", "responsabilidad ultra vires", "aceptación a beneficio de inventario", "derecho a deliberar", "inventario notarial", "herencia en administración", "pérdida del beneficio de inventario", "acreedores de la herencia", "acreedores del heredero", "heredar deudas", "ejecución contra los herederos"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "659", tipo: "conexa", nota: "La herencia comprende los bienes, derechos y obligaciones del causante que no se extinguen por su muerte."}
      - {norma: "CC", articulo: "661", tipo: "regula", nota: "Los herederos suceden al difunto, por el solo hecho de su muerte, en todos sus derechos y obligaciones."}
      - {norma: "CC", articulo: "1003", tipo: "regula", nota: "Aceptación pura y simple: responde de todas las cargas con los bienes de la herencia y con los suyos propios."}
      - {norma: "CC", articulo: "1010", tipo: "regula", nota: "Todo heredero puede aceptar a beneficio de inventario aunque lo prohíba el testador, o pedir inventario para deliberar."}
      - {norma: "CC", articulo: "1011", tipo: "regula", nota: "La declaración de usar el beneficio de inventario se hace ante Notario."}
      - {norma: "CC", articulo: "1013", tipo: "regula", nota: "Sin inventario fiel y exacto, hecho en forma y plazo, la declaración no produce efecto alguno."}
      - {norma: "CC", articulo: "1014", tipo: "regula", nota: "Heredero que posee bienes: comunicarlo ante Notario y pedir el inventario en 30 días desde que sabe que es heredero."}
      - {norma: "CC", articulo: "1015", tipo: "regula", nota: "Si no posee ni ha gestionado: el plazo corre desde que expira el del 1005 o desde que aceptó o gestionó."}
      - {norma: "CC", articulo: "1016", tipo: "conexa", nota: "En los demás casos, sin demanda contra él, cabe mientras no prescriba la acción para reclamar la herencia."}
      - {norma: "CC", articulo: "1017", tipo: "regula", nota: "Inventario: empieza en 30 días desde la citación de acreedores y legatarios y acaba en otros 60; prórroga notarial hasta un año."}
      - {norma: "CC", articulo: "1018", tipo: "regula", nota: "Si por su culpa no se empieza o no se acaba el inventario en plazo y forma, se entiende aceptada pura y simplemente."}
      - {norma: "CC", articulo: "1019", tipo: "conexa", nota: "Tras deliberar, 30 días para manifestar ante Notario si acepta o repudia; si calla, aceptación pura y simple."}
      - {norma: "CC", articulo: "1023", tipo: "regula", nota: "Efectos: paga deudas solo hasta donde alcanzan los bienes de la herencia, conserva sus créditos y no hay confusión."}
      - {norma: "CC", articulo: "1024", tipo: "regula", nota: "Pierde el beneficio si oculta bienes a sabiendas o vende sin autorización antes de pagar (salvo mercado o subasta notarial)."}
      - {norma: "CC", articulo: "1026", tipo: "regula", nota: "Hasta pagar a acreedores y legatarios, la herencia está en administración; el administrador la representa en juicio."}
      - {norma: "CC", articulo: "1027", tipo: "regula", nota: "El administrador no paga los legados sino después de pagar a todos los acreedores."}
      - {norma: "CC", articulo: "1028", tipo: "conexa", nota: "Orden de pago: el de la sentencia de graduación; si no, por orden de presentación, con caución al acreedor preferente."}
      - {norma: "CC", articulo: "1029", tipo: "conexa", nota: "Acreedores que aparecen tras pagar los legados: solo reclaman a los legatarios si no quedan bienes en la herencia."}
      - {norma: "CC", articulo: "1031", tipo: "conexa", nota: "Si los bienes no alcanzan, el administrador rinde cuentas y responde de los perjuicios causados por su culpa."}
      - {norma: "CC", articulo: "1032", tipo: "conexa", nota: "Pagados acreedores y legatarios, el heredero queda en el pleno goce del remanente."}
      - {norma: "CC", articulo: "1034", tipo: "regula", nota: "Los acreedores del heredero no intervienen hasta que cobren los de la herencia; pueden embargar el remanente."}
      - {norma: "CC", articulo: "1002", tipo: "conexa", nota: "Quien sustrae u oculta bienes de la herencia pierde la facultad de repudiar y queda heredero puro y simple."}
      - {norma: "CC", articulo: "1005", tipo: "conexa", nota: "Interpelación notarial: si calla 30 días naturales, se entiende aceptada pura y simplemente."}
      - {norma: "CC", articulo: "995", tipo: "conexa", nota: "Casado que acepta sin beneficio sin consentimiento del otro cónyuge: no responden los bienes gananciales."}
      - {norma: "CC", articulo: "1082", tipo: "conexa", nota: "Los acreedores reconocidos pueden oponerse a la partición hasta que se les pague o afiance."}
      - {norma: "CC", articulo: "1084", apartado: "párrafo 1.º", tipo: "regula", nota: "Hecha la partición, cobran por entero de cualquier heredero puro; del beneficiario, hasta su porción hereditaria."}
      - {norma: "CC", articulo: "1084", apartado: "párrafo 2.º", tipo: "conexa", nota: "El heredero demandado puede hacer citar y emplazar a sus coherederos, salvo que solo él quedara obligado."}
      - {norma: "CC", articulo: "1085", tipo: "conexa", nota: "El coheredero que paga más de su parte reclama a los demás la proporcional, aunque el acreedor le ceda sus acciones."}
      - {norma: "CC", articulo: "1257", apartado: "párrafo 1.º", tipo: "conexa", nota: "Los contratos producen efecto entre las partes y sus herederos, salvo derechos u obligaciones intransmisibles."}
      - {norma: "LEC", articulo: "540", apartado: "1", tipo: "regula", nota: "La ejecución se despacha o sigue frente a quien se acredite sucesor del ejecutado que figura en el título."}
      - {norma: "LEC", articulo: "540", apartado: "2", tipo: "conexa", nota: "La sucesión se acredita con documentos fehacientes; si bastan, se despacha sin más trámite."}
      - {norma: "LEC", articulo: "540", apartado: "3", tipo: "conexa", nota: "Sin documento fehaciente suficiente: audiencia de 15 días y el tribunal decide sobre la sucesión."}
      - {norma: "LEC", articulo: "6", apartado: "1.4.º", tipo: "conexa", nota: "Tienen capacidad para ser parte los patrimonios que carecen transitoriamente de titular: la herencia yacente."}
    no_consta_en_norma:
      - "Responsabilidad de los coherederos antes de la partición (solidaria o solo con el caudal común): el CC la regula tras partir (1084); jurisprudencial."
      - "Distinción entre deudas del causante y cargas de la herencia (gastos de entierro, de partición, impuesto): elaboración jurisprudencial."
      - "Plazo de la acción para reclamar la herencia a que se remite el 1016: no consta en norma específica; jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley del Notariado, arts. 67 y 68: expediente notarial de formación de inventario (citación, contenido y plazos)."
      - "Texto refundido de la Ley Concursal (RDLeg 1/2020), arts. 567 a 571: concurso de la herencia no aceptada pura y simplemente."
    afines: ["Aceptación y repudiación de la herencia", "Herencia yacente y comunidades sin personalidad como parte", "Partición de la herencia y su impugnación", "Ejecución frente a herederos y frente al cónyuge", "Administración e intervención del caudal hereditario", "Sucesión procesal (muerte de la parte y transmisión del objeto litigioso)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Responsabilidad de los agentes: plazos de 10, 3 y 1 año"
    sinonimos: ["responsabilidad decenal", "vicios de la construcción", "defectos de construcción", "daños estructurales", "defectos de habitabilidad", "defectos de acabado", "responsabilidad del promotor", "responsabilidad del constructor", "responsabilidad del arquitecto", "artículo 17 LOE", "humedades y filtraciones de obra nueva", "seguro decenal"]
    normas_base: ["LOE", "CC"]
    remisiones:
      - {norma: "LOE", articulo: "17", apartado: "1", tipo: "regula", nota: "Frente a propietarios y terceros adquirentes, desde la recepción sin reservas o la subsanación; sin perjuicio del contrato."}
      - {norma: "LOE", articulo: "17", apartado: "1.a)", tipo: "regula", nota: "Diez años: daños por vicios en cimentación, soportes, vigas, forjados, muros de carga u otros elementos estructurales."}
      - {norma: "LOE", articulo: "17", apartado: "1.b)", tipo: "regula", nota: "Tres años: vicios de elementos constructivos o instalaciones que incumplen los requisitos de habitabilidad del 3.1.c)."}
      - {norma: "LOE", articulo: "17", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Un año, solo el constructor: vicios de ejecución en elementos de terminación o acabado."}
      - {norma: "LOE", articulo: "17", apartado: "2", tipo: "regula", nota: "Responsabilidad personal e individualizada, por actos propios y de las personas por las que se deba responder."}
      - {norma: "LOE", articulo: "17", apartado: "3, párrafo 1.º", tipo: "regula", nota: "Solidaria si no se individualiza la causa o hay concurrencia de culpas sin poder precisar la intervención de cada agente."}
      - {norma: "LOE", articulo: "17", apartado: "3, párrafo 2.º", tipo: "regula", nota: "En todo caso, el promotor responde solidariamente con los demás agentes ante los adquirentes."}
      - {norma: "LOE", articulo: "17", apartado: "4", tipo: "conexa", nota: "Se extiende al gestor de cooperativas o comunidades que actúa como promotor por contrato o intervención decisoria."}
      - {norma: "LOE", articulo: "17", apartado: "5", tipo: "conexa", nota: "Proyectistas contratados conjuntamente: solidarios; responden de los cálculos e informes que encargan a otros."}
      - {norma: "LOE", articulo: "17", apartado: "6", tipo: "conexa", nota: "El constructor responde de su jefe de obra y dependientes, de los subcontratistas y de los productos que adquiere."}
      - {norma: "LOE", articulo: "17", apartado: "7", tipo: "conexa", nota: "Directores: responden de la veracidad del certificado final; quien dirige proyecto ajeno asume sus defectos."}
      - {norma: "LOE", articulo: "17", apartado: "8", tipo: "regula", nota: "No responden si prueban caso fortuito, fuerza mayor, acto de tercero o culpa del propio perjudicado."}
      - {norma: "LOE", articulo: "17", apartado: "9", tipo: "conexa", nota: "Sin perjuicio de la responsabilidad del vendedor frente al comprador: contrato y arts. 1484 y siguientes CC."}
      - {norma: "LOE", articulo: "3", apartado: "1.c)", tipo: "conexa", nota: "Habitabilidad: salubridad y estanqueidad, protección contra el ruido, ahorro de energía y otros aspectos funcionales."}
      - {norma: "LOE", articulo: "6", apartado: "5", tipo: "regula", nota: "Los plazos de responsabilidad y garantía se cuentan desde el acta de recepción o desde la recepción tácita."}
      - {norma: "LOE", articulo: "6", apartado: "4", tipo: "conexa", nota: "Recepción tácita: treinta días desde la notificación del fin de obra sin reservas ni rechazo motivado por escrito."}
      - {norma: "LOE", articulo: "18", apartado: "1", tipo: "regula", nota: "La acción prescribe a los dos años desde que se producen los daños; quedan a salvo las acciones contractuales."}
      - {norma: "LOE", articulo: "19", apartado: "1", tipo: "conexa", nota: "Garantías de referencia: un año (o retención del 5 %), tres años y diez años, por los mismos daños del art. 17."}
      - {norma: "LOE", articulo: "da 2", tipo: "conexa", nota: "El seguro decenal es obligatorio en edificios de vivienda; no para el autopromotor de una vivienda unifamiliar propia."}
      - {norma: "LOE", articulo: "2", apartado: "2", tipo: "conexa", nota: "Es edificación la obra nueva y la intervención que altera la configuración arquitectónica o el uso del edificio."}
      - {norma: "LOE", articulo: "dt 1", tipo: "regula", nota: "La LOE rige obras cuya licencia se solicitó tras su entrada en vigor; las anteriores, por el art. 1591 CC."}
      - {norma: "LOE", articulo: "da 7", tipo: "conexa", nota: "El agente demandado puede pedir, en plazo de contestar, que se notifique la demanda a otros agentes."}
      - {norma: "CC", articulo: "1591", tipo: "conexa", nota: "Régimen anterior a la LOE: ruina por vicios en diez años desde que concluyó la obra; contratista y arquitecto."}
      - {norma: "CC", articulo: "1101", tipo: "conexa", nota: "Vía contractual concurrente: indemnización por cumplimiento defectuoso frente a quien contrató la obra o vendió."}
    no_consta_en_norma:
      - "Los plazos del 17 son de garantía (el daño debe manifestarse dentro) y la acción prescribe aparte (18): así lo interpreta la jurisprudencia."
      - "Daños morales, lucro cesante y otros no materiales quedan fuera del 17 LOE y van por la vía contractual: jurisprudencial."
      - "Encaje de cada defecto (humedades, fisuras, aislamiento) en estructura, habitabilidad o acabado: casuística jurisprudencial."
      - "Legitimación de la comunidad de propietarios para reclamar por vicios en elementos comunes y en los privativos: jurisprudencial."
    fuera_de_la_herramienta:
      - "Código Técnico de la Edificación (RD 314/2006, de 17 de marzo): exigencias básicas que concretan los requisitos del art. 3 LOE."
      - "Ley 50/1980, de Contrato de Seguro, art. 76: acción directa contra la aseguradora de responsabilidad civil del agente."
    afines: ["Prescripción de las acciones de la LOE y repetición", "Agentes de la edificación y sus obligaciones", "Recepción de la obra", "Garantías y seguros de la edificación", "Concurrencia de la LOE con la responsabilidad contractual y el art. 1591 CC", "Contrato de obra: precio, riesgo y vicios", "Intervención de terceros"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Prescripción de las acciones de la LOE y repetición"
    sinonimos: ["prescripción LOE", "dos años LOE", "artículo 18 LOE", "acción de repetición", "repetición entre agentes", "repetición de la aseguradora", "plazo para reclamar vicios de construcción", "interrupción de la prescripción LOE", "solidaridad impropia", "llamada al proceso de otros agentes"]
    normas_base: ["LOE", "CC"]
    remisiones:
      - {norma: "LOE", articulo: "18", apartado: "1", tipo: "regula", nota: "Las acciones del art. 17 prescriben a los dos años desde que se producen los daños; quedan las contractuales."}
      - {norma: "LOE", articulo: "18", apartado: "2", tipo: "regula", nota: "Repetición entre agentes o de la aseguradora: dos años desde la firmeza de la condena o desde la indemnización extrajudicial."}
      - {norma: "LOE", articulo: "17", apartado: "1", tipo: "conexa", nota: "Plazos de 10, 3 y 1 año desde la recepción sin reservas o la subsanación: el daño debe aparecer dentro."}
      - {norma: "LOE", articulo: "6", apartado: "5", tipo: "conexa", nota: "Los plazos de responsabilidad y garantía se cuentan desde el acta de recepción o la recepción tácita."}
      - {norma: "LOE", articulo: "17", apartado: "3, párrafo 1.º", tipo: "conexa", nota: "Solidaridad solo si no se individualiza la causa o no se precisa la intervención de cada agente."}
      - {norma: "LOE", articulo: "17", apartado: "5, párrafo 2.º", tipo: "conexa", nota: "El proyectista responde de cálculos e informes ajenos, sin perjuicio de repetir contra sus autores."}
      - {norma: "LOE", articulo: "17", apartado: "6", tipo: "conexa", nota: "El constructor responde de subcontratistas y productos, sin perjuicio de la repetición a que haya lugar."}
      - {norma: "LOE", articulo: "17", apartado: "7, párrafo 2.º", tipo: "conexa", nota: "Quien dirige obra con proyecto ajeno asume sus defectos, sin perjuicio de repetir frente al proyectista."}
      - {norma: "LOE", articulo: "da 7", tipo: "regula", nota: "El demandado pide, en plazo de contestar, notificar la demanda a otros agentes; si no comparecen, la sentencia les es oponible."}
      - {norma: "CC", articulo: "1973", tipo: "regula", nota: "La prescripción se interrumpe por demanda, reclamación extrajudicial o reconocimiento del deudor."}
      - {norma: "CC", articulo: "1974", apartado: "párrafo 1.º", tipo: "regula", nota: "En las obligaciones solidarias, la interrupción aprovecha o perjudica por igual a todos los acreedores y deudores."}
      - {norma: "CC", articulo: "1969", tipo: "conexa", nota: "Sin regla especial, la prescripción corre desde el día en que la acción pudo ejercitarse."}
      - {norma: "CC", articulo: "1145", apartado: "párrafo 2.º", tipo: "conexa", nota: "El deudor solidario que paga solo reclama a cada codeudor su parte, con los intereses del anticipo."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "conexa", nota: "La acción contractual por los mismos defectos prescribe a los cinco años desde que pudo exigirse."}
      - {norma: "CC", articulo: "1591", tipo: "conexa", nota: "Obras anteriores a la LOE: diez años de garantía; quince la acción si el contratista faltó al contrato."}
    no_consta_en_norma:
      - "Solidaridad impropia de los agentes: la reclamación a uno no interrumpe la prescripción frente a los demás (no rige el 1974): jurisprudencial."
      - "Día inicial de los dos años: cuando se conocen los daños y su alcance; en daños continuados, desde su consolidación: jurisprudencial."
      - "Si cabe condenar al agente llamado por la da 7 sin que el actor dirija la demanda contra él: criterio jurisprudencial."
    afines: ["Responsabilidad de los agentes: plazos de 10, 3 y 1 año", "Prescripción (como excepción)", "Interrupción de la prescripción", "Intervención de terceros", "Solidaridad y mancomunidad", "Concurrencia de la LOE con la responsabilidad contractual y el art. 1591 CC"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Cantidades anticipadas en la compra sobre plano"
    sinonimos: ["compra sobre plano", "cantidades a cuenta", "anticipos al promotor", "aval de cantidades anticipadas", "seguro de caución", "cuenta especial", "Ley 57/1968", "devolución de cantidades entregadas a cuenta", "vivienda no entregada", "retraso en la entrega de la vivienda", "promoción paralizada", "responsabilidad del banco receptor"]
    normas_base: ["LOE", "CC"]
    remisiones:
      - {norma: "LOE", articulo: "da 1", apartado: "Uno.1.a)", tipo: "regula", nota: "Desde la licencia, el promotor garantiza devolver lo entregado más interés legal con seguro de caución o aval solidario."}
      - {norma: "LOE", articulo: "da 1", apartado: "Uno.1.b)", tipo: "regula", nota: "Anticipos en cuenta especial; la entidad de crédito, bajo su responsabilidad, exige la garantía para abrirla."}
      - {norma: "LOE", articulo: "da 1", apartado: "Uno.2", tipo: "conexa", nota: "La garantía cubre lo aportado, impuestos incluidos, más el interés legal del dinero."}
      - {norma: "LOE", articulo: "da 1", apartado: "Dos.1.a)", tipo: "conexa", nota: "Seguro de caución: póliza individual por adquirente, con identificación del inmueble."}
      - {norma: "LOE", articulo: "da 1", apartado: "Dos.1.e)", tipo: "regula", nota: "El asegurador no opone al comprador las excepciones contra el promotor; tampoco el impago de la prima."}
      - {norma: "LOE", articulo: "da 1", apartado: "Dos.1.h)", tipo: "regula", nota: "Requerimiento fehaciente al promotor; sin devolución en 30 días, se reclama al asegurador, que paga en 30 días."}
      - {norma: "LOE", articulo: "da 1", apartado: "Dos.2.b)", tipo: "regula", nota: "Aval: tras requerir al promotor sin devolución en 30 días, se exige al avalista; o directamente si no cabe requerir."}
      - {norma: "LOE", articulo: "da 1", apartado: "Dos.2.c)", tipo: "regula", nota: "El aval caduca a los dos años del incumplimiento si el comprador no requirió la rescisión y la devolución."}
      - {norma: "LOE", articulo: "da 1", apartado: "Tres", tipo: "regula", nota: "El contrato debe recoger la obligación de devolver, la garantía y la cuenta; al firmar se entrega el documento de garantía."}
      - {norma: "LOE", articulo: "da 1", apartado: "Cuatro", tipo: "regula", nota: "Obra no iniciada o vivienda no entregada: rescisión con devolución e intereses legales o prórroga pactada por escrito."}
      - {norma: "LOE", articulo: "da 1", apartado: "Cinco", tipo: "conexa", nota: "La garantía se cancela con la licencia de primera ocupación y la entrega, o si el comprador rehúsa recibirla."}
      - {norma: "LOE", articulo: "da 1", apartado: "Siete", tipo: "conexa", nota: "No garantizar es infracción de consumo: sanción de hasta el 25 % de las cantidades a asegurar."}
      - {norma: "LOE", articulo: "dd 3", tipo: "regula", nota: "Deroga la Ley 57/1968 de cantidades anticipadas, con efectos desde el 1 de enero de 2016."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 2.º", tipo: "conexa", nota: "Ante el incumplimiento, el comprador elige cumplimiento o resolución, con daños e intereses en ambos casos."}
    no_consta_en_norma:
      - "Contratos anteriores al 01-01-2016: siguen bajo la Ley 57/1968 derogada; la LOE no trae régimen transitorio expreso: jurisprudencial."
      - "Responsabilidad del banco que recibe anticipos sin exigir garantía, aunque no estén en cuenta especial: doctrina jurisprudencial."
      - "Si el retraso en la entrega permite resolver o solo el incumplimiento grave del plazo: criterio jurisprudencial."
      - "Si la protección alcanza al comprador que adquiere con fin inversor o profesional: criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 57/1968, de cantidades anticipadas: derogada desde el 01-01-2016 (LOE dd 3), relevante para contratos anteriores."
      - "Ley 50/1980, de Contrato de Seguro: rige el seguro de caución en lo no previsto (LOE da 1, Dos.1.l)."
    afines: ["Incumplimiento y facultad resolutoria (art. 1124)", "Garantías y seguros de la edificación", "Compraventa: entrega, precio y riesgos", "Mora del deudor e intereses moratorios", "Concepto de consumidor y de empresario"]
    estado: "vigente"
