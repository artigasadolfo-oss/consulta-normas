  - voz: "Concepto de consumidor y de empresario"
    sinonimos: ["consumidor", "usuario", "consumidor y usuario", "empresario", "profesional", "relación de consumo", "contrato con consumidores", "consumidor persona jurídica", "finalidad mixta", "propósito ajeno a la actividad profesional", "consumidor vulnerable", "ámbito del TRLGDCU"]
    normas_base: ["TRLGDCU", "LEC", "CE"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "3", apartado: "1, párrafo 1.º", tipo: "regula", nota: "Consumidor: persona física que actúa con un propósito ajeno a su actividad comercial, empresarial, oficio o profesión."}
      - {norma: "TRLGDCU", articulo: "3", apartado: "1, párrafo 2.º", tipo: "regula", nota: "También personas jurídicas y entes sin personalidad que actúan sin ánimo de lucro, ajenos a actividad comercial o empresarial."}
      - {norma: "TRLGDCU", articulo: "3", apartado: "2", tipo: "conexa", nota: "Persona consumidora vulnerable: especial subordinación, indefensión o desprotección en una relación concreta de consumo."}
      - {norma: "TRLGDCU", articulo: "4", tipo: "regula", nota: "Empresario: persona física o jurídica, privada o pública, que actúa con propósito relacionado con su actividad profesional."}
      - {norma: "TRLGDCU", articulo: "2", tipo: "regula", nota: "La ley se aplica a las relaciones entre consumidores o usuarios y empresarios."}
      - {norma: "TRLGDCU", articulo: "59", apartado: "1", tipo: "regula", nota: "Son contratos con consumidores los celebrados entre un consumidor o usuario y un empresario."}
      - {norma: "TRLGDCU", articulo: "59", apartado: "2", tipo: "conexa", nota: "En lo no previsto en esta ley o en leyes especiales, rige el derecho común de los contratos."}
      - {norma: "TRLGDCU", articulo: "59", apartado: "3", tipo: "conexa", nota: "Si el contrato incorpora condiciones generales, se somete además a la Ley 7/1998."}
      - {norma: "TRLGDCU", articulo: "8", apartado: "1", tipo: "conexa", nota: "Derechos básicos: salud y seguridad, intereses económicos frente a cláusulas abusivas, indemnización e información."}
      - {norma: "TRLGDCU", articulo: "10", tipo: "conexa", nota: "Es nula la renuncia previa a los derechos que la ley reconoce al consumidor y los actos en fraude de ley."}
      - {norma: "TRLGDCU", articulo: "67", apartado: "2", tipo: "conexa", nota: "Las normas sobre abusivas se aplican aunque se elija otra ley si hay vínculo estrecho con el EEE; inmuebles allí situados."}
      - {norma: "LEC", articulo: "52", apartado: "3", tipo: "conexa", nota: "Acciones individuales del consumidor: a su elección, el tribunal de su domicilio o el de los arts. 50 y 51."}
      - {norma: "LEC", articulo: "54", apartado: "2", tipo: "conexa", nota: "No vale la sumisión expresa en contratos de adhesión, con condiciones generales o celebrados con consumidores."}
      - {norma: "LEC", articulo: "11", apartado: "1", tipo: "conexa", nota: "Las asociaciones de consumidores defienden en juicio a sus asociados, a la asociación y los intereses generales."}
      - {norma: "CE", articulo: "51", apartado: "1", tipo: "conexa", nota: "Los poderes públicos garantizan la defensa de los consumidores: seguridad, salud e intereses económicos."}
    no_consta_en_norma:
      - "Contrato con finalidad mixta: hay consumidor si el propósito profesional no es predominante: jurisprudencial (TS y TJUE)."
      - "Quien compra una vivienda para alquilarla sin ser profesional puede ser consumidor: casuística jurisprudencial."
      - "Fiador o avalista persona física de una deuda empresarial: consumidor si no tiene vínculo funcional con la empresa: jurisprudencial (TJUE)."
      - "Apreciación de oficio de la condición de consumidor y carga de su prueba: jurisprudencial."
    fuera_de_la_herramienta:
      - "Directivas 93/13/CEE y 2011/83/UE: la jurisprudencia del TJUE sobre ellas fija el alcance de «consumidor» y «profesional»."
    afines: ["Cláusulas abusivas: concepto, nulidad e integración", "Control de oficio de cláusulas abusivas en el proceso", "Sumisión expresa y tácita", "Competencia territorial y fueros imperativos", "Consumidor vulnerable", "Irrenunciabilidad de los derechos del consumidor"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Cláusulas abusivas: concepto, nulidad e integración"
    sinonimos: ["cláusula abusiva", "nulidad de cláusula abusiva", "desequilibrio importante", "buena fe contractual", "cláusula no negociada", "control de transparencia", "cláusula no transparente", "se tiene por no puesta", "integración del contrato", "interpretación contra el predisponente", "contra proferentem", "condiciones generales de la contratación"]
    normas_base: ["TRLGDCU", "LEC", "CC"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "82", apartado: "1", tipo: "regula", nota: "Abusiva: estipulación no negociada que, contra la buena fe, causa al consumidor un desequilibrio importante."}
      - {norma: "TRLGDCU", articulo: "82", apartado: "2", tipo: "regula", nota: "Negociar una cláusula no salva el resto del contrato; el empresario prueba que hubo negociación individual."}
      - {norma: "TRLGDCU", articulo: "82", apartado: "3", tipo: "regula", nota: "Se aprecia según el bien o servicio, las circunstancias al contratar y las demás cláusulas del contrato."}
      - {norma: "TRLGDCU", articulo: "82", apartado: "4", tipo: "regula", nota: "Son abusivas en todo caso las de los arts. 85 a 90: voluntad del empresario, reciprocidad, garantías, competencia."}
      - {norma: "TRLGDCU", articulo: "83", apartado: "párrafo 1.º", tipo: "regula", nota: "Nulas de pleno derecho y no puestas; el juez, oídas las partes, las anula y el contrato sigue si puede subsistir."}
      - {norma: "TRLGDCU", articulo: "83", apartado: "párrafo 2.º", tipo: "regula", nota: "Las condiciones incorporadas de modo no transparente en perjuicio del consumidor son nulas de pleno derecho."}
      - {norma: "TRLGDCU", articulo: "80", apartado: "1", tipo: "regula", nota: "Requisitos: claridad sin reenvíos no facilitados, legibilidad (letra de 2,5 mm como mínimo), buena fe y justo equilibrio."}
      - {norma: "TRLGDCU", articulo: "80", apartado: "2", tipo: "regula", nota: "En acciones individuales, la cláusula dudosa se interpreta del modo más favorable al consumidor."}
      - {norma: "TRLGDCU", articulo: "84", tipo: "conexa", nota: "Notarios y registradores no autorizan ni inscriben cláusulas declaradas abusivas en sentencia inscrita en el RCGC."}
      - {norma: "TRLGDCU", articulo: "59", apartado: "3", tipo: "conexa", nota: "Contratos con condiciones generales: se someten además a la Ley 7/1998."}
      - {norma: "TRLGDCU", articulo: "10", tipo: "conexa", nota: "La renuncia previa a los derechos del consumidor es nula."}
      - {norma: "LEC", articulo: "815", apartado: "3, párrafo 2.º", tipo: "conexa", nota: "Monitorio contra consumidor: el juez puede proponer requerir solo el importe que resulte de excluir la cláusula abusiva."}
      - {norma: "LEC", articulo: "552", apartado: "1, párrafo 2.º", tipo: "conexa", nota: "Al despachar ejecución de título no judicial, control de oficio de cláusulas abusivas con audiencia de 15 días."}
      - {norma: "LEC", articulo: "557", apartado: "1.7.ª", tipo: "conexa", nota: "En la ejecución de títulos no judiciales, el deudor puede oponerse porque el título contiene cláusulas abusivas."}
      - {norma: "CC", articulo: "1288", tipo: "conexa", nota: "La cláusula oscura no puede favorecer a la parte que ocasionó la oscuridad."}
      - {norma: "CC", articulo: "1258", tipo: "conexa", nota: "El contrato obliga también a lo que exigen la buena fe, el uso y la ley."}
    no_consta_en_norma:
      - "Tras la nulidad, el juez no modera ni reescribe la cláusula; solo cabe norma dispositiva si el contrato no subsiste sin ella: jurisprudencial (TJUE)."
      - "Control de transparencia material (comprensión real de la carga económica y jurídica de la cláusula): construcción jurisprudencial."
      - "Restitución de lo pagado sin límite temporal y prescripción de la acción restitutoria: jurisprudencial (TJUE y TS)."
      - "Cláusulas sobre el objeto principal o el precio: solo se controla su abusividad si no son transparentes: jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 7/1998, de Condiciones Generales de la Contratación, arts. 5, 7 y 8: incorporación, no incorporación y nulidad."
      - "Directiva 93/13/CEE, sobre cláusulas abusivas, y su interpretación por el TJUE."
    afines: ["Cláusulas abusivas: lista legal (gastos, sumisión, penalizaciones)", "Control de oficio de cláusulas abusivas en el proceso", "Concepto de consumidor y de empresario", "Condiciones generales en el verbal y procedimiento testigo", "Interpretación de los contratos", "Oposición en la ejecución hipotecaria"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Cláusulas abusivas: lista legal (gastos, sumisión, penalizaciones)"
    sinonimos: ["lista negra de cláusulas abusivas", "gastos de notaría y registro", "plusvalía a cargo del comprador", "sumisión a otros tribunales", "arbitraje no de consumo", "penalización desproporcionada", "indemnización desproporcionada", "permanencia abusiva", "redondeo al alza", "modificación unilateral del contrato", "subrogación en la hipoteca del promotor", "carga de la prueba invertida"]
    normas_base: ["TRLGDCU"]
    remisiones:
      - {norma: "TRLGDCU", articulo: "82", apartado: "4", tipo: "regula", nota: "Son abusivas en todo caso las cláusulas que, conforme a los arts. 85 a 90, encajan en alguno de sus seis grupos."}
      - {norma: "TRLGDCU", articulo: "85", apartado: "3", tipo: "regula", nota: "Reservar al empresario la interpretación o la modificación unilateral, salvo motivos válidos especificados."}
      - {norma: "TRLGDCU", articulo: "85", apartado: "4", tipo: "conexa", nota: "Resolución anticipada solo para el empresario o, en los indefinidos, sin preaviso razonable."}
      - {norma: "TRLGDCU", articulo: "85", apartado: "6", tipo: "regula", nota: "Indemnización desproporcionadamente alta a cargo del consumidor que no cumple."}
      - {norma: "TRLGDCU", articulo: "85", apartado: "8", tipo: "conexa", nota: "Fechas de entrega meramente indicativas condicionadas a la voluntad del empresario."}
      - {norma: "TRLGDCU", articulo: "85", apartado: "10", tipo: "regula", nota: "Fijar el precio al entregar o subirlo sin razones objetivas ni derecho del consumidor a resolver."}
      - {norma: "TRLGDCU", articulo: "86", apartado: "1", tipo: "regula", nota: "Excluir o limitar los derechos por incumplimiento del empresario, incluida la conformidad y su indemnización."}
      - {norma: "TRLGDCU", articulo: "86", apartado: "2", tipo: "regula", nota: "Excluir o limitar la responsabilidad del empresario por daños, muerte o lesiones del consumidor."}
      - {norma: "TRLGDCU", articulo: "86", apartado: "4", tipo: "conexa", nota: "Privar al consumidor de compensar créditos, retener o consignar."}
      - {norma: "TRLGDCU", articulo: "86", apartado: "7", tipo: "conexa", nota: "Cláusula de cierre: cualquier otra renuncia o limitación de los derechos del consumidor."}
      - {norma: "TRLGDCU", articulo: "87", apartado: "2", tipo: "regula", nota: "Retener lo pagado si renuncia el consumidor, sin indemnización equivalente si renuncia el empresario."}
      - {norma: "TRLGDCU", articulo: "87", apartado: "4", tipo: "conexa", nota: "Quedarse lo pagado por prestaciones no efectuadas cuando es el empresario quien resuelve."}
      - {norma: "TRLGDCU", articulo: "87", apartado: "5", tipo: "conexa", nota: "Redondeo al alza del tiempo o del precio y cobro de lo no consumido de manera efectiva."}
      - {norma: "TRLGDCU", articulo: "87", apartado: "6", tipo: "regula", nota: "Obstáculos para poner fin al contrato: permanencias excesivas, formalidades o indemnizaciones sin daño real."}
      - {norma: "TRLGDCU", articulo: "88", apartado: "1", tipo: "conexa", nota: "Garantías desproporcionadas al riesgo; se presumen proporcionadas las financieras que siguen su normativa."}
      - {norma: "TRLGDCU", articulo: "88", apartado: "2", tipo: "regula", nota: "Imponer al consumidor la carga de la prueba cuando debería corresponder a la otra parte."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "1", tipo: "conexa", nota: "Declaraciones de recepción sobre hechos ficticios y adhesión a cláusulas que no pudo conocer antes."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "3", tipo: "regula", nota: "Imponer al consumidor gastos de documentación y tramitación que por ley corresponden al empresario."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "3.a)", tipo: "conexa", nota: "Compraventa de vivienda: gastos de titulación propios del vendedor (obra nueva, PH, hipoteca de construcción)."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "3.b)", tipo: "conexa", nota: "Obligar a subrogarse en la hipoteca del empresario o penalizar que no se subrogue."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "3.c)", tipo: "regula", nota: "Hacer pagar al consumidor tributos cuyo sujeto pasivo es el empresario."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "3.d)", tipo: "conexa", nota: "Cargar al comprador las acometidas de suministros si la vivienda debe entregarse habitable."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "5", tipo: "regula", nota: "Recargos o penalizaciones sin prestación adicional que el consumidor pueda aceptar o rechazar con claridad."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "7", tipo: "conexa", nota: "Descubiertos en cuenta por encima del límite de la Ley 7/1995 (derogada; hoy Ley 16/2011)."}
      - {norma: "TRLGDCU", articulo: "89", apartado: "8", tipo: "conexa", nota: "Renuncia del consumidor a elegir el notario que autorice el documento público."}
      - {norma: "TRLGDCU", articulo: "90", apartado: "1", tipo: "regula", nota: "Sumisión a arbitrajes distintos del de consumo, salvo arbitrajes institucionales sectoriales creados por ley."}
      - {norma: "TRLGDCU", articulo: "90", apartado: "2", tipo: "regula", nota: "Sumisión a tribunal distinto del domicilio del consumidor, del lugar de cumplimiento o de situación del inmueble."}
      - {norma: "TRLGDCU", articulo: "90", apartado: "3", tipo: "conexa", nota: "Sumisión a derecho extranjero respecto del lugar de la declaración del consumidor o de la actividad del empresario."}
      - {norma: "TRLGDCU", articulo: "91", tipo: "conexa", nota: "Valores, instrumentos financieros y divisas: no se aplican ciertas abusivas sobre modificación, resolución y precio."}
    no_consta_en_norma:
      - "Gastos de la hipoteca (notaría, registro, gestoría, tasación, impuesto) y su reparto tras la nulidad: criterio jurisprudencial (TS y TJUE)."
      - "Interés de demora abusivo en préstamos personales a consumidores: más de dos puntos sobre el remuneratorio: jurisprudencial."
      - "Vencimiento anticipado: su abusividad depende de la gravedad del incumplimiento previsto: jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 16/2011, de contratos de crédito al consumo, art. 20.4: descubiertos, TAE máxima de 2,5 veces el interés legal (el 89.7 remite a la derogada Ley 7/1995)."
      - "Ley 5/2019, de contratos de crédito inmobiliario: reparto legal de gastos y tope del interés de demora en préstamos hipotecarios."
    afines: ["Cláusulas abusivas: concepto, nulidad e integración", "Control de oficio de cláusulas abusivas en el proceso", "Sumisión expresa y tácita", "Cláusula penal", "Oposición en la ejecución hipotecaria", "Concepto de consumidor y de empresario"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
