      - "Pie de recurso erróneo (208.4) y su efecto sobre el plazo: criterio jurisprudencial y constitucional."
    afines: ["Recurso de revisión contra decretos del LAJ", "Recurso de queja", "Depósito para recurrir", "Pertinencia y utilidad de la prueba; protesta", "Resoluciones procesales: clases y firmeza"]
