  - voz: "Depósito para recurrir"
    sinonimos: ["depósito", "consignación para recurrir", "depósito de 50 euros", "depósito de 25 euros", "subsanación del depósito", "pérdida del depósito", "cuenta de depósitos y consignaciones"]
    normas_base: ["LOPJ", "LEC"]
    remisiones:
      - {norma: "LOPJ", articulo: "da 15", apartado: "1", tipo: "regula", nota: "Recursos ordinarios y extraordinarios, revisión y rescisión a instancia del rebelde exigen depósito en el orden civil."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "2", tipo: "regula", nota: "Solo para recursos que se tramitan por escrito."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "3", tipo: "regula", nota: "Contra resoluciones que ponen fin o impiden seguir: 30 euros la queja; 50 la apelación, la casación y la rescisión."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "3.e)", tipo: "conexa", nota: "Fija 50 euros para la revisión, pero el apartado 14 excluye la revisión civil, que sigue el art. 513 LEC."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "4", tipo: "regula", nota: "Resoluciones que no ponen fin, y reposición o revisión ante el LAJ: 25 euros; salvo revisión del decreto de reposición."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "5", tipo: "regula", nota: "Exentos el Ministerio Fiscal, el Estado, las comunidades autónomas, las entidades locales y sus organismos autónomos."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "6", tipo: "regula", nota: "La notificación indica el depósito y su forma; se acredita haberlo consignado al interponer el recurso."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "7", tipo: "regula", nota: "Sin depósito no se admite; defecto u omisión: dos días para subsanar o queda firme la resolución."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "8", tipo: "regula", nota: "Si se estima total o parcialmente el recurso, se devuelve todo el depósito."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "9", tipo: "regula", nota: "Inadmitido o confirmada la resolución, el recurrente pierde el depósito."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "13", tipo: "conexa", nota: "El depósito es compatible con la tasa judicial."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "14", tipo: "regula", nota: "No se aplica a la revisión de sentencias firmes en el orden civil, que sigue la LEC."}
      - {norma: "LEC", articulo: "513", apartado: "1", tipo: "regula", nota: "Demanda de revisión de sentencia firme: depósito de 300 euros, que se devuelve si se estima."}
      - {norma: "LEC", articulo: "513", apartado: "2", tipo: "conexa", nota: "Falta o insuficiencia no subsanada en el plazo del LAJ (máximo cinco días): se repele la demanda."}
      - {norma: "LEC", articulo: "241", apartado: "1.3.º", tipo: "conexa", nota: "Los depósitos necesarios para recurrir son costas."}
      - {norma: "LEC", articulo: "449", apartado: "1", tipo: "conexa", nota: "Distinto del depósito: en procesos con lanzamiento hay que acreditar las rentas pagadas para recurrir."}
      - {norma: "LEC", articulo: "449", apartado: "4", tipo: "conexa", nota: "Distinto del depósito: deudas con la comunidad, pago o consignación de la condena para recurrir."}
      - {norma: "LEC", articulo: "449", apartado: "5", tipo: "conexa", nota: "Esas consignaciones caben por aval solidario a primer requerimiento u otro medio de disponibilidad inmediata."}
      - {norma: "LEC", articulo: "231", tipo: "conexa", nota: "Tribunal y LAJ cuidan de que se subsanen los defectos de los actos de las partes."}
    no_consta_en_norma:
      - "Si la impugnación del apelado (art. 461 LEC) exige depósito propio: la disposición no lo dice; criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley 1/1996, de asistencia jurídica gratuita, art. 6.5: exención de depósitos del beneficiario."
      - "Ley 10/2012, de tasas judiciales: la tasa es compatible con el depósito (apartado 13)."
    afines: ["Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Recurso de reposición", "Recurso de revisión contra decretos del LAJ", "Recurso de queja", "Revisión de sentencias firmes", "Rescisión de la sentencia firme a instancia del rebelde"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Nulidad de actuaciones"
    sinonimos: ["nulidad de pleno derecho", "incidente de nulidad", "incidente excepcional de nulidad", "indefensión", "defecto de emplazamiento", "nulidad procesal", "retroacción de actuaciones", "conservación de actos", "subsanación de defectos"]
    normas_base: ["LOPJ", "LEC", "CE"]
    remisiones:
      - {norma: "LOPJ", articulo: "238", tipo: "regula", nota: "Nulidad de pleno derecho: falta de jurisdicción o competencia, violencia, falta de abogado o de LAJ preceptivos."}
      - {norma: "LOPJ", articulo: "238", apartado: "3.º", tipo: "regula", nota: "Prescindir de normas esenciales del procedimiento, si por ello ha podido producirse indefensión."}
      - {norma: "LOPJ", articulo: "240", apartado: "1", tipo: "regula", nota: "La nulidad y los defectos de forma con indefensión se hacen valer por los recursos o medios legales."}
      - {norma: "LOPJ", articulo: "240", apartado: "2", tipo: "regula", nota: "De oficio o a instancia, antes de la resolución final, si no cabe subsanar; en recurso, no de oficio salvo excepciones."}
      - {norma: "LOPJ", articulo: "241", apartado: "1", tipo: "regula", nota: "Incidente excepcional: lesión de derecho del 53.2 CE no denunciable antes, sin recurso; 20 días, máximo cinco años."}
      - {norma: "LOPJ", articulo: "241", apartado: "2", tipo: "regula", nota: "No suspende salvo acuerdo; alegaciones en cinco días; si se desestima, costas y multa de 90 a 600 euros por temeridad."}
      - {norma: "LOPJ", articulo: "239", tipo: "conexa", nota: "Actos bajo violencia o intimidación: nulos, con todos los condicionados por ellos."}
      - {norma: "LOPJ", articulo: "242", tipo: "conexa", nota: "Actuación fuera de plazo: solo se anula si lo impone la naturaleza del término."}
      - {norma: "LOPJ", articulo: "243", apartado: "1", tipo: "regula", nota: "La nulidad no arrastra a los actos independientes ni a los que no habrían cambiado sin la infracción."}
      - {norma: "LOPJ", articulo: "243", apartado: "3", tipo: "conexa", nota: "Se procura subsanar los defectos de las partes si mostraron voluntad de cumplir los requisitos."}
      - {norma: "LEC", articulo: "225", tipo: "regula", nota: "Lista paralela a la del 238 LOPJ, con un caso más: resolver por diligencia o decreto lo reservado al juez (6.º)."}
      - {norma: "LEC", articulo: "227", apartado: "1", tipo: "regula", nota: "La nulidad se hace valer por los recursos contra la resolución de que se trate."}
      - {norma: "LEC", articulo: "227", apartado: "2", tipo: "regula", nota: "Declaración de oficio o a instancia antes de la resolución final; en recurso, no de oficio salvo excepciones."}
      - {norma: "LEC", articulo: "228", apartado: "1", tipo: "regula", nota: "Incidente excepcional en la LEC, con el mismo plazo de 20 días y el tope de cinco años."}
      - {norma: "LEC", articulo: "228", apartado: "2", tipo: "conexa", nota: "Tramitación, efectos y costas del incidente, en términos iguales a los del 241.2 LOPJ."}
      - {norma: "LEC", articulo: "230", tipo: "conexa", nota: "Conservación de los actos independientes del nulo."}
      - {norma: "LEC", articulo: "231", tipo: "conexa", nota: "Tribunal y LAJ cuidan de que se subsanen los defectos de los actos de las partes."}
      - {norma: "LEC", articulo: "df 17", tipo: "conexa", nota: "Dice que los arts. 225 a 230 no se aplican hasta reformar la LOPJ, que se reformó por la LO 19/2003."}
      - {norma: "LEC", articulo: "459", tipo: "conexa", nota: "En apelación, la infracción procesal exige citar la norma, la indefensión y haberla denunciado a tiempo."}
      - {norma: "LEC", articulo: "465", apartado: "4", tipo: "conexa", nota: "Apelación con nulidad radical: se reponen las actuaciones, salvo que se subsane en la segunda instancia."}
      - {norma: "CE", articulo: "24", apartado: "1", tipo: "regula", nota: "Tutela judicial efectiva sin que pueda producirse indefensión."}
      - {norma: "CE", articulo: "53", apartado: "2", tipo: "conexa", nota: "Derechos del art. 14 y de la sección 1.ª del capítulo segundo: son los que abren el incidente excepcional."}
    no_consta_en_norma:
      - "Si la df 17.ª LEC sigue vedando los arts. 225 a 230 tras la LO 19/2003: el texto no lo aclara; la práctica cita ambas leyes."
      - "Indefensión material frente a formal y diligencia exigible a la parte: criterio del Tribunal Constitucional."
      - "Incidente del 241 LOPJ como vía previa obligada al amparo: criterio del Tribunal Constitucional."
    fuera_de_la_herramienta:
      - "Ley Orgánica 2/1979, del Tribunal Constitucional, art. 44: recurso de amparo tras agotar la vía judicial."
    afines: ["Tutela judicial efectiva e indefensión", "Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Rescisión de la sentencia firme a instancia del rebelde", "Revisión de sentencias firmes", "Actos de comunicación: domicilio, emplazamiento y edictos", "Aclaración, corrección y complemento de resoluciones"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Costas: vencimiento, temeridad y allanamiento"
    sinonimos: ["condena en costas", "criterio del vencimiento", "serias dudas de hecho o de derecho", "temeridad", "mala fe", "estimación parcial", "límite del tercio de la cuantía", "costas del allanamiento", "costas del desistimiento", "honorarios no preceptivos"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "394", apartado: "1", tipo: "regula", nota: "Se imponen a quien ve rechazadas todas sus pretensiones, salvo serias dudas de hecho o de derecho razonadas."}
      - {norma: "LEC", articulo: "394", apartado: "1, párrafo 2.º", tipo: "regula", nota: "La duda jurídica se aprecia con la jurisprudencia recaída en casos similares."}
      - {norma: "LEC", articulo: "394", apartado: "2", tipo: "regula", nota: "Estimación parcial: cada parte las suyas y las comunes por mitad, salvo temeridad."}
      - {norma: "LEC", articulo: "394", apartado: "3", tipo: "regula", nota: "Honorarios no sujetos a arancel: máximo un tercio de la cuantía por litigante; inestimables, 24.000 euros."}
      - {norma: "LEC", articulo: "394", apartado: "3, párrafo 2.º", tipo: "regula", nota: "El límite del tercio no rige si se declara la temeridad del condenado."}
      - {norma: "LEC", articulo: "394", apartado: "3, párrafo 3.º", tipo: "conexa", nota: "Beneficiario de justicia gratuita: paga solo en los casos de la Ley 1/1996; si gana, cobran sus profesionales."}
      - {norma: "LEC", articulo: "394", apartado: "5", tipo: "conexa", nota: "Nunca se imponen al Ministerio Fiscal."}
      - {norma: "LEC", articulo: "395", apartado: "1", tipo: "regula", nota: "Allanamiento antes de contestar: sin costas, salvo mala fe o abuso del servicio público de Justicia."}
      - {norma: "LEC", articulo: "395", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Hay mala fe si hubo requerimiento fehaciente previo o se rechazó el acuerdo ofrecido o el MASC."}
      - {norma: "LEC", articulo: "395", apartado: "2", tipo: "regula", nota: "Allanamiento después de contestar: se aplica el vencimiento del 394.1."}
      - {norma: "LEC", articulo: "396", apartado: "1", tipo: "regula", nota: "Desistimiento no consentido: el actor paga todas las costas."}
      - {norma: "LEC", articulo: "396", apartado: "2", tipo: "regula", nota: "Desistimiento consentido: sin condena a ninguna parte."}
      - {norma: "LEC", articulo: "397", tipo: "conexa", nota: "La apelación sobre las costas de la primera instancia se resuelve con el art. 394."}
      - {norma: "LEC", articulo: "398", apartado: "1", tipo: "conexa", nota: "Costas de la apelación: se aplica el art. 394."}
      - {norma: "LEC", articulo: "241", apartado: "1", tipo: "regula", nota: "Qué son costas: honorarios preceptivos, edictos, depósitos, peritos, copias, aranceles y tasa."}
      - {norma: "LEC", articulo: "243", apartado: "2", tipo: "conexa", nota: "No entran actuaciones inútiles; se reducen honorarios por encima del límite del 394.3 sin temeridad; con IVA."}
      - {norma: "LEC", articulo: "32", apartado: "5", tipo: "regula", nota: "Abogado y procurador no preceptivos: se excluyen, salvo temeridad, abuso o domicilio en otro partido judicial."}
      - {norma: "LEC", articulo: "22", apartado: "1", tipo: "conexa", nota: "Satisfacción extraprocesal con acuerdo de las partes: terminación sin condena en costas."}
      - {norma: "LEC", articulo: "22", apartado: "2, párrafo 2.º", tipo: "conexa", nota: "Si solo se discuten las costas, el auto puede imponerlas con los criterios del art. 395."}
      - {norma: "LEC", articulo: "22", apartado: "5", tipo: "conexa", nota: "Enervado el desahucio, costas al arrendatario, salvo que no se cobrara por causa imputable al arrendador."}
      - {norma: "LEC", articulo: "22", apartado: "6", tipo: "conexa", nota: "Enervación extraordinaria del arrendatario vulnerable sin alternativa: la Administración paga también las costas del actor."}
      - {norma: "LEC", articulo: "247", apartado: "3", tipo: "conexa", nota: "Mala fe o abuso del servicio público de Justicia: multa de 180 a 6.000 euros, sin pasar del tercio de la cuantía."}
    no_consta_en_norma:
      - "Temeridad y mala fe a efectos de costas: el texto no las define; criterio jurisprudencial."
      - "Estimación sustancial de la demanda equiparada a total: criterio jurisprudencial."
      - "«Abuso del servicio público de Justicia»: la LEC lo usa sin definirlo; criterio jurisprudencial en formación."
    fuera_de_la_herramienta:
      - "Ley 1/1996, de asistencia jurídica gratuita: costas del beneficiario; a ella remiten los arts. 241.1 y 394.3 LEC."
      - "RDL 29/2026 (pendiente de convalidar), art. 2.2: si se suspende el desahucio del vulnerable, la Administración compensa al actor persona física o arrendador social, costas incluidas."
    afines: ["Costas y MASC", "Tasación de costas y su impugnación", "Costas en los recursos", "Allanamiento", "Desistimiento", "Carencia sobrevenida de objeto / satisfacción extraprocesal", "Buena fe procesal, abuso del servicio de justicia y multas"]
    # VIGENCIA: LEC 22.6 en la redacción del RDL 29/2026 (BOE 07-10-2026, vigor 08-10-2026; su DT 2.ª lo extiende a las ejecuciones en
    # curso sin lanzamiento practicado), leído en la composición; no se aplica a los casos del art. 2.1 del propio RDL. LEC 22.1, 22.2 y
    # 22.5, y LEC 32, 241, 243, 247 y 394 a 398: idénticos a legalize-es@aca28304d y al texto vigente de boe.es.
    # AVISO: RDL 29/2026 (vigor 08-10-2026) no convalidado a esta fecha (Diputación Permanente, art. 86.2 CE); si se deroga, el 22.6
    # desaparece, como ocurrió con el RDL 26/2026. Va «provisional» por eso.
    estado: "provisional"
    espejo: "legalize-es@597314599f"
    revisada_el: "2026-10-09"
    revisor: "armero"

  - voz: "Costas y MASC"
    sinonimos: ["costas y medios adecuados de solución de controversias", "rechazo de la negociación previa", "negativa a negociar", "exoneración de costas", "moderación de costas", "oferta rechazada y costas", "abuso del servicio público de Justicia", "reclamación previa del consumidor"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "394", apartado: "1, párrafo 3.º", tipo: "regula", nota: "MASC preceptivo o acordado: no hay costas a favor de quien rehusó participar sin justa causa."}
      - {norma: "LEC", articulo: "394", apartado: "2, párrafo 2.º", tipo: "regula", nota: "Quien no acudió sin causa al MASC preceptivo o acordado puede ser condenado aunque la estimación sea parcial."}
      - {norma: "LEC", articulo: "394", apartado: "4", tipo: "regula", nota: "Si el requerido rehusó la negociación previa, el requirente queda exento de costas, salvo abuso."}
      - {norma: "LEC", articulo: "395", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Allanamiento previo a contestar: hay mala fe si rechazó el acuerdo ofrecido o el MASC."}
      - {norma: "LEC", articulo: "395", apartado: "3", tipo: "regula", nota: "No acudió sin causa al MASC y luego se allana: costas, salvo circunstancias excepcionales motivadas."}
      - {norma: "LEC", articulo: "245", apartado: "5", tipo: "regula", nota: "El condenado pide exoneración o moderación si su propuesta en el MASC fue rechazada y la sentencia coincide en lo sustancial."}
      - {norma: "LEC", articulo: "245", apartado: "5, párrafo 2.º", tipo: "regula", nota: "Igual efecto si se rechazó sin justificación la propuesta del tercero neutral y la sentencia coincide con ella."}
      - {norma: "LEC", articulo: "245", apartado: "5, párrafo 3.º", tipo: "regula", nota: "Hay que aportar la documentación íntegra de la propuesta, dispensada de confidencialidad; si no, inadmisión."}
      - {norma: "LEC", articulo: "245 bis", apartado: "1", tipo: "regula", nota: "La solicitud de exoneración o moderación se traslada tres días a la parte favorecida."}
      - {norma: "LEC", articulo: "245 bis", apartado: "2", tipo: "regula", nota: "Si la acepta o calla, decreto del LAJ con la cantidad debida; recurso de revisión."}
      - {norma: "LEC", articulo: "245 bis", apartado: "3", tipo: "regula", nota: "Si se opone, auto del tribunal sin costas, con porcentaje y partidas reducidas; recurso de reposición."}
      - {norma: "LEC", articulo: "245 bis", apartado: "4", tipo: "conexa", nota: "Firme lo anterior, se tramita en su caso la impugnación por honorarios excesivos o indebidos."}
      - {norma: "LEC", articulo: "32", apartado: "5, párrafo 2.º", tipo: "regula", nota: "Consumidor con reclamación extrajudicial previa que litiga con abogado y procurador no preceptivos: se incluyen, sin el límite del 394.3."}
      - {norma: "LO 1/2025", articulo: "7", apartado: "4", tipo: "regula", nota: "Al resolver sobre costas, su tasación y multas, el tribunal pondera la colaboración en el MASC y el abuso."}
      - {norma: "LO 1/2025", articulo: "9", apartado: "2.b)", tipo: "regula", nota: "Excepción a la confidencialidad: solo para la exoneración o moderación de costas del art. 245 LEC."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "1", tipo: "conexa", nota: "Acudir antes a un MASC es requisito de procedibilidad de la demanda civil."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "3", tipo: "conexa", nota: "No hace falta MASC para la demanda ejecutiva, las cautelares previas ni las diligencias preliminares."}
      - {norma: "LO 1/2025", articulo: "10", apartado: "1", tipo: "conexa", nota: "La actividad negociadora o su intento debe constar documentalmente."}
      - {norma: "LO 1/2025", articulo: "11", apartado: "2", tipo: "conexa", nota: "Honorarios del tercero neutral: por acuerdo previo; si se rechaza el propuesto unilateralmente, se abonan los devengados."}
      - {norma: "LO 1/2025", articulo: "17", apartado: "4", tipo: "conexa", nota: "Oferta vinculante rechazada o no aceptada en un mes: decae y el requisito de procedibilidad se tiene por cumplido."}
    no_consta_en_norma:
      - "«Justa causa» para rehusar el MASC y propuesta «sustancialmente coincidente» (245.5): el texto no los define."
      - "Si el 394.4 alcanza al requerido que simplemente no contestó la solicitud de negociación: no lo precisa."
      - "Quién paga al tercero neutral rechazado (11.2 LO 1/2025: «deberá esta abonar»): el texto no precisa qué parte."
    fuera_de_la_herramienta:
      - "Ley 5/2012, de mediación, art. 4: efectos de la solicitud de mediación, al que remite el 7.2.a) LO 1/2025."
    afines: ["Costas: vencimiento, temeridad y allanamiento", "Requisito de procedibilidad (MASC)", "Tasación de costas y su impugnación", "Confidencialidad del MASC", "Oferta vinculante confidencial", "Allanamiento"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"
