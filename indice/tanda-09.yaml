      - {norma: "LEC", articulo: "454 bis", apartado: "1", tipo: "regula", nota: "Revisión contra el decreto que resuelve la reposición; revisión directa contra decretos que ponen fin o impiden seguir."}
      - {norma: "LEC", articulo: "454 bis", apartado: "1, párrafo 2.º", tipo: "regula", nota: "También revisión directa en los casos que la ley prevé expresamente."}
      - {norma: "LEC", articulo: "454 bis", apartado: "2", tipo: "regula", nota: "Cinco días, citando la infracción; admitido por diligencia, cinco días comunes para impugnarlo."}
      - {norma: "LEC", articulo: "454 bis", apartado: "2, párrafo 2.º", tipo: "conexa", nota: "Sin los requisitos de admisibilidad, el tribunal lo inadmite por providencia."}
      - {norma: "LEC", articulo: "454 bis", apartado: "2, párrafo 3.º", tipo: "regula", nota: "Resuelve el tribunal, sin más trámite, por auto en cinco días."}
      - {norma: "LEC", articulo: "454 bis", apartado: "2, párrafo 4.º", tipo: "conexa", nota: "Contra la admisión o inadmisión no cabe recurso."}
      - {norma: "LEC", articulo: "454 bis", apartado: "3", tipo: "regula", nota: "Contra el auto que lo resuelve, apelación solo si pone fin al procedimiento o impide su continuación."}
      - {norma: "LEC", articulo: "451", apartado: "1", tipo: "regula", nota: "Lo demás del LAJ (diligencias y decretos no definitivos) va en reposición ante él, salvo revisión directa."}
      - {norma: "LEC", articulo: "452", apartado: "2", tipo: "conexa", nota: "El decreto que inadmite una reposición es directamente recurrible en revisión."}
      - {norma: "LEC", articulo: "244", apartado: "3", tipo: "conexa", nota: "Decreto que aprueba la tasación de costas: revisión directa; contra el auto, ningún recurso."}
      - {norma: "LEC", articulo: "551", apartado: "5", tipo: "conexa", nota: "Decreto de medidas ejecutivas: revisión directa sin efecto suspensivo ante el tribunal de la orden general."}
      - {norma: "LEC", articulo: "670", apartado: "3, párrafo 5.º", tipo: "conexa", nota: "Decreto que aprueba o deniega el remate: revisión directa ante el tribunal."}
      - {norma: "LEC", articulo: "690", apartado: "3", tipo: "conexa", nota: "Resolución sobre las cuentas de la administración interina de la finca hipotecada: revisión directa."}
      - {norma: "LEC", articulo: "225", apartado: "6.º", tipo: "conexa", nota: "Es nulo resolver por diligencia o decreto lo que la ley reserva a providencia, auto o sentencia."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "4", tipo: "conexa", nota: "Depósito de 25 euros; no se exige para la revisión contra el decreto que resuelve una reposición."}
