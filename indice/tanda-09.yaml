# Índice de conceptos de «Consulta de normas» — tanda 9 (hipotecaria, cautelares, recursos y costas)
# Revisor: armero. Espejo: legalize-es@aca28304d, salvo «Ejecución hipotecaria: especialidades» y «Costas: vencimiento, temeridad y
# allanamiento», revisadas el 9-10-2026 contra legalize-es@597314599f (composición con el RDL 29/2026). Todo precepto citado se ha
# leído en el espejo de su revisión.
# Vigencia: contraste con la API de boe.es (scripts/contraste_boe.py --solo "LEC,LOPJ,LO 1/2025,TRLGDCU,CE,CC", 08-10-2026 07:51):
# distintos LEC 22 y 685, CC 396 (errata del espejo). LOPJ, LO 1/2025, TRLGDCU y CE: ninguno. Ver tanda-09-notas.md.
# AVISO: el art. 685.2 LEC de legalize-es@aca28304d muestra en negrita párrafos anulados por la STC 26/2025; desde el 08-10-2026 rige
# otro texto, que es el que trae legalize-es@597314599f (RDL 29/2026, sin los párrafos anulados).
# Voces 142, 143, 144, 162 y 169 a 176 de la lista maestra (12 voces). Recuento y estados en tanda-09-notas.md.

voces:
  - voz: "Ejecución hipotecaria: especialidades"
    sinonimos: ["procedimiento de ejecución hipotecaria", "ejecución directa sobre bienes hipotecados", "acción hipotecaria", "ejecución de hipoteca", "vencimiento anticipado", "requerimiento de pago al deudor hipotecario", "certificación de dominio y cargas", "liberación del bien hipotecado", "hipotecante no deudor", "tercer poseedor"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "681", apartado: "1", tipo: "regula", nota: "La deuda con prenda o hipoteca puede reclamarse directamente contra los bienes gravados, con las especialidades de este capítulo."}
      - {norma: "LEC", articulo: "682", apartado: "1", tipo: "regula", nota: "Solo si la ejecución se dirige exclusivamente contra los bienes hipotecados o pignorados."}
      - {norma: "LEC", articulo: "682", apartado: "2.1.º", tipo: "regula", nota: "La escritura fija el precio de tasación para subasta, nunca inferior al 75 % de la tasación del art. 18 RDL 24/2021."}
      - {norma: "LEC", articulo: "682", apartado: "2.2.º", tipo: "regula", nota: "La escritura fija un domicilio del deudor para requerimientos y notificaciones."}
      - {norma: "LEC", articulo: "683", apartado: "1.1.ª", tipo: "conexa", nota: "Inmuebles: sin consentimiento del acreedor en la misma población o en el término que fija la competencia; fuera, con él."}
      - {norma: "LEC", articulo: "684", apartado: "1.1.º", tipo: "regula", nota: "Inmuebles: tribunal del lugar de la finca; no rige la sumisión expresa ni tácita."}
      - {norma: "LEC", articulo: "684", apartado: "2", tipo: "conexa", nota: "El tribunal examina de oficio su competencia territorial."}
      - {norma: "LEC", articulo: "685", apartado: "1", tipo: "regula", nota: "Demanda contra el deudor y, en su caso, el hipotecante no deudor o el tercer poseedor que acreditó su adquisición."}
      - {norma: "LEC", articulo: "685", apartado: "2", tipo: "regula", nota: "Título con los requisitos del despacho y documentos de los arts. 550, 573 y 574; sin título inscrito, certificación registral."}
      - {norma: "LEC", articulo: "685", apartado: "2, párrafo 3.º", tipo: "regula", nota: "Demanda hipotecaria: decir si es vivienda habitual del deudor y si el ejecutante es gran tenedor (439.6.b)."}
      - {norma: "LEC", articulo: "685", apartado: "2, párrafo 4.º", tipo: "regula", nota: "Si niega ser gran tenedor, certificación del Registro con la relación de viviendas a nombre del actor."}
      - {norma: "LEC", articulo: "685", apartado: "5", tipo: "conexa", nota: "Para seguir luego contra avalistas o fiadores por lo que falte (579.1), deben haber sido notificados de la demanda."}
      - {norma: "LEC", articulo: "686", apartado: "1", tipo: "regula", nota: "El auto manda requerir de pago al deudor, hipotecante no deudor o tercer poseedor en el domicilio del Registro."}
      - {norma: "LEC", articulo: "686", apartado: "2", tipo: "regula", nota: "Sin requerimiento judicial si se acredita el notarial previo hecho en el domicilio registral (581.2)."}
      - {norma: "LEC", articulo: "686", apartado: "3", tipo: "regula", nota: "Fallido el requerimiento en el domicilio registral y hechas averiguaciones: edictos del art. 164."}
      - {norma: "LEC", articulo: "688", apartado: "1", tipo: "regula", nota: "Certificación de dominio y cargas con inserción literal de la hipoteca y constancia de su subsistencia."}
      - {norma: "LEC", articulo: "688", apartado: "3", tipo: "conexa", nota: "Si la hipoteca no existe o está cancelada, el LAJ pone fin a la ejecución por decreto."}
      - {norma: "LEC", articulo: "689", apartado: "1", tipo: "conexa", nota: "Al último titular registral no requerido se le notifica para que intervenga o pague antes del remate."}
      - {norma: "LEC", articulo: "690", apartado: "1", tipo: "conexa", nota: "Diez días tras el requerimiento, el acreedor puede pedir la administración o posesión interina de la finca."}
      - {norma: "LEC", articulo: "691", apartado: "1", tipo: "regula", nota: "Veinte días después del requerimiento y las notificaciones, subasta a instancia del actor, deudor o tercer poseedor."}
      - {norma: "LEC", articulo: "691", apartado: "4", tipo: "conexa", nota: "Sean muebles o inmuebles, la subasta sigue las reglas de la subasta de inmuebles."}
      - {norma: "LEC", articulo: "691", apartado: "6", tipo: "conexa", nota: "Caben el convenio de realización y la realización por persona o entidad especializada."}
      - {norma: "LEC", articulo: "692", apartado: "1", tipo: "regula", nota: "El remate paga principal, intereses y costas dentro de la cobertura hipotecaria; el exceso, a los acreedores posteriores."}
      - {norma: "LEC", articulo: "693", apartado: "1", tipo: "regula", nota: "Impago parcial: basta que venzan tres plazos mensuales o cuotas equivalentes a tres meses."}
      - {norma: "LEC", articulo: "693", apartado: "2", tipo: "regula", nota: "Vencimiento total si se pactó e inscribió; persona física y vivienda: art. 24 Ley 5/2019 y art. 129 bis LH."}
      - {norma: "LEC", articulo: "693", apartado: "3", tipo: "regula", nota: "Vivienda habitual: el deudor libera el bien consignando lo vencido, sin consentimiento del acreedor; otra vez, tras 3 años."}
      - {norma: "LEC", articulo: "697", tipo: "conexa", nota: "Fuera de oposición y tercería, solo suspende la causa penal sobre falsedad del título o invalidez del despacho (569)."}
      - {norma: "LEC", articulo: "698", apartado: "1", tipo: "regula", nota: "Lo demás (nulidad del título, cuantía, vencimiento) va al juicio que corresponda, sin suspender la ejecución."}
      - {norma: "LEC", articulo: "698", apartado: "2", tipo: "conexa", nota: "En ese juicio cabe pedir que se retenga lo que deba entregarse al acreedor, con garantía si no hay solvencia notoria."}
      - {norma: "LEC", articulo: "575", apartado: "1 bis", tipo: "conexa", nota: "Ejecución de vivienda habitual: las costas exigibles al deudor no pasan del 5 % de lo reclamado."}
      - {norma: "LEC", articulo: "579", apartado: "1", tipo: "conexa", nota: "Si el producto de la subasta no cubre el crédito, se sigue por lo que falte con las normas ordinarias."}
    no_consta_en_norma:
      - "Vencimiento anticipado declarado abusivo: si se sobresee o se sigue por lo vencido, criterio jurisprudencial (TJUE y TS)."
      - "Elección entre esta vía y la ejecución ordinaria sobre el bien hipotecado (579.1): el texto no la ordena."
    fuera_de_la_herramienta:
      - "Ley Hipotecaria (arts. 129 y 129 bis) y su Reglamento: venta extrajudicial y vencimiento anticipado inscrito."
      - "Ley 5/2019, de crédito inmobiliario, art. 24: requisitos del vencimiento anticipado; a él remite el 693.2 LEC."
      - "Ley 1/2013, art. 1, y RDL 6/2012 (Código de Buenas Prácticas): suspensión de lanzamientos y medidas para deudores vulnerables."
      - "RDL 29/2026 (pendiente de convalidar), art. 1.5: adjudicación bajo el 70 % del valor de mercado, lanzamiento del vulnerable sin alternativa suspendido hasta el 31-12-2030; art. 2: suspensión de procesos."
    afines: ["Oposición en la ejecución hipotecaria", "Adjudicación al acreedor y vivienda habitual", "Deuda remanente tras ejecutar la vivienda habitual", "Despacho de la ejecución y plazo de espera", "Vulnerabilidad y gran tenedor en la demanda", "Subasta: convocatoria, posturas y aprobación del remate", "Cargas anteriores y ocupantes del inmueble subastado"]
    # VIGENCIA: LEC 685.2 en la redacción del RDL 29/2026 (BOE 07-10-2026, vigor 08-10-2026), leído en la composición: certificación de
    # «viviendas» (antes «propiedades») y sin los párrafos anulados por la STC 26/2025. 685.1 y 685.5 no cambian. LEC 575, 579 y 681
    # a 698: idénticos a legalize-es@aca28304d y al texto vigente de boe.es.
    # AVISO: RDL 29/2026 (vigor 08-10-2026) no convalidado a esta fecha (Diputación Permanente, art. 86.2 CE); si se deroga, el 685.2
    # vuelve a la redacción de la Ley 12/2023 (certificación de «propiedades»), como ocurrió con el RDL 26/2026. Va «provisional» por eso.
    estado: "provisional"
    espejo: "legalize-es@597314599f"
    revisada_el: "2026-10-09"
    revisor: "armero"

  - voz: "Oposición en la ejecución hipotecaria"
    sinonimos: ["oposición del deudor hipotecario", "causas tasadas de oposición", "cláusula abusiva en la ejecución hipotecaria", "cláusula suelo en la ejecución", "vencimiento anticipado abusivo", "sobreseimiento de la ejecución hipotecaria", "comparecencia de oposición", "apelación del auto de oposición"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "695", apartado: "1", tipo: "regula", nota: "Solo se admite la oposición fundada en las cuatro causas tasadas del apartado."}
      - {norma: "LEC", articulo: "695", apartado: "1.1.ª", tipo: "regula", nota: "Extinción de la garantía o de la obligación: con certificación registral de cancelación o escritura de carta de pago."}
      - {norma: "LEC", articulo: "695", apartado: "1.2.ª", tipo: "regula", nota: "Error en la cantidad si la deuda es el saldo de una cuenta: se aporta la libreta o se precisa la discrepancia."}
      - {norma: "LEC", articulo: "695", apartado: "1.3.ª", tipo: "conexa", nota: "Muebles o prenda sin desplazamiento: sujeción a otra garantía o embargo inscritos antes, con certificación."}
      - {norma: "LEC", articulo: "695", apartado: "1.4.ª", tipo: "regula", nota: "Carácter abusivo de una cláusula que funde la ejecución o haya determinado la cantidad exigible."}
      - {norma: "LEC", articulo: "695", apartado: "2", tipo: "regula", nota: "La oposición suspende la ejecución; comparecencia con quince días desde la citación y auto en dos días."}
      - {norma: "LEC", articulo: "695", apartado: "3", tipo: "regula", nota: "Causas 1.ª y 3.ª: sobreseimiento; 2.ª: fija la cantidad; 4.ª: sobresee o sigue sin la cláusula, con cosa juzgada."}
      - {norma: "LEC", articulo: "695", apartado: "4", tipo: "regula", nota: "Apelable el auto que sobresee, inaplica una cláusula o desestima la causa 4.ª; los demás, sin recurso."}
      - {norma: "LEC", articulo: "552", apartado: "1", tipo: "regula", nota: "Antes de despachar, el tribunal examina de oficio las cláusulas abusivas del título y oye quince días a las partes."}
      - {norma: "LEC", articulo: "552", apartado: "4", tipo: "regula", nota: "Contrato con consumidor: control de oficio de las cláusulas que fundan la ejecución o la cantidad; cosa juzgada."}
      - {norma: "LEC", articulo: "557", apartado: "1.7.ª", tipo: "conexa", nota: "Régimen común de los títulos no judiciales: la cláusula abusiva también es causa de oposición."}
      - {norma: "LEC", articulo: "556", apartado: "1", tipo: "conexa", nota: "Plazo general de diez días desde la notificación del auto para oponerse; el 695 no fija otro."}
      - {norma: "LEC", articulo: "696", apartado: "1", tipo: "conexa", nota: "Tercería de dominio: título de fecha fehaciente e inscrito antes que la hipoteca."}
      - {norma: "LEC", articulo: "696", apartado: "2", tipo: "conexa", nota: "Admitida la tercería, se suspende la ejecución sobre los bienes a que se refiere."}
      - {norma: "LEC", articulo: "697", tipo: "regula", nota: "Fuera de oposición y tercería, solo suspende la causa penal sobre falsedad del título o invalidez del despacho."}
      - {norma: "LEC", articulo: "698", apartado: "1", tipo: "regula", nota: "Cualquier otra reclamación, incluida la nulidad del título o la cuantía, va al juicio que corresponda y no suspende."}
      - {norma: "LEC", articulo: "698", apartado: "2", tipo: "conexa", nota: "En ese juicio cabe pedir la retención de lo que deba entregarse al acreedor."}
      - {norma: "LEC", articulo: "698", apartado: "3", tipo: "conexa", nota: "Si el acreedor afianza la cantidad retenida, se alza la retención."}
      - {norma: "LEC", articulo: "561", apartado: "2", tipo: "conexa", nota: "Régimen común: el auto que aprecia la abusividad determina sus consecuencias y, firme, hace cosa juzgada."}
    no_consta_en_norma:
      - "Plazo para oponerse en la ejecución hipotecaria: el 695 no lo fija; la aplicación del 556.1 es criterio jurisprudencial."
      - "Costas de la oposición hipotecaria: el 695 no las regula; si rige el 561, criterio jurisprudencial."
      - "Abusividad de vencimiento anticipado, intereses de demora o cláusula suelo y su efecto en la ejecución: criterio del TJUE y del TS."
      - "Control de oficio de la abusividad ya despachada la ejecución, sin oposición del deudor: criterio jurisprudencial (TJUE)."
    fuera_de_la_herramienta:
      - "Ley 1/2013, disposición transitoria 4.ª: incidente extraordinario de oposición por abusividad en ejecuciones anteriores."
      - "Ley 5/2019 (arts. 24 y 25) y art. 114 de la Ley Hipotecaria: vencimiento anticipado e intereses de demora."
    afines: ["Ejecución hipotecaria: especialidades", "Control de oficio de cláusulas abusivas en el proceso", "Cláusulas abusivas: concepto, nulidad e integración", "Oposición a la ejecución por motivos de fondo", "Tercería de dominio", "Recurso de apelación (plazo, interposición, prueba en segunda instancia)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Adjudicación al acreedor y vivienda habitual"
    sinonimos: ["adjudicación al ejecutante", "adjudicación por el 70 %", "adjudicación por el 60 %", "subasta desierta", "subasta sin postores", "mejora de postura por el ejecutado", "cesión de remate", "aprobación del remate de la vivienda habitual", "imputación de pagos"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "691", apartado: "4", tipo: "conexa", nota: "La subasta del bien hipotecado sigue las reglas de la subasta de inmuebles."}
      - {norma: "LEC", articulo: "647", apartado: "2", tipo: "regula", nota: "El ejecutante puja sin consignar; para adjudicarse ha de pujar. Si no hubo pujas, no puede pedir la adjudicación."}
      - {norma: "LEC", articulo: "647", apartado: "3", tipo: "conexa", nota: "El ejecutante puede ceder el remate; la deuda se reduce por el importe total del remate, no por el de la cesión."}
      - {norma: "LEC", articulo: "670", apartado: "1", tipo: "regula", nota: "Postura igual o superior al 70 % del valor de subasta: el LAJ aprueba el remate al día siguiente del cierre."}
      - {norma: "LEC", articulo: "670", apartado: "2", tipo: "regula", nota: "Si el mejor postor es el ejecutante y supera el principal, se liquida y consigna la diferencia; si no, quiebra."}
      - {norma: "LEC", articulo: "670", apartado: "3", tipo: "regula", nota: "Postura bajo el 70 %: en diez días el ejecutado puede presentar mejorante por el 60 % o lo que cubra la deuda."}
      - {norma: "LEC", articulo: "670", apartado: "3, párrafo 4.º", tipo: "regula", nota: "Sin mejora: remate si llega al 50 %, o al 40 % si cubre todo; por debajo decide el LAJ ponderando las circunstancias."}
      - {norma: "LEC", articulo: "670", apartado: "3, párrafo 5.º", tipo: "conexa", nota: "Contra el decreto que aprueba o deniega el remate, revisión directa ante el tribunal."}
      - {norma: "LEC", articulo: "670", apartado: "3, párrafo 6.º", tipo: "regula", nota: "Vivienda habitual: no menos del 70 %, o de lo debido con mínimo del 60 %; si puja el ejecutante, se eleva a esos importes."}
      - {norma: "LEC", articulo: "670", apartado: "5", tipo: "conexa", nota: "El adjudicatario acepta las cargas anteriores y se subroga en ellas."}
      - {norma: "LEC", articulo: "670", apartado: "7", tipo: "regula", nota: "Hasta aprobar el remate o la adjudicación, el ejecutado libera el bien pagando principal, intereses y costas."}
      - {norma: "LEC", articulo: "671", tipo: "regula", nota: "Subasta desierta: alzamiento del embargo, salvo que el ejecutado designe adjudicatario por el 50 % (40 % si cubre todo)."}
      - {norma: "LEC", articulo: "671", apartado: "párrafo 3.º", tipo: "conexa", nota: "Petición por menos: decide el LAJ con los criterios del 670.3; revisión directa ante el tribunal."}
      - {norma: "LEC", articulo: "671", apartado: "párrafo 4.º", tipo: "conexa", nota: "De común acuerdo, las partes pueden pedir nueva subasta u otra forma de pago (convenio del art. 640)."}
      - {norma: "LEC", articulo: "654", apartado: "3", tipo: "regula", nota: "Si no basta: imputación a intereses remuneratorios, principal, moratorios y costas, con certificado de lo pendiente."}
      - {norma: "LEC", articulo: "579", apartado: "2", tipo: "regula", nota: "Vivienda habitual: liberación pagando el 65 % en 5 años o el 80 % en 10; y rebaja por la plusvalía de la reventa."}
      - {norma: "LEC", articulo: "669", apartado: "3", tipo: "conexa", nota: "Si el poseedor facilita la inspección, el deudor puede pedir que se le reduzca la deuda hasta un 2 %."}
      - {norma: "LEC", articulo: "692", apartado: "1", tipo: "conexa", nota: "Deudor propietario: el exceso sobre la cobertura hipotecaria paga el resto del crédito tras los acreedores posteriores."}
      - {norma: "LEC", articulo: "673", tipo: "conexa", nota: "Título inscribible: testimonio del decreto de adjudicación."}
      - {norma: "LEC", articulo: "674", tipo: "conexa", nota: "Mandamiento de cancelación de la hipoteca ejecutada y de las cargas posteriores."}
      - {norma: "LEC", articulo: "675", apartado: "2", tipo: "conexa", nota: "Inmueble ocupado: lanzamiento de ocupantes sin título; el adquirente lo pide en un año desde la adquisición."}
      - {norma: "LO 1/2025", articulo: "dt 9", apartado: "1", tipo: "conexa", nota: "La reforma rige solo en procesos incoados desde el 3-4-2025; en los anteriores, el acreedor pide la adjudicación (vivienda: 70/60 %)."}
    no_consta_en_norma:
      - "Ejecución incoada antes del 3-4-2025 con subasta posterior: si rige el 671 nuevo o el anterior, la dt 9.ª no lo precisa."
      - "Si el propio ejecutante puede ser la «persona designada» del 671: el texto no lo aclara."
      - "Valor de subasta frente a valor de mercado y enriquecimiento injusto del acreedor adjudicatario: criterio jurisprudencial."
    fuera_de_la_herramienta:
      - "RDL 29/2026, art. 1.4 y 1.5: límites a adquirir viviendas por menos del 70 % del valor de mercado y suspensión de lanzamientos (sin convalidar)."
      - "Ley Hipotecaria y su Reglamento: inscripción de la adjudicación y cancelación de cargas."
    afines: ["Ejecución hipotecaria: especialidades", "Deuda remanente tras ejecutar la vivienda habitual", "Subasta: convocatoria, posturas y aprobación del remate", "Cargas anteriores y ocupantes del inmueble subastado", "Lanzamiento", "Recurso de revisión contra decretos del LAJ"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Medidas cautelares: presupuestos"
    sinonimos: ["periculum in mora", "fumus boni iuris", "apariencia de buen derecho", "peligro por la mora procesal", "tutela cautelar", "solicitud de medidas cautelares", "medidas cautelares innominadas", "caución del solicitante", "instrumentalidad de las medidas"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "721", apartado: "1", tipo: "regula", nota: "El actor, principal o reconvencional, pide bajo su responsabilidad las medidas que aseguren la sentencia estimatoria."}
      - {norma: "LEC", articulo: "721", apartado: "2", tipo: "regula", nota: "No se acuerdan de oficio ni más gravosas que las pedidas, salvo procesos especiales y el apartado 3."}
      - {norma: "LEC", articulo: "721", apartado: "3", tipo: "conexa", nota: "Acción individual de consumidor suspendida por el art. 43: el tribunal puede acordarlas de oficio y sin caución."}
      - {norma: "LEC", articulo: "726", apartado: "1", tipo: "regula", nota: "Características: exclusivamente conducente a la efectividad de la tutela y no sustituible por otra menos gravosa."}
      - {norma: "LEC", articulo: "726", apartado: "2", tipo: "regula", nota: "Caben órdenes y prohibiciones de contenido similar a lo pedido, temporales y sin prejuzgar la sentencia."}
      - {norma: "LEC", articulo: "727", tipo: "regula", nota: "Lista abierta: embargo preventivo, administración, depósito, inventario, anotaciones, cese de actividad y otras (11.ª)."}
      - {norma: "LEC", articulo: "727", apartado: "5.ª", tipo: "conexa", nota: "Anotación preventiva de demanda o de inicio de un MASC sobre bienes inscribibles."}
      - {norma: "LEC", articulo: "728", apartado: "1", tipo: "regula", nota: "Peligro por la mora procesal: justificar que, sin la medida, la sentencia estimatoria podría quedar frustrada."}
      - {norma: "LEC", articulo: "728", apartado: "1, párrafo 2.º", tipo: "regula", nota: "No se acuerdan para alterar situaciones consentidas largo tiempo, salvo que se justifique el retraso."}
      - {norma: "LEC", articulo: "728", apartado: "2", tipo: "regula", nota: "Apariencia de buen derecho: datos y documentos para un juicio provisional e indiciario favorable."}
      - {norma: "LEC", articulo: "728", apartado: "3", tipo: "regula", nota: "Caución suficiente por los daños al demandado, en las formas del 529.3; dispensable en acciones colectivas de consumo."}
      - {norma: "LEC", articulo: "730", apartado: "1", tipo: "regula", nota: "De ordinario se piden con la demanda principal."}
      - {norma: "LEC", articulo: "730", apartado: "2", tipo: "conexa", nota: "Antes de la demanda, si hay urgencia o necesidad; caducan si no se demanda en veinte días."}
      - {norma: "LEC", articulo: "730", apartado: "4", tipo: "conexa", nota: "Después de la demanda o pendiente recurso, solo por hechos y circunstancias que lo justifiquen entonces."}
      - {norma: "LEC", articulo: "731", apartado: "1", tipo: "conexa", nota: "Accesoriedad: terminado el proceso se alzan, salvo condena, que las mantiene durante la espera del art. 548."}
      - {norma: "LEC", articulo: "732", apartado: "1", tipo: "regula", nota: "La solicitud justifica con claridad y precisión cada presupuesto."}
      - {norma: "LEC", articulo: "732", apartado: "2", tipo: "regula", nota: "Se acompañan los documentos o se ofrece la prueba; para el actor, la prueba precluye con la solicitud."}
      - {norma: "LEC", articulo: "732", apartado: "3", tipo: "regula", nota: "Hay que ofrecer caución, con su tipo y la justificación del importe."}
      - {norma: "LEC", articulo: "733", apartado: "1", tipo: "conexa", nota: "Regla general: se resuelve oído el demandado."}
      - {norma: "LEC", articulo: "735", apartado: "2", tipo: "regula", nota: "El auto acuerda si concurren peligro y apariencia de buen derecho; apelable sin efecto suspensivo."}
      - {norma: "LEC", articulo: "736", apartado: "1", tipo: "conexa", nota: "El auto que deniega es apelable con tramitación preferente; costas según el art. 394."}
      - {norma: "LEC", articulo: "736", apartado: "2", tipo: "conexa", nota: "Denegada, puede reiterarse si cambian las circunstancias."}
      - {norma: "LEC", articulo: "737", tipo: "conexa", nota: "La caución se presta antes de cualquier acto de cumplimiento de la medida."}
      - {norma: "LEC", articulo: "723", apartado: "1", tipo: "conexa", nota: "Competente: el de la primera instancia o, antes de la demanda, el competente para el asunto principal."}
    no_consta_en_norma:
      - "Ponderación entre peligro, apariencia de buen derecho y proporcionalidad: criterio jurisprudencial."
      - "Cuantía de la caución: el 728.3 no da baremo; criterio del tribunal caso por caso."
    fuera_de_la_herramienta:
      - "Ley 60/2003 de arbitraje (art. 722 LEC) y Ley Hipotecaria, art. 42 (anotaciones preventivas): no están en la herramienta."
    afines: ["Embargo preventivo", "Anotación preventiva de demanda", "Caución", "Medidas cautelares sin audiencia y oposición", "Medidas cautelares antes de la demanda", "Modificación, alzamiento y caución sustitutoria"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Recurso de apelación (plazo, interposición, prueba en segunda instancia)"
    sinonimos: ["apelación", "segunda instancia", "recurso ante la Audiencia Provincial", "escrito de interposición", "plazo de veinte días para apelar", "prueba en segunda instancia", "documentos en apelación", "sentencias no apelables", "límite de 3.000 euros", "reformatio in peius", "apelación por infracción procesal", "consignación de rentas para recurrir"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "455", apartado: "1", tipo: "regula", nota: "Apelables las sentencias de todo juicio y los autos definitivos; no las de verbales por cuantía de hasta 3.000 euros."}
      - {norma: "LEC", articulo: "455", apartado: "2.2.º", tipo: "regula", nota: "De lo resuelto en primera instancia conoce la Audiencia Provincial de la circunscripción."}
      - {norma: "LEC", articulo: "456", apartado: "1", tipo: "regula", nota: "Nuevo examen de lo actuado, con los fundamentos de la primera instancia y, en su caso, prueba en la segunda."}
      - {norma: "LEC", articulo: "456", apartado: "2", tipo: "conexa", nota: "Contra sentencia desestimatoria o auto que pone fin al proceso, la apelación no suspende."}
      - {norma: "LEC", articulo: "456", apartado: "3", tipo: "conexa", nota: "La sentencia estimatoria apelada puede ejecutarse provisionalmente (título II del libro III)."}
      - {norma: "LEC", articulo: "457", tipo: "conexa", nota: "Ya no hay escrito de preparación: el artículo está sin contenido desde la Ley 37/2011."}
      - {norma: "LEC", articulo: "458", apartado: "1", tipo: "regula", nota: "Se interpone ante el tribunal que ha de resolverlo, en veinte días desde la notificación, con copia de la resolución."}
      - {norma: "LEC", articulo: "458", apartado: "2", tipo: "regula", nota: "El escrito expone las alegaciones y cita la resolución apelada y los pronunciamientos que impugna."}
      - {norma: "LEC", articulo: "458", apartado: "3", tipo: "conexa", nota: "El tribunal de apelación reclama los autos; el de origen los remite y emplaza a los no recurrentes por diez días."}
      - {norma: "LEC", articulo: "458", apartado: "4", tipo: "regula", nota: "Apelable y en plazo: el LAJ lo tiene por interpuesto; si no, decide el tribunal y, si inadmite, devuelve los autos."}
      - {norma: "LEC", articulo: "459", tipo: "regula", nota: "Infracción procesal: citar la norma, alegar la indefensión y acreditar que se denunció cuando hubo ocasión."}
      - {norma: "LEC", articulo: "460", apartado: "1", tipo: "regula", nota: "Solo documentos de los casos del art. 270 que no pudieron aportarse en primera instancia."}
      - {norma: "LEC", articulo: "460", apartado: "2", tipo: "regula", nota: "Prueba: la denegada con reposición o protesta, la admitida y no practicada sin culpa, y la de hechos nuevos."}
      - {norma: "LEC", articulo: "460", apartado: "3", tipo: "conexa", nota: "El rebelde que se personó tarde sin culpa puede pedir en segunda instancia toda la prueba que le convenga."}
      - {norma: "LEC", articulo: "461", apartado: "1", tipo: "regula", nota: "Traslado a las demás partes por diez días para oponerse o impugnar lo que les sea desfavorable."}
      - {norma: "LEC", articulo: "464", apartado: "1", tipo: "regula", nota: "El tribunal decide en diez días sobre la prueba; si se admite, vista dentro del mes por los trámites del verbal."}
      - {norma: "LEC", articulo: "464", apartado: "2", tipo: "conexa", nota: "Sin prueba, cabe vista si la pide una parte o el tribunal la considera necesaria."}
      - {norma: "LEC", articulo: "465", apartado: "2", tipo: "conexa", nota: "Se resuelve en diez días tras la vista o, sin ella, en un mes desde los trámites del art. 461."}
      - {norma: "LEC", articulo: "465", apartado: "3", tipo: "conexa", nota: "Infracción procesal cometida al dictar sentencia: se revoca y se resuelve sobre el fondo."}
      - {norma: "LEC", articulo: "465", apartado: "4", tipo: "conexa", nota: "Nulidad radical: se reponen las actuaciones, salvo que el vicio pueda subsanarse en la segunda instancia."}
      - {norma: "LEC", articulo: "465", apartado: "5", tipo: "regula", nota: "Solo se resuelven los puntos del recurso y de la oposición o impugnación; no se perjudica al apelante."}
      - {norma: "LEC", articulo: "449", apartado: "1", tipo: "regula", nota: "Procesos con lanzamiento: el demandado acredita al recurrir tener pagadas las rentas vencidas y las adelantadas."}
      - {norma: "LEC", articulo: "449", apartado: "2", tipo: "conexa", nota: "Si deja de pagar durante el recurso, se declara desierto en cualquier estado."}
      - {norma: "LEC", articulo: "449", apartado: "4", tipo: "regula", nota: "Deudas con la comunidad: el condenado acredita al recurrir haber pagado o consignado la condena."}
      - {norma: "LEC", articulo: "449", apartado: "6", tipo: "conexa", nota: "Antes de rechazar o declarar desierto el recurso, se da ocasión de subsanar (art. 231)."}
      - {norma: "LEC", articulo: "448", apartado: "2", tipo: "conexa", nota: "El plazo corre desde el día siguiente a la notificación o a la de su aclaración o denegación."}
      - {norma: "LEC", articulo: "285", apartado: "2", tipo: "conexa", nota: "Prueba inadmitida: reposición en el acto y protesta para hacerla valer en la segunda instancia."}
      - {norma: "LEC", articulo: "397", tipo: "conexa", nota: "La apelación sobre las costas de la primera instancia se resuelve con el art. 394."}
      - {norma: "LEC", articulo: "466", tipo: "conexa", nota: "Contra la sentencia de la Audiencia Provincial cabe recurso de casación."}
    no_consta_en_norma:
      - "Alcance de la revisión de la valoración de la prueba en apelación: criterio jurisprudencial."
      - "Cuantía de 3.000 euros (455.1): si se mide por la del proceso o por el gravamen, criterio jurisprudencial."
      - "Autos no definitivos apelables: solo cuando un precepto lo dice; no hay una lista única en la LEC."
    afines: ["Impugnación de la sentencia por el apelado", "Depósito para recurrir", "Costas en los recursos", "Recurso de casación", "Recurso de queja", "Ejecución provisional y su oposición", "Pertinencia y utilidad de la prueba; protesta"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Impugnación de la sentencia por el apelado"
    sinonimos: ["impugnación adhesiva", "adhesión a la apelación", "apelación adhesiva", "escrito de oposición e impugnación", "impugnación de la resolución apelada", "reformatio in peius"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "461", apartado: "1", tipo: "regula", nota: "En los diez días para oponerse, el apelado puede impugnar la resolución en lo que le resulte desfavorable."}
      - {norma: "LEC", articulo: "461", apartado: "2", tipo: "regula", nota: "La impugnación de quien no recurrió se formula con los requisitos del escrito de interposición."}
      - {norma: "LEC", articulo: "461", apartado: "3", tipo: "regula", nota: "El apelado puede aportar documentos y pedir prueba (art. 460) y alegar sobre la admisibilidad de los del apelante."}
      - {norma: "LEC", articulo: "461", apartado: "4", tipo: "regula", nota: "De la impugnación se da traslado al apelante principal por diez días sobre su admisibilidad y la prueba."}
      - {norma: "LEC", articulo: "465", apartado: "5", tipo: "regula", nota: "El fallo solo perjudica al apelante si se estima la impugnación del inicialmente apelado."}
      - {norma: "LEC", articulo: "458", apartado: "2", tipo: "conexa", nota: "Contenido exigido: alegaciones, resolución apelada y pronunciamientos que se impugnan."}
      - {norma: "LEC", articulo: "458", apartado: "4, párrafo 3.º", tipo: "conexa", nota: "El recurrido puede alegar en su oposición la inadmisibilidad de la apelación."}
      - {norma: "LEC", articulo: "456", apartado: "1", tipo: "conexa", nota: "El objeto de la apelación se fija con los fundamentos de hecho y de derecho de la primera instancia."}
      - {norma: "LEC", articulo: "450", apartado: "1", tipo: "conexa", nota: "El recurrente puede desistir del recurso antes de que se resuelva."}
      - {norma: "LEC", articulo: "450", apartado: "2", tipo: "conexa", nota: "Si desisten solo algunos recurrentes, se abandonan las pretensiones exclusivas de quienes desisten."}
      - {norma: "LEC", articulo: "460", apartado: "2", tipo: "conexa", nota: "La prueba que puede pedir el impugnante es la misma que la del apelante."}
      - {norma: "LEC", articulo: "398", apartado: "1", tipo: "conexa", nota: "Costas del recurso: se aplica el art. 394."}
    no_consta_en_norma:
      - "Si la impugnación sobrevive al desistimiento o inadmisión de la apelación principal: el 450 no lo dice; criterio jurisprudencial."
      - "Si cabe impugnar pronunciamientos que afectan a otro apelado distinto del apelante: criterio jurisprudencial."
      - "Si la impugnación exige depósito propio: la disposición adicional 15.ª LOPJ no la menciona."
    afines: ["Recurso de apelación (plazo, interposición, prueba en segunda instancia)", "Depósito para recurrir", "Costas en los recursos", "Desistimiento"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Recurso de reposición"
    sinonimos: ["reposición", "recurso contra providencia", "recurso contra auto no definitivo", "recurso contra diligencia de ordenación", "reposición oral en la vista", "protesta", "pie de recurso"]
    normas_base: ["LEC", "LOPJ"]
    remisiones:
      - {norma: "LEC", articulo: "451", apartado: "1", tipo: "regula", nota: "Contra diligencias de ordenación y decretos no definitivos, ante el LAJ, salvo que quepa revisión directa."}
      - {norma: "LEC", articulo: "451", apartado: "2", tipo: "regula", nota: "Contra providencias y autos no definitivos, ante el mismo tribunal que los dictó."}
      - {norma: "LEC", articulo: "451", apartado: "3", tipo: "regula", nota: "La reposición no suspende la resolución recurrida."}
      - {norma: "LEC", articulo: "452", apartado: "1", tipo: "regula", nota: "Plazo de cinco días; hay que expresar la infracción en que incurre la resolución."}
      - {norma: "LEC", articulo: "452", apartado: "2", tipo: "regula", nota: "Sin esos requisitos se inadmite: por providencia irrecurrible o, ante el LAJ, por decreto recurrible en revisión."}
      - {norma: "LEC", articulo: "453", apartado: "1", tipo: "regula", nota: "Admitido, plazo común de cinco días a las demás partes para impugnarlo."}
      - {norma: "LEC", articulo: "453", apartado: "2", tipo: "regula", nota: "Se resuelve sin más trámite, por auto o decreto, en cinco días."}
      - {norma: "LEC", articulo: "454", tipo: "regula", nota: "Contra el auto que lo resuelve no hay recurso, salvo queja; la cuestión se reproduce al recurrir la definitiva."}
      - {norma: "LEC", articulo: "454 bis", apartado: "1", tipo: "conexa", nota: "Contra el decreto del LAJ que resuelve la reposición cabe revisión ante el tribunal."}
      - {norma: "LEC", articulo: "285", apartado: "2", tipo: "regula", nota: "En la vista, la admisión o inadmisión de prueba solo admite reposición, resuelta en el acto; si se desestima, protesta."}
      - {norma: "LEC", articulo: "552", apartado: "2", tipo: "conexa", nota: "Auto que deniega el despacho de la ejecución: reposición potestativa antes de la apelación."}
      - {norma: "LEC", articulo: "448", apartado: "1", tipo: "conexa", nota: "Se recurren las resoluciones que afectan desfavorablemente a la parte."}
      - {norma: "LEC", articulo: "448", apartado: "2", tipo: "conexa", nota: "El plazo corre desde el día siguiente a la notificación o a la de su aclaración o denegación."}
      - {norma: "LEC", articulo: "208", apartado: "4", tipo: "conexa", nota: "Toda resolución dice si es firme o qué recurso cabe, ante qué órgano y en qué plazo."}
      - {norma: "LEC", articulo: "215", apartado: "5", tipo: "conexa", nota: "Pedir aclaración o complemento interrumpe el plazo para recurrir."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "4", tipo: "conexa", nota: "Depósito de 25 euros; no se exige para la reposición previa a la queja."}
      - {norma: "LOPJ", articulo: "da 15", apartado: "2", tipo: "conexa", nota: "El depósito solo se exige en recursos que se tramitan por escrito: no en la reposición oral en vista."}
    no_consta_en_norma:
