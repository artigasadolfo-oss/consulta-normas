  - voz: "Interpretación de los contratos"
    sinonimos: ["interpretación literal", "intención de los contratantes", "actos coetáneos y posteriores", "interpretación sistemática", "interpretación contra proferentem", "cláusula oscura", "principio de conservación del contrato", "usos interpretativos", "integración del contrato", "interpretación más favorable al consumidor"]
    normas_base: ["CC", "TRLGDCU"]
    remisiones:
      - {norma: "CC", articulo: "1281", apartado: "párrafo 1.º", tipo: "regula", nota: "Si los términos son claros y no dejan duda sobre la intención, se está al sentido literal."}
      - {norma: "CC", articulo: "1281", apartado: "párrafo 2.º", tipo: "regula", nota: "Si las palabras contradicen la intención evidente de las partes, prevalece la intención."}
