      - {norma: "CC", articulo: "1266", apartado: "párrafo 2.º", tipo: "regula", nota: "Error sobre la persona: solo si su consideración fue la causa principal del contrato."}
      - {norma: "CC", articulo: "1266", apartado: "párrafo 3.º", tipo: "regula", nota: "El simple error de cuenta solo da lugar a su corrección."}
