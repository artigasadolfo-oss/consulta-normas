      - {norma: "LEC", articulo: "782", apartado: "5", tipo: "conexa", nota: "Los acreedores de un coheredero pueden intervenir a su costa para evitar fraude."}
      - {norma: "LEC", articulo: "783", apartado: "1", tipo: "conexa", nota: "Si se pide y procede, se acuerdan la intervención del caudal y el inventario."}
      - {norma: "LEC", articulo: "783", apartado: "2", tipo: "regula", nota: "El LAJ convoca a junta a herederos, legatarios de parte alícuota y viudo dentro de los diez días."}
      - {norma: "LEC", articulo: "783", apartado: "4", tipo: "conexa", nota: "Se cita al Ministerio Fiscal por los menores sin representante y los ausentes de paradero desconocido."}
      - {norma: "LEC", articulo: "784", apartado: "2", tipo: "regula", nota: "En la junta se acuerdan el contador y los peritos; no más de un perito por clase de bienes."}
      - {norma: "LEC", articulo: "784", apartado: "3", tipo: "regula", nota: "Sin acuerdo, contador por sorteo entre abogados con despacho en el lugar del juicio; peritos igual."}
      - {norma: "LEC", articulo: "785", apartado: "3", tipo: "conexa", nota: "A instancia de parte, el LAJ fija plazo al contador; si lo incumple, responde de los daños."}
      - {norma: "LEC", articulo: "786", apartado: "1", tipo: "regula", nota: "Operaciones conforme a la ley de la sucesión y a las reglas del testador sin dañar legítimas; evitar indivisión."}
      - {norma: "LEC", articulo: "786", apartado: "2", tipo: "regula", nota: "Dos meses como máximo; escrito con relación de bienes, avalúo, liquidación, división y adjudicación."}
      - {norma: "LEC", articulo: "787", apartado: "1", tipo: "regula", nota: "Traslado de diez días para oponerse por escrito, con los puntos concretos y sus razones."}
      - {norma: "LEC", articulo: "787", apartado: "2", tipo: "regula", nota: "Sin oposición o con conformidad, decreto que aprueba las operaciones y manda protocolizarlas."}
      - {norma: "LEC", articulo: "787", apartado: "3", tipo: "regula", nota: "Con oposición, comparecencia ante el tribunal con el contador dentro de diez días."}
      - {norma: "LEC", articulo: "787", apartado: "5", tipo: "regula", nota: "Sin acuerdo, se sigue por el juicio verbal; la sentencia no produce cosa juzgada y cabe el ordinario posterior."}
      - {norma: "LEC", articulo: "788", apartado: "1", tipo: "conexa", nota: "Aprobada la partición, el LAJ entrega a cada uno lo adjudicado y sus títulos."}
      - {norma: "LEC", articulo: "788", apartado: "3", tipo: "conexa", nota: "Si un acreedor se opuso (782.4), no se entrega nada hasta que esté pagado o garantizado."}
      - {norma: "LEC", articulo: "789", tipo: "regula", nota: "En cualquier momento los interesados pueden apartarse y, de común acuerdo, pedir el sobreseimiento."}
      - {norma: "LEC", articulo: "792", apartado: "1.2.º", tipo: "conexa", nota: "Al pedir la división, cualquier coheredero puede pedir la intervención del caudal, salvo prohibición del testador."}
      - {norma: "LEC", articulo: "52", apartado: "1.4.º", tipo: "regula", nota: "Competencia: último domicilio del causante; si fue extranjero, último en España o donde esté la mayoría de bienes."}
      - {norma: "CC", articulo: "1051", tipo: "regula", nota: "Nadie está obligado a seguir en la indivisión; la prohibición del testador cede ante las causas de extinción de la sociedad."}
      - {norma: "CC", articulo: "1052", tipo: "regula", nota: "Todo coheredero con libre disposición puede pedir la partición en cualquier tiempo."}
      - {norma: "CC", articulo: "1965", tipo: "regula", nota: "La acción para pedir la partición de la herencia no prescribe entre coherederos."}
      - {norma: "CC", articulo: "1056", tipo: "conexa", nota: "Si el testador partió, se pasa por su partición mientras no perjudique la legítima."}
      - {norma: "CC", articulo: "1057", tipo: "conexa", nota: "Contador-partidor testamentario; sin él, el dativo que nombra el LAJ o el notario a petición del 50 % del haber."}
      - {norma: "CC", articulo: "1058", tipo: "conexa", nota: "Herederos mayores y capaces pueden partir como quieran."}
      - {norma: "CC", articulo: "1059", tipo: "regula", nota: "Si no se entienden sobre el modo de partir, queda a salvo la vía de la Ley de Enjuiciamiento Civil."}
      - {norma: "CC", articulo: "1061", tipo: "regula", nota: "Se ha de guardar la posible igualdad, con lotes de cosas de la misma naturaleza, calidad o especie."}
      - {norma: "CC", articulo: "1062", tipo: "regula", nota: "Cosa indivisible: se adjudica a uno abonando el exceso; basta que un heredero pida subasta pública con extraños."}
      - {norma: "CC", articulo: "1063", tipo: "conexa", nota: "Los coherederos se abonan rentas y frutos percibidos, gastos útiles y necesarios y daños por malicia o negligencia."}
      - {norma: "CC", articulo: "1064", tipo: "conexa", nota: "Gastos de partición en interés común, a cargo de la herencia; los de interés particular, de quien los causa."}
      - {norma: "CC", articulo: "1068", tipo: "conexa", nota: "La partición legalmente hecha da a cada heredero la propiedad exclusiva de lo adjudicado."}
      - {norma: "CC", articulo: "1073", tipo: "conexa", nota: "Las particiones se rescinden por las mismas causas que las obligaciones."}
      - {norma: "CC", articulo: "1074", tipo: "conexa", nota: "Rescisión por lesión en más de la cuarta parte, según el valor al adjudicarse."}
      - {norma: "CC", articulo: "1076", tipo: "conexa", nota: "La acción rescisoria por lesión dura cuatro años desde la partición."}
      - {norma: "CC", articulo: "1079", tipo: "conexa", nota: "Omitir bienes no rescinde la partición: se completa o adiciona."}
      - {norma: "CC", articulo: "1080", tipo: "conexa", nota: "Preterición de un heredero: no se rescinde salvo mala fe o dolo; se le paga su parte."}
      - {norma: "CC", articulo: "1081", tipo: "conexa", nota: "La partición hecha con quien se creyó heredero sin serlo es nula."}
      - {norma: "CC", articulo: "1082", tipo: "conexa", nota: "Los acreedores reconocidos pueden oponerse a la partición hasta que se les pague o afiance."}
    no_consta_en_norma:
      - "Fecha de valoración de los bienes (fallecimiento o partición) y su actualización: jurisprudencial."
      - "Plazo y causas para impugnar por nulidad la partición del contador-partidor: jurisprudencial."
      - "Si en este cauce se discute la inclusión o exclusión de bienes del caudal: no lo resuelve la LEC fuera del inventario de la intervención."
    fuera_de_la_herramienta:
      - "Reglamento (UE) 650/2012, de sucesiones: ley aplicable a la sucesión de extranjeros (el 786.1 remite a ella)."
      - "Ley 15/2015 (expediente ante el LAJ) y Ley del Notariado, arts. 50 y 66: nombramiento del contador-partidor dativo y aprobación de su partición."
    afines: ["Partición de la herencia y su impugnación", "Administración e intervención del caudal hereditario", "Herencia yacente y comunidades sin personalidad como parte", "Copropiedad y acción de división de cosa común", "Albacea y contador-partidor", "Legítimas: cuantía y cálculo", "Liquidación del régimen económico matrimonial (procedimiento)"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Uso de la vivienda familiar"
    sinonimos: ["atribución del uso de la vivienda familiar", "domicilio conyugal", "vivienda conyugal", "ajuar familiar", "uso de la vivienda a los hijos menores", "cónyuge no titular", "interés más necesitado de protección", "limitación temporal del uso", "extinción del uso de la vivienda", "vivienda arrendada tras el divorcio", "custodia compartida y vivienda"]
    normas_base: ["CC", "LEC", "LAU"]
    remisiones:
      - {norma: "CC", articulo: "96", apartado: "1", tipo: "regula", nota: "Sin acuerdo aprobado, uso de los hijos menores y del cónyuge con quien queden hasta la mayoría de todos; si un menor tiene discapacidad, el juez fija el plazo."}
      - {norma: "CC", articulo: "96", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Hijos mayores con discapacidad que aconseje seguir en la vivienda: se equiparan a los menores; el juez fija el plazo."}
      - {norma: "CC", articulo: "da4", apartado: "párrafo 1.º", tipo: "regula", nota: "La discapacidad del art. 96 es la definida en la Ley 41/2003 y, además, la dependencia de grado II o III de la Ley 39/2006."}
      - {norma: "CC", articulo: "96", apartado: "1, párrafo 3.º", tipo: "regula", nota: "Extinguido el uso, la vivienda de los hijos sin independencia económica se atiende como alimentos entre parientes."}
      - {norma: "CC", articulo: "96", apartado: "1, párrafo 4.º", tipo: "regula", nota: "Hijos repartidos entre ambos cónyuges: resuelve el juez lo procedente."}
      - {norma: "CC", articulo: "96", apartado: "2", tipo: "regula", nota: "Sin hijos: al no titular, por tiempo prudencial, si su interés es el más necesitado de protección."}
      - {norma: "CC", articulo: "96", apartado: "3", tipo: "regula", nota: "Para disponer de la vivienda atribuida, consentimiento de ambos o autorización judicial; se inscribe en el Registro."}
      - {norma: "CC", articulo: "90", apartado: "1.c)", tipo: "regula", nota: "El convenio regulador debe contener la atribución del uso de la vivienda y del ajuar familiar."}
      - {norma: "CC", articulo: "90", apartado: "2", tipo: "conexa", nota: "El juez aprueba el convenio salvo que dañe a los hijos o perjudique gravemente a un cónyuge."}
      - {norma: "CC", articulo: "90", apartado: "3", tipo: "conexa", nota: "Las medidas se modifican por nuevas necesidades de los hijos o cambio de circunstancias de los cónyuges."}
      - {norma: "CC", articulo: "91", tipo: "regula", nota: "Sin acuerdo, la sentencia fija las medidas sobre la vivienda familiar; se modifican si cambian sustancialmente las circunstancias."}
      - {norma: "CC", articulo: "103", apartado: "2.ª", tipo: "regula", nota: "Medida provisional: uso para el cónyuge del interés familiar más necesitado de protección, con inventario del ajuar."}
      - {norma: "CC", articulo: "1320", tipo: "conexa", nota: "Disponer de la vivienda habitual exige el consentimiento de ambos o autorización judicial, aunque sea de uno."}
      - {norma: "LEC", articulo: "771", apartado: "1", tipo: "regula", nota: "Medidas previas a la demanda (arts. 102 y 103 CC) ante el tribunal del domicilio; sin abogado ni procurador para pedirlas."}
      - {norma: "LEC", articulo: "771", apartado: "2", tipo: "conexa", nota: "Si urge, el tribunal acuerda de inmediato sobre custodia y uso de la vivienda; sin recurso."}
      - {norma: "LEC", articulo: "771", apartado: "5", tipo: "regula", nota: "Las medidas previas caducan si la demanda no se presenta en treinta días."}
      - {norma: "LEC", articulo: "773", apartado: "1", tipo: "conexa", nota: "Medidas provisionales pedidas en la demanda; el acuerdo de los cónyuges no vincula para las definitivas."}
      - {norma: "LEC", articulo: "774", apartado: "4", tipo: "regula", nota: "Sin acuerdo aprobado, la sentencia fija las medidas definitivas sobre la vivienda familiar."}
      - {norma: "LEC", articulo: "774", apartado: "5", tipo: "conexa", nota: "Los recursos contra la sentencia no suspenden la eficacia de las medidas."}
      - {norma: "LEC", articulo: "775", apartado: "1", tipo: "regula", nota: "Modificación de medidas definitivas si han variado sustancialmente las circunstancias."}
      - {norma: "LAU", articulo: "15", apartado: "1", tipo: "regula", nota: "Vivienda arrendada: el cónyuge no arrendatario sigue si se le atribuye; si el uso es permanente o excede lo que resta del contrato, pasa a ser el titular."}
      - {norma: "LAU", articulo: "15", apartado: "2", tipo: "regula", nota: "Debe comunicarlo al arrendador en dos meses desde la notificación de la resolución, con copia."}
    no_consta_en_norma:
      - "Entrada de una nueva pareja en la vivienda: pierde su carácter familiar y cesa o se revisa el uso: jurisprudencial."
      - "Custodia compartida: uso temporal por el 96.2 por analogía, al interés más necesitado: jurisprudencial."
      - "Vivienda propiedad de un tercero (p. ej., padres de un cónyuge): precario frente a él: jurisprudencial."
      - "Parejas de hecho: aplicación analógica del art. 96: jurisprudencial."
    fuera_de_la_herramienta:
      - "Ley valenciana 5/2011, de relaciones familiares: anulada por la STC 192/2016; en Benidorm rige el Código Civil."
      - "Ley 41/2003, art. 2.2 (al que remite la da 4.ª CC): discapacidad psíquica igual o superior al 33 % o física o sensorial igual o superior al 65 %; se acredita por certificado o resolución judicial firme (2.3)."
    afines: ["Separación y divorcio contenciosos", "Divorcio de mutuo acuerdo y convenio regulador", "Medidas provisionales en familia", "Modificación de medidas definitivas", "Vivienda familiar: disposición por el cónyuge titular", "Separación o divorcio del arrendatario", "Desahucio por precario"]
    estado: "vigente"
    espejo: "legalize-es@10ec58cc2a"
    revisada_el: "2026-10-09"
    revisor: "armero"
