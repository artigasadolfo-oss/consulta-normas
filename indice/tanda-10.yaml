  - voz: "Solidaridad y mancomunidad"
    sinonimos: ["obligaciones solidarias", "deudores solidarios", "acreedores solidarios", "obligación mancomunada", "obligación parciaria", "presunción de mancomunidad", "acción de regreso entre codeudores", "solidaridad impropia", "obligación indivisible", "fiador solidario", "responsabilidad solidaria"]
    normas_base: ["CC", "LEC", "LOE"]
    remisiones:
      - {norma: "CC", articulo: "1137", tipo: "regula", nota: "Varios deudores o acreedores no implica que cada uno deba o pueda exigir el todo: la solidaridad ha de pactarse expresamente."}
      - {norma: "CC", articulo: "1138", tipo: "regula", nota: "Salvo otra cosa, crédito y deuda se presumen divididos en partes iguales y distintas."}
      - {norma: "CC", articulo: "1139", tipo: "regula", nota: "Prestación indivisible: solo se cobra procediendo contra todos los deudores; nadie suple al insolvente."}
      - {norma: "CC", articulo: "1140", tipo: "conexa", nota: "Cabe solidaridad aunque los obligados lo estén con distintos plazos y condiciones."}
      - {norma: "CC", articulo: "1141", tipo: "regula", nota: "Cada acreedor solidario hace lo útil, no lo perjudicial; la acción contra un deudor solidario perjudica a todos."}
      - {norma: "CC", articulo: "1142", tipo: "conexa", nota: "Se paga a cualquier acreedor solidario, pero si uno demandó, a ese."}
      - {norma: "CC", articulo: "1143", tipo: "conexa", nota: "Novación, compensación, confusión o remisión con uno extinguen la deuda; responde ante los demás."}
      - {norma: "CC", articulo: "1144", tipo: "regula", nota: "El acreedor elige demandar a uno, a varios o a todos, y puede seguir contra los demás hasta cobrar."}
      - {norma: "CC", articulo: "1145", tipo: "regula", nota: "El pago de uno extingue la deuda; regreso contra cada codeudor por su parte con intereses; el insolvente se reparte."}
      - {norma: "CC", articulo: "1146", tipo: "conexa", nota: "La quita a un deudor no le libra frente a los codeudores si la deuda se pagó entera."}
      - {norma: "CC", articulo: "1147", tipo: "conexa", nota: "Imposibilidad sin culpa extingue; con culpa de uno, todos responden ante el acreedor."}
      - {norma: "CC", articulo: "1148", tipo: "regula", nota: "El deudor solidario opone las excepciones de la obligación y las suyas; las personales de otro, solo en su parte."}
      - {norma: "CC", articulo: "1150", tipo: "conexa", nota: "Mancomunada indivisible incumplida: indemnización; quien estaba dispuesto a cumplir solo paga su porción del precio."}
      - {norma: "CC", articulo: "1974", apartado: "párrafo 1.º", tipo: "regula", nota: "En las solidarias, la interrupción de la prescripción aprovecha o perjudica a todos."}
      - {norma: "CC", articulo: "1974", apartado: "párrafo 3.º", tipo: "regula", nota: "En las mancomunadas, reclamar a un deudor solo su parte no interrumpe frente a los demás."}
      - {norma: "CC", articulo: "1084", tipo: "conexa", nota: "Tras la partición, cada heredero sin beneficio de inventario responde por entero de las deudas del causante."}
      - {norma: "CC", articulo: "1822", tipo: "conexa", nota: "Párrafo 2.º: el fiador solidario se rige por las reglas de las obligaciones solidarias."}
      - {norma: "LEC", articulo: "542", apartado: "1", tipo: "regula", nota: "La sentencia contra unos deudores solidarios no es título frente a los que no fueron parte."}
      - {norma: "LEC", articulo: "542", apartado: "2", tipo: "conexa", nota: "Título extrajudicial: solo contra el deudor solidario que figura en él o en otro documento ejecutivo."}
      - {norma: "LEC", articulo: "542", apartado: "3", tipo: "conexa", nota: "Con varios deudores solidarios en el título, ejecución por el total contra uno, varios o todos."}
      - {norma: "LOE", articulo: "17", apartado: "3", tipo: "conexa", nota: "Edificación: solidaria si no se individualiza la causa; el promotor responde siempre solidariamente."}
    no_consta_en_norma:
      - "Solidaridad tácita deducida de la naturaleza del vínculo, pese al 1137: jurisprudencial."
      - "Solidaridad impropia: la reclamación a un responsable no interrumpe frente a los demás: jurisprudencial."
      - "Que no hay litisconsorcio pasivo necesario entre deudores solidarios: jurisprudencial."
    afines: ["Litisconsorcio pasivo necesario", "Interrupción de la prescripción", "Fianza", "Responsabilidad de los agentes: plazos de 10, 3 y 1 año", "Ejecución frente a herederos y frente al cónyuge", "Responsabilidad del heredero por deudas y beneficio de inventario"]
