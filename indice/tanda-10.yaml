    afines: ["Vicios del consentimiento: error, dolo e intimidación", "Nulidad y anulabilidad del contrato", "Abuso de derecho y buena fe", "Cláusulas abusivas: concepto, nulidad e integración", "Requisitos del contrato y autonomía de la voluntad"]
