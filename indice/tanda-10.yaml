      - {norma: "CC", articulo: "1267", apartado: "párrafo 3.º", tipo: "conexa", nota: "Para calificar la intimidación se atiende a la edad y condición de la persona."}
      - {norma: "CC", articulo: "1267", apartado: "párrafo 4.º", tipo: "conexa", nota: "El temor de desagradar a quien se debe sumisión y respeto no anula."}
      - {norma: "CC", articulo: "1268", tipo: "regula", nota: "La violencia o intimidación de un tercero también anula."}
      - {norma: "CC", articulo: "1269", tipo: "regula", nota: "Dolo: palabras o maquinaciones insidiosas de un contratante sin las que el otro no habría contratado."}
      - {norma: "CC", articulo: "1270", apartado: "párrafo 1.º", tipo: "regula", nota: "Para anular, el dolo ha de ser grave y no recíproco."}
      - {norma: "CC", articulo: "1270", apartado: "párrafo 2.º", tipo: "regula", nota: "El dolo incidental no anula: solo obliga a indemnizar."}
      - {norma: "CC", articulo: "1301", apartado: "1.º", tipo: "regula", nota: "Intimidación o violencia: los cuatro años corren desde que cesaron."}
      - {norma: "CC", articulo: "1301", apartado: "2.º", tipo: "regula", nota: "Error o dolo: los cuatro años corren desde la consumación del contrato."}
      - {norma: "CC", articulo: "1302", apartado: "4", tipo: "regula", nota: "Quien causó la intimidación, empleó el dolo o produjo el error no puede alegarlos."}
      - {norma: "CC", articulo: "1303", tipo: "conexa", nota: "Anulado el contrato, restitución recíproca de cosas con frutos y precio con intereses."}
      - {norma: "CC", articulo: "1311", tipo: "conexa", nota: "Confirmación tácita: actuar conociendo el vicio ya cesado con voluntad de renunciar a alegarlo."}
      - {norma: "CC", articulo: "6", apartado: "1", tipo: "conexa", nota: "El error de derecho solo produce los efectos que las leyes determinen."}
      - {norma: "CC", articulo: "1102", tipo: "conexa", nota: "La responsabilidad por dolo es irrenunciable de antemano."}
