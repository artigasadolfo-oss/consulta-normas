      - {norma: "CC", articulo: "1286", tipo: "regula", nota: "Palabras de varias acepciones: la más conforme a la naturaleza y objeto del contrato."}
      - {norma: "CC", articulo: "1287", tipo: "regula", nota: "El uso o costumbre del país interpreta ambigüedades y suple cláusulas habituales omitidas."}
      - {norma: "CC", articulo: "1288", tipo: "regula", nota: "La cláusula oscura no favorece a quien causó la oscuridad."}
      - {norma: "CC", articulo: "1289", apartado: "párrafo 1.º", tipo: "regula", nota: "Duda irresoluble en lo accesorio: gratuito, menor transmisión; oneroso, mayor reciprocidad."}
      - {norma: "CC", articulo: "1289", apartado: "párrafo 2.º", tipo: "regula", nota: "Duda irresoluble sobre el objeto principal: el contrato es nulo."}
      - {norma: "CC", articulo: "1258", tipo: "conexa", nota: "Integración: el contrato obliga también a lo que exijan la buena fe, el uso y la ley."}
      - {norma: "CC", articulo: "1091", tipo: "conexa", nota: "El contrato tiene fuerza de ley entre las partes y se cumple a su tenor."}
      - {norma: "TRLGDCU", articulo: "80", apartado: "2", tipo: "regula", nota: "Acción individual de consumidor: en la duda prevalece la interpretación más favorable al consumidor."}
      - {norma: "TRLGDCU", articulo: "80", apartado: "1.a)", tipo: "conexa", nota: "Las cláusulas no negociadas deben ser concretas, claras y sencillas, sin reenvíos a textos no entregados."}
