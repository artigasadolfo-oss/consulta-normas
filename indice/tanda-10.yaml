      - {norma: "LO 1/2025", articulo: "7", apartado: "2", tipo: "regula", nota: "Con tercero neutral: mediación, art. 4 Ley 5/2012; conciliador, desde que la recibe; experto, desde su designación."}
      - {norma: "LO 1/2025", articulo: "7", apartado: "3", tipo: "conexa", nota: "Sin respuesta o sin acuerdo, la demanda debe presentarse en un año para tener por cumplido el requisito de procedibilidad."}
      - {norma: "CC", articulo: "1969", tipo: "conexa", nota: "El plazo corre desde que la acción pudo ejercitarse."}
      - {norma: "CC", articulo: "1970", tipo: "conexa", nota: "Obligaciones de capital con interés o renta: el plazo corre desde el último pago de la renta o del interés."}
      - {norma: "CC", articulo: "1945", tipo: "conexa", nota: "Usucapión: la interrumpe la citación judicial al poseedor, aun de juez incompetente."}
      - {norma: "CC", articulo: "1946", tipo: "conexa", nota: "Usucapión: no interrumpe la citación nula, ni la demanda desistida, caducada o desestimada."}
      - {norma: "CC", articulo: "1947", tipo: "conexa", nota: "Usucapión: la conciliación interrumpe si se demanda en los dos meses siguientes."}
