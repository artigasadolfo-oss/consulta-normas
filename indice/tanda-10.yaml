# Índice de conceptos de «Consulta de normas» — tanda 10 (tasación, herencia, vivienda familiar, obligaciones)
# Revisor: armero. Espejo: legalize-es@aca28304d, salvo «Interrupción de la prescripción» y «Uso de la vivienda familiar»,
# revisadas el 09-10-2026 contra legalize-es@10ec58cc2a. Todo precepto citado se ha leído en el espejo en su pasada.
# Vigencia: contraste con la API de boe.es (scripts/contraste_boe.py --solo "LEC,CC,LO 1/2025,TRLGDCU,LAU", 08-10-2026 08:03):
# distintos LEC 22 y 685, CC 396 (errata del espejo) y 34 artículos de la LAU (no el 15). LOE (contraste aparte): ninguno.
# Ninguno de los distintos está citado; ninguna versión futura. Ver tanda-10-notas.md.
# Voces 177, 184, 185 y 200 a 208 de la lista maestra (12 voces). Recuento y estados en tanda-10-notas.md.

voces:
  - voz: "Tasación de costas y su impugnación"
    sinonimos: ["tasación de costas", "impugnación de la tasación", "honorarios excesivos", "partidas indebidas", "minuta de honorarios", "límite del tercio", "informe del Colegio de Abogados", "exoneración o moderación de costas", "cuenta del procurador en la tasación", "IVA en la tasación de costas"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "242", apartado: "1", tipo: "regula", nota: "Firme la condena en costas, se tasan y se exigen por apremio si el condenado no las pagó antes de pedirse la tasación."}
      - {norma: "LEC", articulo: "242", apartado: "2", tipo: "regula", nota: "Quien pide la tasación aporta los justificantes de lo que ya pagó y quiere recobrar."}
      - {norma: "LEC", articulo: "242", apartado: "3", tipo: "regula", nota: "Procuradores, abogados y peritos presentan minuta detallada y cuenta justificada de suplidos."}
      - {norma: "LEC", articulo: "242", apartado: "5", tipo: "conexa", nota: "Los honorarios no sujetos a arancel se fijan conforme a las normas del estatuto profesional."}
      - {norma: "LEC", articulo: "243", apartado: "1", tipo: "regula", nota: "Tasa el LAJ del tribunal que conoció del proceso o del recurso, o el de la ejecución. El texto aún dice «Secretario»."}
      - {norma: "LEC", articulo: "243", apartado: "2", tipo: "regula", nota: "Fuera lo inútil o no detallado; reduce al límite del 394.3 sin temeridad; IVA incluido y no computa para ese límite."}
      - {norma: "LEC", articulo: "243", apartado: "3", tipo: "conexa", nota: "No entran las costas de incidentes en que se condenó expresamente al favorecido en lo principal."}
      - {norma: "LEC", articulo: "244", apartado: "1", tipo: "regula", nota: "Traslado de la tasación a las partes por plazo común de diez días."}
      - {norma: "LEC", articulo: "244", apartado: "2", tipo: "regula", nota: "Tras el traslado no se admite añadir partidas; queda a salvo reclamarlas por otra vía."}
      - {norma: "LEC", articulo: "244", apartado: "3", tipo: "regula", nota: "Sin impugnación, decreto de aprobación; cabe revisión y contra el auto que la resuelve no hay recurso."}
      - {norma: "LEC", articulo: "245", apartado: "1", tipo: "regula", nota: "La impugnación se hace dentro de los diez días del traslado."}
      - {norma: "LEC", articulo: "245", apartado: "2", tipo: "regula", nota: "Motivos: partidas indebidas; y, en honorarios no sujetos a arancel, también excesivos."}
      - {norma: "LEC", articulo: "245", apartado: "3", tipo: "regula", nota: "El favorecido puede impugnar por no incluir gastos justificados o la minuta entera de su abogado o perito."}
      - {norma: "LEC", articulo: "245", apartado: "4", tipo: "regula", nota: "Hay que citar minutas, partidas concretas y razones; si no, decreto de inadmisión, recurrible en revisión."}
      - {norma: "LEC", articulo: "245", apartado: "5", tipo: "regula", nota: "Exoneración o moderación si la sentencia coincide en lo sustancial con la propuesta MASC rechazada."}
      - {norma: "LEC", articulo: "245 bis", apartado: "1", tipo: "regula", nota: "Pedida la exoneración o moderación, traslado de tres días a la otra parte."}
      - {norma: "LEC", articulo: "245 bis", apartado: "2", tipo: "conexa", nota: "Si la acepta o calla, decreto que fija la cantidad; cabe revisión."}
      - {norma: "LEC", articulo: "245 bis", apartado: "3", tipo: "regula", nota: "Si no la acepta, auto del tribunal sin costas con porcentaje y partidas reducidas; cabe reposición."}
      - {norma: "LEC", articulo: "245 bis", apartado: "4", tipo: "conexa", nota: "La impugnación por excesivas o indebidas se tramita después, cuando sea firme lo resuelto sobre la exoneración."}
      - {norma: "LEC", articulo: "246", apartado: "1", tipo: "regula", nota: "Excesivos: se oye al abogado cinco días y, si no acepta reducir, informe del Colegio (salvo informe previo del 438 bis)."}
      - {norma: "LEC", articulo: "246", apartado: "2", tipo: "conexa", nota: "Honorarios de peritos excesivos: dictamen de su colegio, asociación o corporación."}
      - {norma: "LEC", articulo: "246", apartado: "3", tipo: "regula", nota: "Con los informes, el LAJ dicta decreto que mantiene o modifica la tasación."}
      - {norma: "LEC", articulo: "246", apartado: "4", tipo: "regula", nota: "Indebidas: traslado de tres días y decreto en otros tres; revisión, y contra el auto no hay recurso. Reglas de costas."}
      - {norma: "LEC", articulo: "246", apartado: "5", tipo: "conexa", nota: "Indebida y, subsidiariamente, excesiva: se tramitan a la vez y lo excesivo espera a lo indebido."}
      - {norma: "LEC", articulo: "246", apartado: "6", tipo: "conexa", nota: "En el incidente no se discute si la Administración debe pagar por la asistencia jurídica gratuita."}
      - {norma: "LEC", articulo: "394", apartado: "3", tipo: "regula", nota: "Límite: un tercio de la cuantía por cada litigante favorecido; inestimables, 24.000 euros; no rige si hay temeridad."}
      - {norma: "LEC", articulo: "32", apartado: "5", tipo: "regula", nota: "Sin preceptividad, fuera abogado y procurador, salvo temeridad, abuso u otro partido; consumidor con reclamación previa, sin límite."}
      - {norma: "LEC", articulo: "241", apartado: "1", tipo: "conexa", nota: "Qué partidas son costas: honorarios preceptivos, edictos, depósitos, peritos, copias, aranceles y tasa."}
      - {norma: "LEC", articulo: "539", apartado: "2", tipo: "conexa", nota: "En la ejecución, las costas no resueltas expresamente son del ejecutado sin necesidad de imposición."}
      - {norma: "LO 1/2025", articulo: "7", apartado: "4", tipo: "conexa", nota: "Al resolver sobre costas o su tasación, el tribunal pondera la colaboración en el MASC y el abuso del servicio."}
    no_consta_en_norma:
      - "Criterios orientadores de los Colegios de Abogados: no vinculan al LAJ; se valora el trabajo efectivo y la cuantía: jurisprudencial."
      - "Exclusión del IVA cuando el favorecido puede deducirlo: criterio jurisprudencial, el 243.2 no lo distingue."
      - "Si el límite del tercio del 394.3 alcanza a las costas de los recursos: no consta en norma."
    fuera_de_la_herramienta:
      - "Ley 1/1996, art. 36: costas a favor del beneficiario (las cobran sus profesionales, que pueden instar la tasación) y en su contra."
      - "RD 434/2024, arancel de los procuradores: es máximo y tiene un tope de 75.000 euros por asunto (242.4 LEC)."
    afines: ["Costas: vencimiento, temeridad y allanamiento", "Costas y MASC", "Costas en los recursos", "Cuenta del procurador y jura de cuentas del abogado", "Liquidación de intereses y tasación de costas en la ejecución", "Recurso de revisión contra decretos del LAJ"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Incumplimiento y facultad resolutoria (art. 1124)"
    sinonimos: ["resolución del contrato", "acción resolutoria", "facultad resolutoria implícita", "condición resolutoria tácita", "obligaciones recíprocas", "incumplimiento esencial", "exceptio non adimpleti contractus", "excepción de contrato no cumplido", "pacto comisorio", "resolución de la compraventa de inmueble"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "1124", apartado: "párrafo 1.º", tipo: "regula", nota: "La facultad de resolver va implícita en las obligaciones recíprocas si uno de los obligados no cumple."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 2.º", tipo: "regula", nota: "El perjudicado elige cumplimiento o resolución, con daños e intereses; resolución si el cumplimiento resulta imposible."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 3.º", tipo: "regula", nota: "El tribunal decreta la resolución, salvo causas justificadas para señalar plazo."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 4.º", tipo: "conexa", nota: "Quedan a salvo los terceros adquirentes, según los arts. 1295 y 1298 y la Ley Hipotecaria."}
      - {norma: "CC", articulo: "1100", tipo: "regula", nota: "Último párrafo: en las recíprocas nadie incurre en mora si el otro no cumple o no se allana a cumplir."}
      - {norma: "CC", articulo: "1091", tipo: "conexa", nota: "Los contratos tienen fuerza de ley entre las partes y deben cumplirse a su tenor."}
      - {norma: "CC", articulo: "1256", tipo: "conexa", nota: "La validez y el cumplimiento no pueden dejarse al arbitrio de uno de los contratantes."}
      - {norma: "CC", articulo: "1101", tipo: "conexa", nota: "Responde de los daños quien incumple con dolo, negligencia o morosidad o contraviene el tenor de la obligación."}
      - {norma: "CC", articulo: "1123", tipo: "conexa", nota: "Cumplida la condición resolutoria, se restituye lo percibido; pérdida, deterioro y mejoras según el 1122."}
      - {norma: "CC", articulo: "1295", tipo: "conexa", nota: "Al que remite el 1124: no se recupera la cosa que está en poder de un tercero de buena fe."}
      - {norma: "CC", articulo: "1503", tipo: "regula", nota: "Venta de inmueble: con fundado temor de perder cosa y precio, resolución inmediata; si no, art. 1124."}
      - {norma: "CC", articulo: "1504", tipo: "regula", nota: "Inmueble: aun pactada la resolución automática, el comprador paga mientras no se le requiera judicial o notarialmente."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "conexa", nota: "La acción resolutoria, personal, prescribe a los cinco años desde que pudo exigirse el cumplimiento."}
    no_consta_en_norma:
      - "Incumplimiento esencial o frustración del fin del contrato; el mero retraso no basta: jurisprudencial."
      - "Resolución por declaración extrajudicial del acreedor, con control judicial posterior: jurisprudencial."
      - "Efecto retroactivo de la resolución y restitución recíproca de prestaciones: jurisprudencial (el 1124 no lo dice)."
      - "Excepción de contrato no cumplido o cumplido defectuosamente: jurisprudencial, con apoyo en el 1100."
    afines: ["Daños y perjuicios por incumplimiento contractual", "Mora del deudor e intereses moratorios", "Cláusula penal", "Arras y señal", "Resolución del contrato por incumplimiento", "Compraventa: entrega, precio y riesgos", "Fuerza mayor y caso fortuito"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Daños y perjuicios por incumplimiento contractual"
    sinonimos: ["indemnización de daños y perjuicios", "responsabilidad contractual", "daño emergente", "lucro cesante", "culpa contractual", "diligencia del buen padre de familia", "deudor doloso", "previsibilidad del daño", "liquidación de daños", "daño moral contractual"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1101", tipo: "regula", nota: "Indemniza quien incumple con dolo, negligencia o morosidad o contraviene de cualquier modo el tenor de la obligación."}
      - {norma: "CC", articulo: "1102", tipo: "regula", nota: "La responsabilidad por dolo es exigible siempre; la renuncia anticipada a esa acción es nula."}
      - {norma: "CC", articulo: "1103", tipo: "regula", nota: "La responsabilidad por negligencia es exigible, pero los tribunales pueden moderarla."}
      - {norma: "CC", articulo: "1104", tipo: "regula", nota: "Culpa: omisión de la diligencia que exige la obligación; en defecto de pacto, la del buen padre de familia."}
      - {norma: "CC", articulo: "1105", tipo: "regula", nota: "Nadie responde de lo imprevisible o inevitable, salvo que lo diga la ley o la obligación."}
      - {norma: "CC", articulo: "1106", tipo: "regula", nota: "Se indemniza la pérdida sufrida y la ganancia dejada de obtener."}
      - {norma: "CC", articulo: "1107", apartado: "párrafo 1.º", tipo: "regula", nota: "Deudor de buena fe: solo los daños previstos o previsibles al contratar y consecuencia necesaria del incumplimiento."}
      - {norma: "CC", articulo: "1107", apartado: "párrafo 2.º", tipo: "regula", nota: "Deudor doloso: todos los daños que conocidamente deriven del incumplimiento."}
      - {norma: "CC", articulo: "1108", tipo: "conexa", nota: "Deuda de dinero en mora: la indemnización son los intereses pactados o, en su defecto, el interés legal."}
      - {norma: "CC", articulo: "1098", tipo: "conexa", nota: "Obligación de hacer incumplida o mal hecha: se ejecuta a costa del deudor y cabe deshacer lo mal hecho."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 2.º", tipo: "conexa", nota: "Con el cumplimiento o con la resolución cabe pedir el resarcimiento de daños y el abono de intereses."}
      - {norma: "CC", articulo: "1152", tipo: "conexa", nota: "Si hay cláusula penal, la pena sustituye a la indemnización, salvo pacto en contrario."}
      - {norma: "CC", articulo: "1270", apartado: "párrafo 2.º", tipo: "conexa", nota: "El dolo incidental no anula el contrato: solo obliga a indemnizar."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "conexa", nota: "La acción contractual prescribe a los cinco años desde que pudo exigirse el cumplimiento."}
      - {norma: "LEC", articulo: "219", apartado: "1", tipo: "regula", nota: "Hay que pedir condena cuantificada o con bases para una pura operación aritmética; no cabe diferirlo a ejecución."}
      - {norma: "LEC", articulo: "219", apartado: "3", tipo: "conexa", nota: "Única excepción: pedir solo la condena genérica y dejar la liquidación para un pleito posterior."}
      - {norma: "LEC", articulo: "712", tipo: "conexa", nota: "Cuando la ley lo permite, los daños se liquidan en ejecución por el procedimiento de los arts. 712 y siguientes."}
    no_consta_en_norma:
      - "Daño moral contractual y cuándo se indemniza: jurisprudencial."
      - "Daño «ex re ipsa», que no necesita prueba por evidente: jurisprudencial."
      - "Lucro cesante: probable y no meramente posible o soñado: jurisprudencial."
      - "Deber de mitigar el daño y compensación del lucro con el daño: jurisprudencial."
    afines: ["Incumplimiento y facultad resolutoria (art. 1124)", "Mora del deudor e intereses moratorios", "Cláusula penal", "Fuerza mayor y caso fortuito", "Responsabilidad extracontractual", "Prescripción (como excepción)", "Liquidación de daños, frutos y rendición de cuentas"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Mora del deudor e intereses moratorios"
    sinonimos: ["mora del deudor", "constitución en mora", "intimación", "requerimiento de pago", "interés de demora", "interés legal del dinero", "anatocismo", "intereses de los intereses", "mora automática", "in illiquidis non fit mora"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1100", tipo: "regula", nota: "Mora desde la exigencia judicial o extrajudicial; en las recíprocas, nadie incurre si el otro no cumple (último párrafo)."}
      - {norma: "CC", articulo: "1100", apartado: "1.º", tipo: "regula", nota: "Sin intimación si la obligación o la ley lo declaran expresamente."}
      - {norma: "CC", articulo: "1100", apartado: "2.º", tipo: "regula", nota: "Sin intimación si la fecha de cumplimiento fue el motivo determinante de la obligación."}
      - {norma: "CC", articulo: "1101", tipo: "regula", nota: "La morosidad obliga a indemnizar los daños y perjuicios causados."}
      - {norma: "CC", articulo: "1108", tipo: "regula", nota: "Deuda de dinero: salvo pacto, la indemnización son los intereses convenidos y, a falta de pacto, el interés legal."}
      - {norma: "CC", articulo: "1109", tipo: "regula", nota: "Los intereses vencidos devengan el legal desde su reclamación judicial; en lo mercantil, el Código de Comercio."}
      - {norma: "CC", articulo: "1096", tipo: "conexa", nota: "Párrafo 3.º: el deudor de cosa determinada en mora carga con el caso fortuito hasta la entrega."}
      - {norma: "CC", articulo: "1110", tipo: "conexa", nota: "Recibir el capital sin reserva extingue los intereses; el último plazo sin reserva, los plazos anteriores."}
      - {norma: "CC", articulo: "1501", apartado: "3.º", tipo: "conexa", nota: "El comprador debe intereses del precio desde la entrega si está en mora conforme al 1100."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 2.º", tipo: "conexa", nota: "El abono de intereses acompaña tanto al cumplimiento como a la resolución."}
      - {norma: "LEC", articulo: "576", apartado: "1", tipo: "conexa", nota: "Distinto: desde la sentencia de condena, interés legal más dos puntos (mora procesal)."}
      - {norma: "LEC", articulo: "219", apartado: "1", tipo: "conexa", nota: "La demanda debe cuantificar los intereses o fijar las bases para calcularlos."}
    no_consta_en_norma:
      - "Abandono de la regla «in illiquidis non fit mora»; criterio de lo razonable de la reclamación: jurisprudencial."
      - "Interés moratorio abusivo con consumidores (más de dos puntos sobre el remuneratorio) y sus efectos: jurisprudencial."
    fuera_de_la_herramienta:
      - "La Ley de Presupuestos de cada año (o su prórroga) fija el interés legal; las notas del espejo al 1108 (5 % y 4 %) son históricas."
      - "Ley 3/2004, de morosidad en las operaciones comerciales: interés de demora y plazos de pago entre empresas."
      - "Ley 5/2019, art. 25: persona física con hipoteca sobre inmueble residencial, demora = remuneratorio + 3 puntos, sin pacto en contra."
    afines: ["Intereses de la mora procesal", "Daños y perjuicios por incumplimiento contractual", "Incumplimiento y facultad resolutoria (art. 1124)", "Préstamo e intereses", "Ofrecimiento de pago y consignación", "Pago: prueba, imputación y pago por tercero"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Cláusula penal"
    sinonimos: ["pena convencional", "penalización contractual", "cláusula penal sustitutiva", "cláusula penal cumulativa", "pena moratoria", "moderación judicial de la pena", "indemnización pactada", "penalidad por incumplimiento", "indemnización desproporcionada al consumidor"]
    normas_base: ["CC", "TRLGDCU"]
    remisiones:
      - {norma: "CC", articulo: "1152", apartado: "párrafo 1.º", tipo: "regula", nota: "La pena sustituye a la indemnización de daños e intereses por incumplimiento, si no se pactó otra cosa."}
      - {norma: "CC", articulo: "1152", apartado: "párrafo 2.º", tipo: "regula", nota: "La pena solo es efectiva cuando sea exigible conforme al Código."}
      - {norma: "CC", articulo: "1153", tipo: "regula", nota: "El deudor no se libera pagando la pena, ni el acreedor cobra pena y cumplimiento a la vez, salvo que se pactara."}
      - {norma: "CC", articulo: "1154", tipo: "regula", nota: "El juez modera la pena si la obligación principal se cumplió en parte o irregularmente."}
      - {norma: "CC", articulo: "1155", tipo: "regula", nota: "La nulidad de la pena no anula la obligación principal; la nulidad de esta arrastra la pena."}
      - {norma: "CC", articulo: "1255", tipo: "conexa", nota: "Libertad de pactos dentro de las leyes, la moral y el orden público: base de la pena convencional."}
      - {norma: "CC", articulo: "1101", tipo: "conexa", nota: "Sin pena pactada, o si se pactó cumulativa, la indemnización se rige por los arts. 1101 y siguientes."}
      - {norma: "CC", articulo: "1454", tipo: "conexa", nota: "Arras penitenciales: el comprador desiste perdiéndolas o el vendedor devolviéndolas duplicadas."}
      - {norma: "TRLGDCU", articulo: "85", apartado: "6", tipo: "regula", nota: "Abusiva la indemnización desproporcionadamente alta impuesta al consumidor que incumple."}
      - {norma: "TRLGDCU", articulo: "83", tipo: "conexa", nota: "La cláusula abusiva es nula y se tiene por no puesta; el contrato subsiste si puede sin ella."}
    no_consta_en_norma:
      - "No cabe moderar por el 1154 si se previó y se produjo precisamente ese incumplimiento: jurisprudencial."
      - "Pena abusiva con consumidor: no se modera, se anula entera (sin integración): jurisprudencial (TJUE y TS)."
      - "Interpretación restrictiva de la pena y de su carácter cumulativo: jurisprudencial."
    afines: ["Arras y señal", "Daños y perjuicios por incumplimiento contractual", "Incumplimiento y facultad resolutoria (art. 1124)", "Cláusulas abusivas: lista legal (gastos, sumisión, penalizaciones)", "Desistimiento del arrendatario"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Nulidad y anulabilidad del contrato"
    sinonimos: ["nulidad absoluta", "nulidad radical", "nulidad de pleno derecho", "anulabilidad", "nulidad relativa", "acción de nulidad", "contrato inexistente", "falta de causa", "causa ilícita", "confirmación del contrato", "restitución de prestaciones", "caducidad de la acción de anulabilidad"]
    normas_base: ["CC", "TRLGDCU", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "6", apartado: "3", tipo: "regula", nota: "Los actos contrarios a normas imperativas o prohibitivas son nulos de pleno derecho, salvo otro efecto previsto."}
      - {norma: "CC", articulo: "1261", tipo: "regula", nota: "No hay contrato sin consentimiento, objeto cierto y causa."}
