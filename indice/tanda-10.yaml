    revisor: "armero"

  - voz: "Interrupción de la prescripción"
    sinonimos: ["interrumpir la prescripción", "reclamación extrajudicial", "burofax interruptivo", "reconocimiento de deuda", "requerimiento fehaciente", "interrupción por demanda", "efecto interruptivo del MASC", "reinicio del plazo", "interrupción frente al fiador", "interrupción frente a codeudores"]
