      - {norma: "LEC", articulo: "695", apartado: "4", tipo: "conexa", nota: "Apelación contra el auto de sobreseimiento, de inaplicación o que desestima la oposición por abusividad."}
      - {norma: "LEC", articulo: "34", apartado: "4", tipo: "regula", nota: "Cuenta del procurador frente a persona física: contrato y control de oficio de cláusulas antes del requerimiento."}
