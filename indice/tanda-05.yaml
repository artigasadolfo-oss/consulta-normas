# Índice de conceptos de «Consulta de normas» — tanda 5 (Juicio verbal, desahucios y procesos sumarios)
# Revisor: armero. Espejo: legalize-es@aca28304d. Todo precepto citado se ha leído en el espejo en esta pasada.
# Vigencia: contraste con la API de boe.es (scripts/contraste_boe.py, 08-10-2026) y lectura de la versión vigente de los
# artículos afectados. Las voces que citan LEC 22, LEC 685 o la LAU van «provisional» (ver tanda-05-notas.md).
# AVISO: RDL 29/2026 (vigor 08-10-2026) y RDL 28/2026 (vigor 15-11-2026) no están convalidados a esta fecha.

voces:
  - voz: "Desahucio por falta de pago"
    sinonimos: ["desahucio por impago", "juicio de desahucio", "impago de alquiler", "desahucio de vivienda", "desahucio de local", "reclamación de rentas"]
    normas_base: ["LEC", "LAU", "CC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "250", apartado: "1.1.º", tipo: "regula", nota: "Juicio verbal, cualquiera que sea la cuantía: impago de rentas y recuperación de la finca arrendada."}
      - {norma: "LEC", articulo: "249", apartado: "1.6.º", tipo: "conexa", nota: "Arrendamientos van al ordinario, salvo rentas, desahucio por impago o expiración, o cuantía valorable."}
      - {norma: "LEC", articulo: "52", apartado: "1.7.º", tipo: "regula", nota: "Fuero imperativo: tribunal del lugar de la finca (art. 54.1)."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "2", tipo: "conexa", nota: "El desahucio no está entre las materias exceptuadas: rige el MASC previo como requisito de procedibilidad."}
      - {norma: "LEC", articulo: "437", apartado: "3", tipo: "regula", nota: "Compromiso de condonar deuda y costas si desaloja en el plazo fijado (mínimo quince días); puede pedirse ya el lanzamiento."}
      - {norma: "LEC", articulo: "437", apartado: "4.3.ª", tipo: "regula", nota: "Acumulación de rentas vencidas sin límite de cuantía y de la acción contra el fiador o avalista solidario requerido."}
      - {norma: "LEC", articulo: "439", apartado: "3", tipo: "regula", nota: "Inadmisión si la demanda no indica las circunstancias que permiten o no enervar el desahucio."}
      - {norma: "LEC", articulo: "439", apartado: "6", tipo: "regula", nota: "Si es vivienda: decir si es habitual del ocupante y si el actor es gran tenedor (certificación registral si lo niega)."}
      - {norma: "LEC", articulo: "155", apartado: "3", tipo: "regula", nota: "Sin domicilio pactado en el contrato, el de la vivienda o local arrendado vale a todos los efectos."}
      - {norma: "LEC", articulo: "164", apartado: "párrafo 3.º", tipo: "regula", nota: "Arrendatario no hallado en los domicilios del 155.3 ni otro comunicado: edictos sin más trámites."}
      - {norma: "LEC", articulo: "438", apartado: "5", tipo: "regula", nota: "Requerimiento del LAJ: diez días para desalojar, pagar, enervar u oponerse; fija vista y lanzamiento."}
      - {norma: "LEC", articulo: "438", apartado: "5, párrafo 5.º", tipo: "regula", nota: "Si no atiende el requerimiento ni se opone: decreto que termina el juicio y lanzamiento en la fecha fijada."}
      - {norma: "LEC", articulo: "438", apartado: "5, párrafo 7.º", tipo: "regula", nota: "El decreto impone las costas e incluye las rentas que se devenguen hasta la entrega de la posesión."}
      - {norma: "LEC", articulo: "438", apartado: "6", tipo: "regula", nota: "Si no comparece a la vista, desahucio sin más trámites; lanzamiento antes de treinta días desde la vista."}
      - {norma: "LEC", articulo: "441", apartado: "5", tipo: "regula", nota: "Vivienda habitual: información y aviso de oficio a servicios sociales; posible suspensión por vulnerabilidad."}
      - {norma: "LEC", articulo: "444", apartado: "1", tipo: "regula", nota: "Oposición limitada a alegar y probar el pago o la procedencia de la enervación."}
      - {norma: "LEC", articulo: "22", apartado: "4", tipo: "regula", nota: "Enervación por decreto; no cabe si ya se enervó antes o hubo requerimiento fehaciente 30 días antes de demandar."}
      - {norma: "LEC", articulo: "22", apartado: "5", tipo: "regula", nota: "Enervada la acción, costas al arrendatario salvo que no se cobrara por causa imputable al arrendador."}
      - {norma: "LEC", articulo: "22", tipo: "conexa", nota: "Desde 08-10-2026, nuevo 22.6 (RDL 29/2026), aún no en el espejo: enervación a cargo de la Administración si hay vulnerabilidad."}
      - {norma: "LEC", articulo: "447", apartado: "1", tipo: "regula", nota: "Sentencia en cinco días; tras allanamiento del 437.3, lanzamiento subsidiario sin más trámites."}
      - {norma: "LEC", articulo: "447", apartado: "2", tipo: "regula", nota: "Sin cosa juzgada sobre el desahucio; sí la tienen los pronunciamientos sobre rentas y frente al fiador."}
      - {norma: "LEC", articulo: "449", apartado: "1", tipo: "regula", nota: "Para apelar o recurrir en casación, el demandado acredita tener pagadas las rentas vencidas y las adelantadas."}
      - {norma: "LEC", articulo: "449", apartado: "2", tipo: "regula", nota: "Recurso desierto si deja de pagar durante su tramitación; puede adelantar o consignar varios periodos."}
      - {norma: "LEC", articulo: "549", apartado: "3", tipo: "regula", nota: "La solicitud de ejecución hecha en la demanda basta para el lanzamiento en el día y hora señalados."}
      - {norma: "LEC", articulo: "549", apartado: "4", tipo: "regula", nota: "Sin plazo de espera de veinte días; si es vivienda habitual, antes del lanzamiento, trámite del 441.5 a 7."}
      - {norma: "LEC", articulo: "251", apartado: "9.ª", tipo: "conexa", nota: "Juicios sobre arrendamientos: cuantía de una anualidad de renta, salvo que se reclamen rentas."}
      - {norma: "LEC", articulo: "252", apartado: "2.ª", tipo: "conexa", nota: "Desahucio acumulado a reclamación de rentas: la cuantía es la de la acción de mayor valor."}
      - {norma: "LEC", articulo: "21", apartado: "3", tipo: "conexa", nota: "Allanamiento por el compromiso del 437.3: si no desaloja en plazo, lanzamiento sin más trámite ni notificación."}
      - {norma: "LAU", articulo: "27", apartado: "2.a)", tipo: "regula", nota: "Resolución de pleno derecho por falta de pago de la renta o de cantidades asumidas por el arrendatario."}
      - {norma: "LAU", articulo: "27", apartado: "4", tipo: "conexa", nota: "Arrendamiento inscrito con pacto resolutorio: resuelve el requerimiento judicial o notarial no contestado en diez días."}
      - {norma: "CC", articulo: "1555", apartado: "1.º", tipo: "conexa", nota: "Obligación del arrendatario de pagar el precio en los términos convenidos."}
      - {norma: "CC", articulo: "1569", apartado: "2.ª", tipo: "conexa", nota: "Falta de pago del precio como causa de desahucio en el régimen del Código Civil."}
    no_consta_en_norma:
      - "Qué «cantidades debidas» o «asimiladas» (suministros, IBI, comunidad) permiten el desahucio: la LEC no las enumera."
      - "Medio válido del requerimiento fehaciente de 30 días que impide enervar (burofax, notario, correo electrónico): el 22.4 no lo precisa."
    fuera_de_la_herramienta:
      - "RDL 29/2026, art. 2 (pendiente de convalidación): suspensión del proceso si el demandado es vulnerable y sin alternativa habitacional, hasta el 31-12-2030."
      - "RDL 29/2026, disp. trans. 2.ª: aplica el art. 2 y el nuevo 22.6 LEC a las ejecuciones en curso sin lanzamiento practicado."
    afines: ["Enervación del desahucio", "Vulnerabilidad y gran tenedor en la demanda", "Desahucio por expiración del plazo", "Lanzamiento", "Resolución del contrato por incumplimiento"]
    # VIGENCIA: LEC 22 cambia el 08-10-2026 (nuevo 22.6; 22.1 a 22.5 idénticos) y la LAU cambia en bloque (27.2.a y 27.4 idénticos; cambia el 27.2.f). Provisional hasta que el espejo traiga el RDL 29/2026.
    estado: "provisional"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Desahucio por expiración del plazo"
    sinonimos: ["desahucio por fin de contrato", "expiración del término", "extinción del plazo contractual", "fin del alquiler de temporada", "no renovación del contrato", "desahucio por vencimiento"]
    normas_base: ["LEC", "LAU", "CC"]
    remisiones:
      - {norma: "LEC", articulo: "250", apartado: "1.1.º", tipo: "regula", nota: "Juicio verbal: recuperar la finca arrendada por expiración del plazo fijado contractual o legalmente."}
      - {norma: "LEC", articulo: "52", apartado: "1.7.º", tipo: "regula", nota: "Fuero imperativo: tribunal del lugar de la finca (art. 54.1)."}
      - {norma: "LEC", articulo: "437", apartado: "3", tipo: "regula", nota: "Compromiso de condonar deuda y costas condicionado al desalojo voluntario: cabe también por expiración."}
      - {norma: "LEC", articulo: "437", apartado: "4.3.ª", tipo: "regula", nota: "Acumulación de rentas vencidas y de la acción contra el fiador o avalista solidario requerido."}
      - {norma: "LEC", articulo: "439", apartado: "6", tipo: "regula", nota: "Si es vivienda: decir si es habitual del ocupante y si el actor es gran tenedor."}
      - {norma: "LEC", articulo: "441", apartado: "5", tipo: "regula", nota: "Vivienda habitual del demandado: aviso a servicios sociales y posible suspensión por vulnerabilidad."}
      - {norma: "LEC", articulo: "438", apartado: "6", tipo: "regula", nota: "En todo desahucio: si no comparece, desahucio sin más trámites; fecha de lanzamiento en la resolución."}
      - {norma: "LEC", articulo: "164", apartado: "párrafo 3.º", tipo: "regula", nota: "Arrendatario no hallado en los domicilios del 155.3 ni otro comunicado: edictos sin más trámites."}
      - {norma: "LEC", articulo: "447", apartado: "2", tipo: "regula", nota: "Sin cosa juzgada sobre el desahucio; sí la tienen los pronunciamientos sobre rentas y frente al fiador."}
      - {norma: "LEC", articulo: "549", apartado: "4", tipo: "regula", nota: "Sin plazo de espera de veinte días; si es vivienda habitual, antes del lanzamiento, trámite del 441.5 a 7."}
      - {norma: "LEC", articulo: "703", apartado: "1", tipo: "conexa", nota: "Lanzamiento: basta un funcionario Gestor; las cosas no retiradas en plazo se tienen por abandonadas."}
      - {norma: "LAU", articulo: "9", apartado: "1", tipo: "regula", nota: "Prórroga obligatoria anual hasta cinco años (siete si el arrendador es persona jurídica), salvo preaviso del inquilino."}
      - {norma: "LAU", articulo: "9", apartado: "3", tipo: "regula", nota: "Necesidad del arrendador persona física pactada en el contrato: tras el primer año, preaviso de dos meses."}
      - {norma: "LAU", articulo: "9 bis", tipo: "regula", nota: "Vivienda temporal: más de 31 días y, como regla, hasta 12 meses. El espejo dice «sin efecto»; rige desde 08-10-2026."}
      - {norma: "LAU", articulo: "10", apartado: "1", tipo: "regula", nota: "Tras 5 o 7 años, prórroga anual hasta tres más si nadie preavisa (arrendador, 4 meses). Cambia el 15-11-2026."}
      - {norma: "LAU", articulo: "10", apartado: "2", tipo: "conexa", nota: "Prórroga extraordinaria de un año al vulnerable que la pida; obligatoria si el arrendador es gran tenedor."}
      - {norma: "LAU", articulo: "10", apartado: "3", tipo: "conexa", nota: "Zona tensionada: prórroga extraordinaria anual, hasta tres años, a solicitud del arrendatario."}
      - {norma: "LAU", articulo: "dt 8", tipo: "regula", nota: "Temporada anterior al 08-10-2026: se extingue al fin del plazo pactado, sin prórroga. El espejo dice «sin efecto»."}
      - {norma: "CC", articulo: "1565", tipo: "regula", nota: "Arrendamiento por tiempo determinado: concluye el día prefijado sin necesidad de requerimiento."}
      - {norma: "CC", articulo: "1566", tipo: "regula", nota: "Tácita reconducción si sigue quince días con aquiescencia del arrendador, salvo requerimiento previo."}
      - {norma: "CC", articulo: "1581", tipo: "conexa", nota: "Sin plazo pactado: por años, meses o días según se fije la renta; cesa cumplido el término."}
      - {norma: "CC", articulo: "1569", apartado: "1.ª", tipo: "regula", nota: "Expiración del término como causa de desahucio en el régimen del Código Civil."}
    no_consta_en_norma:
      - "Si cabe demandar antes del vencimiento para que el desahucio surta efecto a su llegada: la LEC no lo regula."
      - "Si la comunicación de no renovar excluye la tácita reconducción del 1566 CC: el texto exige «requerimiento» sin definirlo."
    fuera_de_la_herramienta:
      - "RDL 29/2026, disp. final 5.ª (pendiente de convalidación): prórroga extraordinaria de hasta dos años al arrendatario al corriente de pago."
      - "RDL 28/2026 (vigor 15-11-2026, pendiente de convalidación): nuevo art. 10 LAU, prórrogas de 5 o 7 años, preaviso de 6 meses e indemnización."
    vigilar:
      - {norma: "LAU", articulo: "2"}
      - {norma: "LAU", articulo: "3"}
    afines: ["Desahucio por falta de pago", "Duración y prórroga del arrendamiento de vivienda", "Tácita reconducción", "Arrendamiento de temporada y para uso distinto de vivienda", "Lanzamiento"]
    # VIGENCIA: LAU 9 (añade 9.4), 9 bis y dt 8 (en el espejo «sin efecto») según la API vigente desde 08-10-2026; LAU 10 tiene versión con vigencia 15-11-2026 que la API publica con fecha_vigencia vacía. Provisional.
    estado: "provisional"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Vulnerabilidad y gran tenedor en la demanda"
    sinonimos: ["gran tenedor", "gran tenedora de vivienda", "vulnerabilidad económica", "vulnerabilidad social", "servicios sociales en el desahucio", "suspensión del lanzamiento por vulnerabilidad"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "439", apartado: "6", tipo: "regula", nota: "Demandas para recuperar finca (250.1.1.º, 2.º, 4.º y 7.º): indicar si es vivienda habitual del ocupante."}
      - {norma: "LEC", articulo: "439", apartado: "6.b)", tipo: "regula", nota: "Indicar si el actor es gran tenedor (art. 3.k Ley 12/2023); si lo niega, certificación registral de sus propiedades."}
      - {norma: "LEC", articulo: "439", apartado: "7", tipo: "conexa", nota: "Los apartados 6.c) y 7 están anulados por la STC 26/2025, de 29 de enero (nota del espejo)."}
      - {norma: "LEC", articulo: "441", apartado: "5", tipo: "regula", nota: "Vivienda habitual: el decreto informa de los servicios sociales y el juzgado les comunica de oficio el proceso."}
      - {norma: "LEC", articulo: "441", apartado: "5, párrafo 3.º", tipo: "regula", nota: "Si la Administración confirma la vulnerabilidad, lo notifica al juzgado en diez días como máximo."}
      - {norma: "LEC", articulo: "441", apartado: "5, párrafo 4.º", tipo: "regula", nota: "Actor gran tenedor: el oficio lo hace constar. Remite al 439.6 y 7, aunque el 439.7 está anulado."}
      - {norma: "LEC", articulo: "441", apartado: "5, párrafo 5.º", tipo: "regula", nota: "Traslado a las partes por cinco días; se suspende la vista o el lanzamiento si las fechas son inmediatas."}
      - {norma: "LEC", articulo: "441", apartado: "6", tipo: "regula", nota: "Auto de suspensión: máximo dos meses si el actor es persona física, cuatro si es jurídica."}
      - {norma: "LEC", articulo: "441", apartado: "7", tipo: "regula", nota: "Ponderación, también de la vulnerabilidad del actor; umbrales de renta e IPREM y vulnerabilidad social."}
      - {norma: "LEC", articulo: "549", apartado: "4, párrafo 2.º", tipo: "regula", nota: "Vivienda habitual: antes del lanzamiento debe haberse seguido el trámite del 441.5 a 7."}
      - {norma: "LEC", articulo: "150", apartado: "4", tipo: "regula", nota: "La notificación que fija el lanzamiento de una vivienda se traslada a los servicios sociales."}
      - {norma: "LEC", articulo: "686", apartado: "1", tipo: "conexa", nota: "Ejecución hipotecaria: el requerimiento de pago incluye las indicaciones del 441.5, con iguales efectos."}
      - {norma: "LEC", articulo: "685", apartado: "2", tipo: "regula", nota: "Desde 08-10-2026 (RDL 29/2026, aún no en el espejo): la demanda hipotecaria dice si hay vivienda habitual y gran tenedor."}
      - {norma: "LEC", articulo: "22", tipo: "conexa", nota: "Desde 08-10-2026, nuevo 22.6 (RDL 29/2026), aún no en el espejo: la Administración enerva si el inquilino es vulnerable."}
      - {norma: "LEC", articulo: "704", apartado: "1", tipo: "conexa", nota: "Entrega de la vivienda habitual del ejecutado: un mes para desalojar, prorrogable otro con motivo fundado."}
    no_consta_en_norma:
      - "Si la omisión de las indicaciones del 439.6 es subsanable antes de inadmitir: la norma dice «no se admitirán» y no lo aclara."
      - "Qué efecto tiene la remisión del 441.5 a los apartados 6.c) y 7 del 439, anulados: el texto no se ha adaptado."
    fuera_de_la_herramienta:
      - "Ley 12/2023, art. 3.k): concepto de gran tenedor (más de diez inmuebles residenciales o 1.500 m²), reformado por el RDL 29/2026."
      - "RDL 29/2026, art. 2 (pendiente de convalidación): suspensión del proceso con demandado vulnerable sin alternativa habitacional, hasta el 31-12-2030."
      - "Ley 39/2006, art. 2.2: concepto de persona dependiente al que remite el 441.7 LEC."
    afines: ["Desahucio por falta de pago", "Desahucio por precario", "Ocupación ilegal de vivienda (desahucio exprés)", "Lanzamiento", "Ejecución hipotecaria: especialidades"]
    # VIGENCIA: cita LEC 685 y 22, cambiados el 08-10-2026 por el RDL 29/2026 (texto leído en la API). 439 y 441 idénticos en espejo y boe.es. Provisional.
    estado: "provisional"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Ocupación ilegal de vivienda (desahucio exprés)"
    sinonimos: ["okupación", "okupas", "desahucio exprés", "recuperación inmediata de la posesión de la vivienda", "ignorados ocupantes", "usurpación de vivienda"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "250", apartado: "1.4.º, párrafo 2.º", tipo: "regula", nota: "Solo persona física propietaria o poseedora legítima, entidades sin ánimo de lucro y entes públicos de vivienda social."}
      - {norma: "LEC", articulo: "437", apartado: "3 bis", tipo: "regula", nota: "Demanda contra los desconocidos ocupantes; se acompaña el título en que se funda el derecho a poseer."}
      - {norma: "LEC", articulo: "441", apartado: "1 bis", tipo: "regula", nota: "Notificación a quien habite la vivienda y a ignorados ocupantes; puede ir acompañada de los agentes de la autoridad."}
      - {norma: "LEC", articulo: "441", apartado: "1 bis, párrafo 2.º", tipo: "regula", nota: "Si se pide la entrega inmediata, el decreto de admisión requiere a los ocupantes que aporten título en cinco días."}
      - {norma: "LEC", articulo: "441", apartado: "1 bis, párrafo 3.º", tipo: "regula", nota: "Sin título bastante: auto de desalojo e inmediata entrega; si se identifica a los ocupantes, trámite del 441.5 a 7."}
      - {norma: "LEC", articulo: "441", apartado: "1 bis, párrafo 4.º", tipo: "regula", nota: "Contra el auto del incidente no cabe recurso; se cumple contra cualquier ocupante que esté en la vivienda."}
      - {norma: "LEC", articulo: "444", apartado: "1 bis", tipo: "regula", nota: "Oposición solo por título suficiente frente al actor para poseer o por falta de título del actor."}
      - {norma: "LEC", articulo: "438", apartado: "7", tipo: "regula", nota: "Si no contestan en plazo, sentencia de inmediato; se ejecuta sin esperar los veinte días del art. 548."}
      - {norma: "LEC", articulo: "439", apartado: "1", tipo: "regula", nota: "Inadmisión de la demanda posesoria interpuesta pasado un año desde el despojo."}
      - {norma: "LEC", articulo: "439", apartado: "6", tipo: "regula", nota: "Requisitos de la demanda (250.1.4.º): si es vivienda habitual del ocupante y si el actor es gran tenedor."}
      - {norma: "LEC", articulo: "441", apartado: "5", tipo: "regula", nota: "Vivienda habitual del demandado: información y aviso de oficio a servicios sociales; posible suspensión."}
      - {norma: "LEC", articulo: "447", apartado: "2", tipo: "regula", nota: "La sentencia de tutela sumaria de la posesión no produce cosa juzgada."}
      - {norma: "LEC", articulo: "150", apartado: "4", tipo: "conexa", nota: "La notificación que fija el lanzamiento de una vivienda se traslada a los servicios sociales."}
      - {norma: "LEC", articulo: "704", apartado: "2", tipo: "conexa", nota: "Ocupantes distintos del ejecutado: diez días para presentar título; el ejecutante puede pedir su lanzamiento."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "2.e)", tipo: "regula", nota: "La tutela sumaria de la posesión está exceptuada del MASC previo: no hace falta negociar con el ocupante."}
    no_consta_en_norma:
      - "Ocupación consentida en origen (inquilino o precarista que no se va): el 250.1.4.º exige privación «sin su consentimiento»; el encaje es interpretativo."
    fuera_de_la_herramienta:
      - "Código Penal, arts. 202 (allanamiento de morada) y 245 (usurpación), y su cauce en la LECrim: no están en la herramienta."
      - "RDL 29/2026, art. 2 (pendiente de convalidación): suspensión con demandado vulnerable sin alternativa; si alcanza a esta vía no lo precisa."
    afines: ["Tutela sumaria de la posesión", "Desahucio por precario", "Vulnerabilidad y gran tenedor en la demanda", "Lanzamiento", "Inviolabilidad del domicilio en la ejecución y el lanzamiento"]
    # VERIFICADO: la persona jurídica mercantil no figura entre los legitimados del 250.1.4.º, párrafo 2.º; le queda el 250.1.4.º general o el precario.
    estado: "vigente"
