  - voz: "Ámbito del juicio verbal por materia y cuantía"
    sinonimos: ["juicio verbal", "verbal por razón de la materia", "verbal por razón de la cuantía", "límite de 15.000 euros", "clase de juicio", "verbal u ordinario"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "248", apartado: "2", tipo: "regula", nota: "Dos procesos declarativos: el juicio ordinario y el juicio verbal."}
      - {norma: "LEC", articulo: "248", apartado: "3", tipo: "regula", nota: "La cuantía solo decide la clase de juicio en defecto de norma por razón de la materia."}
      - {norma: "LEC", articulo: "250", apartado: "1", tipo: "regula", nota: "Verbal sea cual sea la cuantía: desahucios, precario, posesión, alimentos, cesación de consumo, división de cosa común…"}
      - {norma: "LEC", articulo: "250", apartado: "1.15.º", tipo: "regula", nota: "Acciones de la LPH exclusivamente de reclamación de cantidad: verbal, sea cual fuere la cantidad."}
      - {norma: "LEC", articulo: "250", apartado: "2", tipo: "regula", nota: "Por cuantía: verbal hasta 15.000 euros, si la materia no está en el art. 249.1."}
      - {norma: "LEC", articulo: "249", apartado: "1", tipo: "regula", nota: "Ordinario sea cual sea la cuantía: honor, acuerdos sociales, retracto, arrendamientos y PH salvo las excepciones."}
      - {norma: "LEC", articulo: "249", apartado: "2", tipo: "regula", nota: "Ordinario si la cuantía excede de 15.000 euros o el interés económico es imposible de calcular."}
      - {norma: "LEC", articulo: "251", tipo: "regula", nota: "Reglas para fijar la cuantía según el interés económico de la demanda (dinero, bienes, arrendamientos…)."}
      - {norma: "LEC", articulo: "252", tipo: "regula", nota: "Cuantía con pluralidad de objetos o partes; la reconvención y la acumulación de autos no la alteran (regla 5.ª)."}
      - {norma: "LEC", articulo: "253", apartado: "3", tipo: "regula", nota: "Si no puede fijarse la cuantía ni en forma relativa, se sigue el juicio ordinario."}
      - {norma: "LEC", articulo: "437", apartado: "4", tipo: "regula", nota: "Acumulación objetiva de acciones en el verbal: prohibida salvo las cuatro excepciones tasadas."}
      - {norma: "LEC", articulo: "438", apartado: "2", tipo: "conexa", nota: "Sin reconvención en verbales sin cosa juzgada; en los demás, conexa y sin hacer improcedente el verbal."}
      - {norma: "LEC", articulo: "23", apartado: "2.1.º", tipo: "conexa", nota: "Sin procurador en verbales determinados por cuantía que no exceda de 2.000 euros."}
      - {norma: "LEC", articulo: "31", apartado: "2.1.º", tipo: "conexa", nota: "Sin abogado en verbales determinados por cuantía que no exceda de 2.000 euros."}
      - {norma: "LEC", articulo: "455", apartado: "1", tipo: "conexa", nota: "No son apelables las sentencias de verbales por razón de la cuantía que no supere 3.000 euros."}
      - {norma: "LEC", articulo: "447", apartado: "2", tipo: "conexa", nota: "Sin cosa juzgada: tutela sumaria de la posesión y desahucios por impago o por expiración del plazo."}
    no_consta_en_norma: []
    afines: ["Cuantía del proceso y su impugnación", "Inadecuación de procedimiento", "Contestación escrita en el verbal y petición de vista", "Acumulación de acciones"]
    # VERIFICADO: 249.1 tiene 8 numerales y 250.1 tiene 16; el 249.1.6.º saca del ordinario las rentas y los desahucios por impago y expiración.
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Contestación escrita en el verbal y petición de vista"
    sinonimos: ["contestación en el juicio verbal", "diez días para contestar", "solicitud de vista", "verbal sin vista", "excepciones procesales en el verbal", "auto del 438.10"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "438", apartado: "1", tipo: "regula", nota: "Admitida la demanda, traslado para contestar por escrito en diez días, como en el ordinario; si no, rebeldía."}
      - {norma: "LEC", articulo: "438", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Si cabe actuar sin abogado ni procurador, el decreto lo indica y ofrece impresos normalizados para contestar."}
      - {norma: "LEC", articulo: "405", apartado: "2", tipo: "regula", nota: "Hay que admitir o negar los hechos; el silencio o la evasiva pueden valer como admisión tácita."}
      - {norma: "LEC", articulo: "405", apartado: "3", tipo: "regula", nota: "Las excepciones procesales se alegan en la contestación."}
      - {norma: "LEC", articulo: "438", apartado: "2", tipo: "regula", nota: "Reconvención: nunca en verbales sin cosa juzgada; en los demás, conexa y sin desbordar el verbal; diez días para contestarla."}
      - {norma: "LEC", articulo: "438", apartado: "3", tipo: "regula", nota: "Crédito compensable en la contestación; si excede de la cuantía del verbal, se tiene por no alegado."}
      - {norma: "LEC", articulo: "438", apartado: "8", tipo: "regula", nota: "Contestada la demanda: cinco días comunes para proponer prueba e indicar a quién citar a la vista."}
      - {norma: "LEC", articulo: "438", apartado: "8, párrafo 2.º", tipo: "regula", nota: "En esos cinco días, el actor alega sobre las excepciones procesales opuestas en la contestación."}
      - {norma: "LEC", articulo: "438", apartado: "9", tipo: "regula", nota: "Tres días desde el traslado de la proposición de prueba para impugnar documentos y dictámenes (280, 283, 287, 427)."}
      - {norma: "LEC", articulo: "438", apartado: "10", tipo: "regula", nota: "Auto sobre cuantía, excepciones procesales, prueba y pertinencia de la vista; sin vista, autos conclusos."}
      - {norma: "LEC", articulo: "438", apartado: "10, párrafo 2.º", tipo: "regula", nota: "Contra ese auto, recurso de reposición con efecto suspensivo."}
      - {norma: "LEC", articulo: "438", apartado: "10, párrafo 3.º", tipo: "regula", nota: "Sentencia sin vista si solo hay documentos no impugnados o pericias sin necesidad de oír a los peritos."}
      - {norma: "LEC", articulo: "440", tipo: "regula", nota: "Si hay vista, citación en cinco días; la vista se celebra en el plazo máximo de un mes."}
      - {norma: "LEC", articulo: "438", apartado: "4", tipo: "conexa", nota: "Derechos reales inscritos (250.1.7.º): apercibimiento de sentencia si no contesta o no presta caución."}
      - {norma: "LEC", articulo: "496", tipo: "conexa", nota: "Rebeldía del que no comparece en plazo; no equivale a allanamiento ni a admisión de hechos."}
    no_consta_en_norma:
      - "Si la petición de vista de una parte vincula al tribunal: el 438.10 le deja decidir su pertinencia y no menciona la solicitud."
    afines: ["Ámbito del juicio verbal por materia y cuantía", "Vista del juicio verbal: desarrollo e incomparecencias", "Reconvención", "Proposición de prueba", "Rebeldía del demandado"]
    # VERIFICADO: en el texto vigente la vista no depende de que la pidan las partes (438.10); el nombre de la voz recoge el uso forense.
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Vista del juicio verbal: desarrollo e incomparecencias"
    sinonimos: ["vista del verbal", "incomparecencia del demandante", "incomparecencia del demandado", "conclusiones en el verbal", "sentencia oral", "desarrollo de la vista"]
    normas_base: ["LEC"]
    remisiones:
      - {norma: "LEC", articulo: "440", apartado: "párrafo 2.º", tipo: "regula", nota: "La citación informa de la posibilidad de negociar o ir a mediación; las partes dicen su decisión en la vista o antes."}
      - {norma: "LEC", articulo: "440", apartado: "párrafo 3.º", tipo: "regula", nota: "La vista no se suspende si falta el demandado; hechos admitidos si no acude al interrogatorio admitido (304)."}
      - {norma: "LEC", articulo: "442", apartado: "1", tipo: "regula", nota: "Actor que no asiste: desistido, con costas e indemnización al demandado, salvo interés de este en la sentencia."}
      - {norma: "LEC", articulo: "442", apartado: "2", tipo: "regula", nota: "Si no comparece el demandado, se celebra el juicio."}
      - {norma: "LEC", articulo: "443", apartado: "1", tipo: "regula", nota: "Al abrir la vista se comprueba si subsiste el litigio; cabe acuerdo homologado o suspensión para un MASC."}
      - {norma: "LEC", articulo: "443", apartado: "2", tipo: "conexa", nota: "El tribunal puede proponer derivar a un MASC antes de la prueba; se suspende si todas las partes aceptan."}
      - {norma: "LEC", articulo: "443", apartado: "3", tipo: "regula", nota: "Sin acuerdo, palabra a las partes para aclaraciones y fijación de los hechos controvertidos."}
      - {norma: "LEC", articulo: "443", apartado: "4", tipo: "regula", nota: "Se practican las pruebas admitidas; la proposición puede completarse conforme al 429.1."}
      - {norma: "LEC", articulo: "429", apartado: "1", tipo: "conexa", nota: "Remisión del 443.4: el tribunal advierte la insuficiencia probatoria y las partes completan su prueba."}
      - {norma: "LEC", articulo: "445", tipo: "regula", nota: "Prueba, diligencias finales y presunciones: normas generales y arts. 435 y 436."}
      - {norma: "LEC", articulo: "446", tipo: "regula", nota: "Admisión o inadmisión de prueba en la vista: solo reposición en el acto y, si se desestima, protesta."}
      - {norma: "LEC", articulo: "447", apartado: "1", tipo: "regula", nota: "Conclusiones orales si se conceden; sentencia en diez días (cinco en desahucio de finca urbana)."}
      - {norma: "LEC", articulo: "447", apartado: "1, párrafo 2.º", tipo: "regula", nota: "Condena tras incomparecencia del demandado: lanzamiento en la fecha fijada sin más trámite."}
      - {norma: "LEC", articulo: "438", apartado: "6", tipo: "regula", nota: "Desahucio: si el demandado no comparece a la vista, desahucio sin más trámites; citado para la sentencia."}
      - {norma: "LEC", articulo: "210", apartado: "3", tipo: "regula", nota: "Sentencia oral en el verbal al concluir la vista, salvo si no interviene abogado (31.2)."}
      - {norma: "LEC", articulo: "210", apartado: "4", tipo: "regula", nota: "Sentencia oral: cinco días desde la vista para anunciar interés en recurrir; apelación desde la notificación escrita."}
    no_consta_en_norma:
      - "Qué cabe «completar» en la vista tras el auto de admisión de prueba del 438.10: la remisión al 429.1 no lo concreta."
      - "Si el demandado que llega con la vista empezada puede intervenir: el 442.2 solo dice que el juicio se celebra."
    afines: ["Contestación escrita en el verbal y petición de vista", "Pertinencia y utilidad de la prueba; protesta", "Interrogatorio de parte y ficta confessio", "Suspensión de la vista y nuevo señalamiento", "Desistimiento"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Juicio monitorio y oposición"
    sinonimos: ["proceso monitorio", "petición monitoria", "requerimiento de pago", "oposición al monitorio", "monitorio por facturas", "deuda dineraria documentada"]
    normas_base: ["LEC", "LO 1/2025"]
    remisiones:
      - {norma: "LEC", articulo: "812", apartado: "1", tipo: "regula", nota: "Deuda dineraria de cualquier importe, líquida, determinada, vencida y exigible, acreditada documentalmente."}
      - {norma: "LEC", articulo: "812", apartado: "1.2.ª", tipo: "regula", nota: "Bastan facturas, albaranes o certificaciones del acreedor si documentan habitualmente esa relación."}
      - {norma: "LEC", articulo: "812", apartado: "2.1.º", tipo: "regula", nota: "También con documentos comerciales que acrediten una relación anterior duradera."}
      - {norma: "LEC", articulo: "813", tipo: "regula", nota: "Competencia exclusiva del domicilio del deudor, sin sumisión; si se le halla en otro partido, se archiva."}
      - {norma: "LEC", articulo: "814", tipo: "regula", nota: "Petición con identidad, domicilios, origen y cuantía de la deuda; cabe impreso; sin abogado ni procurador."}
      - {norma: "LEC", articulo: "815", apartado: "1", tipo: "regula", nota: "Requerimiento: veinte días para pagar u oponerse de forma fundada y motivada; sin edictos salvo en PH."}
      - {norma: "LEC", articulo: "815", apartado: "3", tipo: "regula", nota: "Si la cantidad no es correcta o hay cláusula abusiva, el juez puede proponer un requerimiento por menos."}
      - {norma: "LEC", articulo: "816", apartado: "1", tipo: "regula", nota: "Sin pago ni oposición: decreto que termina el monitorio y ejecución sin esperar los veinte días del 548."}
      - {norma: "LEC", articulo: "816", apartado: "2", tipo: "regula", nota: "Despachada la ejecución, nadie puede reclamar luego lo mismo en ordinario; devenga el interés del art. 576."}
      - {norma: "LEC", articulo: "817", tipo: "regula", nota: "Si el deudor paga y lo acredita, archivo de las actuaciones."}
      - {norma: "LEC", articulo: "818", apartado: "1", tipo: "regula", nota: "Con oposición en plazo, juicio que corresponda con cosa juzgada; abogado y procurador según la cuantía."}
      - {norma: "LEC", articulo: "818", apartado: "1, párrafo 3.º", tipo: "regula", nota: "Oposición por pluspetición: sobre la cantidad reconocida se aplica el art. 21.2."}
      - {norma: "LEC", articulo: "818", apartado: "2", tipo: "regula", nota: "Hasta la cuantía del verbal: sigue como verbal; el actor impugna la oposición en diez días y se propone prueba."}
      - {norma: "LEC", articulo: "818", apartado: "2, párrafo 2.º", tipo: "regula", nota: "Mayor cuantía: demanda en un mes desde el traslado de la oposición o sobreseimiento con costas al acreedor."}
      - {norma: "LEC", articulo: "818", apartado: "3", tipo: "regula", nota: "Rentas de finca urbana con oposición: juicio verbal, cualquiera que sea la cuantía."}
      - {norma: "LEC", articulo: "23", apartado: "2.1.º", tipo: "conexa", nota: "La petición inicial del monitorio no requiere procurador."}
      - {norma: "LEC", articulo: "31", apartado: "2.1.º", tipo: "conexa", nota: "La petición inicial del monitorio no requiere abogado."}
      - {norma: "LEC", articulo: "21", apartado: "2", tipo: "conexa", nota: "Allanamiento parcial: auto ejecutable sobre lo reconocido, si cabe pronunciamiento separado."}
      - {norma: "LO 1/2025", articulo: "5", apartado: "2", tipo: "conexa", nota: "El monitorio es proceso del libro IV LEC y no está exceptuado (sí el cambiario): rige el MASC previo."}
    no_consta_en_norma:
      - "Si el MASC previo se exige ya para la petición monitoria o solo al pasar a declarativo: el art. 5 LO 1/2025 habla de «demanda» y no lo precisa."
    fuera_de_la_herramienta:
      - "Reglamento (CE) 1896/2006 (proceso monitorio europeo): exento del MASC (art. 5.3 LO 1/2025); no está en la herramienta."
    afines: ["Monitorio de propiedad horizontal", "Control de oficio de cláusulas abusivas en el proceso", "Ámbito del juicio verbal por materia y cuantía", "Requisito de procedibilidad (MASC)", "Oposición a la ejecución por motivos de fondo"]
    # VERIFICADO: el monitorio está en el libro IV, título III LEC; el art. 5.2.h) LO 1/2025 exceptúa solo el juicio cambiario.
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Monitorio de propiedad horizontal"
    sinonimos: ["monitorio de la comunidad de propietarios", "reclamación de cuotas de comunidad", "certificado de deuda de la comunidad", "propietario moroso", "deuda con la comunidad"]
    normas_base: ["LEC", "LPH"]
    remisiones:
      - {norma: "LEC", articulo: "812", apartado: "2.2.º", tipo: "regula", nota: "Basta la certificación de impago de gastos comunes de la comunidad de propietarios."}
      - {norma: "LEC", articulo: "813", tipo: "regula", nota: "Competente también el juzgado del lugar de la finca, a elección del solicitante; sin sumisión."}
      - {norma: "LEC", articulo: "815", apartado: "2", tipo: "regula", nota: "Notificación en el domicilio designado para la comunidad; si no, en el piso o local; si no, edictos."}
      - {norma: "LEC", articulo: "818", apartado: "2", tipo: "regula", nota: "Oposición hasta la cuantía del verbal: sigue como verbal; el actor impugna la oposición en diez días."}
      - {norma: "LEC", articulo: "250", apartado: "1.15.º", tipo: "regula", nota: "Acciones de la LPH solo de reclamación de cantidad: verbal, sea cual fuere la cantidad."}
      - {norma: "LEC", articulo: "449", apartado: "4", tipo: "regula", nota: "Para apelar la condena a pagar a la comunidad, el propietario acredita haber pagado o consignado."}
      - {norma: "LEC", articulo: "52", apartado: "1.8.º", tipo: "conexa", nota: "Juicios en materia de propiedad horizontal: tribunal del lugar de la finca."}
      - {norma: "LPH", articulo: "21", apartado: "2", tipo: "regula", nota: "Gastos ordinarios, extraordinarios y fondo de reserva; cabe demandar al titular registral para ejecutar el inmueble."}
      - {norma: "LPH", articulo: "21", apartado: "3", tipo: "regula", nota: "Certificado del acuerdo de liquidación con desglose (secretario y visto bueno del presidente) y prueba de su notificación."}
      - {norma: "LPH", articulo: "21", apartado: "4", tipo: "regula", nota: "Si el deudor se opone, embargo preventivo sin caución; el deudor puede enervarlo con garantías."}
      - {norma: "LPH", articulo: "21", apartado: "5", tipo: "regula", nota: "Honorarios de abogado y procurador del monitorio a cargo del deudor, con el límite del 394.3 LEC."}
      - {norma: "LPH", articulo: "21", apartado: "1", tipo: "conexa", nota: "Intereses desde que debió pagarse; la junta puede acordar medidas disuasorias no abusivas ni retroactivas."}
      - {norma: "LPH", articulo: "21", apartado: "6", tipo: "conexa", nota: "La reclamación de gastos y fondo de reserva admite también mediación-conciliación o arbitraje."}
      - {norma: "LPH", articulo: "9", apartado: "1.e)", tipo: "conexa", nota: "Deber de contribuir; preferencia del crédito y afección del piso: parte vencida del año y tres anteriores."}
    no_consta_en_norma:
      - "Oposición en un monitorio de PH de más de 15.000 euros: el 818.2 exige demanda nueva, pero el 250.1.15.º lo lleva siempre al verbal; el texto no lo concilia."
      - "Cómo se prueba la notificación subsidiaria en el tablón de anuncios durante tres días: la LPH no fija la forma."
    afines: ["Juicio monitorio y oposición", "Deudas con la comunidad, preferencia y afección", "Gastos comunes, cuota y fondo de reserva", "Embargo preventivo", "Legitimación del presidente"]
    # VIGENCIA: LPH 21 y 9 idénticos en espejo y boe.es; la reforma del 23-10-2026 solo toca el art. 10 y la disp. adic. 3.ª LPH, no citados.
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Control de oficio de cláusulas abusivas en el proceso"
    sinonimos: ["cláusulas abusivas de oficio", "control de abusividad", "examen de oficio de cláusulas", "abusividad en el monitorio", "abusividad en la ejecución", "consumidor y cláusula abusiva"]
