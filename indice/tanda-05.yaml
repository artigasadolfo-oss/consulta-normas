      - {norma: "LEC", articulo: "552", apartado: "4", tipo: "regula", nota: "Ejecución contra consumidor: mismo control; firme el auto, lo resuelto sobre abusividad tiene cosa juzgada."}
      - {norma: "LEC", articulo: "557", apartado: "1.7.ª", tipo: "regula", nota: "Títulos no judiciales: el ejecutado puede oponerse porque el título contiene cláusulas abusivas."}
      - {norma: "LEC", articulo: "561", apartado: "2", tipo: "regula", nota: "Apreciada la abusividad: improcedencia de la ejecución o despacho sin las cláusulas; cosa juzgada al ser firme."}
      - {norma: "LEC", articulo: "695", apartado: "1.4.ª", tipo: "regula", nota: "Ejecución hipotecaria: oposición por abusiva la cláusula que funda la ejecución o fija la cantidad exigible."}
