      - {norma: "CC", articulo: "7", apartado: "2", tipo: "conexa", nota: "La ley no ampara el abuso del derecho ni su ejercicio antisocial; indemnización y medidas de cesación."}
      - {norma: "TRLGDCU", articulo: "10", tipo: "conexa", nota: "Es nula la renuncia previa a los derechos del consumidor y los actos en fraude de ley según el art. 6 CC."}
