      - {norma: "CC", articulo: "6", apartado: "4", tipo: "regula", nota: "Actos amparados en una norma que persiguen un resultado prohibido: fraude de ley; se aplica la norma eludida."}
      - {norma: "CC", articulo: "6", apartado: "2", tipo: "regula", nota: "Excluir la ley o renunciar a derechos solo vale si no contraría el interés u orden público ni perjudica a terceros."}
      - {norma: "CC", articulo: "6", apartado: "1", tipo: "conexa", nota: "La ignorancia de las leyes no excusa; el error de derecho solo produce los efectos que las leyes fijen."}
      - {norma: "CC", articulo: "12", apartado: "4", tipo: "regula", nota: "Es fraude de ley usar una norma de conflicto para eludir una ley imperativa española."}
      - {norma: "CC", articulo: "12", apartado: "3", tipo: "conexa", nota: "No se aplica la ley extranjera contraria al orden público."}
      - {norma: "CC", articulo: "1255", tipo: "regula", nota: "La autonomía de la voluntad tiene por límite las leyes, la moral y el orden público."}
      - {norma: "CC", articulo: "1275", tipo: "regula", nota: "El contrato con causa ilícita (contraria a las leyes o a la moral) no produce efecto alguno."}
      - {norma: "CC", articulo: "1116", tipo: "conexa", nota: "Las condiciones prohibidas por la ley anulan la obligación que de ellas dependa."}
      - {norma: "CC", articulo: "1271", apartado: "párrafo 3.º", tipo: "conexa", nota: "Solo pueden ser objeto de contrato los servicios no contrarios a las leyes o a las buenas costumbres."}
      - {norma: "CC", articulo: "1102", tipo: "conexa", nota: "Es nula la renuncia a la acción para exigir la responsabilidad por dolo."}
      - {norma: "CC", articulo: "1303", tipo: "conexa", nota: "Declarada la nulidad, restitución recíproca de las cosas con sus frutos y del precio con sus intereses."}
      - {norma: "CC", articulo: "1305", tipo: "regula", nota: "Objeto o causa ilícitos constitutivos de delito de ambos: sin acción entre sí; si solo de uno, el otro recupera."}
