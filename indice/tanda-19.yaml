  - voz: "Fraude de ley y actos contrarios a normas imperativas"
    sinonimos: ["fraude de ley", "norma de cobertura", "norma defraudada", "actos contrarios a normas imperativas", "nulidad de pleno derecho", "nulidad radical", "contrato contra legem", "orden público", "renuncia de derechos", "exclusión voluntaria de la ley aplicable", "fraude de ley en derecho internacional privado", "causa ilícita", "renuncia previa del consumidor"]
