# Índice de conceptos de «Consulta de normas» — tanda 19 (prioridad B: voces 216 a 227, bloque 12 de obligaciones y contratos)
# Revisor: armero. Espejo: legalize-es@aca28304d, leído con `git show aca28304d:es/…` (no el árbol de trabajo, que hoy trae erratas).
# Todo precepto citado se ha leído en el espejo en esta pasada. Vigencia: contraste con la API de boe.es (08-10-2026).
# Ver tanda-19-notas.md.

voces:
  - voz: "Pago: prueba, imputación y pago por tercero"
    sinonimos: ["prueba del pago", "carga de la prueba del pago", "recibo", "recibo sin reserva de intereses", "imputación de pagos", "pago parcial", "pago por tercero", "reembolso del tercero que paga", "pago al acreedor aparente", "lugar del pago", "pago con pagaré o letra", "dación en pago", "cesión de bienes en pago"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1157", tipo: "regula", nota: "Solo hay pago cuando se entrega por completo la cosa o se hace por completo la prestación debida."}
      - {norma: "CC", articulo: "1156", tipo: "conexa", nota: "El pago o cumplimiento es la primera de las causas de extinción de las obligaciones."}
      - {norma: "LEC", articulo: "217", apartado: "3", tipo: "regula", nota: "Al demandado le incumbe probar los hechos que extinguen la eficacia de los del actor, como el pago."}
      - {norma: "LEC", articulo: "217", apartado: "7", tipo: "conexa", nota: "El tribunal tiene en cuenta la disponibilidad y facilidad probatoria de cada parte."}
      - {norma: "CC", articulo: "1110", tipo: "regula", nota: "El recibo del capital sin reserva extingue los intereses; el del último plazo sin reserva, los plazos anteriores."}
      - {norma: "CC", articulo: "1229", tipo: "conexa", nota: "La nota del acreedor al margen o al dorso del título o del recibo hace prueba a favor del deudor."}
      - {norma: "CC", articulo: "1188", tipo: "conexa", nota: "La entrega voluntaria al deudor del documento privado del crédito implica renuncia a la acción."}
      - {norma: "CC", articulo: "1189", tipo: "conexa", nota: "Si el documento privado de la deuda está en poder del deudor, se presume entregado voluntariamente."}
      - {norma: "CC", articulo: "1158", tipo: "regula", nota: "Puede pagar cualquier persona, tenga o no interés, lo conozca y apruebe el deudor o lo ignore."}
      - {norma: "CC", articulo: "1158", apartado: "párrafo 2.º", tipo: "regula", nota: "Quien paga por cuenta de otro le reclama lo pagado, salvo que pagara contra su expresa voluntad."}
      - {norma: "CC", articulo: "1158", apartado: "párrafo 3.º", tipo: "regula", nota: "Si pagó contra su voluntad, solo repite aquello en que el pago le fue útil al deudor."}
      - {norma: "CC", articulo: "1159", tipo: "regula", nota: "Quien paga en nombre del deudor ignorándolo este no puede obligar al acreedor a subrogarle."}
      - {norma: "CC", articulo: "1210", tipo: "conexa", nota: "Se presume subrogación si paga un acreedor preferente, un tercero con aprobación del deudor o un interesado."}
      - {norma: "CC", articulo: "1162", tipo: "regula", nota: "Se paga al acreedor o a otra persona autorizada para recibir en su nombre."}
      - {norma: "CC", articulo: "1163", apartado: "párrafo 2.º", tipo: "regula", nota: "El pago hecho a un tercero vale en cuanto se convirtió en utilidad del acreedor."}
      - {norma: "CC", articulo: "1164", tipo: "regula", nota: "El pago de buena fe al que está en posesión del crédito libera al deudor."}
      - {norma: "CC", articulo: "1165", tipo: "conexa", nota: "No vale el pago al acreedor hecho después de ordenada judicialmente la retención de la deuda."}
      - {norma: "CC", articulo: "1166", tipo: "regula", nota: "No se puede obligar al acreedor a recibir cosa distinta de la debida, aunque valga igual o más."}
      - {norma: "CC", articulo: "1169", tipo: "regula", nota: "Salvo pacto, no cabe imponer el pago parcial; sí el de la parte líquida sin esperar a la ilíquida."}
      - {norma: "CC", articulo: "1170", apartado: "párrafo 2.º", tipo: "regula", nota: "Pagarés y letras solo pagan cuando se cobran o se perjudican por culpa del acreedor; entretanto, acción en suspenso."}
      - {norma: "CC", articulo: "1171", tipo: "conexa", nota: "Lugar del pago: el pactado; si no, donde estaba la cosa determinada; en otro caso, domicilio del deudor."}
      - {norma: "CC", articulo: "1168", tipo: "conexa", nota: "Los gastos extrajudiciales del pago son del deudor; los judiciales, según la LEC."}
      - {norma: "CC", articulo: "1172", tipo: "regula", nota: "Con varias deudas de la misma especie, el deudor declara al pagar a cuál se aplica."}
      - {norma: "CC", articulo: "1172", apartado: "párrafo 2.º", tipo: "regula", nota: "Si acepta un recibo con la imputación hecha por el acreedor, no puede impugnarla salvo causa de invalidez."}
      - {norma: "CC", articulo: "1173", tipo: "regula", nota: "Si la deuda produce interés, no se imputa a capital mientras no estén cubiertos los intereses."}
      - {norma: "CC", articulo: "1174", tipo: "regula", nota: "Sin imputación, se aplica a la deuda vencida más onerosa; si son de igual gravamen, a prorrata."}
      - {norma: "CC", articulo: "1175", tipo: "conexa", nota: "La cesión de bienes a los acreedores solo libera, salvo pacto, por el importe líquido de lo cedido."}
      - {norma: "CC", articulo: "1900", tipo: "conexa", nota: "En el cobro de lo indebido, la prueba del pago incumbe a quien pretende haberlo hecho."}
    no_consta_en_norma:
      - "Dación en pago (el acreedor acepta cosa distinta): no regulada como figura general en el CC; jurisprudencial."
      - "Valor de la transferencia o del extracto bancario sin concepto como prueba del pago: casuística."
      - "Imputación pactada en contratos de préstamo con consumidores (orden intereses-capital): jurisprudencial."
    afines: ["Ofrecimiento de pago y consignación", "Carga de la prueba", "Compensación y nulidad alegadas por el demandado", "Mora del deudor e intereses moratorios", "Cesión de créditos y retracto de crédito litigioso", "Enriquecimiento injusto y cobro de lo indebido", "Oposición a la ejecución por motivos de fondo"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Fuerza mayor y caso fortuito"
    sinonimos: ["caso fortuito", "fuerza mayor", "suceso imprevisible o inevitable", "exoneración del deudor", "imposibilidad sobrevenida de la prestación", "pérdida de la cosa debida", "riesgo de la cosa", "caso fortuito del deudor moroso", "pacto de asunción del caso fortuito", "fuerza mayor extraña a la conducción", "pandemia y cumplimiento", "presunción de culpa por pérdida de la cosa"]
    normas_base: ["CC", "LOE"]
    remisiones:
      - {norma: "CC", articulo: "1105", tipo: "regula", nota: "Nadie responde de sucesos imprevisibles o, previstos, inevitables, salvo que la ley o la obligación lo digan."}
      - {norma: "CC", articulo: "1096", apartado: "párrafo 3.º", tipo: "regula", nota: "El deudor moroso, o que se obligó a entregar lo mismo a varios, carga con el caso fortuito hasta la entrega."}
      - {norma: "CC", articulo: "1182", tipo: "regula", nota: "La pérdida de la cosa determinada sin culpa y antes de la mora extingue la obligación."}
      - {norma: "CC", articulo: "1183", tipo: "regula", nota: "La pérdida en poder del deudor se presume culpable y no fortuita, salvo prueba en contrario."}
      - {norma: "CC", articulo: "1184", tipo: "regula", nota: "En las obligaciones de hacer, libera la imposibilidad legal o física sobrevenida de la prestación."}
      - {norma: "CC", articulo: "1185", tipo: "conexa", nota: "Deuda procedente de delito: la pérdida no libera, salvo que el acreedor rehusara sin razón la cosa ofrecida."}
      - {norma: "CC", articulo: "1186", tipo: "conexa", nota: "Extinguida la obligación por pérdida, pasan al acreedor las acciones del deudor contra terceros."}
      - {norma: "CC", articulo: "1104", tipo: "conexa", nota: "Culpa es omitir la diligencia que exige la obligación según personas, tiempo y lugar; si no, la del buen padre de familia."}
      - {norma: "CC", articulo: "1122", apartado: "1.ª", tipo: "conexa", nota: "Pendiente la condición suspensiva, la pérdida de la cosa sin culpa del deudor extingue la obligación."}
      - {norma: "CC", articulo: "1575", apartado: "párrafo 2.º", tipo: "conexa", nota: "Ejemplos legales de caso fortuito extraordinario: incendio, guerra, peste, inundación insólita, terremoto."}
      - {norma: "CC", articulo: "1589", tipo: "conexa", nota: "El contratista que pone el material soporta la destrucción de la obra antes de entregarla, salvo mora en recibirla."}
      - {norma: "CC", articulo: "1602", tipo: "conexa", nota: "Los porteadores responden de pérdidas y averías salvo que prueben caso fortuito o fuerza mayor."}
      - {norma: "CC", articulo: "1784", tipo: "conexa", nota: "El posadero responde de los efectos del viajero, salvo robo a mano armada u otra fuerza mayor."}
      - {norma: "CC", articulo: "1891", tipo: "conexa", nota: "El gestor de negocios responde del caso fortuito en operaciones arriesgadas o si antepuso su interés."}
      - {norma: "CC", articulo: "1896", apartado: "párrafo 2.º", tipo: "conexa", nota: "Quien cobró lo indebido de mala fe responde de menoscabos por cualquier causa, salvo fortuito que igual habría sufrido la cosa."}
      - {norma: "CC", articulo: "1905", tipo: "conexa", nota: "El poseedor del animal solo se exonera por fuerza mayor o culpa de quien sufrió el daño."}
      - {norma: "CC", articulo: "1908", apartado: "3.º", tipo: "conexa", nota: "El propietario responde de la caída de árboles en sitios de tránsito, salvo fuerza mayor."}
      - {norma: "LOE", articulo: "17", apartado: "8", tipo: "conexa", nota: "Los agentes de la edificación no responden si prueban caso fortuito, fuerza mayor, acto de tercero o del perjudicado."}
    no_consta_en_norma:
      - "Distinción entre caso fortuito y fuerza mayor (suceso interno o ajeno a la actividad): doctrinal y jurisprudencial."
      - "Cláusula rebus sic stantibus y alteración extraordinaria de las circunstancias: no consta en norma; jurisprudencial."
      - "Pandemias, restricciones administrativas o huelgas como fuerza mayor: casuística."
      - "Validez de las cláusulas que trasladan el caso fortuito al deudor (1105 «así lo declare la obligación»): casuística."
    fuera_de_la_herramienta:
      - "RDLeg 8/2004 (responsabilidad civil y seguro de vehículos), art. 1.1: en daños personales, exonera la fuerza mayor extraña a la conducción."
    afines: ["Daños y perjuicios por incumplimiento contractual", "Incumplimiento y facultad resolutoria (art. 1124)", "Mora del deudor e intereses moratorios", "Responsabilidad extracontractual", "Daños causados por animales, edificios y cosas", "Responsabilidad de los agentes: plazos de 10, 3 y 1 año"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Cesión de créditos y retracto de crédito litigioso"
    sinonimos: ["cesión de crédito", "venta de crédito", "cesionario", "notificación de la cesión al deudor", "pago al cedente", "compra de deuda por fondos", "crédito litigioso", "retracto de crédito litigioso", "extinción del crédito litigioso por el deudor", "plazo de nueve días", "responsabilidad del cedente", "sucesión procesal del cesionario", "compensación frente al cesionario"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1112", tipo: "regula", nota: "Los derechos nacidos de una obligación son transmisibles con sujeción a las leyes, salvo pacto en contrario."}
      - {norma: "CC", articulo: "1526", tipo: "regula", nota: "Frente a terceros, la cesión surte efecto desde su fecha cierta (1218 y 1227); si es de inmueble, desde la inscripción."}
      - {norma: "CC", articulo: "1527", tipo: "regula", nota: "El deudor que paga al cedente antes de conocer la cesión queda liberado."}
      - {norma: "CC", articulo: "1528", tipo: "regula", nota: "La cesión comprende los derechos accesorios: fianza, hipoteca, prenda o privilegio."}
      - {norma: "CC", articulo: "1529", tipo: "regula", nota: "El cedente de buena fe responde de la existencia y legitimidad del crédito; de la solvencia, si se pactó o era anterior y pública."}
      - {norma: "CC", articulo: "1529", apartado: "párrafo 3.º", tipo: "conexa", nota: "El cedente de mala fe responde siempre de los gastos y de los daños y perjuicios."}
      - {norma: "CC", articulo: "1530", tipo: "conexa", nota: "Garantía de solvencia sin plazo pactado: un año desde la cesión o desde el vencimiento del crédito."}
      - {norma: "CC", articulo: "1535", tipo: "regula", nota: "Vendido un crédito litigioso, el deudor lo extingue reembolsando el precio pagado, las costas y sus intereses."}
      - {norma: "CC", articulo: "1535", apartado: "párrafo 2.º", tipo: "regula", nota: "El crédito es litigioso desde que se contesta a la demanda relativa a él."}
      - {norma: "CC", articulo: "1535", apartado: "párrafo 3.º", tipo: "regula", nota: "El deudor ejercita el derecho en nueve días desde que el cesionario le reclama el pago."}
      - {norma: "CC", articulo: "1536", tipo: "regula", nota: "No cabe si se cede a un coheredero o condueño, a un acreedor en pago o al poseedor de la finca afectada."}
      - {norma: "CC", articulo: "1198", tipo: "regula", nota: "Compensación frente al cesionario según el deudor consintiera la cesión, la conociera o la ignorara."}
      - {norma: "CC", articulo: "1280", apartado: "6.º", tipo: "conexa", nota: "Constará en documento público la cesión de derechos procedentes de un acto en escritura pública."}
      - {norma: "CC", articulo: "1218", tipo: "conexa", nota: "El documento público prueba frente a terceros el hecho que motiva su otorgamiento y su fecha."}
      - {norma: "CC", articulo: "1227", tipo: "conexa", nota: "Fecha del documento privado frente a terceros: registro, muerte de un firmante o entrega a funcionario."}
      - {norma: "CC", articulo: "1209", tipo: "conexa", nota: "La subrogación en el crédito no se presume fuera de los casos legales; debe establecerse con claridad."}
      - {norma: "CC", articulo: "1212", tipo: "conexa", nota: "La subrogación transfiere el crédito con sus derechos anexos frente al deudor, fiadores e hipotecas."}
      - {norma: "LEC", articulo: "17", apartado: "1", tipo: "regula", nota: "El adquirente del objeto litigioso pide ocupar la posición del transmitente; diez días a la otra parte."}
      - {norma: "LEC", articulo: "17", apartado: "2", tipo: "regula", nota: "Se deniega si la otra parte tiene defensas solo frente al transmitente, reconvención o merma de su defensa."}
      - {norma: "LEC", articulo: "540", tipo: "conexa", nota: "La ejecución se despacha o continúa a favor del sucesor del ejecutante que acredite la sucesión."}
    no_consta_en_norma:
      - "Si el 1535 alcanza a las cesiones en bloque de carteras de créditos y cómo se fija su precio: jurisprudencial (TS y TJUE)."
      - "Si la notificación de la cesión al deudor condiciona la legitimación del cesionario: jurisprudencial."
      - "Cuándo es litigioso el crédito en procesos sin contestación (monitorio, ejecución): jurisprudencial."
    afines: ["Sucesión procesal (muerte de la parte y transmisión del objeto litigioso)", "Falta de legitimación", "Compensación y nulidad alegadas por el demandado", "Pago: prueba, imputación y pago por tercero", "Ejecución hipotecaria: especialidades", "Títulos ejecutivos"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Acción subrogatoria y rescisión por fraude de acreedores"
    sinonimos: ["acción subrogatoria", "acción oblicua", "acción pauliana", "acción revocatoria", "rescisión por fraude de acreedores", "consilium fraudis", "eventus damni", "enajenación gratuita en fraude", "venta tras embargo o condena", "subsidiariedad de la rescisión", "plazo de cuatro años de la rescisión", "adquirente de mala fe", "repudiación de herencia en perjuicio de acreedores", "responsabilidad patrimonial universal"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "1911", tipo: "conexa", nota: "El deudor responde del cumplimiento con todos sus bienes, presentes y futuros."}
      - {norma: "CC", articulo: "1111", tipo: "regula", nota: "Tras perseguir los bienes del deudor, el acreedor ejerce sus acciones no personalísimas e impugna sus actos en fraude."}
      - {norma: "CC", articulo: "1290", tipo: "conexa", nota: "Los contratos válidamente celebrados solo se rescinden en los casos establecidos por la ley."}
      - {norma: "CC", articulo: "1291", apartado: "3.º", tipo: "regula", nota: "Rescindibles los contratos en fraude de acreedores cuando estos no puedan cobrar de otro modo."}
      - {norma: "CC", articulo: "1291", apartado: "4.º", tipo: "conexa", nota: "Y los del demandado sobre cosas litigiosas sin conocimiento de los litigantes o del juez."}
      - {norma: "CC", articulo: "1292", tipo: "conexa", nota: "Rescindibles los pagos hechos en insolvencia de deudas que aún no eran exigibles."}
      - {norma: "CC", articulo: "1294", tipo: "regula", nota: "Acción subsidiaria: solo si el perjudicado carece de todo otro recurso legal para reparar el perjuicio."}
      - {norma: "CC", articulo: "1295", tipo: "regula", nota: "Obliga a devolver la cosa con sus frutos y el precio con sus intereses."}
      - {norma: "CC", articulo: "1295", apartado: "párrafo 2.º", tipo: "regula", nota: "No procede si la cosa está legalmente en poder de terceros de buena fe; queda indemnización del causante."}
      - {norma: "CC", articulo: "1297", tipo: "regula", nota: "Se presumen en fraude de acreedores las enajenaciones a título gratuito."}
      - {norma: "CC", articulo: "1297", apartado: "párrafo 2.º", tipo: "regula", nota: "Y las onerosas de quien ya tenía sentencia condenatoria en cualquier instancia o mandamiento de embargo."}
      - {norma: "CC", articulo: "1298", tipo: "regula", nota: "El adquirente de mala fe indemniza los daños si por cualquier causa no puede devolver la cosa."}
      - {norma: "CC", articulo: "1299", tipo: "regula", nota: "La acción para pedir la rescisión dura cuatro años."}
      - {norma: "CC", articulo: "1124", apartado: "párrafo 4.º", tipo: "conexa", nota: "La resolución respeta a los terceros adquirentes conforme a los arts. 1295 y 1298 y a la Ley Hipotecaria."}
      - {norma: "CC", articulo: "1001", tipo: "conexa", nota: "Si el heredero repudia en perjuicio de sus acreedores, estos piden al juez que les autorice a aceptar."}
      - {norma: "CC", articulo: "1083", tipo: "conexa", nota: "Los acreedores de un coheredero pueden intervenir a su costa en la partición para evitar el fraude."}
      - {norma: "CC", articulo: "1937", tipo: "conexa", nota: "Los acreedores pueden hacer valer la prescripción pese a la renuncia del deudor."}
    no_consta_en_norma:
      - "Requisitos de la pauliana (crédito anterior, perjuicio, fraude, subsidiariedad): jurisprudencial."
      - "Si basta la conciencia del perjuicio (scientia fraudis) sin intención de dañar: jurisprudencial."
      - "Naturaleza de caducidad del plazo del 1299 y su día inicial (otorgamiento o inscripción): jurisprudencial."
      - "Requisitos de la subrogatoria (crédito exigible, inactividad e insolvencia del deudor): jurisprudencial."
    fuera_de_la_herramienta:
      - "TRLC (RDLeg 1/2020), arts. 226 y 238: declarado el concurso, rescisión concursal y demás impugnaciones, ante el juez del concurso."
    afines: ["Embargo e inembargabilidad", "Averiguación patrimonial", "Simulación y causa del contrato", "Aceptación y repudiación de la herencia", "Anotación preventiva de demanda", "Nulidad y anulabilidad del contrato", "Fraude de ley y actos contrarios a normas imperativas"]
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - voz: "Simulación y causa del contrato"
    sinonimos: ["simulación absoluta", "simulación relativa", "negocio disimulado", "contrato simulado", "causa falsa", "causa ilícita", "contrato sin causa", "presunción de causa", "contradocumento", "compraventa que encubre una donación", "precio confesado no pagado", "causa torpe", "prueba de la simulación por presunciones"]
    normas_base: ["CC", "LEC"]
    remisiones:
      - {norma: "CC", articulo: "1261", apartado: "3.º", tipo: "regula", nota: "No hay contrato sin causa de la obligación que se establezca."}
      - {norma: "CC", articulo: "1274", tipo: "regula", nota: "Causa: en los onerosos, la prestación de la otra parte; en los remuneratorios, el servicio; en los gratuitos, la liberalidad."}
      - {norma: "CC", articulo: "1275", tipo: "regula", nota: "Los contratos sin causa o con causa ilícita no producen efecto; ilícita es la contraria a las leyes o a la moral."}
      - {norma: "CC", articulo: "1276", tipo: "regula", nota: "La causa falsa anula el contrato, salvo que se pruebe que se funda en otra verdadera y lícita."}
      - {norma: "CC", articulo: "1277", tipo: "regula", nota: "Aunque no se exprese, la causa se presume existente y lícita mientras el deudor no pruebe lo contrario."}
      - {norma: "CC", articulo: "1219", tipo: "regula", nota: "La escritura que desvirtúa otra anterior solo afecta a terceros si se anota en el registro o en la matriz."}
      - {norma: "CC", articulo: "1230", tipo: "regula", nota: "Los documentos privados que alteran lo pactado en escritura pública no producen efecto contra tercero."}
      - {norma: "CC", articulo: "1218", apartado: "párrafo 2.º", tipo: "conexa", nota: "La escritura hace prueba contra los contratantes y causahabientes de las declaraciones que hicieron en ella."}
      - {norma: "CC", articulo: "1301", apartado: "2.º", tipo: "conexa", nota: "La acción por falsedad de la causa caduca a los cuatro años desde la consumación del contrato."}
