  - voz: "Requisitos del contrato y autonomía de la voluntad"
    sinonimos: ["elementos esenciales del contrato", "consentimiento, objeto y causa", "oferta y aceptación", "perfección del contrato", "contrato entre ausentes", "autonomía de la voluntad", "libertad contractual", "límites de la autonomía de la voluntad", "pacta sunt servanda", "fuerza obligatoria del contrato", "relatividad del contrato", "estipulación a favor de tercero", "contrato en nombre ajeno sin poder", "ratificación", "objeto del contrato", "pacto sobre herencia futura", "capacidad para contratar"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "1254", tipo: "regula", nota: "El contrato existe desde que una o varias personas consienten en obligarse a dar algo o prestar un servicio."}
      - {norma: "CC", articulo: "1261", tipo: "regula", nota: "No hay contrato sin consentimiento, objeto cierto y causa de la obligación."}
      - {norma: "CC", articulo: "1262", tipo: "regula", nota: "El consentimiento es el concurso de oferta y aceptación sobre la cosa y la causa."}
      - {norma: "CC", articulo: "1262", apartado: "párrafo 2.º", tipo: "regula", nota: "Entre ausentes, hay consentimiento cuando el oferente conoce la aceptación o no puede ignorarla de buena fe."}
      - {norma: "CC", articulo: "1262", apartado: "párrafo 3.º", tipo: "conexa", nota: "En los contratos por dispositivos automáticos, hay consentimiento desde que se manifiesta la aceptación."}
      - {norma: "CC", articulo: "1255", tipo: "regula", nota: "Libertad de pactos, cláusulas y condiciones, salvo contrarios a las leyes, la moral o el orden público."}
      - {norma: "CC", articulo: "1256", tipo: "regula", nota: "La validez y el cumplimiento no pueden dejarse al arbitrio de uno de los contratantes."}
      - {norma: "CC", articulo: "1091", tipo: "regula", nota: "Las obligaciones contractuales tienen fuerza de ley entre las partes y se cumplen a tenor del contrato."}
      - {norma: "CC", articulo: "1258", tipo: "regula", nota: "Perfección consensual; obligan también a las consecuencias conformes a la buena fe, al uso y a la ley."}
      - {norma: "CC", articulo: "1257", tipo: "regula", nota: "El contrato solo produce efecto entre las partes y sus herederos, salvo derechos intransmisibles."}
      - {norma: "CC", articulo: "1257", apartado: "párrafo 2.º", tipo: "regula", nota: "El tercero beneficiario exige la estipulación a su favor si comunicó su aceptación antes de revocarse."}
      - {norma: "CC", articulo: "1259", tipo: "regula", nota: "Nadie contrata en nombre de otro sin su autorización o representación legal."}
      - {norma: "CC", articulo: "1259", apartado: "párrafo 2.º", tipo: "regula", nota: "El contrato sin poder es nulo salvo ratificación antes de que lo revoque la otra parte."}
      - {norma: "CC", articulo: "1263", tipo: "regula", nota: "Los menores no emancipados contratan lo que la ley les permite y los bienes y servicios de la vida corriente."}
      - {norma: "CC", articulo: "1264", tipo: "conexa", nota: "Sin perjuicio de las prohibiciones y requisitos especiales de capacidad que fijen las leyes."}
      - {norma: "CC", articulo: "1271", tipo: "regula", nota: "Pueden ser objeto las cosas en el comercio, aun futuras, y los servicios no contrarios a las leyes o buenas costumbres."}
      - {norma: "CC", articulo: "1271", apartado: "párrafo 2.º", tipo: "conexa", nota: "Sobre herencia futura solo caben contratos de división entre vivos del caudal conforme al art. 1056."}
      - {norma: "CC", articulo: "1272", tipo: "regula", nota: "No pueden ser objeto de contrato las cosas o servicios imposibles."}
      - {norma: "CC", articulo: "1273", tipo: "regula", nota: "Objeto determinado en su especie; la cantidad puede quedar indeterminada si se determina sin nuevo convenio."}
      - {norma: "CC", articulo: "1115", tipo: "conexa", nota: "Es nula la obligación cuya condición depende de la exclusiva voluntad del deudor."}
      - {norma: "CC", articulo: "1300", tipo: "conexa", nota: "Los contratos con los requisitos del 1261 son anulables si adolecen de algún vicio que los invalide."}
      - {norma: "CC", articulo: "6", apartado: "2", tipo: "conexa", nota: "Renunciar a derechos o excluir la ley aplicable solo vale si no daña el interés u orden público ni a terceros."}
      - {norma: "CC", articulo: "1089", tipo: "conexa", nota: "Las obligaciones nacen de la ley, los contratos, los cuasicontratos y los actos ilícitos o culposos."}
    no_consta_en_norma:
