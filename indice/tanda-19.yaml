  - voz: "Enriquecimiento injusto y cobro de lo indebido"
    sinonimos: ["enriquecimiento sin causa", "enriquecimiento injusto", "cobro de lo indebido", "pago indebido", "condictio indebiti", "repetición de lo pagado", "restitución de lo cobrado por error", "accipiens de buena fe", "accipiens de mala fe", "presunción de error en el pago", "cuasicontrato", "devolución de cantidades pagadas sin causa", "acción in rem verso"]
    normas_base: ["CC"]
    remisiones:
      - {norma: "CC", articulo: "1887", tipo: "conexa", nota: "Cuasicontratos: hechos lícitos y voluntarios de los que nace una obligación con un tercero."}
      - {norma: "CC", articulo: "1895", tipo: "regula", nota: "Quien recibe por error lo que no tenía derecho a cobrar debe restituirlo."}
      - {norma: "CC", articulo: "1896", tipo: "regula", nota: "Quien acepta de mala fe un pago indebido abona el interés legal del capital o los frutos de la cosa."}
      - {norma: "CC", articulo: "1896", apartado: "párrafo 2.º", tipo: "regula", nota: "Y responde de menoscabos y perjuicios hasta la devolución, salvo fortuito que igual habría sufrido la cosa."}
      - {norma: "CC", articulo: "1897", tipo: "regula", nota: "El de buena fe solo responde de pérdidas en cuanto se enriqueció; si enajenó, restituye el precio o cede la acción."}
      - {norma: "CC", articulo: "1898", tipo: "conexa", nota: "Mejoras y gastos de quien recibió indebidamente: reglas de la posesión (título V del libro II)."}
      - {norma: "CC", articulo: "1899", tipo: "regula", nota: "No restituye quien de buena fe inutilizó el título, dejó prescribir o canceló garantías; se reclama al verdadero deudor."}
      - {norma: "CC", articulo: "1900", tipo: "regula", nota: "Quien reclama prueba el pago y su error; si el demandado niega haber recibido, basta probar la entrega."}
      - {norma: "CC", articulo: "1901", tipo: "regula", nota: "Se presume el error si se entregó lo nunca debido o ya pagado; cabe probar liberalidad u otra causa justa."}
      - {norma: "CC", articulo: "1158", apartado: "párrafo 3.º", tipo: "conexa", nota: "Quien paga contra la expresa voluntad del deudor solo repite aquello en que el pago le fue útil."}
      - {norma: "CC", articulo: "1163", tipo: "conexa", nota: "El pago al menor o al tercero vale en cuanto se convirtió en utilidad de aquel o del acreedor."}
      - {norma: "CC", articulo: "1303", tipo: "conexa", nota: "Declarada la nulidad, restitución recíproca de las cosas con sus frutos y del precio con sus intereses."}
      - {norma: "CC", articulo: "1304", tipo: "conexa", nota: "Nulidad por minoría de edad: el menor solo restituye en cuanto se enriqueció con la prestación."}
      - {norma: "CC", articulo: "1893", tipo: "conexa", nota: "El dueño que aprovecha la gestión ajena indemniza al gestor los gastos necesarios y útiles."}
      - {norma: "CC", articulo: "1894", tipo: "conexa", nota: "Quien presta alimentos sin conocimiento del obligado puede reclamárselos, salvo que los diera por piedad."}
      - {norma: "CC", articulo: "10", apartado: "9, párrafo 3.º", tipo: "conexa", nota: "Enriquecimiento sin causa con elemento extranjero: ley en virtud de la cual se produjo la transferencia de valor."}
      - {norma: "CC", articulo: "1964", apartado: "2", tipo: "conexa", nota: "Sin plazo especial, las acciones personales prescriben a los cinco años desde que puede exigirse el cumplimiento."}
