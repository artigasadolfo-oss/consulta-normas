      - {norma: "CC", articulo: "1114", tipo: "regula", nota: "En las condicionales, adquirir o perder derechos depende del acontecimiento que constituye la condición."}
      - {norma: "CC", articulo: "1115", tipo: "regula", nota: "Nula si la condición depende de la exclusiva voluntad del deudor; válida si de la suerte o de un tercero."}
