  - voz: "Obligaciones condicionales, a plazo y vencimiento anticipado"
    sinonimos: ["condición suspensiva", "condición resolutoria", "condición potestativa", "condición imposible", "cumplimiento ficto de la condición", "retroactividad de la condición", "obligación a plazo", "día cierto", "plazo en beneficio de ambas partes", "fijación judicial del plazo", "pérdida del beneficio del plazo", "vencimiento anticipado", "cláusula de vencimiento anticipado", "pago anticipado"]
