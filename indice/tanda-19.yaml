      - {norma: "CC", articulo: "1118", tipo: "conexa", nota: "Condición de que no ocurra algo: eficaz al pasar el tiempo; si no se fijó, el que verosímilmente se quiso."}
      - {norma: "CC", articulo: "1119", tipo: "regula", nota: "Se tiene por cumplida la condición cuando el obligado impide voluntariamente su cumplimiento."}
      - {norma: "CC", articulo: "1120", tipo: "regula", nota: "Cumplida la condición, sus efectos se retrotraen a la constitución; frutos e intereses compensados si son recíprocas."}
      - {norma: "CC", articulo: "1121", tipo: "conexa", nota: "Pendiente la condición, el acreedor puede ejercitar acciones conservativas; el deudor repite lo pagado."}
      - {norma: "CC", articulo: "1122", tipo: "conexa", nota: "Pérdida, deterioro o mejora de la cosa pendiente la condición suspensiva: reglas 1.ª a 6.ª."}
      - {norma: "CC", articulo: "1123", tipo: "regula", nota: "Cumplida la condición resolutoria, las partes se restituyen lo percibido."}
      - {norma: "CC", articulo: "1125", tipo: "regula", nota: "La obligación a día cierto solo es exigible cuando el día llega; día cierto es el que necesariamente vendrá."}
      - {norma: "CC", articulo: "1125", apartado: "párrafo 3.º", tipo: "regula", nota: "Si es incierto que el día llegue, la obligación es condicional."}
      - {norma: "CC", articulo: "1126", tipo: "regula", nota: "Lo pagado anticipadamente no se repite; si se ignoraba el plazo, se reclaman intereses o frutos."}
      - {norma: "CC", articulo: "1127", tipo: "regula", nota: "El término se presume en beneficio de acreedor y deudor, salvo que resulte puesto a favor de uno."}
      - {norma: "CC", articulo: "1128", tipo: "regula", nota: "Los tribunales fijan el plazo si no se señaló y se quiso conceder, o si quedó a voluntad del deudor."}
      - {norma: "CC", articulo: "1129", apartado: "1.º", tipo: "regula", nota: "Pierde el plazo el deudor que resulta insolvente después de contraer la obligación, salvo que la garantice."}
      - {norma: "CC", articulo: "1129", apartado: "2.º", tipo: "regula", nota: "Y el que no otorga las garantías comprometidas."}
      - {norma: "CC", articulo: "1129", apartado: "3.º", tipo: "regula", nota: "Y el que disminuye las garantías o las pierde por caso fortuito sin sustituirlas de inmediato."}
