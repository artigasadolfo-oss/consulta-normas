      - {norma: "CC", articulo: "535", tipo: "conexa", nota: "Son indivisibles: dividido el sirviente o el dominante, la servidumbre se mantiene sin agravarse."}
      - {norma: "CC", articulo: "536", tipo: "regula", nota: "Se establecen por la ley (legales) o por voluntad de los propietarios (voluntarias)."}
      - {norma: "CC", articulo: "537", tipo: "regula", nota: "Las continuas y aparentes se adquieren por título o por prescripción de veinte años."}
      - {norma: "CC", articulo: "538", tipo: "conexa", nota: "Cómputo: en las positivas, desde que se empezó a ejercer; en las negativas, desde la prohibición formal al sirviente."}
      - {norma: "CC", articulo: "539", tipo: "regula", nota: "Las continuas no aparentes y las discontinuas, aparentes o no, solo se adquieren por título."}
      - {norma: "CC", articulo: "540", tipo: "regula", nota: "La falta de título solo se suple con escritura de reconocimiento del dueño del sirviente o sentencia firme."}
      - {norma: "CC", articulo: "541", tipo: "regula", nota: "El signo aparente puesto por el dueño de ambas fincas vale como título al enajenar una, salvo exclusión o retirada del signo."}
      - {norma: "CC", articulo: "542", tipo: "regula", nota: "Al establecer una servidumbre se conceden todos los derechos necesarios para su uso."}
      - {norma: "CC", articulo: "543", tipo: "regula", nota: "El dominante hace a su costa las obras necesarias en el sirviente, sin agravarla y con la menor incomodidad."}
      - {norma: "CC", articulo: "544", tipo: "conexa", nota: "Varios dominantes pagan las obras según su beneficio; el que no quiera, renuncia; el sirviente que la usa, contribuye."}
      - {norma: "CC", articulo: "545", tipo: "regula", nota: "El dueño del sirviente no puede menoscabar el uso de la servidumbre."}
      - {norma: "CC", articulo: "545", apartado: "párrafo 2.º", tipo: "regula", nota: "Si resulta muy incómoda, puede cambiarla a su costa a otro lugar o forma igual de cómodos y sin perjuicio."}
      - {norma: "CC", articulo: "546", tipo: "regula", nota: "Extinción: confusión, no uso, imposibilidad de uso, término o condición, renuncia y redención."}
      - {norma: "CC", articulo: "546", apartado: "2.º", tipo: "regula", nota: "No uso durante veinte años: desde que dejó de usarse (discontinuas) o desde el acto contrario (continuas)."}
      - {norma: "CC", articulo: "547", tipo: "conexa", nota: "La forma de prestar la servidumbre puede prescribirse como la servidumbre misma."}
      - {norma: "CC", articulo: "548", tipo: "conexa", nota: "Si el dominante es de varios, el uso de uno impide la prescripción respecto de los demás."}
      - {norma: "CC", articulo: "551", tipo: "conexa", nota: "Las legales de interés particular se rigen por este título y por las ordenanzas de policía urbana o rural."}
      - {norma: "CC", articulo: "594", tipo: "regula", nota: "El propietario puede establecer en su finca las servidumbres que quiera, sin contravenir las leyes ni el orden público."}
      - {norma: "CC", articulo: "597", tipo: "regula", nota: "Sobre fundo indiviso se requiere el consentimiento de todos; la concesión de uno le obliga a no impedirla."}
      - {norma: "CC", articulo: "598", tipo: "regula", nota: "El título, o la posesión si se adquirió por prescripción, fija los derechos del dominante y las cargas del sirviente."}
      - {norma: "CC", articulo: "595", tipo: "conexa", nota: "El nudo propietario puede imponer, sin el usufructuario, servidumbres que no perjudiquen el usufructo."}
      - {norma: "CC", articulo: "599", tipo: "conexa", nota: "El sirviente obligado a costear las obras se libera abandonando su predio al dueño del dominante."}
      - {norma: "LEC", articulo: "251", apartado: "5.ª", tipo: "conexa", nota: "Cuantía en demandas sobre servidumbre: precio de constitución si consta y no tiene más de cinco años."}
      - {norma: "LEC", articulo: "250", apartado: "1.7.º", tipo: "conexa", nota: "Juicio verbal para la efectividad de derechos reales inscritos frente a quien perturbe su ejercicio sin título inscrito."}
    no_consta_en_norma:
      - "Acciones confesoria y negatoria de servidumbre: no reguladas en el CC; construcción jurisprudencial."
      - "Alcance del signo aparente del 541 (destino del padre de familia) y su prueba: jurisprudencial."
