  - situacion: "Testigo-perito: manifestaciones técnicas del testigo"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«En cuanto a las manifestaciones técnicas que el testigo agrega, hacemos notar que concurre en él la circunstancia de tacha del artículo 343.1.[n.º]: […].»"
    pide: "Que se tenga en cuenta la circunstancia al valorar esas manifestaciones."
    bases:
      - { norma: LEC, articulo: "370", apartado: "4" }
      - { norma: LEC, articulo: "343", apartado: "1" }
