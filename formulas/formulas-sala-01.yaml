  # ───────────────────────── TESTIGOS (ADEMÁS DE LAS FILAS 2 Y 4) ─────────────────────────
  - situacion: "Circunstancias de parcialidad reveladas en las preguntas generales al testigo"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«A la vista de la respuesta del testigo sobre [su relación con la parte], ponemos de manifiesto esa circunstancia relativa a su imparcialidad e interesamos que se le interrogue sobre ella y conste en acta.»"
    pide: "Interrogatorio sobre la imparcialidad y constancia para la valoración en sentencia."
    aviso: "Es la vía cuando la causa se descubre en el acto; la tacha formal tiene plazo propio (378)."
    bases:
      - { norma: LEC, articulo: "367", apartado: "1" }
      - { norma: LEC, articulo: "367", apartado: "2" }
      - { norma: LEC, articulo: "378" }
