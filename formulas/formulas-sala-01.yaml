  - situacion: "Hechos de la demanda no negados en la contestación o negados con evasivas"
    grupo: "Fijación de hechos"
    momento: ["audiencia_previa", "vista_verbal"]
    formula: "«Interesamos que se tengan por admitidos los hechos [n.º], que la demandada no negó en su contestación [o respondió con evasivas], y que se excluyan de los controvertidos.»"
    pide: "Admisión tácita de los hechos perjudiciales y su exclusión de la prueba."
