  - situacion: "Escritos oscuros de la contraria: pedir que el tribunal requiera aclaración"
    grupo: "Fijación de hechos"
    momento: ["audiencia_previa"]
    formula: "«Interesamos que se requiera a la contraria para que aclare [el hecho / el argumento] de su escrito, con el apercibimiento de que, si no lo hace, podrá tenérsela por conforme con lo que alegamos de contrario.»"
