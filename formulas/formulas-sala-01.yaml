    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Negativa de la parte a declarar"
    grupo: "Interrogatorio de parte"
    momento: ["juicio", "vista_verbal"]
    formula: "«Ante la negativa a declarar, interesamos que se aperciba en el acto al declarante de que pueden tenerse por reconocidos como ciertos los hechos de las preguntas en que intervino personalmente y le perjudican.»"
    pide: "Apercibimiento del 307.1."
    aviso: "No procede si concurre un deber legal de secreto (307.1)."
    bases:
      - { norma: LEC, articulo: "307", apartado: "1" }
      - { norma: LEC, articulo: "316", apartado: "1" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Hechos no personales del declarante: propuesta de que conteste un tercero"
    grupo: "Interrogatorio de parte"
    momento: ["juicio", "vista_verbal"]
    formula: "«[Proponente de la prueba:] No aceptamos la sustitución por el tercero propuesto; el declarante debe contestar según sus conocimientos, dando razón de su origen.»"
    pide: "Que el declarante responda; o, si se acepta, que el tercero conteste con las consecuencias de la declaración."
    aviso: "Sin aceptación del proponente no hay sustitución, pero el declarante puede pedir que el tercero declare como testigo; decide el tribunal (308)."
    bases:
      - { norma: LEC, articulo: "308" }
