    formula: "«Nos oponemos: la parte ya ha declarado en este proceso sobre esos mismos hechos. No procede reiterar el interrogatorio.»"
    pide: "Inadmisión del interrogatorio reiterado."
    aviso: "No impide repetir el interrogatorio practicado como prueba anticipada si una parte lo pide y es posible (295.4)."
