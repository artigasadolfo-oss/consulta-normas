    revisor: "armero"

  # ───────────────────────── AUDIENCIA PREVIA: ALEGACIONES, HECHOS NUEVOS Y PRECLUSIÓN ─────────────────────────
  - situacion: "Alegaciones complementarias propias a lo expuesto de contrario"
    grupo: "Alegaciones complementarias y preclusión"
    momento: ["audiencia_previa"]
    formula: "«Con la venia, al amparo del artículo 426.1 formulamos la siguiente alegación complementaria, en relación con lo que la contestación expone sobre […], sin alterar nuestra pretensión ni sus fundamentos: […].»"
    pide: "Que se tenga por formulada la alegación complementaria."
    aviso: "Si la alegación altera sustancialmente la pretensión o su fundamento, será rechazada (426.1 y 412.1)."
    bases:
      - { norma: LEC, articulo: "426", apartado: "1" }
      - { norma: LEC, articulo: "412", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "La contraria, so capa de alegación complementaria, cambia la demanda o la contestación"
    grupo: "Alegaciones complementarias y preclusión"
    momento: ["audiencia_previa"]
    formula: "«Nos oponemos, Señoría: no es una alegación complementaria, sino un cambio sustancial de [la pretensión / la causa de pedir], vedado por los artículos 412.1 y 426.1. Interesamos que se tenga por no formulada.»"
    pide: "Que no se admita la alteración del objeto del proceso."
    aviso: "Si se admite, pedir que conste la oposición: la indefensión habrá de acreditarse en apelación como denunciada en tiempo (459)."
    bases:
      - { norma: LEC, articulo: "412", apartado: "1" }
      - { norma: LEC, articulo: "426", apartado: "1" }
      - { norma: LEC, articulo: "459" }
    no_consta_en_norma:
      - "Frontera entre «complementar» y «alterar sustancialmente» la pretensión: elaboración jurisprudencial (mutatio libelli)."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Aclaración de alegaciones propias o rectificación de extremos secundarios"
    grupo: "Alegaciones complementarias y preclusión"
    momento: ["audiencia_previa"]
    formula: "«Aclaramos la alegación [n.º] de la demanda en el sentido de que […]; y rectificamos el extremo secundario relativo a [p. ej. un error de cálculo], sin alterar la pretensión ni su fundamento.»"
    pide: "Que se tenga por hecha la aclaración o rectificación."
    bases:
      - { norma: LEC, articulo: "426", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Petición accesoria o complementaria añadida en la audiencia (oposición)"
    grupo: "Alegaciones complementarias y preclusión"
    momento: ["audiencia_previa"]
    formula: "«No prestamos conformidad a la adición. Su planteamiento en este acto nos impide ejercer el derecho de defensa en condiciones de igualdad, porque […]. Interesamos que se inadmita.»"
    pide: "Inadmisión de la petición añadida."
    aviso: "Si la contraria calla, la adición se admite sin más (426.3): la oposición hay que hacerla en el acto."
    bases:
      - { norma: LEC, articulo: "426", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Alegación de hecho nuevo o de nueva noticia en la audiencia (propia)"
    grupo: "Alegaciones complementarias y preclusión"
    momento: ["audiencia_previa"]
    formula: "«Alegamos como hecho [posterior a la demanda / de nueva noticia] el siguiente: […]. Acreditamos en este acto [su fecha / cuándo lo conocimos] con […], y aportamos los documentos que lo justifican.»"
    pide: "Que se admita el hecho nuevo y los documentos que lo justifican."
    aviso: "Si no se acredita cumplidamente que es posterior, el tribunal lo rechaza por providencia; si se pretende de nueva noticia sin justificarlo, puede rechazarse y multarse de 120 a 600 euros (286.4)."
    bases:
      - { norma: LEC, articulo: "426", apartado: "4" }
      - { norma: LEC, articulo: "426", apartado: "5" }
      - { norma: LEC, articulo: "286", apartado: "4" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Oposición al hecho «nuevo» o «de nueva noticia» de la contraria"
    grupo: "Alegaciones complementarias y preclusión"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Nos oponemos: no se acredita que el hecho sea posterior [ni que se conociera después]; pudo alegarse en [la demanda / la contestación]. Interesamos que no se tome en consideración y, por su ánimo dilatorio, la multa del 286.4.»"
    pide: "Rechazo del hecho por providencia y, en su caso, multa de 120 a 600 euros."
    aviso: "Si se admite, negar el hecho expresamente y proponer en el acto la prueba pertinente sobre él (286.2 y 286.3)."
    bases:
      - { norma: LEC, articulo: "286", apartado: "4" }
      - { norma: LEC, articulo: "426", apartado: "4" }
      - { norma: LEC, articulo: "433", apartado: "1, párrafo 2.º" }
      - { norma: LEC, articulo: "286", apartado: "2" }
      - { norma: LEC, articulo: "286", apartado: "3" }
    estado: "vigente"
