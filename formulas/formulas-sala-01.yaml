    revisor: "armero"

  - situacion: "La contraria intenta discutir en la audiencia la jurisdicción o la competencia"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«Nos oponemos, Señoría: la falta de jurisdicción o de competencia no puede impugnarse en la audiencia previa; debió proponerse por declinatoria.»"
    pide: "Que no se admita la cuestión, salvo apreciación de oficio por el tribunal."
    aviso: "El tribunal conserva la facultad de apreciar de oficio su falta de jurisdicción o de competencia (416.2, párrafo 2.º)."
