    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia: el declarante está leyendo respuestas preparadas. Interesamos que se le indique que responda por sí mismo, sin borrador, y que conste.»"
    pide: "Que se impida el uso del borrador; solo cabe consultar documentos o notas si el tribunal lo considera conveniente."
