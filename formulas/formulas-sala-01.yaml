    revisor: "armero"

  - situacion: "Tacha de un testigo de contrario"
    grupo: "Testigos"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Formulamos tacha del testigo [nombre] por [parentesco / dependencia / interés / amistad o enemistad / condena por falso testimonio] (art. 377.1.n.º), y proponemos para acreditarla [documental].»"
    pide: "Que se tenga por formulada la tacha y se valore con la declaración."
    aviso: "Plazo: desde que se admite la testifical hasta que comienza el juicio o la vista (378). No cabe probar la tacha con testigos (379.1)."
    bases:
      - { norma: LEC, articulo: "377", apartado: "1" }
      - { norma: LEC, articulo: "378" }
      - { norma: LEC, articulo: "379", apartado: "1" }
      - { norma: LEC, articulo: "379", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Oposición a la tacha de un testigo propio"
    grupo: "Testigos"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Nos oponemos a la tacha del testigo [nombre]: la causa alegada no concurre, porque […]. Aportamos [documentos].»"
    pide: "Que se desestime la tacha al valorar la prueba."
    aviso: "Si no se opone uno en los tres días siguientes a su formulación, se entiende que reconoce su fundamento (379.2): si se formula en sala, contestar en el acto."
    bases:
      - { norma: LEC, articulo: "379", apartado: "2" }
      - { norma: LEC, articulo: "344", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "El testigo no da razón de ciencia de lo que afirma"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Señoría, interesamos que el testigo exprese la razón de ciencia de lo que acaba de decir: si lo presenció, se lo contaron o lo deduce.»"
    pide: "Que el testigo exprese su razón de ciencia."
    aviso: "La razón de ciencia es criterio legal de valoración del testimonio (376): si no la da, recordarlo en conclusiones."
    bases:
      - { norma: LEC, articulo: "370", apartado: "3" }
      - { norma: LEC, articulo: "376" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Testigos que han presenciado declaraciones de otros o se han comunicado"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia: el testigo [nombre], pendiente de declarar, ha permanecido en sala durante la declaración de [otro testigo]. Interesamos que conste en acta a efectos de su valoración.»"
    pide: "Constancia del incidente y medidas para evitar la comunicación."
    bases:
      - { norma: LEC, articulo: "366", apartado: "2" }
      - { norma: LEC, articulo: "376" }
    no_consta_en_norma:
      - "Efecto procesal de la infracción del 366.2 (exclusión del testimonio o solo merma de credibilidad): no consta; criterio judicial."
