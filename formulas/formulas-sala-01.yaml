  - situacion: "El testigo invoca el deber de secreto profesional"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«[Si conviene que declare:] El secreto invocado no alcanza a este hecho, porque […]. Interesamos que se resuelva que el testigo debe responder [o, si se le libera, que conste en acta y qué preguntas afecta].»"
    pide: "Resolución motivada sobre el fundamento de la negativa."
    bases:
      - { norma: LEC, articulo: "371", apartado: "1" }
    vigilar:
      - { norma: LOPJ, articulo: "542" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "El tribunal pretende prescindir de testigos tras oír a tres sobre el mismo hecho"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia: el testigo [nombre] depone sobre un hecho distinto [o sobre un aspecto no aclarado del mismo hecho]: […]. Interesamos que se le oiga; en otro caso, formulamos protesta.»"
    pide: "Que se oiga al testigo; subsidiariamente, protesta."
    bases:
      - { norma: LEC, articulo: "363" }
      - { norma: LEC, articulo: "285", apartado: "2" }
      - { norma: LEC, articulo: "446" }
    no_consta_en_norma:
      - "Recurribilidad de la decisión de obviar testigos ya admitidos (363, párrafo 2.º): la norma no la regula; se aplica por analogía el régimen de inadmisión de prueba (285.2 y 446)."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "El autor de un informe (detective) declara como testigo"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Antes de las preguntas, interesamos que el testigo acredite su habilitación profesional, reconozca el informe y se ratifique. Nos oponemos a preguntas que excedan de los hechos consignados en él.»"
    pide: "Acreditación, reconocimiento, ratificación y limitación del interrogatorio."
    bases:
      - { norma: LEC, articulo: "380", apartado: "1.2.ª" }
      - { norma: LEC, articulo: "380", apartado: "1.3.ª" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  # ───────────────────────── PERITOS EN EL JUICIO O LA VISTA ─────────────────────────
  - situacion: "Intervención del perito: exposición, explicación y respuesta a objeciones"
    grupo: "Peritos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Interesamos que el perito explique [el punto n.º] del dictamen y responda a nuestras objeciones sobre [método / premisas / conclusiones].»"
    pide: "La intervención del 347.1.2.º y 3.º."
    aviso: "El tribunal solo puede denegarla por impertinente o inútil o por deber de confidencialidad de una mediación previa (347.1, párrafo 2.º)."
    bases:
      - { norma: LEC, articulo: "347", apartado: "1.2.º" }
      - { norma: LEC, articulo: "347", apartado: "1.3.º" }
      - { norma: LEC, articulo: "347", apartado: "1, párrafo 2.º" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Ampliación del dictamen a puntos conexos"
    grupo: "Peritos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Interesamos que el perito manifieste si puede ampliar su dictamen al punto conexo [X] en este acto y, si no, su opinión sobre la utilidad de la ampliación y el plazo que precisaría.»"
    pide: "Respuesta del perito sobre la ampliación."
    bases:
      - { norma: LEC, articulo: "347", apartado: "1.4.º" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Crítica del dictamen de contrario por nuestro perito"
    grupo: "Peritos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Interesamos que nuestro perito, presente en sala, formule su crítica del dictamen de contrario.»"
    pide: "Intervención del perito propio para criticar el dictamen ajeno."
    bases:
      - { norma: LEC, articulo: "347", apartado: "1.5.º" }
    no_consta_en_norma:
      - "Careo o declaración conjunta de peritos: no consta en la LEC como tal; se practica por uso forense al amparo del 347.1.5.º."
