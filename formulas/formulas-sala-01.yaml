    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Pretensión de ampliar la demanda o acumular acciones después de contestada"
    grupo: "Alegaciones complementarias y preclusión"
    momento: ["audiencia_previa", "vista_verbal"]
    formula: "«Nos oponemos, Señoría: contestada la demanda no cabe acumular acciones ni ampliarla contra nuevos demandados (art. 401). Lo que se pretende es una acción nueva. Interesamos su inadmisión.»"
    pide: "Que se inadmita la ampliación."
    bases:
      - { norma: LEC, articulo: "401", apartado: "1" }
