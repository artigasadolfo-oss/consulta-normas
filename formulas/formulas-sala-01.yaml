# Fórmulas de sala de «Consulta de normas» — tanda 01 (audiencia previa, juicio ordinario y vista del verbal)
# Revisor: armero. Espejo: legalize-es@aca28304d; la fórmula «Desahucio por falta de pago: el demandado alega causas distintas del pago o la enervación» está revisada contra legalize-es@597314599f (composición con el RDL 29/2026) y cita ya el LEC 22 como base, no solo en `vigilar`. Todo precepto citado se ha leído en el espejo en esta pasada.
# Encargo: docs/consulta-armero-formulas-sala-08-10-2026.md. Notas: formulas-sala-01-notas.md.
# Vigencia: contraste con la API de boe.es (scripts/contraste_boe.py --solo "LEC,LOPJ,CE,LO 1/2025", 08-10-2026). Distintos: LEC 22 y 685,
# ninguno citado como base (el 22 solo en `vigilar`); ninguna versión futura. 120 fórmulas: 8 del cuadro de Adolfo + 112 nuevas.
# Sin campos nuevos: se usan solo los del formato del encargo.

formulas:
  # ───────────────────────── 1-8. CUADRO DE ADOLFO (verificado) ─────────────────────────
  - situacion: "Pregunta a la parte con valoración o calificación"
    grupo: "Interrogatorio de parte"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia, Señoría: la pregunta incorpora una valoración. Interesamos que se tenga por no formulada en esos términos.»"
    pide: "Que se tenga por no realizada la valoración o calificación y, en su caso, que se reformule la pregunta."
    aviso: "La objeción la tiene la parte que declara y su abogado (303 y 306.3); hay que hacerla en el acto, antes de que se conteste."
    bases:
      - { norma: LEC, articulo: "302", apartado: "1" }
      - { norma: LEC, articulo: "303" }
      - { norma: LEC, articulo: "306", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Pregunta al testigo con valoración o calificación"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia, Señoría: la pregunta al testigo incorpora una valoración. Interesamos que se tenga por no formulada en esos términos.»"
    pide: "Que se tenga por no realizada la valoración o calificación."
    aviso: "La impugnación corresponde a las partes distintas de la que formula la pregunta, en el acto mismo del interrogatorio (369.1)."
    bases:
      - { norma: LEC, articulo: "368", apartado: "1" }
      - { norma: LEC, articulo: "369", apartado: "1" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Pregunta impertinente o inútil (a la parte o al testigo)"
    grupo: "Objeciones comunes a parte y testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Nos oponemos, Señoría: la pregunta no guarda relación con los hechos controvertidos fijados y no puede contribuir a esclarecerlos. Interesamos que se repela.»"
    pide: "Que el tribunal repela la pregunta antes de que se conteste."
    aviso: "Si el testigo responde pese a la inadmisión, la respuesta no constará en acta (368.3); pedirlo así si ocurre."
    bases:
      - { norma: LEC, articulo: "283", apartado: "1" }
      - { norma: LEC, articulo: "283", apartado: "2" }
      - { norma: LEC, articulo: "302", apartado: "2" }
      - { norma: LEC, articulo: "306", apartado: "1" }
      - { norma: LEC, articulo: "306", apartado: "3" }
      - { norma: LEC, articulo: "368", apartado: "2" }
      - { norma: LEC, articulo: "369", apartado: "1" }
      - { norma: LEC, articulo: "372", apartado: "1" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Pregunta a un testigo sobre juicios técnicos o de opinión"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia: el testigo no es perito. La pregunta no versa sobre hechos que conozca, sino que le pide un juicio técnico. Interesamos su inadmisión.»"
    pide: "Que se inadmita la pregunta por no referirse a los conocimientos propios de un testigo."
    aviso: "Si el testigo tiene conocimientos técnicos sobre la materia, el tribunal admitirá lo que agregue sobre los hechos (testigo-perito, 370.4): entonces lo que cabe es hacer notar las circunstancias de tacha del 343."
    bases:
      - { norma: LEC, articulo: "368", apartado: "2, párrafo 2.º" }
      - { norma: LEC, articulo: "360" }
      - { norma: LEC, articulo: "370", apartado: "4" }
      - { norma: LEC, articulo: "369", apartado: "1" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Inadmisión de una pregunta nuestra"
    grupo: "Objeciones comunes a parte y testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con todo respeto, Señoría, solicitamos que conste en acta nuestra protesta por la inadmisión de la pregunta, que era: […].»"
    pide: "Que conste la protesta y el tenor literal de la pregunta inadmitida."
    aviso: "Sin protesta en el acto no podrá acreditarse en apelación que se denunció la infracción (459). Para la parte no hay norma de protesta propia: se aplica el mismo uso."
    bases:
      - { norma: LEC, articulo: "369", apartado: "2" }
      - { norma: LEC, articulo: "372", apartado: "1, párrafo 2.º" }
      - { norma: LEC, articulo: "459" }
    no_consta_en_norma:
      - "Protesta por inadmisión de preguntas en el interrogatorio de PARTE: la LEC solo la prevé para testigos (369.2 y 372.1); su extensión a la parte es uso forense."
      - "Enunciar la pregunta inadmitida para que quede en la grabación: uso forense, no lo exige la norma."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Denegación de una prueba propuesta"
    grupo: "Proposición y admisión de prueba"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Interponemos recurso de reposición contra la inadmisión de [la prueba], que es pertinente y útil para el hecho controvertido [n.º]. Si se desestima, formulamos protesta a efectos de la segunda instancia.»"
    pide: "Que se reponga la resolución y se admita la prueba; subsidiariamente, que conste la protesta."
    aviso: "Sin reposición en el acto y protesta no podrá pedirse esa prueba en apelación (460.2.1.ª). En el verbal, la admisión se decide por auto escrito (438.10), recurrible en reposición por escrito; la reposición oral es para lo resuelto en la vista (446)."
    bases:
      - { norma: LEC, articulo: "285", apartado: "2" }
      - { norma: LEC, articulo: "446" }
      - { norma: LEC, articulo: "460", apartado: "2.1.ª" }
      - { norma: LEC, articulo: "438", apartado: "10" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Respuestas evasivas o inconcluyentes de la parte contraria"
    grupo: "Interrogatorio de parte"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia: las respuestas del declarante son evasivas. Interesamos que se le aperciba conforme al artículo 307 de que pueden tenerse por reconocidos los hechos.»"
    pide: "Que se haga al declarante el apercibimiento del 307.1."
    aviso: "El efecto (tener por reconocidos los hechos) solo alcanza a hechos en que intervino personalmente y le perjudican; se valora en sentencia (316.2)."
    bases:
      - { norma: LEC, articulo: "307", apartado: "2" }
      - { norma: LEC, articulo: "307", apartado: "1" }
      - { norma: LEC, articulo: "316", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Incomparecencia de la parte contraria citada a interrogatorio (también persona jurídica)"
    grupo: "Interrogatorio de parte"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con la venia: la parte citada a interrogatorio con el apercibimiento del 304 no comparece. Interesamos que se tengan por reconocidos los hechos en que intervino y le perjudican, y que se le imponga la multa del 292.4.»"
    pide: "Admisión tácita de los hechos personales perjudiciales (304) e imposición de la multa (292.4, en relación con el 292.1)."
    aviso: "El 304 es facultativo («podrá») y exige que la citación contuviera el apercibimiento; comprobarlo antes. La multa requiere audiencia previa de cinco días (292.1)."
    bases:
      - { norma: LEC, articulo: "304" }
      - { norma: LEC, articulo: "292", apartado: "4" }
      - { norma: LEC, articulo: "292", apartado: "1" }
      - { norma: LEC, articulo: "440" }
    no_consta_en_norma:
      - "Aplicación del 304 a la persona jurídica que no comparece por medio de representante (qué hechos son «personales» suyos): elaboración jurisprudencial; la LEC solo regula la persona jurídica que sí declara (309)."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  # ───────────────────────── AUDIENCIA PREVIA: APERTURA, ACUERDO Y COMPARECENCIA ─────────────────────────
  - situacion: "Apertura de la audiencia: las partes han llegado a un acuerdo"
    grupo: "Audiencia previa: apertura y acuerdo"
    momento: ["audiencia_previa", "vista_verbal"]
    formula: "«Con la venia: las partes hemos alcanzado un acuerdo que ponga fin al proceso. Lo aportamos y solicitamos su homologación judicial.»"
    pide: "Homologación del acuerdo, con efectos de transacción judicial y ejecutable como tal."
    aviso: "El tribunal examina antes la capacidad y el poder de disposición de quienes asisten: llevar poder especial si no comparece la parte personalmente."
    bases:
      - { norma: LEC, articulo: "415", apartado: "1" }
      - { norma: LEC, articulo: "415", apartado: "2" }
      - { norma: LEC, articulo: "443", apartado: "1" }
      - { norma: LEC, articulo: "19", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Suspensión del proceso para acudir a un medio adecuado de solución de controversias"
    grupo: "Audiencia previa: apertura y acuerdo"
    momento: ["audiencia_previa", "vista_verbal"]
    formula: "«De común acuerdo, las partes solicitamos la suspensión del proceso conforme al artículo 19.4 para someternos a [mediación / otro MASC].»"
    pide: "Suspensión del proceso, que no podrá superar sesenta días."
    aviso: "Terminada la negociación sin acuerdo, cualquiera de las partes debe pedir que se alce la suspensión y se señale la continuación (415.3)."
    bases:
      - { norma: LEC, articulo: "415", apartado: "1, párrafo 3.º" }
      - { norma: LEC, articulo: "415", apartado: "3" }
      - { norma: LEC, articulo: "19", apartado: "4" }
      - { norma: LEC, articulo: "443", apartado: "1" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "El tribunal plantea derivar el litigio a un medio adecuado de solución de controversias"
    grupo: "Audiencia previa: apertura y acuerdo"
    momento: ["audiencia_previa", "vista_verbal"]
    formula: "«Esta parte [presta / no presta] su conformidad a la derivación. [En caso negativo:] La negativa obedece a la siguiente justa causa: […]. Interesamos que conste en acta.»"
    pide: "Que conste la posición de la parte y, si se rehúsa, su justa causa."
    aviso: "Rehusar sin justa causa un MASC acordado por el tribunal con conformidad de las partes, o legalmente preceptivo, puede costar las costas aun ganando (394.1, párrafo 3.º, y 394.2, párrafo 2.º)."
    bases:
      - { norma: LEC, articulo: "19", apartado: "5" }
      - { norma: LEC, articulo: "429", apartado: "2, párrafo 2.º" }
      - { norma: LEC, articulo: "443", apartado: "2" }
      - { norma: LEC, articulo: "394", apartado: "1, párrafo 3.º" }
      - { norma: LEC, articulo: "394", apartado: "2, párrafo 2.º" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "La contraria comparece solo por procurador sin poder para renunciar, allanarse o transigir"
    grupo: "Audiencia previa: apertura y acuerdo"
    momento: ["audiencia_previa"]
    formula: "«Con la venia: la parte contraria no comparece personalmente y su procurador carece de poder para renunciar, allanarse o transigir. Interesamos que se la tenga por no comparecida a la audiencia.»"
    pide: "Que se tenga a la parte por no comparecida, con los efectos del 414.3 y 414.4."
    aviso: "Si es el actor el que se tiene por no comparecido, el proceso se sobresee salvo que el demandado alegue interés legítimo en la sentencia de fondo (414.3)."
    bases:
      - { norma: LEC, articulo: "414", apartado: "2, párrafo 3.º" }
      - { norma: LEC, articulo: "414", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "No comparece el actor o su abogado a la audiencia previa (habla el demandado)"
    grupo: "Audiencia previa: apertura y acuerdo"
    momento: ["audiencia_previa"]
    formula: "«Esta parte alega interés legítimo en la continuación del procedimiento para que se dicte sentencia sobre el fondo, por [razón]. Interesamos que no se sobresea.»"
    pide: "Que la audiencia continúe pese a la incomparecencia del actor o de su abogado."
    aviso: "Si el demandado no lo alega en el acto, el proceso se sobresee (414.3 y 414.4)."
    bases:
      - { norma: LEC, articulo: "414", apartado: "3, párrafo 2.º" }
      - { norma: LEC, articulo: "414", apartado: "4" }
    no_consta_en_norma:
      - "Qué constituye «interés legítimo» en la continuación (p. ej. evitar un segundo pleito, haber reconvenido): elaboración jurisprudencial."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  # ───────────────────────── AUDIENCIA PREVIA: EXCEPCIONES PROCESALES ─────────────────────────
  - situacion: "Defecto de capacidad o representación subsanable (de la parte propia)"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«El defecto alegado es subsanable. Aportamos en este acto [el poder / el documento]; subsidiariamente, interesamos plazo de hasta diez días para subsanarlo, con suspensión de la audiencia.»"
    pide: "Que se tenga por subsanado el defecto o se conceda plazo no superior a diez días."
    aviso: "Si no se subsana en plazo, auto que pone fin al proceso; si afecta a la personación del demandado, rebeldía (418.2 y 418.3)."
    bases:
      - { norma: LEC, articulo: "418", apartado: "1" }
      - { norma: LEC, articulo: "418", apartado: "2" }
      - { norma: LEC, articulo: "418", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Defecto de capacidad o representación en la contestación o la reconvención (lo alega el actor)"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«Con la venia: advertimos en la representación de la demandada el siguiente defecto: […]. Interesamos que se requiera su subsanación y, de no producirse, que se la declare en rebeldía.»"
    pide: "Requerimiento de subsanación y, en su defecto, declaración de rebeldía sin constancia de lo actuado."
    bases:
      - { norma: LEC, articulo: "418", apartado: "1" }
      - { norma: LEC, articulo: "418", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Oposición a la acumulación de acciones (sostenida en la audiencia)"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«Nos ratificamos en la oposición a la acumulación formulada en la contestación: las acciones [razón: incompatibles / sin nexo]. Interesamos que se declare inadmisible y que el proceso siga solo por [acción].»"
    pide: "Resolución oral sobre la admisibilidad de la acumulación."
    aviso: "Solo cabe si el demandado se opuso motivadamente en la contestación (419 y 405.1); el tribunal oye antes al actor."
    bases:
      - { norma: LEC, articulo: "419" }
      - { norma: LEC, articulo: "405", apartado: "1" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Falta de litisconsorcio pasivo necesario alegada por el demandado (habla el actor)"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«[Opción A:] Presentamos escrito dirigiendo la demanda contra [litisconsortes], con sus copias, e interesamos su emplazamiento. [Opción B:] Nos oponemos: la relación jurídica no exige su llamada porque […].»"
    pide: "A: emplazamiento de los nuevos demandados con suspensión de la audiencia. B: que se desestime la excepción."
    aviso: "Al integrar la litis solo pueden añadirse las alegaciones imprescindibles, sin alterar sustancialmente la causa de pedir (420.1). Si se estima la excepción y no se integra en plazo, archivo (420.4)."
    bases:
      - { norma: LEC, articulo: "420", apartado: "1" }
      - { norma: LEC, articulo: "420", apartado: "2" }
      - { norma: LEC, articulo: "420", apartado: "3" }
      - { norma: LEC, articulo: "420", apartado: "4" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Litispendencia o cosa juzgada"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«Con la venia: existe [otro proceso pendiente / sentencia firme] sobre objeto idéntico, que acreditamos con […]. Interesamos que se dé por finalizada la audiencia y se dicte auto de sobreseimiento.»"
    pide: "Sobreseimiento; o, si la sentencia anterior solo es prejudicial, que se respete su efecto vinculante (222.4)."
    aviso: "Si el tribunal la rechaza, lo declara motivadamente en el acto y la audiencia sigue (421.2); pedir que conste la motivación."
    bases:
      - { norma: LEC, articulo: "421", apartado: "1" }
      - { norma: LEC, articulo: "421", apartado: "2" }
      - { norma: LEC, articulo: "421", apartado: "3" }
    vigilar:
      - { norma: LEC, articulo: "222" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Impugnación de la cuantía o de la clase de juicio por razón de la cuantía (ordinario)"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«Nos ratificamos en la impugnación de la cuantía: correctamente calculada asciende a […], según [regla del art. 251/252], lo que determina [el verbal / la apelabilidad]. Interesamos que así se resuelva en el acto.»"
    pide: "Resolución oral motivada sobre el valor de la cosa litigiosa y el procedimiento."
    aviso: "Solo si se impugnó en la contestación (255.2). En el verbal no se resuelve en sala, sino por el auto del 438.10 (255.3). Si procede el verbal y la acción estaba caducada, sobreseimiento (422.2)."
    bases:
      - { norma: LEC, articulo: "255", apartado: "1" }
      - { norma: LEC, articulo: "255", apartado: "2" }
      - { norma: LEC, articulo: "422", apartado: "1" }
      - { norma: LEC, articulo: "422", apartado: "2" }
    vigilar:
      - { norma: LEC, articulo: "251" }
      - { norma: LEC, articulo: "252" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Inadecuación del procedimiento por razón de la materia"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«Con la venia: por razón de la materia, el asunto debe sustanciarse por los trámites del [juicio verbal, art. 250.1.n.º]. Interesamos que así se declare y se cite a las partes a la vista.»"
    pide: "Declaración de inadecuación y cita a vista (o sobreseimiento si la demanda estaba caducada)."
    bases:
      - { norma: LEC, articulo: "423", apartado: "1" }
      - { norma: LEC, articulo: "423", apartado: "3" }
    vigilar:
      - { norma: LEC, articulo: "250" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Defecto legal en el modo de proponer la demanda, la contestación o la reconvención"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«[Quien la alega:] Interesamos que se requiera a la contraria para que precise [partes / petición]. [Quien la sufre:] Aclaramos en este acto que lo pedido es […], con lo que el defecto queda subsanado.»"
    pide: "Aclaración en el acto; sobreseimiento solo si es imposible saber qué se pide o frente a quién."
    aviso: "El sobreseimiento es excepcional (424.2): la aclaración en el acto lo evita."
    bases:
      - { norma: LEC, articulo: "416", apartado: "1.5.ª" }
      - { norma: LEC, articulo: "424", apartado: "1" }
      - { norma: LEC, articulo: "424", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Falta del requisito de procedibilidad (actividad negociadora previa no acreditada)"
    grupo: "Excepciones procesales"
    momento: ["audiencia_previa"]
    formula: "«Con la venia: la demanda se interpuso sin acreditar la actividad negociadora previa exigida como requisito de procedibilidad [o sin identidad de objeto]. Interesamos que se aprecie el defecto procesal.»"
    pide: "Apreciación del óbice procesal (por analogía, 425) y las consecuencias que el tribunal determine."
    aviso: "Debió alegarse en la contestación como excepción procesal (405.3). Comprobar antes que la materia no esté exceptuada (art. 5.2 LO 1/2025)."
    bases:
      - { norma: "LO 1/2025", articulo: "5", apartado: "1" }
      - { norma: "LO 1/2025", articulo: "5", apartado: "2" }
      - { norma: LEC, articulo: "403", apartado: "2" }
      - { norma: LEC, articulo: "264", apartado: "4.º" }
      - { norma: LEC, articulo: "425" }
      - { norma: LEC, articulo: "405", apartado: "3" }
    no_consta_en_norma:
      - "Tratamiento en la audiencia previa de la falta de MASC no detectada en la admisión (si es subsanable, si conduce a sobreseimiento): la LEC solo prevé la inadmisión de la demanda (403.2); doctrina de las Audiencias aún dividida."
