    revisor: "armero"

  - situacion: "El declarante no contesta afirmativa o negativamente"
    grupo: "Interrogatorio de parte"
    momento: ["juicio", "vista_verbal"]
    formula: "«Señoría, interesamos que se requiera al declarante para que conteste primero sí o no, y añada después las explicaciones que estime.»"
    pide: "Respuesta afirmativa o negativa, o precisa y concreta si no cabe."
    aviso: "Si persiste, pedir el apercibimiento del 307 (fila de evasivas)."
    bases:
