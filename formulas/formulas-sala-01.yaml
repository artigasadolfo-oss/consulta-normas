    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "El tribunal acuerda de oficio ampliar el dictamen de un perito de parte"
    grupo: "Peritos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Con todo respeto, Señoría: el tribunal puede preguntar y pedir explicaciones al perito, pero no acordar de oficio la ampliación del dictamen. Formulamos protesta.»"
    pide: "Que no se acuerde la ampliación de oficio; protesta si se mantiene."
    aviso: "La ampliación de oficio solo cabe con peritos designados de oficio en filiación, capacidad o procesos matrimoniales (339.5)."
    bases:
      - { norma: LEC, articulo: "347", apartado: "2" }
      - { norma: LEC, articulo: "339", apartado: "5" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Tacha de un perito con dictamen aportado después de la demanda o la contestación"
    grupo: "Peritos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Formulamos tacha del perito [nombre], autor del dictamen aportado [con posterioridad], por [causa del art. 343.1]; proponemos para acreditarla [documental].»"
    pide: "Que se tenga por formulada la tacha."
    aviso: "En el verbal, nunca después de la vista (343.2). El perito designado judicialmente no se tacha: se recusa (343.1)."
    bases:
      - { norma: LEC, articulo: "347", apartado: "1.6.º" }
      - { norma: LEC, articulo: "343", apartado: "1" }
      - { norma: LEC, articulo: "343", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Dictamen sin juramento o promesa de objetividad, o perito sin título oficial"
    grupo: "Peritos"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Hacemos notar que el dictamen [no contiene la manifestación de objetividad del artículo 335.2 / está firmado por quien carece del título oficial que corresponde a la materia]. Interesamos que se tenga en cuenta al valorarlo.»"
    pide: "Que conste el defecto para la valoración del dictamen."
    bases:
      - { norma: LEC, articulo: "335", apartado: "2" }
      - { norma: LEC, articulo: "340", apartado: "1" }
    no_consta_en_norma:
      - "Consecuencia de la falta de juramento o de titulación (inadmisión, subsanación o mera valoración): la LEC no la fija; criterio jurisprudencial."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

