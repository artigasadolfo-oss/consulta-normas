    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "El testigo responde a una pregunta ya inadmitida"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Señoría, la pregunta había sido inadmitida: interesamos que la respuesta no conste en acta.»"
    pide: "Que la respuesta no conste."
    bases:
      - { norma: LEC, articulo: "368", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Graves contradicciones entre testigos, o entre testigo y parte: careo"
    grupo: "Testigos"
    momento: ["juicio", "vista_verbal"]
    formula: "«Al término de este interrogatorio, y dadas las graves contradicciones con lo declarado por [testigo / parte] sobre […], interesamos careo entre ambos; pedimos que se advierta al testigo que no se ausente.»"
    pide: "Careo acto seguido."
    aviso: "Debe pedirse al término del interrogatorio (373.3): después no hay ocasión."
    bases:
      - { norma: LEC, articulo: "373", apartado: "1" }
      - { norma: LEC, articulo: "373", apartado: "2" }
      - { norma: LEC, articulo: "373", apartado: "3" }
