  # ───────────────────────── CONCLUSIONES, DILIGENCIAS FINALES, COSTAS Y SENTENCIA ─────────────────────────
  - situacion: "Conclusiones en el juicio ordinario"
    grupo: "Conclusiones"
    momento: ["juicio"]
    formula: "«Sobre los hechos controvertidos: primero, el hecho [n.º] ha quedado probado por [prueba, con remisión a autos]; segundo, [hecho] debe tenerse por cierto por presunción; tercero, [hecho dudoso]: la carga era de la contraria.»"
    pide: "Que se tengan por probados o inciertos los hechos en los términos expuestos."
    aviso: "Orden legal: primero los hechos propios, luego los de contrario; después, informe jurídico. Las pretensiones no pueden alterarse en este momento (433.3)."
    bases:
      - { norma: LEC, articulo: "433", apartado: "2" }
      - { norma: LEC, articulo: "433", apartado: "3" }
    vigilar:
      - { norma: LEC, articulo: "217" }
      - { norma: LEC, articulo: "386" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "La contraria altera en conclusiones su pretensión"
