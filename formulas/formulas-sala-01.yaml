    formula: "«Interesamos que el representante identifique a la persona que intervino en nombre de la entidad; y, si manifiesta desconocerla, que se tenga como respuesta evasiva con los efectos del artículo 307.»"
    pide: "Identificación y citación del interviniente como diligencia final; o efectos del 307."
