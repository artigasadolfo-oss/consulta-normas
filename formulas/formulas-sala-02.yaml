  - situacion: "Documento en idioma no oficial aportado en el acto sin traducción"
    grupo: "Lengua e intérpretes"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: el documento que se aporta está redactado en [idioma] y no va acompañado de traducción. Interesamos que se requiera a la contraria para que la aporte, y nos reservamos impugnarla en los cinco días siguientes a su traslado.»"
    pide: "Requerimiento de traducción (144.1); en su caso, impugnación de la traducción privada (144.2)."
    aviso: "Un documento en valenciano no está en idioma «no oficial» (142.4). La LEC no prevé la inadmisión directa por falta de traducción: lo prudente es pedir el requerimiento (231). Si la traducción oficial coincide en lo sustancial con la privada, la paga quien la pidió (144.2, párrafo 2.º)."
