    pide: "Que conste el uso de la lengua cooficial y, en su caso, que se habilite intérprete en el acto."
    aviso: "Es un derecho del declarante (142.3) y la actuación es plenamente válida sin traducción (142.4); la traducción solo se hace si una parte alega indefensión."
