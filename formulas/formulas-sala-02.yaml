  - situacion: "Una parte, un testigo o un perito interviene en valenciano y nuestro cliente no lo entiende"
    grupo: "Lengua e intérpretes"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: no discutimos el derecho del declarante a expresarse en valenciano, pero [mi representado] no lo entiende. Alegando indefensión, interesamos que se habilite intérprete que traduzca al castellano lo declarado.»"
    pide: "Habilitación de intérprete, con juramento o promesa de fiel traducción (142.5)."
    aviso: "No cabe oponerse al uso del valenciano por partes, testigos o peritos (142.3): lo que se pide es la traducción, que procede a instancia de parte que alegue indefensión (142.4). Vale también para documentos en valenciano, que son válidos sin traducción salvo esa petición."
    bases:
      - { norma: LEC, articulo: "142", apartado: "3" }
      - { norma: LEC, articulo: "142", apartado: "4" }
      - { norma: LEC, articulo: "142", apartado: "5" }
      - { norma: LOPJ, articulo: "231", apartado: "3" }
      - { norma: LOPJ, articulo: "231", apartado: "4" }
      - { norma: LOPJ, articulo: "231", apartado: "5" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
