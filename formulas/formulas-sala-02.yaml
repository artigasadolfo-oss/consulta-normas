  # ───────────────────────── VIDEOCONFERENCIA Y PRESENCIA TELEMÁTICA ─────────────────────────
  - situacion: "La contraria pretende que una parte, testigo o perito declare por videoconferencia"
    grupo: "Videoconferencia"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Nos oponemos, Señoría: para declarar, la ley exige la presencia física de [la parte / el testigo / el perito], salvo excepción que aquí no concurre [reside en el municipio sede / no se pidió con diez días de antelación]. Interesamos que declare presencialmente.»"
    pide: "Presencia física del declarante (129 bis.2) o, en su caso, que el tribunal la acuerde por resolución motivada (129 bis.3)."
    aviso: "Excepciones: que el tribunal disponga otra cosa; que el declarante resida en otro municipio y lo pida, desde lugar seguro del suyo; o que intervenga como autoridad o funcionario (129 bis.2). En esos dos últimos casos el tribunal aún puede exigir la presencia (129 bis.3). Si declara una parte, también su abogado ha de estar presente (129 bis.2)."
    bases:
      - { norma: LEC, articulo: "129 bis", apartado: "2" }
      - { norma: LEC, articulo: "129 bis", apartado: "3" }
      - { norma: LEC, articulo: "137 bis", apartado: "4" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Declarante por videoconferencia: identidad, lugar desde el que interviene y presencia de terceros"
    grupo: "Videoconferencia"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: antes de que declare, interesamos que se compruebe la identidad de [el declarante], que indique desde dónde interviene y que conste que no le acompañan terceras personas ni tiene a la vista documentos que no obren en autos.»"
    pide: "Comprobación de la identidad y de las condiciones de la intervención."
    aviso: "La regla es intervenir desde la oficina judicial del partido del domicilio o del trabajo, o desde el juzgado de paz si tiene medios (137 bis.2); desde otro lugar, solo si el juez lo autoriza y puede asegurarse la identidad (137 bis.3). Menores y personas sujetas a un procedimiento de apoyos, solo desde oficina judicial (137 bis.3)."
    bases:
      - { norma: LEC, articulo: "137 bis", apartado: "2" }
      - { norma: LEC, articulo: "137 bis", apartado: "3" }
      - { norma: LOPJ, articulo: "229", apartado: "3" }
    no_consta_en_norma:
      - "Pedir que se muestre la estancia o que conste la ausencia de terceros y de documentos ajenos a autos es uso forense; la ley solo exige asegurar la identidad y las condiciones de la intervención."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Exhibición de documentos a un declarante que interviene por videoconferencia"
    grupo: "Videoconferencia"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: interesamos que el documento que se exhibe al declarante se identifique por su número en autos y se muestre también a esta parte en pantalla, para garantizar la contradicción.»"
    pide: "Identificación del documento y su exhibición simultánea a todas las partes."
    aviso: "La videoconferencia debe asegurar en todo caso la contradicción y el derecho de defensa (LOPJ 229.3; 129 bis.5)."
    bases:
      - { norma: LOPJ, articulo: "229", apartado: "3" }
      - { norma: LEC, articulo: "129 bis", apartado: "5" }
    no_consta_en_norma:
      - "El modo concreto (número en autos y pantalla compartida) es uso forense; la norma solo garantiza la contradicción."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  # ───────────────────────── PROPIEDAD HORIZONTAL (LPH) ─────────────────────────
  - situacion: "Impugnación de acuerdos de la junta: el actor no está al corriente ni ha consignado (habla la comunidad)"
    grupo: "Propiedad horizontal"
    momento: ["audiencia_previa"]
    formula: "«Con la venia: el actor no acreditó estar al corriente en el pago de la totalidad de las deudas vencidas con la comunidad ni haberlas consignado judicialmente, requisito para impugnar (artículo 18.2 LPH). Interesamos que se aprecie como óbice procesal.»"
    pide: "Que se aprecie la falta del requisito del 18.2 LPH, por el cauce de las cuestiones procesales (416.1 y 425 LEC)."
    aviso: "No rige si se impugnan acuerdos sobre el establecimiento o la alteración de cuotas de participación (18.2 LPH, inciso final). En el verbal no hay discusión en sala: las excepciones procesales se resuelven por auto escrito (438.10)."
    bases:
      - { norma: LPH, articulo: "18", apartado: "2" }
      - { norma: LEC, articulo: "416", apartado: "1" }
      - { norma: LEC, articulo: "425" }
    no_consta_en_norma:
      - "Si el defecto puede subsanarse en la audiencia (consignando o acreditando el pago después de la demanda) no lo dice la LPH; hay doctrina del Tribunal Supremo sobre su subsanabilidad que no se ha verificado en esta pasada."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Impugnación de acuerdos de la junta: subsanación del requisito de estar al corriente (habla el impugnante)"
    grupo: "Propiedad horizontal"
    momento: ["audiencia_previa"]
    formula: "«Con la venia: el requisito del artículo 18.2 LPH es subsanable. [Acreditamos estar al corriente / Acreditamos la consignación judicial de …]. Interesamos que se tenga por cumplido y que continúe la audiencia.»"
    pide: "Que se tenga por subsanado el defecto (231 LEC, por la vía del 425)."
    aviso: "La ley habla de consignación «previa» (18.2 LPH): la subsanación en la audiencia es tesis de parte, no regla legal. Llevar el justificante de pago o de consignación."
    bases:
      - { norma: LPH, articulo: "18", apartado: "2" }
      - { norma: LEC, articulo: "231" }
      - { norma: LEC, articulo: "425" }
    no_consta_en_norma:
      - "Subsanabilidad del requisito del 18.2 LPH: elaboración jurisprudencial, no regla expresa; no verificada en esta pasada."
    estado: "provisional"   # PENDIENTE: verificar la doctrina del Tribunal Supremo sobre la subsanabilidad del requisito del 18.2 LPH y su momento.
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Impugnación de acuerdos de la junta: fijar como controvertida la legitimación del impugnante"
    grupo: "Propiedad horizontal"
    momento: ["audiencia_previa", "vista_verbal"]
    formula: "«Interesamos que se fije como hecho controvertido si el actor asistió a la junta y, en tal caso, si salvó su voto o fue privado indebidamente de él, presupuesto de su legitimación conforme al artículo 18.2 LPH.»"
    pide: "Inclusión de la legitimación entre los hechos controvertidos (428.1; en el verbal, 443.3)."
    aviso: "Están legitimados quienes salvaron su voto, los ausentes por cualquier causa y los privados indebidamente del voto (18.2 LPH). El acta de la junta es la prueba natural: pedir su aportación o exhibición si no consta."
    bases:
      - { norma: LPH, articulo: "18", apartado: "2" }
      - { norma: LEC, articulo: "428", apartado: "1" }
      - { norma: LEC, articulo: "443", apartado: "3" }
    no_consta_en_norma:
      - "Si el propietario que se abstuvo, o que votó en contra sin salvar expresamente el voto, está legitimado no lo dice la LPH; es cuestión jurisprudencial no verificada en esta pasada."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Petición de suspensión cautelar del acuerdo de la junta impugnado"
    grupo: "Propiedad horizontal"
    momento: ["vista_verbal"]
    formula: "«Con la venia: interesamos que se suspenda cautelarmente la ejecución del acuerdo impugnado, porque su cumplimiento durante el pleito [consecuencia concreta] haría ineficaz una sentencia estimatoria.»"
    pide: "Suspensión cautelar del acuerdo (18.4 LPH), en la vista de medidas con audiencia de la comunidad."
    aviso: "La impugnación no suspende por sí sola el acuerdo: la suspensión se pide expresamente y exige oír a la comunidad (18.4 LPH), lo que lleva a la vista del 734 LEC. Prever la caución (728.3 LEC) y justificar el peligro por la mora (728.1)."
    bases:
      - { norma: LPH, articulo: "18", apartado: "4" }
      - { norma: LEC, articulo: "728", apartado: "1" }
      - { norma: LEC, articulo: "728", apartado: "3" }
      - { norma: LEC, articulo: "734", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Verbal procedente del monitorio de la comunidad: costas con honorarios aunque el abogado no fuera preceptivo"
    grupo: "Propiedad horizontal"
    momento: ["vista_verbal"]
    formula: "«Interesamos la condena en costas del demandado, incluidos los honorarios del abogado y los derechos del procurador de la comunidad aunque su intervención no fuera preceptiva, como dispone el artículo 21.5 LPH para la sentencia totalmente favorable.»"
    pide: "Costas con inclusión de honorarios y derechos no preceptivos (21.5 LPH)."
    aviso: "Solo si la sentencia es totalmente favorable a la comunidad. Es excepción a la regla general que excluye esos honorarios cuando la intervención no es preceptiva (32.5 LEC)."
    bases:
      - { norma: LPH, articulo: "21", apartado: "5" }
      - { norma: LEC, articulo: "32", apartado: "5" }
      - { norma: LEC, articulo: "394", apartado: "1" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  # ───────────────────────── CONSUMIDORES: CLÁUSULAS ABUSIVAS (TRLGDCU) ─────────────────────────
  - situacion: "El tribunal plantea de oficio en el acto el posible carácter abusivo de una cláusula"
    grupo: "Consumidores: cláusulas abusivas"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: antes de que se resuelva sobre el carácter abusivo de la cláusula [ … ], interesamos que se conceda a las partes trámite de audiencia para alegar y, en su caso, probar sobre ello.»"
    pide: "Audiencia de las partes antes de la declaración de nulidad (83 TRLGDCU)."
    aviso: "El 83 TRLGDCU exige audiencia previa de las partes. Para el empresario es el momento de acreditar la negociación individual, cuya prueba le incumbe (82.2, párrafo 2.º), y las circunstancias de la celebración (82.3)."
    bases:
      - { norma: TRLGDCU, articulo: "83" }
      - { norma: TRLGDCU, articulo: "82", apartado: "2" }
      - { norma: TRLGDCU, articulo: "82", apartado: "3" }
      - { norma: CE, articulo: "24", apartado: "1" }
    no_consta_en_norma:
      - "El deber del juez de examinar de oficio la abusividad en el proceso declarativo no está en la LEC, que solo lo regula en el monitorio y en la ejecución (815.3, 552.1 y 557.1.7.ª); procede de la jurisprudencia del TJUE sobre la Directiva 93/13, no verificada en esta pasada."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Consumidor: invitar al tribunal a examinar de oficio una cláusula que no se alegó"
    grupo: "Consumidores: cláusulas abusivas"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: sin alterar nuestras pretensiones, ponemos de manifiesto que la cláusula [ … ] puede ser abusiva por [causa del 82.4 o de los artículos 85 a 90 TRLGDCU]. Interesamos que el tribunal la examine de oficio, con audiencia de las partes.»"
    pide: "Control de oficio de la cláusula, con audiencia de las partes (83 TRLGDCU)."
    aviso: "Plantearlo como invitación al control de oficio, no como alegación nueva: como alegación, chocaría con la preclusión (400 y 426 LEC)."
    bases:
      - { norma: TRLGDCU, articulo: "82", apartado: "1" }
      - { norma: TRLGDCU, articulo: "82", apartado: "4" }
      - { norma: TRLGDCU, articulo: "83" }
    no_consta_en_norma:
      - "Que una parte pueda suscitar en el acto el control de oficio de una cláusula no alegada no está regulado; descansa en la jurisprudencia del TJUE sobre el control de oficio, no verificada en esta pasada."
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Carga de la prueba de la negociación individual de una cláusula con un consumidor"
    grupo: "Consumidores: cláusulas abusivas"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: la contraria afirma que la cláusula [ … ] se negoció individualmente. Como empresario, le corresponde probarlo, y no lo ha hecho. Interesamos que así se tenga en cuenta.»"
    pide: "Aplicación de la regla de carga de la prueba del 82.2, párrafo 2.º, TRLGDCU."
    aviso: "Que se negociara una parte de la cláusula, o una cláusula aislada, no excluye el control del resto del contrato (82.2, párrafo 1.º). En la audiencia previa sirve para fijar el hecho controvertido; en el juicio, para conclusiones."
