  # ───────────────────────── PERSONAS CON DISCAPACIDAD Y PERSONAS MAYORES (ART. 7 BIS LEC) ─────────────────────────
  - situacion: "Ajustes de procedimiento para una persona con discapacidad o mayor que interviene en el acto"
    grupo: "Discapacidad y personas mayores"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: [el declarante] [tiene una discapacidad / tiene … años]. Al amparo del artículo 7 bis LEC, interesamos que se le hable en lenguaje claro y sencillo, que pueda estar acompañado de [persona de su elección] y que se hagan los ajustes que necesite para participar en igualdad.»"
    pide: "Adaptaciones y ajustes (7 bis.1), comunicación en lenguaje claro (7 bis.2.a) y acompañante de su elección (7 bis.2.d)."
    aviso: "De 65 a 79 años, los ajustes solo se hacen a petición del interesado; con 80 o más, también de oficio; para la discapacidad, de oficio o a petición de cualquier parte o del fiscal (7 bis.1). Con 80 años o más el proceso es de tramitación preferente (7 bis.3): recordarlo si hay nuevo señalamiento. Si se deniega el ajuste, pedir que conste."
    bases:
      - { norma: LEC, articulo: "7 bis", apartado: "1" }
      - { norma: LEC, articulo: "7 bis", apartado: "2.a)" }
      - { norma: LEC, articulo: "7 bis", apartado: "2.d)" }
      - { norma: LEC, articulo: "7 bis", apartado: "3" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Persona con discapacidad que necesita un facilitador para entender y ser entendida"
    grupo: "Discapacidad y personas mayores"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: interesamos que se permita intervenir a [profesional experto] como facilitador, para que haga las adaptaciones necesarias y [el declarante] pueda entender y ser entendido.»"
    pide: "Participación del facilitador (7 bis.2.c)."
    aviso: "Mejor pedirlo antes del acto, identificando al facilitador y su cualificación. Si la persona ha de ser entrevistada como persona con discapacidad, se exige su presencia física (129 bis.2)."
    bases:
      - { norma: LEC, articulo: "7 bis", apartado: "1" }
      - { norma: LEC, articulo: "7 bis", apartado: "2.c)" }
      - { norma: LEC, articulo: "129 bis", apartado: "2" }
    estado: "vigente"
    espejo: "legalize-es@aca28304d"
    revisada_el: "2026-10-08"
    revisor: "armero"

  - situacion: "Persona sorda o con discapacidad auditiva: intérprete de lengua de signos o apoyos a la comunicación oral"
    grupo: "Discapacidad y personas mayores"
    momento: ["audiencia_previa", "juicio", "vista_verbal"]
    formula: "«Con la venia: [el declarante] es [sordo / tiene discapacidad auditiva]. Interesamos que se nombre intérprete de la lengua de signos adecuada [o los medios de apoyo a la comunicación oral que necesite] y que se levante acta de lo actuado.»"
    pide: "Intérprete de lengua de signos o medios de apoyo (7 bis.2.b; 143.2) y acta."
    aviso: "El 143.2 obliga a nombrar «siempre» intérprete de lengua de signos a la persona sorda que haya de declarar; el 7 bis.2.b amplía a los apoyos a la comunicación oral y a las personas sordociegas."
